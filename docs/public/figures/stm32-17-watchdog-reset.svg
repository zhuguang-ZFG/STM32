<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="窗口看门狗：早喂也复位、晚喂也复位，只有落在窗口内才喂狗成功"><g fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
<text x="20" y="12" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">早</text> <text x="160" y="12" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">窗口内</text> <text x="260" y="12" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">晚</text>
<rect x="100" y="38" width="120" height="22" rx="3" stroke-width="1.4"/>
<text x="160" y="32" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">刷新窗口</text>
<path d="M70 20 C 70 30, 70 40, 70 58" stroke-width="2.2"/>
<path d="M160 20 C 160 28, 160 32, 160 38" stroke-width="2.2"/>
<path d="M250 20 C 250 30, 250 40, 250 58" stroke-width="2.2"/>
<text x="70" y="68" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">复位</text> <text x="160" y="68" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">喂狗</text> <text x="250" y="68" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">复位</text>
<text x="20" y="84" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">早也复位，晚也复位：窗口约束的是“进展发生在正确的时间段”</text>
</g></svg>
