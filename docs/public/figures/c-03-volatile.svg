<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="编译器把 flag 缓存进寄存器，ISR 在内存里写 1；轮询循环因此看不到更新"><g transform="translate(0,-4.5)" fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
<rect x="16" y="26" width="84" height="38" rx="5" stroke-width="1.4"/> <rect x="220" y="26" width="84" height="38" rx="5" stroke-width="1.4"/>
<text x="58" y="44" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">CPU</text> <text x="58" y="56" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">r0 = 0</text>
<text x="262" y="44" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">flag</text> <text x="262" y="56" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">0 → 1</text>
<path d="M220 45 C 190 38, 150 38, 100 45" stroke-width="2.2"/>
<path d="M100 45 l 8 -4 M100 45 l 8 4" stroke-width="1.8"/>
<text x="100" y="18" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">编译器：只读一次</text>
<path d="M262 64 C 262 70, 200 74, 150 74 C 120 74, 80 70, 58 64" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="142" y="84" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">轮询循环</text>
</g></svg>
