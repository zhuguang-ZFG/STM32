<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="SPI 全双工移位环：主机与从机各有一个 8 位移位寄存器，MOSI 与 MISO 两根线同时移出一位、移入一位"><g transform="translate(0,-5.8)" fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
<rect x="20" y="18" width="120" height="38" rx="4" stroke-width="1.4"/>
<rect x="180" y="18" width="120" height="38" rx="4" stroke-width="1.4"/>
<text x="80" y="34" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">主机</text>
<text x="80" y="46" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">8 位移位寄存器</text>
<text x="240" y="34" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">从机</text>
<text x="240" y="46" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">8 位移位寄存器</text>
<path d="M140 28 C 152 28, 168 28, 180 28" stroke-width="2.2"/>
<path d="M180 28 l -7 -4 M180 28 l -7 4" stroke-width="1.8"/>
<text x="160" y="20" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">MOSI</text>
<path d="M180 46 C 168 46, 152 46, 140 46" stroke-width="2.2"/>
<path d="M140 46 l 7 -4 M140 46 l 7 4" stroke-width="1.8"/>
<text x="160" y="56" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">MISO</text>
<text x="10" y="72" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">SCLK</text>
<path d="M36 72 L60 72" stroke-width="1.4"/><path d="M60 72 L60 64" stroke-width="1.4"/><path d="M60 64 L84 64" stroke-width="1.4"/><path d="M84 64 L84 72" stroke-width="1.4"/><path d="M84 72 L108 72" stroke-width="1.4"/><path d="M108 72 L108 64" stroke-width="1.4"/><path d="M108 64 L132 64" stroke-width="1.4"/><path d="M132 64 L132 72" stroke-width="1.4"/><path d="M132 72 L156 72" stroke-width="1.4"/><path d="M156 72 L156 64" stroke-width="1.4"/><path d="M156 64 L180 64" stroke-width="1.4"/><path d="M180 64 L180 72" stroke-width="1.4"/><path d="M180 72 L300 72" stroke-width="1.4"/>
<text x="160" y="84" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">一个沿一位，全双工</text>
</g></svg>
