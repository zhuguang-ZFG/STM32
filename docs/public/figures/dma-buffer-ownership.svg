<polygon points="634.00,158.00 627.00,161.50 627.00,154.50" fill="#075e84" opacity="1"/>
<text x="595" y="143" font-size="9.5" fill="#5e6872" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">MINC</text>
