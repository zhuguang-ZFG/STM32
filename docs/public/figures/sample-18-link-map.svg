<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="链接失败：先对照容量，再读段的落点">


<rect x="0" y="0" width="960" height="880" fill="#FBF3DF"/>
<rect x="0" y="0" width="960" height="58" fill="#F7EFDA" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#6E6B60" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1F4680" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">链接失败：先对照容量，再读段的落点</text>
<text x="22" y="50" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 · Flash 64 KB / SRAM 20 KB</text>
<rect x="906" y="15" width="32" height="28" fill="#DCE6F2" opacity="1" rx="8" stroke="#6E6B60" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">18</text>
<text x="40" y="104" font-size="20" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">地址轴只比较容量；具体占用以本次 map 文件为准。</text>
<text x="40" y="158" font-size="23" fill="#1F4680" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Flash · 64 KB</text>
<rect x="40" y="178" width="704" height="44" fill="#F7EFDA" opacity="1" rx="2" stroke="#1F4680" stroke-width="1.5"/>
<line x1="40" y1="222" x2="40" y2="235" stroke="#1F4680" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="744" y1="222" x2="744" y2="235" stroke="#1F4680" stroke-width="2" stroke-linecap="round" opacity="1"/>
<text x="40" y="263" font-size="17" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x08000000</text>
<text x="762" y="209" font-size="17" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x08010000</text>
<text x="40" y="306" font-size="23" fill="#2E5F42" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SRAM · 20 KB</text>
<rect x="40" y="326" width="220" height="44" fill="#F7EFDA" opacity="1" rx="2" stroke="#2E5F42" stroke-width="1.5"/>
<line x1="40" y1="370" x2="40" y2="383" stroke="#2E5F42" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="260" y1="370" x2="260" y2="383" stroke="#2E5F42" stroke-width="2" stroke-linecap="round" opacity="1"/>
<text x="40" y="411" font-size="17" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x20000000</text>
<text x="278" y="357" font-size="17" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x20005000</text>
<text x="40" y="450" font-size="22" fill="#7A5B14" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">初始化的 .data 占两处</text>
<rect x="40" y="474" width="340" height="76" fill="#F7EFDA" opacity="1" rx="8" stroke="#1F4680" stroke-width="1.5"/>
<text x="210" y="505" font-size="18" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Flash：初值（LMA）</text>
<text x="210" y="532" font-size="15" fill="#2F2E2B" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">.text / .rodata 也存放于此</text>
<line x1="388" y1="512" x2="553" y2="512" stroke="#7A5B14" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="560.00,512.00 553.00,515.50 553.00,508.50" fill="#7A5B14" opacity="1"/>
<text x="474" y="492" font-size="15" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">启动时复制</text>
<rect x="572" y="474" width="348" height="76" fill="#F7EFDA" opacity="1" rx="8" stroke="#2E5F42" stroke-width="1.5"/>
<text x="746" y="505" font-size="18" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SRAM：运行地址（VMA）</text>
<text x="746" y="532" font-size="15" fill="#2F2E2B" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">.bss 清零；栈和堆另留空间</text>
<line x1="40" y1="586" x2="920" y2="586" stroke="#D8D2C0" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="40" y="626" font-size="21" fill="#B3392F" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">region overflowed</text>
<text x="40" y="661" font-size="18" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">读报错区域、LENGTH 与段占用；包括保留区、对齐和栈/堆。</text>
<text x="40" y="713" font-size="21" fill="#1F4680" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">链接通过，复位后没运行</text>
<text x="40" y="748" font-size="18" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">再对照镜像位置、启动向量、BOOT 与 VTOR；ORIGIN 和 VTOR 各有用途。</text>
<text x="40" y="797" font-size="17" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">size 是汇总，map 才能显示每段和符号的地址；容量上界不包含终点地址。</text>
<line x1="24" y1="844" x2="936" y2="844" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="864" font-size="11" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量图 · F103C8 容量与链接段关系；无虚构占用量。</text>
<text x="936" y="864" font-size="11" fill="#6E6B60" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
