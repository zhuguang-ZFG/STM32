<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="STM32 Flash 擦除与编程序列：解锁 → SER/AR → STRT → 等 BSY；编程 PG=1 写半字再等 BSY"><g fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
