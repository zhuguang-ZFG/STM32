<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="固件栈不是排名表，而是边界选择">


<rect x="0" y="0" width="900" height="560" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#5b3a8c" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">固件栈不是排名表，而是边界选择</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先判断项目约束，再决定 HAL/LL、SPL、libopencm3 或 RTOS 生态</text>
<rect x="738" y="15" width="140" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="808" y="33.32" font-size="12" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">20 选型 · IG-004</text>
<rect x="42" y="96" width="180" height="310" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<rect x="42" y="96" width="180" height="46" fill="#075e84" opacity="0.86" rx="8"/>
<text x="132" y="125" font-size="12" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">新 STM32 项目</text>
<text x="132" y="184" font-size="13" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">HAL / LL</text>
<line x1="66" y1="207" x2="198" y2="207" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="132" y="258" font-size="10.5" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CubeMX 与官方包</text>
<line x1="66" y1="281" x2="198" y2="281" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="132" y="332" font-size="10.5" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">跨系列维护成本低</text>
<rect x="254" y="96" width="180" height="310" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<rect x="254" y="96" width="180" height="46" fill="#1b5c45" opacity="0.86" rx="8"/>
<text x="344" y="125" font-size="12" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">锁版 F1 旧工程</text>
<text x="344" y="184" font-size="13" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SPL</text>
<line x1="278" y1="207" x2="410" y2="207" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="344" y="258" font-size="10.5" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">只维护既有边界</text>
<line x1="278" y1="281" x2="410" y2="281" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="344" y="332" font-size="10.5" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不要和 HAL 双重接管</text>
<rect x="466" y="96" width="180" height="310" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<rect x="466" y="96" width="180" height="46" fill="#7a4e00" opacity="0.86" rx="8"/>
<text x="556" y="125" font-size="12" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">轻量裸机</text>
<text x="556" y="184" font-size="13" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">libopencm3</text>
<line x1="490" y1="207" x2="622" y2="207" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="556" y="258" font-size="10.5" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">接受社区支持边界</text>
<line x1="490" y1="281" x2="622" y2="281" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="556" y="332" font-size="10.5" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自行冻结版本与构建</text>
<rect x="678" y="96" width="180" height="310" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<rect x="678" y="96" width="180" height="46" fill="#5b3a8c" opacity="0.86" rx="8"/>
<text x="768" y="125" font-size="12" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">系统级产品</text>
<text x="768" y="184" font-size="13" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">RTOS 生态</text>
<line x1="702" y1="207" x2="834" y2="207" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="768" y="258" font-size="10.5" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">设备模型与组件</text>
<line x1="702" y1="281" x2="834" y2="281" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="768" y="332" font-size="10.5" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">预算启动/恢复/升级</text>
<rect x="42" y="432" width="816" height="80" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="60" y="458" font-size="11.5" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">明确判断</text>
<text x="132" y="458" font-size="11" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">新项目优先 HAL/LL；只有维护锁定版本的 F1 旧工程时才继续用 SPL。</text>
<text x="132" y="484" font-size="10.2" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">改变判断的条件：现有资产、认证冻结、团队能力、实时/内存预算与生命周期。</text>
<line x1="24" y1="518" x2="876" y2="518" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="542" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">视觉规范：FA-029 几何图解叙事 · IG-004 多列对比 · C-03 / C-10 / C-27 / C-31</text>
<text x="876" y="542" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量图 · STM32 知识库</text>
</svg>
