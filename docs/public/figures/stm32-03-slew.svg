<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 108" role="img" aria-label="GPIO 输出速度四档：上升沿越陡，翻转越快，但振铃与 EMI 越大"><g fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
  <text x="14" y="18" font-size="8.5" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">OSPEEDR 四档：速度越高，边沿越陡</text>

  <text x="14" y="38" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">2 MHz</text>
  <path d="M52 36 L108 36 L138 28" stroke-width="1.6"/>

  <text x="14" y="54" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">25 MHz</text>
  <path d="M52 52 L112 52 L138 40" stroke-width="1.8"/>

  <text x="14" y="70" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">50 MHz</text>
  <path d="M52 68 L118 68 L138 52" stroke-width="2"/>

  <text x="14" y="86" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">100 MHz</text>
  <path d="M52 84 L124 84 L138 64" stroke-width="2.2"/>

  <path d="M150 28 L150 88" stroke-width="1" stroke-dasharray="3 2"/>

  <rect x="164" y="30" width="182" height="24" rx="4"/>
  <text x="255" y="46" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">上升沿越陡 → 翻转更快</text>

  <text x="164" y="70" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">代价：振铃 / EMI 更大</text>
  <text x="164" y="86" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">原则：够用就选低档</text>
</g></svg>
