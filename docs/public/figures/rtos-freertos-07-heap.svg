<rect x="20" y="56" width="60" height="20" rx="3" stroke-width="1.4"/> <rect x="80" y="56" width="170" height="20" rx="3" stroke-width="1.4"/> <rect x="250" y="56" width="50" height="20" rx="3" stroke-width="1.4"/>
