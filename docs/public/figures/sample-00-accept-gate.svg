<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="860" viewBox="0 0 960 860" role="img" aria-label="第一份能验收的程序有三道门槛：编译 0 Error、板上有可见现象、逐行能解释；只看编译过不算验收">


<rect x="0" y="0" width="960" height="860" fill="#FBF3DF"/>
<rect x="0" y="0" width="960" height="58" fill="#F7EFDA" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#6E6B60" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1F4680" opacity="1"/>
<text x="22" y="32" font-size="18" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">第一份能验收的程序有三道门槛：编译 0 Error、板上有可见现象、逐行能解释；只看编译过不算验收</text>
<text x="22" y="50" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 · PC13 低电平点亮 · RM0008 Rev 21 §9 GPIO</text>
<rect x="906" y="15" width="32" height="28" fill="#DCE6F2" opacity="1" rx="8" stroke="#6E6B60" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">00</text>
<text x="40" y="122" font-size="15" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">三道门槛按顺序全过才叫验收——每道都是 yes/no，不是感觉</text>
<rect x="40" y="150" width="280" height="300" fill="#F7EFDA" opacity="1" rx="8" stroke="#2E5F42" stroke-width="1.5"/>
<circle cx="70" cy="184" r="15" fill="#2E5F42" opacity="1" stroke="#2E5F42" stroke-width="1.5"/>
<text x="70" y="189" font-size="14" fill="#FBF3DF" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">1</text>
<text x="96" y="190" font-size="16" fill="#2E5F42" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">编译 0 Error</text>
<rect x="340" y="150" width="280" height="300" fill="#F7EFDA" opacity="1" rx="8" stroke="#2E5F42" stroke-width="1.5"/>
<circle cx="370" cy="184" r="15" fill="#2E5F42" opacity="1" stroke="#2E5F42" stroke-width="1.5"/>
<text x="370" y="189" font-size="14" fill="#FBF3DF" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">2</text>
<text x="396" y="190" font-size="16" fill="#2E5F42" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">板上有现象</text>
<rect x="640" y="150" width="280" height="300" fill="#F7EFDA" opacity="1" rx="8" stroke="#2E5F42" stroke-width="1.5"/>
<circle cx="670" cy="184" r="15" fill="#2E5F42" opacity="1" stroke="#2E5F42" stroke-width="1.5"/>
<text x="670" y="189" font-size="14" fill="#FBF3DF" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">3</text>
<text x="696" y="190" font-size="16" fill="#2E5F42" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">逐行能解释</text>
<rect x="58" y="216" width="244" height="92" fill="#FBF3DF" opacity="1" rx="4" stroke="#1F4680" stroke-width="1.5"/>
<text x="70" y="244" font-size="11" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">arm-none-eabi-gcc … 0 Error</text>
<text x="70" y="268" font-size="11" fill="#2E5F42" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">flash  →  0x08000000</text>
<text x="70" y="292" font-size="10" fill="#6E6B60" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">from STM32F103C8Tx_FLASH.ld</text>
<text x="58" y="338" font-size="12" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">日志只证明语法与链接，</text>
<text x="58" y="358" font-size="12" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">证明不了引脚和波形</text>
<line x1="322" y1="300" x2="333" y2="300" stroke="#2E5F42" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="340.00,300.00 333.00,303.50 333.00,296.50" fill="#2E5F42" opacity="1"/>
<path d="M 358 239.44 L 358.00 239.44 L 388.50 239.44 L 388.50 296.56 L 419.00 296.56 L 419.00 239.44 L 449.50 239.44 L 449.50 296.56 L 480.00 296.56 L 480.00 239.44 L 510.50 239.44 L 510.50 296.56 L 541.00 296.56 L 541.00 239.44 L 571.50 239.44 L 571.50 296.56 L 602.00 296.56" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#2E5F42" stroke-width="2"/>
<text x="358" y="332" font-size="12" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">500 ms 高 + 500 ms 低 = 1 s</text>
<text x="358" y="354" font-size="12" fill="#7A5B14" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">数时间，不是数亮度</text>
<line x1="622" y1="300" x2="633" y2="300" stroke="#2E5F42" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="640.00,300.00 633.00,303.50 633.00,296.50" fill="#2E5F42" opacity="1"/>
<rect x="658" y="226" width="244" height="50" fill="#FBF3DF" opacity="1" rx="4" stroke="#1F4680" stroke-width="1.5"/>
<text x="670" y="247" font-size="12" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">IOPCEN 先于 CRH——为什么</text>
<text x="670" y="266" font-size="11" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">时钟不开，寄存器白写</text>
<rect x="658" y="288" width="244" height="50" fill="#FBF3DF" opacity="1" rx="4" stroke="#1F4680" stroke-width="1.5"/>
<text x="670" y="309" font-size="12" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">CRH[23:20] = 0x2</text>
<text x="670" y="328" font-size="11" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">→ 2 MHz 推挽输出</text>
<rect x="658" y="350" width="244" height="50" fill="#FBF3DF" opacity="1" rx="4" stroke="#1F4680" stroke-width="1.5"/>
<text x="670" y="371" font-size="12" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">ODR13 不断翻转</text>
<text x="670" y="390" font-size="11" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">→ LED 才有 1 Hz</text>
<rect x="40" y="480" width="880" height="150" fill="#F7EFDA" opacity="1" rx="8" stroke="#B3392F" stroke-width="1.5"/>
<text x="56" y="508" font-size="15" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">失败路径  只看编译过</text>
<line x1="70" y1="590" x2="400" y2="590" stroke="#6E6B60" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="410" y1="578" x2="422" y2="602" stroke="#B3392F" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="424" y1="578" x2="436" y2="602" stroke="#B3392F" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="438" y1="578" x2="450" y2="602" stroke="#B3392F" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="452" y1="578" x2="464" y2="602" stroke="#B3392F" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="70" y1="590" x2="397" y2="590" stroke="#6E6B60" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="404.00,590.00 397.00,593.50 397.00,586.50" fill="#6E6B60" opacity="1"/>
<text x="470" y="552" font-size="14" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">LED 不动，PC13 上没有波形</text>
<text x="470" y="578" font-size="14" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">门 2、门 3 都在板上——日志给不了</text>
<text x="470" y="604" font-size="13" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">编译是唯一会自己喊失败的门槛</text>
<rect x="40" y="656" width="880" height="116" fill="#F7EFDA" opacity="1" rx="8" stroke="#6E569B" stroke-width="1.5"/>
<text x="56" y="686" font-size="15" fill="#6E569B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">旁注  门槛是 yes/no，不是感觉</text>
<text x="56" y="712" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PC13 低电平点亮：亮 = ODR13 = 0</text>
<text x="56" y="736" font-size="13" fill="#7A5B14" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">1 s 周期用逻辑分析仪数；眼睛只会看闪不闪</text>
<text x="56" y="760" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">动手节的四级阶梯再加上电、复位与测量</text>
<line x1="24" y1="824" x2="936" y2="824" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="844" font-size="11" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。PC13 低电平点亮与 500 ms 半周期来自第 00 章；CRH / ODR 与 GPIO 时钟来自 RM0008 Rev 21 第 9 章。</text>
<text x="936" y="844" font-size="11" fill="#6E6B60" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
