<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="模型缺口、主机环境、板级物理：仿真能过不等于板上能过，先分清失败属于哪一岔">


<rect x="0" y="0" width="960" height="880" fill="#FBF3DF"/>
<rect x="0" y="0" width="960" height="58" fill="#F7EFDA" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#6E6B60" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1F4680" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">仿真三岔口：模型、主机、板级物理</text>
<text x="22" y="50" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">chapter 22 · Wokwi / Renode · model boundary</text>
<rect x="906" y="15" width="32" height="28" fill="#DCE6F2" opacity="1" rx="8" stroke="#6E6B60" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">22</text>
<text x="40" y="122" font-size="15" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">失败先分岔：是模型没做、是主机环境，还是本来就只能在真板上验</text>
<rect x="40" y="160" width="200" height="560" fill="#F7EFDA" opacity="1" rx="8" stroke="#1F4680" stroke-width="1.5"/>
<text x="140" y="196" font-size="18" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">同一份固件</text>
<text x="140" y="224" font-size="15" fill="#2F2E2B" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">在仿真里出问题</text>
<text x="60" y="280" font-size="15" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先问一句：</text>
<text x="60" y="306" font-size="15" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">这个外设在</text>
<text x="60" y="332" font-size="15" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">支持表里吗？</text>
<rect x="60" y="370" width="160" height="60" fill="#FBF3DF" opacity="1" rx="4" stroke="#2E5F42" stroke-width="1.5"/>
<text x="140" y="394" font-size="12" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIO / EXTI / TIM</text>
<text x="140" y="414" font-size="13" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">有</text>
<rect x="60" y="446" width="160" height="60" fill="#FBF3DF" opacity="1" rx="4" stroke="#B3392F" stroke-width="1.5"/>
<text x="140" y="470" font-size="12" fill="#B3392F" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">DMA / RTC / IWDG</text>
<text x="140" y="490" font-size="13" fill="#B3392F" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Wokwi 没有</text>
<text x="60" y="540" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Wokwi 的 BluePill</text>
<text x="60" y="562" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">以打开文档的那一版</text>
<text x="60" y="584" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">支持表为准</text>
<text x="60" y="640" font-size="13" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">缺口写进测试计划，</text>
<text x="60" y="662" font-size="13" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不许静默跳过</text>
<rect x="280" y="160" width="640" height="180" fill="#F7EFDA" opacity="1" rx="8" stroke="#B3392F" stroke-width="1.5"/>
<text x="296" y="192" font-size="16" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">岔口一  模型缺口</text>
<text x="296" y="220" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">外设根本没进模拟器</text>
<text x="296" y="254" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">断言按全功能写，模型只做了子集</text>
<text x="296" y="280" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">时钟树简化：波特率/定时巧合正确</text>
<text x="296" y="306" font-size="13" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">→ 未建模项移出仿真验收</text>
<line x1="242" y1="440" x2="276.697" y2="256.878" stroke="#B3392F" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="278.00,250.00 280.14,257.53 273.26,256.23" fill="#B3392F" opacity="1"/>
<rect x="280" y="360" width="640" height="180" fill="#F7EFDA" opacity="1" rx="8" stroke="#7A5B14" stroke-width="1.5"/>
<text x="296" y="392" font-size="16" fill="#7A5B14" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">岔口二  主机环境</text>
<text x="296" y="420" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">脚本、路径、键名与文档假设不一致</text>
<text x="296" y="454" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">别人的 .resc 跑不起来；缺 board.json 键名</text>
<text x="296" y="480" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先让最小 blink ELF 跑通，再叠加外设</text>
<text x="296" y="506" font-size="13" fill="#7A5B14" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">→ 固定工具版本，留一条回归门脚本</text>
<line x1="242" y1="440" x2="271.255" y2="448.126" stroke="#7A5B14" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="278.00,450.00 270.32,451.50 272.19,444.75" fill="#7A5B14" opacity="1"/>
<rect x="280" y="560" width="640" height="180" fill="#F7EFDA" opacity="1" rx="8" stroke="#6E569B" stroke-width="1.5"/>
<text x="296" y="592" font-size="16" fill="#6E569B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">岔口三  板级物理</text>
<text x="296" y="620" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">仿真全绿，真板一上电就失败</text>
<text x="296" y="654" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">滤波、起振、眼图、纹波不在数字模型里</text>
<text x="296" y="680" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">线长、上拉、地回流只在 PCB 上成立</text>
<text x="296" y="706" font-size="13" fill="#6E569B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">→ 仿真门与真板门分列，缺一不可</text>
<line x1="242" y1="440" x2="276.817" y2="643.101" stroke="#6E569B" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="278.00,650.00 273.37,643.69 280.27,642.51" fill="#6E569B" opacity="1"/>
<rect x="40" y="748" width="880" height="60" fill="#F7EFDA" opacity="1" rx="8" stroke="#2E5F42" stroke-width="1.5"/>
<text x="56" y="786" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">底注  仿真证明「逻辑在模型假设下成立」；真板证明「物理世界也成立」。两句不能并成一句。</text>
<line x1="24" y1="844" x2="936" y2="844" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="864" font-size="11" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。边界与验收门对照 simulation-model-boundary / simulation-acceptance-gates；Wokwi 板定义与 Renode 平台文档仅对照。</text>
<text x="936" y="864" font-size="11" fill="#6E6B60" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
