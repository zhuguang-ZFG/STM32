<text x="56" y="560" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">1. Stop 2 封面电流是芯片典型值，不是本仓库整板实测；JP6 / 积分波形才进账。</text>
<text x="56" y="582" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">2. HAL 清位前先留下唤醒证据；SysTick 若不停，1 ms 节拍会反复叫醒。</text>
<text x="56" y="604" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">3. 醒后临时时钟是 MSI 或 HSI16，通信前必须恢复到业务时钟并复验。</text>
<rect x="40" y="650" width="880" height="90" fill="#F7EFDA" opacity="1" rx="8" stroke="#2E5F42" stroke-width="1.5"/>
<text x="56" y="680" font-size="13" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">出处优先：RM0351 模式表、DS10198 典型值、AN4746 测量边界；CubeL4 Stop2 示例仅对照。</text>
<text x="56" y="708" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">*1.1 µA / 带 RTC 1.4 µA 为手册封面数，必须随 revision、VDD、温度一并记录。</text>
