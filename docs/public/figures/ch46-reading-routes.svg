<polygon points="540.00,420.00 535.00,410.00 545.00,410.00" fill="#1b5c45" opacity="1"/>
<rect x="32" y="424" width="308" height="154" fill="#eef5ee" opacity="1" rx="12" stroke="#1b5c45" stroke-width="1.5"/>
<text x="186" y="465" font-size="28" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">组织与连接</text>
<text x="186" y="510" font-size="26" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">并发：第 21–25 章</text>
<text x="186" y="550" font-size="26" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">联网：第 33 章</text>
<rect x="380" y="424" width="308" height="154" fill="#eef5ee" opacity="1" rx="12" stroke="#1b5c45" stroke-width="1.5"/>
<text x="534" y="465" font-size="28" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">控制与迁移</text>
<text x="534" y="510" font-size="26" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">运动：第 36–39 章</text>
<text x="534" y="550" font-size="26" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">换芯片：第 28–34 章</text>
<line x1="180" y1="578" x2="180" y2="610" stroke="#1b5c45" stroke-width="3" stroke-linecap="round" opacity="1"/>
