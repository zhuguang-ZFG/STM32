<text x="360" y="316" font-size="26" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">边做实验，边补语言、构建与排错</text>
<line x1="360" y1="344" x2="360" y2="350" stroke="#1b5c45" stroke-width="3" stroke-linecap="round" opacity="1"/>
