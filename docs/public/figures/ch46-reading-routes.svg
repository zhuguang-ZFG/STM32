<text x="360" y="168" font-size="26" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">第 0 章 · 留下首次运行记录</text>
<line x1="360" y1="192" x2="360" y2="218" stroke="#1e4d63" stroke-width="2" stroke-linecap="round" opacity="1"/>
