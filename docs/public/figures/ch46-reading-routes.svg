<line x1="180" y1="610" x2="540" y2="610" stroke="#1b5c45" stroke-width="3" stroke-linecap="round" opacity="1"/>
<line x1="360" y1="610" x2="360" y2="635" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="360.00,645.00 355.00,635.00 365.00,635.00" fill="#1b5c45" opacity="1"/>
<rect x="74" y="650" width="572" height="88" fill="#fbf0d7" opacity="1" rx="12" stroke="#7a4e00" stroke-width="1.5"/>
<text x="360" y="687" font-size="28" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">交付：重建 + 验收 + 失败恢复</text>
<text x="360" y="722" font-size="24" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">第 42 章 · 连同所选功能的证据交给别人</text>
<text x="360" y="779" font-size="24" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">阅读路线示意；逐章先修条件见正文索引</text>
</svg>
