<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="800" viewBox="0 0 720 800" role="img" aria-label="学完共同基础，再按项目选分支">


<rect x="0" y="0" width="720" height="800" fill="#fbfaf7"/>
<text x="360" y="56" font-size="34" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">从一次点灯，走到一次交付</text>
