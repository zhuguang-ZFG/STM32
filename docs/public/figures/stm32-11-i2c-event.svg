<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="I2C 事件链：六步各等一组状态位，事件号是 SR1 与 SR2 的组合"><g fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
<text x="8" y="11" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">六步，每步等一组位</text>
<path d="M8 14 L118 14" stroke-width="2.2"/>
<text x="8" y="24" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">1 START → 等 SB</text>
<text x="8" y="36" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">2 地址 → 等 ADDR</text>
<text x="8" y="48" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">3 清 ADDR：读 SR1 再读 SR2</text>
<text x="8" y="60" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">4 数据 → 等 TXE</text>
<text x="8" y="72" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">5 末字节 → 等 BTF</text>
<text x="8" y="84" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">6 最后才 STOP</text>
<rect x="186" y="16" width="126" height="20" rx="3" stroke-width="2.2"/> <text x="190" y="29" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">事件 = SR2高16 | SR1低16</text>
<rect x="186" y="42" width="126" height="20" rx="3" stroke-width="1.0"/> <text x="190" y="55" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">0x00030001 = BUSY|MSL|SB</text>
<rect x="186" y="68" width="126" height="14" rx="3" stroke-width="1.4"/> <text x="190" y="78" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">TXE 只说明 DR 空</text>
</g></svg>
