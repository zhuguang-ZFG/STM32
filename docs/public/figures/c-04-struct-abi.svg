<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="结构体对齐：char a、int b、char c 之间插入 3 字节与 3 字节填充，sizeof 从 6 变 12"><g fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
<text x="20" y="16" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">offset 0</text> <text x="112" y="16" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">4</text> <text x="204" y="16" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">8</text> <text x="270" y="16" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">12</text>
<rect x="20" y="24" width="276" height="28" rx="2" stroke-width="1.4"/>
<path d="M43 24 L43 52" stroke-width="1.4"/> <path d="M112 24 L112 52" stroke-width="1.4"/> <path d="M204 24 L204 52" stroke-width="1.4"/> <path d="M273 24 L273 52" stroke-width="1.4"/>
<text x="31" y="42" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">a</text> <text x="77" y="42" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">pad</text> <text x="158" y="42" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">b</text> <text x="238" y="42" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">c</text> <text x="284" y="42" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">pad</text>
<path d="M43 58 C 60 66, 90 66, 112 58" stroke-width="1.8" stroke-dasharray="3 2"/>
<text x="78" y="78" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">补齐到 4 字节</text>
<text x="230" y="78" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">sizeof = 12</text>
</g></svg>
