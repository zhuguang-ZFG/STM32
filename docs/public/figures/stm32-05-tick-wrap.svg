<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 112" role="img" aria-label="无符号回绕：then=0xFFFFFC18、now=2000 时 (now-then)=3000 仍正确，而 now>=then+timeout 漏报"><g fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
  <text x="14" y="18" font-size="8.5" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">uint32 毫秒计数：回绕后无符号减法仍正确</text>

  <path d="M20 46 L204 46" stroke-width="1.4"/>
  <path d="M228 46 L340 46" stroke-width="1.4"/>
  <path d="M204 46 C 210 28, 222 28, 228 46" stroke-width="1.8"/>
  <text x="216" y="24" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">0xFFFFFFFF → 0</text>

  <path d="M72 38 L72 54" stroke-width="1.4"/>
  <path d="M304 38 L304 54" stroke-width="1.4"/>
  <text x="72" y="34" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">then = 0xFFFFFC18</text>
  <text x="304" y="34" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">now = 2000</text>

  <path d="M72 54 C 120 78, 256 78, 304 54" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="188" y="82" font-size="8.5" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">(now - then) = 3000 &gt; 500  ✓</text>

  <rect x="14" y="90" width="332" height="16" rx="3" stroke-width="1.1" stroke-dasharray="3 2"/>
  <text x="24" y="101" font-size="7.5" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">错误写法：now &gt;= then + timeout  ✗（回绕后漏报）</text>
</g></svg>
