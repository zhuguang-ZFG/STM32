<text x="40" y="102" font-size="23" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">单 APP：16 KB + 2 KB + 46 KB = 64 KB</text>
<rect x="40" y="148" width="118.4" height="56" fill="#f1f5f7" opacity="1" rx="2" stroke="#075e84" stroke-width="1.5"/>
<text x="99.2" y="182" font-size="20" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Boot</text>
<rect x="158.4" y="148" width="14.8" height="56" fill="#f1f5f7" opacity="1" rx="2" stroke="#7a4e00" stroke-width="1.5"/>
<rect x="173.2" y="148" width="340.4" height="56" fill="#f1f5f7" opacity="1" rx="2" stroke="#1b5c45" stroke-width="1.5"/>
<text x="343.4" y="182" font-size="20" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">APP</text>
<rect x="40" y="334" width="118.4" height="56" fill="#f1f5f7" opacity="1" rx="2" stroke="#075e84" stroke-width="1.5"/>
<text x="99.2" y="368" font-size="20" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Boot</text>
<rect x="158.4" y="334" width="14.8" height="56" fill="#f1f5f7" opacity="1" rx="2" stroke="#7a4e00" stroke-width="1.5"/>
<rect x="173.2" y="334" width="340.4" height="56" fill="#f1f5f7" opacity="1" rx="2" stroke="#1b5c45" stroke-width="1.5"/>
<text x="343.4" y="368" font-size="20" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">A</text>
<rect x="513.6" y="334" width="340.4" height="56" fill="#f1f5f7" opacity="1" rx="2" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="683.8" y="368" font-size="20" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">B</text>
<line x1="165.8" y1="205" x2="165.8" y2="215" stroke="#7a4e00" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<line x1="165.8" y1="215" x2="332" y2="215" stroke="#7a4e00" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="342" y="235" font-size="20" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">参数区 2 KB</text>
<text x="40" y="132" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x08000000</text>
<text x="158.4" y="231" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x08004000</text>
<text x="173.2" y="260" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x08004800</text>
<text x="513.6" y="132" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x08010000</text>
<line x1="513.6" y1="140" x2="513.6" y2="412" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 6"/>
<text x="40" y="302" font-size="22" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">两张同样的 APP：16 + 2 + 46 + 46 = 110 KB</text>
<text x="527.6" y="424" font-size="18" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">B 从上界开始，全部越界</text>
<text x="854" y="462" font-size="19" fill="#8f2d2d" text-anchor="end" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x0801B800</text>
<text x="40" y="508" font-size="19" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">APP 长度 0xB800；参数区 2 KB 不应当作可随意覆盖的空隙。</text>
<line x1="40" y1="542" x2="920" y2="542" stroke="#d7dce1" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="40" y="583" font-size="22" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SRAM：65536 字节数组已经大于整块 20480 字节</text>
<rect x="40" y="616" width="786.432" height="64" fill="#f1f5f7" opacity="1" rx="2" stroke="#8f2d2d" stroke-width="1.5"/>
<rect x="40" y="616" width="245.76" height="64" fill="#f1f5f7" opacity="1" rx="2" stroke="#1b5c45" stroke-width="1.5"/>
<text x="58" y="655" font-size="20" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">20 KB = 20480</text>
<text x="600" y="655" font-size="20" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">数组 65536 B</text>
<text x="40" y="719" font-size="18" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">图按同一比例比较；还没计入其他全局变量、栈和堆。</text>
<line x1="40" y1="751" x2="920" y2="751" stroke="#d7dce1" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="40" y="795" font-size="20" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ADC：2048 × 3.3 / 4096 = 1.65 V（名义参考电压）</text>
<text x="40" y="840" font-size="20" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">USB：应用帧 133 B = 64 + 64 + 5 B；FS bulk 包上限 64 B。</text>
<text x="40" y="886" font-size="18" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">范围放得下只是起点；镜像有效性、缓冲所有权和失败恢复另行验证。</text>
<line x1="24" y1="944" x2="936" y2="944" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="964" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。DS5319 容量；第 12 章单槽布局；RM0008 ADC。</text>
<text x="936" y="964" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
