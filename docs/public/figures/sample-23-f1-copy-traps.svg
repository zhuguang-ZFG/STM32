<text x="56" y="614" font-size="14" fill="#6E569B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Method: DS pinout table → RM AF column → one scope of idle level before code blame.</text>
<text x="56" y="646" font-size="13" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">sample-23-f1-g0-compare stays the overview; this plate is the copy-paste checklist.</text>
