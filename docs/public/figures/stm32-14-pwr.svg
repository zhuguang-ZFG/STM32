<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 104" role="img" aria-label="低功耗三档：Sleep 只停 CPU，Stop 停时钟保 SRAM，Standby 全停且唤醒相当于复位"><g fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
  <text x="14" y="18" font-size="8.5" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">低功耗三档（功耗从高到低）</text>

  <text x="14" y="40" font-size="8.5" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">Sleep</text>
  <rect x="62" y="28" width="284" height="20" rx="4"/>
  <text x="204" y="42" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">CPU 停 · 外设跑 · 任意中断唤醒</text>

  <text x="14" y="66" font-size="8.5" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">Stop</text>
  <rect x="62" y="54" width="284" height="20" rx="4"/>
  <text x="204" y="68" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">时钟停 · SRAM 保留 · EXTI/RTC 唤醒</text>

  <text x="14" y="92" font-size="8.5" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">Standby</text>
  <rect x="62" y="80" width="284" height="20" rx="4"/>
  <text x="204" y="94" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="middle">1.2V 域断电 · SRAM 丢失 · 唤醒等同复位</text>
</g></svg>
