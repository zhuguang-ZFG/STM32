<line x1="700" y1="340" x2="700" y2="225" stroke="#6E569B" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 6"/>
<polygon points="700.00,218.00 703.50,225.00 696.50,225.00" fill="#6E569B" opacity="1"/>
<text x="618" y="278" font-size="9.5" fill="#6E569B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">RX 写 SRAM</text>
<line x1="646" y1="186" x2="549" y2="186" stroke="#7A5B14" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 6"/>
<polygon points="542.00,186.00 549.00,182.50 549.00,189.50" fill="#7A5B14" opacity="1"/>
<text x="594" y="204" font-size="9.5" fill="#7A5B14" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">RX invalidate</text>
<line x1="356" y1="186" x2="259" y2="186" stroke="#1F4680" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 6"/>
<polygon points="252.00,186.00 259.00,182.50 259.00,189.50" fill="#1F4680" opacity="1"/>
<text x="304" y="204" font-size="9.5" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CPU 接管</text>
<rect x="40" y="466" width="820" height="64" fill="#F7EFDA" opacity="1" rx="8" stroke="#B3392F" stroke-width="1.5"/>
<text x="58" y="491" font-size="11.5" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">最常见的错</text>
<text x="150" y="491" font-size="10.4" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">把 clean / invalidate 当作“都刷新一下”，或在 DMA 仍拥有缓冲时让 CPU 修改它。</text>
<text x="150" y="514" font-size="9.8" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">验收必须同时记录：缓冲地址与对齐、Cache 操作方向、描述符状态、PCAP 中的实际帧。</text>
<line x1="24" y1="518" x2="876" y2="518" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="542" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">视觉规范：FA-029 几何图解叙事 · IG-012 分层结构 · C-03 / C-10 / C-27 / C-31</text>
<text x="876" y="542" font-size="11" fill="#6E6B60" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量图 · STM32 知识库</text>
