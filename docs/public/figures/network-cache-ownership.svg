<text x="304" y="133" font-size="9.5" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CPU 写</text>
<line x1="542" y1="146" x2="639" y2="146" stroke="#2E5F42" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="646.00,146.00 639.00,149.50 639.00,142.50" fill="#2E5F42" opacity="1"/>
<text x="594" y="128" font-size="9.5" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TX clean</text>
<text x="594" y="143" font-size="9" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">发布所有权</text>
<line x1="740" y1="218" x2="740" y2="333" stroke="#2E5F42" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="740.00,340.00 736.50,333.00 743.50,333.00" fill="#2E5F42" opacity="1"/>
<text x="756" y="286" font-size="9.5" fill="#2E5F42" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DMA 取帧</text>
<line x1="646" y1="392" x2="551" y2="392" stroke="#8e2f5b" stroke-width="2" stroke-linecap="round" opacity="1"/>
