<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="NVIC 地址公式：IRQn 6 推出槽号 22、ISER[0] bit 6 与 IP 字节 0xE000E406"><g transform="translate(+16.2,-2)" fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
<rect x="8" y="6" width="84" height="24" rx="3" stroke-width="1.4"/>
<text x="12" y="19" font-size="8" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">IRQn = 6</text>
<text x="12" y="27" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">EXTI0</text>
<path d="M50 30 C48 34 52 34 50 38" stroke-width="1.6"/>
<text x="8" y="46" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">槽 = 6 + 16 = 22</text>
<path d="M96 42 L116 42" stroke-width="1.6"/>
<rect x="120" y="36" width="84" height="14" rx="3" stroke-width="1.4"/> <text x="124" y="46" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">0x0058</text>
<text x="8" y="64" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">ISER[6/32=0] · bit 6</text>
<path d="M96 60 L116 60" stroke-width="1.6"/>
<rect x="120" y="54" width="84" height="14" rx="3" stroke-width="1.4"/> <text x="124" y="64" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">0xE000E100</text>
<text x="8" y="82" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">IP = E000E400 + 6</text>
<path d="M96 78 L116 78" stroke-width="1.6"/>
<rect x="120" y="72" width="84" height="14" rx="3" stroke-width="1.4"/> <text x="124" y="82" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">0xE000E406</text>
<path d="M212 40 L226 40 L226 78" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="230" y="30" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">槽偏移 =</text>
<text x="230" y="40" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">槽号 × 4</text>
<text x="230" y="56" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">ISER 下标</text>
<text x="230" y="66" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">= IRQn / 32</text>
<text x="230" y="82" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">IP 一字节一中断</text>
</g></svg>
