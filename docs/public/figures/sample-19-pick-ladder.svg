<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="选题：从已验证的模块向前走一步">


<rect x="0" y="0" width="960" height="880" fill="#FBF3DF"/>
<rect x="0" y="0" width="960" height="58" fill="#F7EFDA" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#6E6B60" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1F4680" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">选题：从已验证的模块向前走一步</text>
<text x="22" y="50" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">按输入、传输与容量选项目；星级不代替硬件核对</text>
<rect x="906" y="15" width="32" height="28" fill="#DCE6F2" opacity="1" rx="8" stroke="#6E6B60" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">19</text>
<text x="40" y="104" font-size="24" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">先选一个能独立重建和验收的结果</text>
<rect x="40" y="164" width="262" height="96" fill="#F7EFDA" opacity="1" rx="8" stroke="#2E5F42" stroke-width="1.5"/>
<text x="60" y="204" font-size="21" fill="#2E5F42" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">已有 UART / PWM</text>
<text x="60" y="237" font-size="18" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">现有能力</text>
<line x1="312" y1="212" x2="363" y2="212" stroke="#2E5F42" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="370.00,212.00 363.00,215.50 363.00,208.50" fill="#2E5F42" opacity="1"/>
<text x="392" y="199" font-size="22" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">小车：命令 → 转向 / 停止</text>
<text x="392" y="240" font-size="18" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">断开遥控后进入预定停止状态</text>
<rect x="40" y="346" width="262" height="96" fill="#F7EFDA" opacity="1" rx="8" stroke="#1F4680" stroke-width="1.5"/>
<text x="60" y="386" font-size="21" fill="#1F4680" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">已有 ADC / DMA</text>
<text x="60" y="419" font-size="18" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">现有能力</text>
<line x1="312" y1="394" x2="363" y2="394" stroke="#1F4680" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="370.00,394.00 363.00,397.50 363.00,390.50" fill="#1F4680" opacity="1"/>
<text x="392" y="381" font-size="22" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">采集：稳定半区 → 主机 / 屏幕</text>
<text x="392" y="422" font-size="18" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">处理完前，DMA 不覆盖仍在使用的数据</text>
<rect x="40" y="528" width="262" height="96" fill="#F7EFDA" opacity="1" rx="8" stroke="#7A5B14" stroke-width="1.5"/>
<text x="60" y="568" font-size="21" fill="#7A5B14" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">已有模块和错误记录</text>
<text x="60" y="601" font-size="18" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">现有能力</text>
<line x1="312" y1="576" x2="363" y2="576" stroke="#7A5B14" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="370.00,576.00 363.00,579.50 363.00,572.50" fill="#7A5B14" opacity="1"/>
<text x="392" y="563" font-size="22" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">系统：CAN / IAP / RTOS</text>
<text x="392" y="604" font-size="18" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先验收失败与恢复，再扩大节点或任务</text>
<line x1="40" y1="682" x2="920" y2="682" stroke="#D8D2C0" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="40" y="730" font-size="21" fill="#1F4680" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">C8：64 KB Flash / 20 KB SRAM；先复算缓冲与镜像。</text>
<text x="40" y="774" font-size="20" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">需要片内 CAN 时核对具体型号：F411 无 bxCAN，F407 有。</text>
<text x="40" y="814" font-size="18" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">所选项目只增加已列明的一项不确定性，并留下复现步骤。</text>
<line x1="24" y1="844" x2="936" y2="844" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="864" font-size="11" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。项目组合见本章；芯片能力以对应数据手册为准。</text>
<text x="936" y="864" font-size="11" fill="#6E6B60" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
