<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="USART 波特率寄存器 BRR：PCLK 与 baud 相除后拆成整数与小数两个字段"><g fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
<text x="8" y="12" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">USARTDIV = 84M / (16 × 115200) = 45.5729</text>
<rect x="8" y="18" width="140" height="16" rx="3" stroke-width="1.4"/> <text x="12" y="29" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">整数 45 → Mantissa</text>
<rect x="8" y="40" width="140" height="16" rx="3" stroke-width="1.4"/> <text x="12" y="51" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">小数 .5729 × 16 ≈ 9</text>
<path d="M150 26 L166 26" stroke-width="1.8"/>
<path d="M150 48 L166 48" stroke-width="1.8"/>
<rect x="170" y="18" width="142" height="38" rx="3" stroke-width="1.4"/>
<text x="176" y="32" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">BRR = (45 &lt;&lt; 4) | 9</text>
<text x="176" y="46" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">= 0x2D9</text>
<text x="8" y="70" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">OVER8=0：小数 4 位；OVER8=1：3 位</text>
<text x="8" y="82" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">两处都写错 → 波特率偏 1 位就丢帧</text>
</g></svg>
