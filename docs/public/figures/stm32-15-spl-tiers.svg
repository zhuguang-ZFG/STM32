<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="SPL 三层基础设施：基址宏给名字、结构体收字段、位掩码给位号"><g transform="translate(+33.5,+1.5)" fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
<text x="8" y="12" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">三层叠加，函数只是翻译</text>
<rect x="8" y="18" width="176" height="16" rx="3" stroke-width="1.4"/> <text x="12" y="29" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">① 基址宏：GPIOA_BASE = 0x40020000</text>
<path d="M96 34 L96 40" stroke-width="1.8"/>
<rect x="8" y="40" width="176" height="16" rx="3" stroke-width="1.4"/> <text x="12" y="51" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">② 结构体：GPIO_TypeDef{MODER,OTYPER,…}</text>
<path d="M96 56 L96 62" stroke-width="1.8"/>
<rect x="8" y="62" width="176" height="16" rx="3" stroke-width="1.4"/> <text x="12" y="73" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">③ 位掩码：GPIO_MODER_MODER5</text>
<path d="M188 70 L200 70" stroke-width="2.2"/>
<text x="204" y="20" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">读库三步：</text>
<text x="204" y="32" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">先找基址</text>
<text x="204" y="42" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">再看结构体</text>
<text x="204" y="52" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">最后对位掩码</text>
<text x="204" y="66" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">SPL 不发明</text>
<text x="204" y="76" font-size="7" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none" text-anchor="start">寄存器</text>
</g></svg>
