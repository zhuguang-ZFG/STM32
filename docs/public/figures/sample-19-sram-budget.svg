<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="SRAM 预算：外层只计一次，堆内再细分">


<rect x="0" y="0" width="960" height="880" fill="#FBF3DF"/>
<rect x="0" y="0" width="960" height="58" fill="#F7EFDA" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#6E6B60" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#7A5B14" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SRAM 预算：外层只计一次，堆内再细分</text>
<text x="22" y="50" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 · 20480 B · 下列数值仅为预算示例</text>
<rect x="906" y="15" width="32" height="28" fill="#DCE6F2" opacity="1" rx="8" stroke="#6E6B60" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#7A5B14" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">19</text>
<text x="40" y="106" font-size="24" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">示例：heap_4 的 ucHeap 已属于 .bss</text>
<rect x="40" y="184" width="176" height="84" fill="#F7EFDA" opacity="1" rx="2" stroke="#1F4680" stroke-width="1.5"/>
<text x="128" y="221" font-size="20" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">其他静态</text>
<text x="128" y="303" font-size="18" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">4096 B</text>
<rect x="216" y="184" width="352" height="84" fill="#F7EFDA" opacity="1" rx="2" stroke="#2E5F42" stroke-width="1.5"/>
<text x="392" y="221" font-size="20" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">ucHeap</text>
<text x="392" y="303" font-size="18" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">8192 B</text>
<rect x="568" y="184" width="88" height="84" fill="#F7EFDA" opacity="1" rx="2" stroke="#7A5B14" stroke-width="1.5"/>
<text x="612" y="303" font-size="18" fill="#7A5B14" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">2048 B</text>
<line x1="612" y1="182" x2="612" y2="154" stroke="#7A5B14" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="612" y="140" font-size="18" fill="#7A5B14" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">MSP / C 堆预留</text>
<rect x="656" y="184" width="264" height="84" fill="#F7EFDA" opacity="1" rx="2" stroke="#6E6B60" stroke-width="1.5"/>
<text x="788" y="221" font-size="20" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">未分配地址空间</text>
<text x="788" y="303" font-size="18" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">6144 B</text>
<text x="40" y="351" font-size="23" fill="#1F4680" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">4096 + 8192 + 2048 + 6144 = 20480 B</text>
<text x="40" y="390" font-size="19" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">这不是板上测量；未分配区不等于可保证的安全余量。</text>
<line x1="40" y1="425" x2="920" y2="425" stroke="#D8D2C0" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="40" y="470" font-size="22" fill="#2E5F42" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">展开 8192 B ucHeap：动态分配发生在这块内部</text>
<rect x="40" y="510" width="440" height="98" fill="#F7EFDA" opacity="1" rx="2" stroke="#2E5F42" stroke-width="1.5"/>
<text x="260" y="549" font-size="20" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">动态任务栈</text>
<text x="260" y="584" font-size="19" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">4096 B</text>
<rect x="480" y="510" width="220" height="98" fill="#F7EFDA" opacity="1" rx="2" stroke="#1F4680" stroke-width="1.5"/>
<text x="590" y="549" font-size="20" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TCB / 队列等</text>
<text x="590" y="584" font-size="19" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">2048 B</text>
<rect x="700" y="510" width="220" height="98" fill="#F7EFDA" opacity="1" rx="2" stroke="#6E6B60" stroke-width="1.5"/>
<text x="810" y="549" font-size="20" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">heap 剩余</text>
<text x="810" y="584" font-size="19" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">2048 B</text>
<text x="40" y="650" font-size="22" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">TCB / 队列等已含管理开销；动态分配不能再加到外层。</text>
<line x1="40" y1="688" x2="920" y2="688" stroke="#D8D2C0" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="40" y="733" font-size="19" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">map：核对静态段和 MSP 预留；DMA 缓冲按实际字节数列入。</text>
<text x="40" y="774" font-size="19" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">运行：核对最小剩余堆、任务栈水位与中断栈峰值。</text>
<text x="40" y="814" font-size="18" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">换分配器或改用静态任务后，按实际存储对象重算包含关系。</text>
<line x1="24" y1="844" x2="936" y2="844" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="864" font-size="11" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。DS5319 容量；FreeRTOS heap_4 / tasks.c 的分配关系。</text>
<text x="936" y="864" font-size="11" fill="#6E6B60" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
