<text x="145" y="210" font-size="13" fill="#2F2E2B" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">.resc board</text>
<line x1="254" y1="195" x2="259" y2="195" stroke="#6E6B60" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="266.00,195.00 259.00,198.50 259.00,191.50" fill="#6E6B60" opacity="1"/>
