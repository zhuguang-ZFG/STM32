<line x1="72" y1="332" x2="72" y2="335" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="72.00,340.00 69.50,335.00 74.50,335.00" fill="#5e6872" opacity="1"/>
<rect x="44" y="342" width="812" height="50" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<rect x="44" y="342" width="54" height="50" fill="#7a4e00" opacity="1" rx="8"/>
<text x="71" y="372" font-size="12" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">L5</text>
<text x="116" y="363" font-size="11.5" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">DNS / TLS</text>
<text x="116" y="382" font-size="9.7" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DNS 得到预期地址；证书链与主机名通过</text>
<rect x="626" y="351" width="210" height="32" fill="#fbfaf7" opacity="1" rx="4" stroke="#5e6872" stroke-width="1.5"/>
<text x="731" y="371" font-size="9.2" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">nslookup · TLS error</text>
<line x1="72" y1="394" x2="72" y2="397" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="72.00,402.00 69.50,397.00 74.50,397.00" fill="#5e6872" opacity="1"/>
