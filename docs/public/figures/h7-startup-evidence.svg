<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="480 MHz 启动后，要拿到三类互相独立的证据">


<rect x="0" y="0" width="900" height="560" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1b5c45" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">480 MHz 启动后，要拿到三类互相独立的证据</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">软件读回、MCO 测量和外设闭环分别排除不同错误</text>
<rect x="738" y="15" width="140" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="808" y="33.32" font-size="12" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">25 证据 · IG-010</text>
<rect x="42" y="100" width="256" height="286" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<rect x="42" y="100" width="256" height="48" fill="#075e84" opacity="0.86" rx="8"/>
<text x="170" y="130" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">1 · 软件读回</text>
<circle cx="76" cy="190" r="8" fill="#075e84" opacity="0.82"/>
<text x="98" y="194" font-size="10.2" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SYSCLK = 480 MHz</text>
<line x1="66" y1="220" x2="274" y2="220" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<circle cx="76" cy="254" r="8" fill="#075e84" opacity="0.82"/>
<text x="98" y="258" font-size="10.2" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HCLK = 240 MHz</text>
<line x1="66" y1="284" x2="274" y2="284" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<circle cx="76" cy="318" r="8" fill="#075e84" opacity="0.82"/>
<text x="98" y="322" font-size="10.2" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">记录供电/REV_ID/失败步骤</text>
<rect x="322" y="100" width="256" height="286" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<rect x="322" y="100" width="256" height="48" fill="#7a4e00" opacity="0.86" rx="8"/>
<text x="450" y="130" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">2 · 独立时钟输出</text>
<circle cx="356" cy="190" r="8" fill="#7a4e00" opacity="0.82"/>
<text x="378" y="194" font-size="10.2" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PC9 输出 MCO2</text>
<line x1="346" y1="220" x2="554" y2="220" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<circle cx="356" cy="254" r="8" fill="#7a4e00" opacity="0.82"/>
<text x="378" y="258" font-size="10.2" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SYSCLK / 5 = 96 MHz</text>
<line x1="346" y1="284" x2="554" y2="284" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<circle cx="356" cy="318" r="8" fill="#7a4e00" opacity="0.82"/>
<text x="378" y="322" font-size="10.2" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">示波器或计数器实测</text>
<rect x="602" y="100" width="256" height="286" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<rect x="602" y="100" width="256" height="48" fill="#1b5c45" opacity="0.86" rx="8"/>
<text x="730" y="130" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">3 · 外设闭环</text>
<circle cx="636" cy="190" r="8" fill="#1b5c45" opacity="0.82"/>
<text x="658" y="194" font-size="10.2" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">UART 波特率 / PWM 周期</text>
<line x1="626" y1="220" x2="834" y2="220" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<circle cx="636" cy="254" r="8" fill="#1b5c45" opacity="0.82"/>
<text x="658" y="258" font-size="10.2" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SysTick / RTOS tick</text>
<line x1="626" y1="284" x2="834" y2="284" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<circle cx="636" cy="318" r="8" fill="#1b5c45" opacity="0.82"/>
<text x="658" y="322" font-size="10.2" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">独立 kernel clock 另验</text>
<rect x="42" y="420" width="816" height="92" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="60" y="449" font-size="11.5" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">不能替代</text>
<text x="132" y="449" font-size="10.3" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HAL_Delay(1000) 大约一秒，只检查一条路径；它不证明 USB、FDCAN 或其他 kernel clock。</text>
<text x="132" y="478" font-size="10.2" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">96 MHz 是计算期望；仓库没有实测数据。只有仪器读数与计算一致时，才成为板级证据。</text>
<line x1="24" y1="518" x2="876" y2="518" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="542" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">视觉规范：FA-002 概念连续线 · IG-010 阶段进阶 · C-03 / C-10 / C-27 / C-31</text>
<text x="876" y="542" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量图 · STM32 知识库</text>
</svg>
