<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="FAQ：从症状找到下一项检查">


<rect x="0" y="0" width="960" height="880" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">FAQ：从症状找到下一项检查</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">编译链接 / 下载调试 / 外设 / 硬件 / RTOS</text>
<rect x="906" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">18</text>
<text x="40" y="104" font-size="21" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">保存一次失败的日志或波形，再选下面对应的一行。</text>
<text x="40" y="162" font-size="19" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">症状</text>
<text x="316" y="162" font-size="19" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">检查什么</text>
<text x="650" y="162" font-size="19" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">读到什么才往下查</text>
<line x1="40" y1="184" x2="920" y2="184" stroke="#d7dce1" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<rect x="40" y="198" width="4" height="77" fill="#075e84" opacity="1"/>
<text x="60" y="220" font-size="21" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">编译链接</text>
<text x="60" y="256" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">未定义 / 区域溢出</text>
<text x="316" y="220" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">构建日志、map 与符号表</text>
<text x="316" y="256" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">区分缺少输入与容量不足</text>
<line x1="598" y1="232" x2="621" y2="232" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="628.00,232.00 621.00,235.50 621.00,228.50" fill="#075e84" opacity="1"/>
<text x="650" y="220" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">缺哪个符号或哪个段超限</text>
<text x="650" y="256" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">再核对源文件或链接区域</text>
<line x1="40" y1="295" x2="920" y2="295" stroke="#d7dce1" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<rect x="40" y="309" width="4" height="77" fill="#1e4d63" opacity="1"/>
<text x="60" y="331" font-size="21" fill="#1e4d63" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">下载调试</text>
<text x="60" y="367" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SWD 读不到目标</text>
<text x="316" y="331" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">供电、共地、线序与 NRST</text>
<text x="316" y="367" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PA13 / PA14 · 第 34 / 37 脚</text>
<line x1="598" y1="343" x2="621" y2="343" stroke="#1e4d63" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="628.00,343.00 621.00,346.50 621.00,339.50" fill="#1e4d63" opacity="1"/>
<text x="650" y="331" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">探针能否稳定读取目标 ID</text>
<text x="650" y="367" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">能连接后再查烧录和启动</text>
<line x1="40" y1="406" x2="920" y2="406" stroke="#d7dce1" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<rect x="40" y="420" width="4" height="77" fill="#1b5c45" opacity="1"/>
<text x="60" y="442" font-size="21" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">外设</text>
<text x="60" y="478" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">USART1 收到乱码</text>
<text x="316" y="442" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SWS、PPRE2 与完整 BRR</text>
<text x="316" y="478" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">用 PCLK2 换算波特率</text>
<line x1="598" y1="454" x2="621" y2="454" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="628.00,454.00 621.00,457.50 621.00,450.50" fill="#1b5c45" opacity="1"/>
<text x="650" y="442" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TX 位宽与接收设置是否一致</text>
<text x="650" y="478" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">再查接线、电平和数据格式</text>
<line x1="40" y1="517" x2="920" y2="517" stroke="#d7dce1" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<rect x="40" y="531" width="4" height="77" fill="#7a4e00" opacity="1"/>
<text x="60" y="553" font-size="21" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">硬件</text>
<text x="60" y="589" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">板卡反复复位</text>
<text x="316" y="553" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">供电与 NRST 波形</text>
<text x="316" y="589" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">让波形与失败时刻对应</text>
<line x1="598" y1="565" x2="621" y2="565" stroke="#7a4e00" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="628.00,565.00 621.00,568.50 621.00,561.50" fill="#7a4e00" opacity="1"/>
<text x="650" y="553" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">电压跌落或复位脉冲</text>
<text x="650" y="589" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">再查负载、去耦与复位电路</text>
<line x1="40" y1="628" x2="920" y2="628" stroke="#d7dce1" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<rect x="40" y="642" width="4" height="77" fill="#5b3a8c" opacity="1"/>
<text x="60" y="664" font-size="21" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">RTOS</text>
<text x="60" y="700" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">某任务一直没运行</text>
<text x="316" y="664" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">任务状态、优先级与阻塞点</text>
<text x="316" y="700" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">栈水位另作内存余量检查</text>
<line x1="598" y1="676" x2="621" y2="676" stroke="#5b3a8c" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="628.00,676.00 621.00,679.50 621.00,672.50" fill="#5b3a8c" opacity="1"/>
<text x="650" y="664" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">任务被阻塞，还是就绪却未调度</text>
<text x="650" y="700" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">再查等待条件与高优先级负载</text>
<line x1="40" y1="748" x2="920" y2="748" stroke="#d7dce1" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="40" y="790" font-size="19" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">BOOT 选择启动存储区；任务栈水位也不能证明任务获得了 CPU。</text>
<line x1="24" y1="844" x2="936" y2="844" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="864" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。FAQ 检查索引；观测结果用于缩小范围，不代表已经证明根因。</text>
<text x="936" y="864" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
