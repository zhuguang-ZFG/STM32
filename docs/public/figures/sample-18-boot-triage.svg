<text x="40" y="824" font-size="18" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">BOOT 选择启动存储区；不能仅凭 BOOT0 电平判断 SWD 是否能读到目标。</text>
<text x="40" y="860" font-size="17" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">应用仍需有效镜像与向量；Flash / 系统存储器映射到 0，SRAM 有专用启动机制。</text>
