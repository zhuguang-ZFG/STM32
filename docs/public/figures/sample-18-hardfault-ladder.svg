<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="HardFault：地址和栈帧分开核对">


<rect x="0" y="0" width="960" height="880" fill="#FBF3DF"/>
<rect x="0" y="0" width="960" height="58" fill="#F7EFDA" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#6E6B60" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#7A5B14" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">HardFault：地址和栈帧分开核对</text>
<text x="22" y="50" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CFSR 0xE000ED28 · BFAR 0xE000ED38</text>
<rect x="906" y="15" width="32" height="28" fill="#DCE6F2" opacity="1" rx="8" stroke="#6E6B60" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#7A5B14" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">18</text>
<rect x="40" y="106" width="880" height="108" fill="#F7EFDA" opacity="1" rx="8" stroke="#1F4680" stroke-width="1.5"/>
<text x="60" y="145" font-size="23" fill="#1F4680" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">先保存 BFAR / MMFAR，再读取对应有效位</text>
<text x="60" y="182" font-size="18" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">一并保存 CFSR、HFSR、EXC_RETURN 与可用栈帧；以下解读同一快照。</text>
<line x1="480" y1="218" x2="480" y2="249" stroke="#6E6B60" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="480.00,256.00 476.50,249.00 483.50,249.00" fill="#6E6B60" opacity="1"/>
<text x="480" y="294" font-size="23" fill="#2F2E2B" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">BFARVALID · CFSR bit 15</text>
<line x1="480" y1="312" x2="480" y2="330" stroke="#6E6B60" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<line x1="256" y1="330" x2="704" y2="330" stroke="#6E6B60" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<line x1="256" y1="330" x2="256" y2="359" stroke="#2E5F42" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="256.00,366.00 252.50,359.00 259.50,359.00" fill="#2E5F42" opacity="1"/>
<line x1="704" y1="330" x2="704" y2="359" stroke="#B3392F" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="704.00,366.00 700.50,359.00 707.50,359.00" fill="#B3392F" opacity="1"/>
<text x="280" y="354" font-size="19" fill="#2E5F42" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">1</text>
<text x="728" y="354" font-size="19" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">0</text>
<rect x="40" y="370" width="424" height="108" fill="#F7EFDA" opacity="1" rx="8" stroke="#2E5F42" stroke-width="1.5"/>
<text x="60" y="411" font-size="21" fill="#2E5F42" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">使用保存的 BFAR 地址</text>
<text x="60" y="449" font-size="17" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">结合故障类型与访问指令解释</text>
<rect x="496" y="370" width="424" height="108" fill="#F7EFDA" opacity="1" rx="8" stroke="#B3392F" stroke-width="1.5"/>
<text x="516" y="411" font-size="21" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">舍弃保存的 BFAR 地址</text>
<text x="516" y="449" font-size="17" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">数值看起来合理也不能用于定位</text>
<line x1="40" y1="520" x2="920" y2="520" stroke="#D8D2C0" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="40" y="563" font-size="23" fill="#1F4680" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">继续检查异常栈帧</text>
<text x="40" y="604" font-size="18" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STKERR / MSTKERR：入栈失败，不能假定 frame 中每个字段都完整。</text>
<text x="40" y="644" font-size="18" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先验证 MSP / PSP、栈边界与 EXC_RETURN，再解释选定 frame 的 PC。</text>
<text x="40" y="684" font-size="18" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">IMPRECISERR：异常可滞后于写访问，栈中 PC 未必是肇事指令。</text>
<rect x="40" y="728" width="880" height="72" fill="#F7EFDA" opacity="1" rx="8" stroke="#7A5B14" stroke-width="1.5"/>
<text x="60" y="759" font-size="19" fill="#7A5B14" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">定位源码使用同一份 ELF 与可信 PC；BFAR 是访问地址。</text>
<text x="60" y="786" font-size="16" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">MMFAR 同样先保存，再检查 MMARVALID；避免在故障中阻塞打印。</text>
<line x1="24" y1="844" x2="936" y2="844" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="864" font-size="11" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量图 · ARM DUI0552A §4.3.10–4.3.15；采集、地址有效性与栈完整性分别判断。</text>
<text x="936" y="864" font-size="11" fill="#6E6B60" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
