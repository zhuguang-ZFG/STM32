<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>RISC-V ECLIC 两维优先级：level 定抢占，priority 定序</title>
  <desc>RISC-V Bumblebee 内核的 ECLIC 用两维优先级（level + priority）替代 ARM NVIC 的单一优先级 + PRIGROUP 切分。ARM 的 NVIC 把 16 级优先级用 PRIGROUP 切分成抢占组 + 子优先级——切分点一改，含义全变。ECLIC 则是 level（0-15）决定抢占、priority（0-15）在同级 level 内排序——两维独立设置，不用切分点。level 高的抢占 level 低的（数字大=高），同级 level 内 priority 高的先执行。shv（Selective Hardware Vector）模式让中断直接向量跳到 handler 入口（像 ARM 的向量模式），非 shv 模式统一进一个入口再分发。没有 NVIC 的优先级分组，没有 SCB->VTOR（向量表基址在 mtvec 寄存器）。图上有一个真在跑的中断请求：按 level 排队，高 level 插队到低 level 前面，同级 level 内按 priority 排序。</desc>
  <rect width="720" height="460" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">RISC-V ECLIC：两维优先级替代 NVIC 单维+PRIGROUP</text>
  <text x="24" y="50" font-size="12" fill="#666">level 定抢占（数字大=高），priority 定同序；无 PRIGROUP 切分点</text>

  <!-- 左侧 ARM NVIC（常驻） -->
  <rect x="40" y="66" width="260" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="170" y="86" font-size="13" font-weight="bold" fill="#3451b2" text-anchor="middle">ARM NVIC：单维 + PRIGROUP</text>
  <line x1="56" y1="94" x2="284" y2="94" stroke="#e2e8f0"/>
  <text x="56" y="114" font-size="11" fill="#666">16 级优先级，1 个寄存器值</text>
  <rect x="56" y="122" width="228" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="170" y="138" font-size="11" font-family="Consolas,monospace" fill="#64748b" text-anchor="middle">PRIGROUP 切分点：[抢占组|子优先级]</text>
  <text x="56" y="166" font-size="11" fill="#666">切分点一改，含义全变：</text>
  <text x="56" y="182" font-size="11" font-family="Consolas,monospace" fill="#94a3b8">组0：0抢占+16子（全子）</text>
  <text x="56" y="196" font-size="11" font-family="Consolas,monospace" fill="#94a3b8">组4：2抢占+2子（常用）</text>
  <text x="56" y="210" font-size="11" font-family="Consolas,monospace" fill="#94a3b8">组7：16抢占+0子（全抢占）</text>
  <text x="56" y="232" font-size="11" fill="#d97706">单维切分=一改全动，心智负担</text>

  <!-- 右侧 ECLIC（常驻） -->
  <rect x="420" y="66" width="260" height="180" rx="8" fill="#ffffff" stroke="#3eaf7c" stroke-width="2"/>
  <text x="550" y="86" font-size="13" font-weight="bold" fill="#1a7f56" text-anchor="middle">ECLIC：两维独立</text>
  <line x1="436" y1="94" x2="664" y2="94" stroke="#e2e8f0"/>
  <text x="436" y="114" font-size="11" fill="#666">level（0-15）× priority（0-15）</text>
  <rect x="436" y="122" width="100" height="24" rx="3" fill="#d8f3e5" stroke="#3eaf7c"/>
  <text x="486" y="138" font-size="11" font-family="Consolas,monospace" fill="#1a7f56" text-anchor="middle">level 定抢占</text>
  <rect x="544" y="122" width="120" height="24" rx="3" fill="#dbe7ff" stroke="#3451b2"/>
  <text x="604" y="138" font-size="11" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">priority 定同级序</text>
  <text x="436" y="166" font-size="11" fill="#666">两维独立设置，不用切分点：</text>
  <text x="436" y="182" font-size="11" font-family="Consolas,monospace" fill="#1a7f56">level 高抢占 level 低</text>
  <text x="436" y="196" font-size="11" font-family="Consolas,monospace" fill="#3451b2">同级 level 内 priority 高先</text>
  <text x="436" y="210" font-size="11" font-family="Consolas,monospace" fill="#94a3b8">shv 向量直跳 / 非 shv 统一入口</text>
  <text x="436" y="232" font-size="11" fill="#3eaf7c">两维独立=改一维不动另一维</text>

  <!-- 中断排队演示条（连续运动：高 level 插队） -->
  <text x="360" y="264" font-size="11" fill="#94a3b8" text-anchor="middle">中断排队：高 level 插队到低 level 前面</text>
  <line x1="80" y1="290" x2="640" y2="290" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="120" cy="290" r="7" fill="#3451b2">
    <animate attributeName="cx" values="120;520;520;120" keyTimes="0;0.86;0.93;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="281" font-size="11" fill="#3451b2" text-anchor="middle">L3 低</text>
  <text x="360" y="281" font-size="11" fill="#d97706" text-anchor="middle">L7 中</text>
  <text x="520" y="281" font-size="11" fill="#dc2626" text-anchor="middle">L15 高</text>

  <!-- 阶段一：ARM 单维 + PRIGROUP -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="310" width="640" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="332" font-size="13" font-weight="bold" fill="#3451b2">① ARM NVIC：16 级优先级 + PRIGROUP 切分</text>
    <text x="56" y="356" font-size="13" fill="#333">一个 4 位优先级值，用 PRIGROUP 切成"抢占组+子优先级"——切分点一改，同一数字的含义全变。</text>
    <text x="56" y="378" font-size="12" fill="#d97706">组4（2+2）与组7（16+0）下"优先级5"的抢占行为完全不同——心智负担。</text>
  </g>

  <!-- 阶段二：ECLIC 两维独立 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="310" width="640" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="332" font-size="13" font-weight="bold" fill="#1a7f56">② ECLIC：level + priority 两维独立</text>
    <text x="56" y="356" font-size="13" fill="#333">level（0-15）定抢占，priority（0-15）定同级排序——两维各设各的，不用切分点。</text>
    <text x="56" y="378" font-size="12" fill="#3eaf7c">改 level 不动 priority，改 priority 不动 level——比 PRIGROUP 切分清晰一档。</text>
  </g>

  <!-- 阶段三：level 定抢占 priority 定序 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="310" width="640" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="332" font-size="13" font-weight="bold" fill="#d97706">③ 排队规则：level 高先，同级 priority 高先</text>
    <text x="56" y="356" font-size="13" fill="#333">中断到达时按 level 排队，level 高的插队到 level 低的前面；同级 level 内按 priority 排序。</text>
    <text x="56" y="378" font-size="12" fill="#d97706">数字大=高（与 NVIC 同向），0=最低——别套 FreeRTOS 反向。</text>
  </g>

  <!-- 阶段四：shv 向量直跳 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="310" width="640" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="332" font-size="13" font-weight="bold" fill="#3451b2">④ shv 向量直跳：像 ARM 向量模式</text>
    <text x="56" y="356" font-size="13" fill="#333">shv（Selective Hardware Vector）模式：中断直接向量跳到 handler 入口，像 ARM 的向量模式。</text>
    <text x="56" y="378" font-size="12" fill="#3eaf7c">非 shv 模式统一进一个入口再分发；向量表基址在 mtvec 寄存器，无 SCB->VTOR。</text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">① ARM NVIC：单维优先级+PRIGROUP 切分，一改全动</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">② ECLIC：level+priority 两维独立，不用切分点</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">③ level 定抢占 priority 定序，数字大=高与 NVIC 同向</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">④ shv 向量直跳像 ARM 向量模式，无 VTOR 用 mtvec</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,438)" fill="#3451b2">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>
