<text x="478" y="334" font-size="11" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">VOS1 ready → VOS0 · PLLN=480</text>
<text x="478" y="360" font-size="10.3" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CPU 480 · HCLK 240 · PCLK 120 MHz</text>
<text x="478" y="386" font-size="10.3" fill="#6E6B60" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">MCO2 = SYSCLK/5 → 96 MHz</text>
<rect x="40" y="440" width="820" height="102" fill="#F7EFDA" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="58" y="468" font-size="11.5" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">两条容易算错的支路</text>
<text x="58" y="494" font-size="10.3" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">APB prescaler ≠ 1 时，timer clock = 2 × PCLK；UART 仍用自己的 kernel clock。</text>
<text x="58" y="520" font-size="10.1" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PLL1Q = 240 MHz 不是 USB 48 MHz；USB/FDCAN/ADC/SPI/USART 的 kernel clock 必须逐项选择。</text>
