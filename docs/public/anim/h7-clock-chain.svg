<text x="58" y="334" font-size="11" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">VOS1 · PLLN=400</text>
