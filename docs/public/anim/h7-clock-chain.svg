<text x="58" y="386" font-size="10.3" fill="#6E6B60" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">MCO2 = SYSCLK/5 → 80 MHz</text>
