<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>中断来了：硬件替你保存现场（异常进入与返回）</title>
  <desc>中断来了：硬件替你保存现场（异常进入与返回）。EXTI → NVIC → 硬件压栈 8 个字 → 向量表跳 ISR → EXC_RETURN 魔法值自动弹栈。图里请求点沿 EXTI 线爬到 NVIC，八个字按 xPSR→…→R0 一格一格亮进栈里，栈指针跟着往下走；返回时指针再一格一格走回原处。</desc>
  <rect width="720" height="440" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">中断来了：硬件替你保存现场（异常进入与返回）</text>
  <text x="24" y="50" font-size="12" fill="#666">EXTI → NVIC → 硬件压栈 8 个字 → 向量表跳 ISR → EXC_RETURN 魔法值自动弹栈</text>

  <!-- EXTI 信号线 -->
  <text x="40" y="72" font-size="12" fill="#888">EXTI 请求线</text>
  <polyline points="110,68 360,68 360,52 690,52" fill="none" stroke="#3eaf7c" stroke-width="2"/>
  <text x="366" y="66" font-size="11" fill="#3eaf7c">按键触发 ↑</text>

  <!-- 左：程序流 -->
  <rect x="30" y="88" width="196" height="296" fill="#fff" stroke="#cbd5e1" rx="8"/>
  <text x="44" y="108" font-size="13" font-weight="bold" fill="#3451b2">程序流</text>
  <rect x="48" y="120" width="160" height="46" fill="#dbe7ff" stroke="#3451b2" rx="5"/>
  <text x="128" y="147" font-size="13" fill="#3451b2" text-anchor="middle">main 循环</text>
  <rect x="48" y="176" width="160" height="30" fill="#f1f5f9" stroke="#94a3b8" rx="5"/>
  <text x="128" y="196" font-size="11" fill="#64748b" text-anchor="middle">向量表[22] = ISR 地址</text>
  <rect x="48" y="216" width="160" height="46" fill="#fff" stroke="#cbd5e1" rx="5"/>
  <text x="128" y="236" font-size="12" fill="#888" text-anchor="middle">EXTI0_IRQHandler</text>
  <text x="128" y="252" font-size="11" fill="#aaa" text-anchor="middle">（清挂起 → 翻转 LED）</text>
  <text x="44" y="292" font-size="11" fill="#888">①  NVIC 判优先级</text>
  <text x="44" y="310" font-size="11" fill="#888">②  硬件压栈（免指令）</text>
  <text x="44" y="328" font-size="11" fill="#888">③  取向量表跳 ISR</text>
  <text x="44" y="346" font-size="11" fill="#888">④  BX lr → 硬件弹栈</text>

  <!-- 中：栈 -->
  <rect x="260" y="88" width="250" height="296" fill="#fff" stroke="#cbd5e1" rx="8"/>
  <text x="274" y="108" font-size="13" font-weight="bold" fill="#3451b2">当前栈（MSP/PSP）</text>
  <rect x="274" y="118" width="216" height="30" fill="#dbe7ff" stroke="#3451b2" rx="3"/>
  <text x="382" y="138" font-size="12" fill="#3451b2" text-anchor="middle">main 的栈帧</text>
  <g font-size="11" font-family="Consolas,monospace">
    <g fill="none" stroke="#94a3b8" stroke-dasharray="3 3">
      <rect x="274" y="148" width="216" height="24"/><rect x="274" y="172" width="216" height="24"/>
      <rect x="274" y="196" width="216" height="24"/><rect x="274" y="220" width="216" height="24"/>
      <rect x="274" y="244" width="216" height="24"/><rect x="274" y="268" width="216" height="24"/>
      <rect x="274" y="292" width="216" height="24"/><rect x="274" y="316" width="216" height="24"/>
    </g>
    <g fill="#94a3b8">
      <text x="282" y="164">xPSR</text><text x="282" y="188">PC（返回地址）</text>
      <text x="282" y="212">LR</text><text x="282" y="236">R12</text>
      <text x="282" y="260">R3</text><text x="282" y="284">R2</text>
      <text x="282" y="308">R1</text><text x="282" y="332">R0</text><text x="282" y="376">R0　← 压完 sp 在这</text>
    </g>
  </g>
  <text x="382" y="356" font-size="11" fill="#aaa" text-anchor="middle">↓ 硬件自动压栈区（8 字 = 32 字节）</text>

  <!-- 右：寄存器 -->
  <rect x="540" y="88" width="160" height="296" fill="#fff" stroke="#cbd5e1" rx="8"/>
  <text x="554" y="108" font-size="13" font-weight="bold" fill="#3451b2">关键寄存器</text>
  <g font-family="Consolas,monospace">
    <g fill="#eef2ff" stroke="#3451b2">
      <rect x="554" y="120" width="40" height="24" rx="3"/>
      <rect x="554" y="152" width="40" height="24" rx="3"/>
      <rect x="554" y="184" width="40" height="24" rx="3"/>
    </g>
    <g fill="#3451b2" font-weight="bold" font-size="12">
      <text x="574" y="136" text-anchor="middle">sp</text>
      <text x="574" y="168" text-anchor="middle">lr</text>
      <text x="574" y="200" text-anchor="middle">pc</text>
    </g>
  </g>
  <text x="554" y="240" font-size="11" fill="#888">魔法值 EXC_RETURN</text>
  <text x="554" y="256" font-size="11" fill="#888">= 0xFFFFFFFD：</text>
  <text x="554" y="272" font-size="11" fill="#888">“请弹栈回线程模式”</text>

  <!-- ===== 阶段 0：平静 ===== -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <g font-size="12" font-family="Consolas,monospace" fill="#333">
      <text x="600" y="136">0x2000FFF0</text>
      <text x="600" y="168">—</text>
      <text x="600" y="200" fill="#3451b2">main 中</text>
    </g>
    <text x="30" y="416" font-size="14" font-family="Consolas,monospace" fill="#333">▶ main 正在跑，一切平静……（EXTI 线上还没有信号）</text>
  </g>

  <!-- ===== 阶段 1：压栈 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="360" cy="52" r="5" fill="#3eaf7c"/>
    <g fill="#d8f3e5" stroke="#3eaf7c">
      <!-- 8 个字按 xPSR→PC→LR→R12→R3→R2→R1→R0 的顺序依次压进来 -->
      <rect x="274" y="148" width="216" height="24" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;0.25;1" dur="12s" repeatCount="indefinite"/></rect>
      <rect x="274" y="172" width="216" height="24" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;0.279;1" dur="12s" repeatCount="indefinite"/></rect>
      <rect x="274" y="196" width="216" height="24" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;0.308;1" dur="12s" repeatCount="indefinite"/></rect>
      <rect x="274" y="220" width="216" height="24" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;0.336;1" dur="12s" repeatCount="indefinite"/></rect>
      <rect x="274" y="244" width="216" height="24" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;0.365;1" dur="12s" repeatCount="indefinite"/></rect>
      <rect x="274" y="268" width="216" height="24" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;0.394;1" dur="12s" repeatCount="indefinite"/></rect>
      <rect x="274" y="292" width="216" height="24" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;0.422;1" dur="12s" repeatCount="indefinite"/></rect>
      <rect x="274" y="316" width="216" height="24" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;0.451;1" dur="12s" repeatCount="indefinite"/></rect>
    </g>
    <g font-size="11" font-family="Consolas,monospace" fill="#1a7f56">
      <text x="282" y="164">xPSR</text><text x="282" y="188">PC（返回地址）</text>
      <text x="282" y="212">LR</text><text x="282" y="236">R12</text>
      <text x="282" y="260">R3</text><text x="282" y="284">R2</text>
      <text x="282" y="308">R1</text><text x="282" y="332">R0</text>
    </g>
    <g font-size="12" font-family="Consolas,monospace">
      <text x="600" y="136" fill="#d97706" font-weight="bold">0x2000FFD0</text>
      <text x="600" y="168" fill="#333">—</text>
      <text x="600" y="200" fill="#3451b2">main 中（被打断）</text>
    </g>
    <text x="30" y="416" font-size="14" font-family="Consolas,monospace" fill="#333">▶ 按键！EXTI→NVIC 判定→<tspan fill="#d97706" font-weight="bold">硬件自动压栈 8 个字</tspan>（不要一条指令）</text>
  </g>

  <!-- ===== 阶段 2：ISR ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="48" y="216" width="160" height="46" fill="#d8f3e5" stroke="#3eaf7c" stroke-width="2" rx="5"/>
    <text x="128" y="236" font-size="12" fill="#1a7f56" text-anchor="middle" font-weight="bold">EXTI0_IRQHandler</text>
    <text x="128" y="252" font-size="11" fill="#1a7f56" text-anchor="middle">（清挂起 → 翻转 LED）</text>
    <g fill="#d8f3e5" stroke="#3eaf7c">
      <rect x="274" y="148" width="216" height="24"/><rect x="274" y="172" width="216" height="24"/>
      <rect x="274" y="196" width="216" height="24"/><rect x="274" y="220" width="216" height="24"/>
      <rect x="274" y="244" width="216" height="24"/><rect x="274" y="268" width="216" height="24"/>
      <rect x="274" y="292" width="216" height="24"/><rect x="274" y="316" width="216" height="24"/>
    </g>
    <g font-size="11" font-family="Consolas,monospace" fill="#1a7f56">
      <text x="282" y="164">xPSR</text><text x="282" y="188">PC（返回地址）</text>
      <text x="282" y="212">LR</text><text x="282" y="236">R12</text>
      <text x="282" y="260">R3</text><text x="282" y="284">R2</text>
      <text x="282" y="308">R1</text><text x="282" y="332">R0</text>
    </g>
    <g font-size="12" font-family="Consolas,monospace">
      <text x="600" y="136" fill="#333">0x2000FFD0</text>
      <text x="600" y="168" fill="#d97706" font-weight="bold">0xFFFFFFFD</text>
      <text x="600" y="200" fill="#1a7f56">ISR 中</text>
    </g>
    <text x="30" y="416" font-size="14" font-family="Consolas,monospace" fill="#333">▶ pc 从向量表[22] 取地址跳进 ISR；<tspan fill="#d97706" font-weight="bold">lr 被置为魔法值 0xFFFFFFFD</tspan></text>
  </g>

  <!-- ===== 阶段 3：返回 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <g font-size="12" font-family="Consolas,monospace">
      <text x="600" y="136" fill="#d97706" font-weight="bold">0x2000FFF0</text>
      <text x="600" y="168" fill="#333">—</text>
      <text x="600" y="200" fill="#3451b2">main 续跑</text>
    </g>
    <text x="30" y="416" font-size="14" font-family="Consolas,monospace" fill="#333">▶ ISR 末尾 <tspan fill="#d97706" font-weight="bold">BX lr</tspan> → 硬件认出魔法值，<tspan fill="#d97706" font-weight="bold">自动弹栈 8 个字</tspan>，main 无缝续跑</text>
  </g>

  <!-- EXTI 线上真的有一个请求在跑：沿信号线从按键爬到 NVIC（①末尾来了，②开始压栈） -->
  <circle cx="110" cy="68" r="5" fill="#3eaf7c" opacity="0">
    <animate attributeName="cx" values="110;110;360;360;690;690" keyTimes="0;0.16;0.205;0.209;0.25;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="68;68;68;52;52;52" keyTimes="0;0.16;0.205;0.209;0.25;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0;0.16;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- 取向量：pc 沿这条路从向量表[22] 跳进 ISR -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <line x1="234" y1="191" x2="234" y2="191" stroke="#3451b2" stroke-width="3" marker-end="url(#arrI)">
      <animate attributeName="y2" values="191;191;239;239" keyTimes="0;0.50;0.57;1" dur="12s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- 跑动的栈指针：压栈时一格一格往下走，EXC_RETURN 触发弹栈时再走回来 -->
  <g transform="translate(498,148)">
    <animateTransform attributeName="transform" type="translate" values="498 148;498 148;498 340;498 340;498 148;498 148" keyTimes="0;0.25;0.47;0.75;0.95;1" dur="12s" repeatCount="indefinite"/>
    <polygon points="6,-5 -4,0 6,5" fill="#d97706"/>
  </g>

  <defs>
    <marker id="arrI" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#3451b2"/>
    </marker>
  </defs>

  <!-- 阶段指示点 -->
  <g transform="translate(630,410)" fill="#3451b2">
    <circle cx="0"  cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>
