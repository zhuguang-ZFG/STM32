<text x="753" y="160" font-size="13" fill="#2F2E2B" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SWDIO/SWCLK</text>
<text x="753" y="182" font-size="12" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PA13 / PA14</text>
<rect x="50" y="108" width="170" height="90" fill="#1F4680" opacity="0.1" rx="8" class="s0"/>
<rect x="256" y="108" width="170" height="90" fill="#1F4680" opacity="0.1" rx="8" class="s1"/>
