<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="上电到 SWD 接通">
<title>上电到 SWD 接通</title>
<style>

.f0{stroke-dasharray:6 12;animation:f0-flow 1.5s linear infinite;}@keyframes f0-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes p0-tx{0%{transform:translateX(0px)}100%{transform:translateX(26px)}}
.p0{animation:p0-tx 1.5s linear infinite 0.00s;}

.f1{stroke-dasharray:6 12;animation:f1-flow 1.5s linear infinite;}@keyframes f1-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes p1-tx{0%{transform:translateX(0px)}100%{transform:translateX(26px)}}
.p1{animation:p1-tx 1.5s linear infinite 0.35s;}

.f2{stroke-dasharray:6 12;animation:f2-flow 1.5s linear infinite;}@keyframes f2-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes p2-tx{0%{transform:translateX(0px)}100%{transform:translateX(26px)}}
.p2{animation:p2-tx 1.5s linear infinite 0.70s;}
@keyframes s0-flash{0%,0.00%{opacity:0.08}0.30%,5.50%{opacity:0.42}5.80%,100%{opacity:0.08}}
.s0{animation:s0-flash 5.2s linear infinite;}
@keyframes s1-flash{0%,25.00%{opacity:0.08}25.30%,30.50%{opacity:0.42}30.80%,100%{opacity:0.08}}
.s1{animation:s1-flash 5.2s linear infinite;}
@keyframes s2-flash{0%,50.00%{opacity:0.08}50.30%,55.50%{opacity:0.42}55.80%,100%{opacity:0.08}}
.s2{animation:s2-flash 5.2s linear infinite;}
@keyframes s3-flash{0%,75.00%{opacity:0.08}75.30%,80.50%{opacity:0.42}80.80%,100%{opacity:0.08}}
.s3{animation:s3-flash 5.2s linear infinite;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#FBF3DF"/>
<rect x="0" y="0" width="900" height="58" fill="#F7EFDA" opacity="1"/>
