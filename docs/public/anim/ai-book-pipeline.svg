<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>本书生产线：源文到印前的八道工序与门禁</title>
  <desc>这本书的生产线全景。八道工序：1 docs/ 正文源文（磁盘与 manifest 集合相等门）2 manifest.json 装订清单（罗盘四字段与来源注册门）3 build_html 离线 HTML（构建期断言：章序/罗盘数/零断链/组件残留）4 题花与机制动画（art_guard 纯矢量门与 anim-lint 色板门）5 build_print 印前重排（寡行守卫 v3.3）6 check_pdf 终审 13 门 7 pytest 72 项回归 8 产物 dist/。令牌沿流水线流动；任何一道门红，产物就不存在。每条论断配一条复现命令。</desc>
  <rect width="720" height="440" fill="#f6f8fa"/>
  <defs>
    <marker id="ah6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">本书生产线：八道工序，十几道门</text>
  <text x="360" y="54" text-anchor="middle" font-size="11.5" fill="#57606a">左列是资产，右列是对资产的断言——没有右列，左列迟早过期</text>

  <!-- 工序行 1 -->
  <rect x="40" y="86" width="140" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="110" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">1 docs/ 源文</text>
  <text x="110" y="126" text-anchor="middle" font-size="11" fill="#57606a">94 章 markdown</text>
  <rect x="52" y="132" width="116" height="18" rx="9" fill="#eef2ff" stroke="#3451b2" stroke-width="1.2"/>
  <text x="110" y="145" text-anchor="middle" font-size="11" fill="#3451b2">门：磁盘↔manifest 相等</text>

  <rect x="212" y="86" width="140" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="282" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">2 manifest 装订</text>
  <text x="282" y="126" text-anchor="middle" font-size="11" fill="#57606a">11 部 / 罗盘 / 75 来源</text>
  <rect x="224" y="132" width="116" height="18" rx="9" fill="#eef2ff" stroke="#3451b2" stroke-width="1.2"/>
  <text x="282" y="145" text-anchor="middle" font-size="11" fill="#3451b2">门：罗盘齐全+来源注册</text>

  <rect x="384" y="86" width="140" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="454" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">3 build_html</text>
  <text x="454" y="126" text-anchor="middle" font-size="11" fill="#57606a">单文件离线 HTML</text>
  <rect x="396" y="132" width="116" height="18" rx="9" fill="#eef7f1" stroke="#1a7f56" stroke-width="1.2"/>
  <text x="454" y="145" text-anchor="middle" font-size="11" fill="#1a7f56">门：章序/断链/残留即失败</text>

  <rect x="556" y="86" width="140" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="626" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">4 题花与动画</text>
  <text x="626" y="126" text-anchor="middle" font-size="11" fill="#57606a">100 题花 + 109 动画</text>
  <rect x="568" y="132" width="116" height="18" rx="9" fill="#eef7f1" stroke="#1a7f56" stroke-width="1.2"/>
  <text x="626" y="145" text-anchor="middle" font-size="11" fill="#1a7f56">门：art_guard + anim-lint</text>

  <!-- 工序行 2 -->
  <rect x="40" y="200" width="140" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="110" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">5 build_print</text>
  <text x="110" y="240" text-anchor="middle" font-size="11" fill="#57606a">paged.js 印前重排</text>
  <rect x="52" y="246" width="116" height="18" rx="9" fill="#fdf0d5" stroke="#d97706" stroke-width="1.2"/>
  <text x="110" y="259" text-anchor="middle" font-size="11" fill="#92400e">门：寡行守卫 v3.3</text>

  <rect x="212" y="200" width="140" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="282" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">6 check_pdf</text>
  <text x="282" y="240" text-anchor="middle" font-size="11" fill="#57606a">印前终审</text>
  <rect x="224" y="246" width="116" height="18" rx="9" fill="#fdf0d5" stroke="#d97706" stroke-width="1.2"/>
  <text x="282" y="259" text-anchor="middle" font-size="11" fill="#92400e">门：13 道全过才放行</text>

  <rect x="384" y="200" width="140" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="454" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">7 pytest + 对账</text>
  <text x="454" y="240" text-anchor="middle" font-size="11" fill="#57606a">72 项 + 27 条声明</text>
  <rect x="396" y="246" width="116" height="18" rx="9" fill="#fdf0d5" stroke="#d97706" stroke-width="1.2"/>
  <text x="454" y="259" text-anchor="middle" font-size="11" fill="#92400e">门：测试+数字对账</text>

  <rect x="556" y="200" width="140" height="70" rx="10" fill="#eef7f1" stroke="#1a7f56" stroke-width="2.4"/>
  <text x="626" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f56">8 dist/ 产物</text>
  <text x="626" y="240" text-anchor="middle" font-size="11" fill="#24292f">单文件 HTML + 印前 PDF</text>
  <rect x="568" y="246" width="116" height="18" rx="9" fill="#ffffff" stroke="#1a7f56" stroke-width="1.2"/>
  <text x="626" y="259" text-anchor="middle" font-size="11" fill="#1a7f56">CI 每次 push 重出</text>

  <!-- 连线 -->
  <path d="M180 121 H206" stroke="#333" stroke-width="2.2" marker-end="url(#ah6)"/>
  <path d="M352 121 H378" stroke="#333" stroke-width="2.2" marker-end="url(#ah6)"/>
  <path d="M524 121 H550" stroke="#333" stroke-width="2.2" marker-end="url(#ah6)"/>
  <path d="M626 156 C 626 180, 110 180, 110 194" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#ah6)"/>
  <path d="M180 235 H206" stroke="#333" stroke-width="2.2" marker-end="url(#ah6)"/>
  <path d="M352 235 H378" stroke="#333" stroke-width="2.2" marker-end="url(#ah6)"/>
  <path d="M524 235 H550" stroke="#333" stroke-width="2.2" marker-end="url(#ah6)"/>

  <!-- 失败回退 -->
  <path d="M282 270 C 282 316, 110 316, 110 276" fill="none" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah6)"/>
  <text x="200" y="330" text-anchor="middle" font-size="12" fill="#cf222e">任何一道门红：打回，产物不存在</text>

  <!-- 底部 -->
  <rect x="120" y="356" width="480" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#57606a">可信度不来自作者声明，来自命令可复现——不信就跑</text>

  <!-- 流动令牌 -->
  <circle r="5" fill="#3451b2" cx="180" cy="121">
    <animate attributeName="cx" values="180;206;352;378" keyTimes="0;0.25;0.75;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#3eaf7c" cx="180" cy="235">
    <animate attributeName="cx" values="180;206;352;378" keyTimes="0;0.25;0.75;1" dur="8s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#d97706" cx="524" cy="235">
    <animate attributeName="cx" values="524;550" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
