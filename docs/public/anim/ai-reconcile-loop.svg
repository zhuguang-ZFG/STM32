<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>手册对账闭环：生成、对账、上板、回喂</title>
  <desc>AI 辅助开发的寄存器代码对账闭环。1 模型生成假设：模型给出初始化代码，那是假设不是事实。2 手册逐位对账：对着 RM0090 问三问——名对不对（§2.3 存储器映射定总线归属、§7.3 定使能位）、位对不对（§8.4 位定义表）、序对不对（时钟先行）。3 上板终审：烧录看现象，示波器与寄存器读回是终审法官。4 证据回喂：把「实测现象+手册出处+板卡接线」三元组写回提示词。对账不过，代码打回模型重新生成；循环直到上板通过。</desc>
  <rect width="720" height="440" fill="#f6f8fa"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#24292f"/>
    </marker>
  </defs>

  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">手册对账闭环</text>
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#57606a">假设 → 证据：模型的每一行输出都要过三关</text>

  <!-- 1 模型生成假设 -->
  <rect x="56" y="88" width="190" height="78" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="151" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#24292f">1 模型生成假设</text>
  <path d="M84 128 h60 M84 140 h84 M84 152 h48" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text x="151" y="196" text-anchor="middle" font-size="11" fill="#cf222e">输出 = 假设，不是事实</text>

  <!-- 2 手册逐位对账 -->
  <rect x="474" y="88" width="190" height="78" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="569" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#24292f">2 手册逐位对账</text>
  <text x="569" y="132" text-anchor="middle" font-size="12" fill="#57606a">三问：名 · 位 · 序</text>
  <text x="569" y="150" text-anchor="middle" font-size="11" fill="#94a3b8">RM0090 §7.3 / §8.4</text>

  <!-- 3 上板终审 -->
  <rect x="474" y="288" width="190" height="78" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="569" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#24292f">3 上板终审</text>
  <rect x="500" y="326" width="52" height="26" rx="4" fill="#eef7f1" stroke="#333" stroke-width="1.6"/>
  <circle cx="512" cy="339" r="5" fill="#dc2626"/>
  <path d="M522 332 h22 M522 339 h22 M522 346 h14" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="622" y="342" text-anchor="middle" font-size="11" fill="#57606a">现象+波形</text>

  <!-- 4 证据回喂 -->
  <rect x="56" y="288" width="190" height="78" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="151" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#24292f">4 证据回喂</text>
  <rect x="76" y="326" width="42" height="20" rx="10" fill="#eef7f1" stroke="#333" stroke-width="1.4"/>
  <text x="97" y="340" text-anchor="middle" font-size="11" fill="#24292f">实测</text>
  <rect x="124" y="326" width="42" height="20" rx="10" fill="#eef7f1" stroke="#333" stroke-width="1.4"/>
  <text x="145" y="340" text-anchor="middle" font-size="11" fill="#24292f">手册</text>
  <rect x="172" y="326" width="42" height="20" rx="10" fill="#eef7f1" stroke="#333" stroke-width="1.4"/>
  <text x="193" y="340" text-anchor="middle" font-size="11" fill="#24292f">板卡</text>

  <!-- 正向闭环箭头 -->
  <path d="M250 127 H466" fill="none" stroke="#333" stroke-width="2.4" marker-end="url(#ah)"/>
  <path d="M569 170 V280" fill="none" stroke="#333" stroke-width="2.4" marker-end="url(#ah)"/>
  <path d="M470 327 H254" fill="none" stroke="#333" stroke-width="2.4" marker-end="url(#ah)"/>
  <path d="M151 284 V174" fill="none" stroke="#333" stroke-width="2.4" marker-end="url(#ah)"/>
  <text x="358" y="120" text-anchor="middle" font-size="11" fill="#57606a">送对账</text>
  <text x="358" y="320" text-anchor="middle" font-size="11" fill="#57606a">带证据回去</text>

  <!-- 打回支路：对账不过 -->
  <path d="M474 150 C 380 210, 250 210, 152 172" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
  <text x="315" y="222" text-anchor="middle" font-size="12" fill="#cf222e">对账不过，打回重生成</text>

  <!-- 三问注解 -->
  <rect x="272" y="238" width="176" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="360" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">对账三问</text>
  <text x="360" y="278" text-anchor="middle" font-size="11" fill="#57606a">名：总线归属查 §7.3</text>
  <text x="360" y="294" text-anchor="middle" font-size="11" fill="#57606a">位/序：位表与时序查 §8.4</text>

  <!-- 流动令牌：顺时针 -->
  <circle r="6" fill="#d97706" cx="250" cy="127">
    <animate attributeName="cx" values="250;466;569;466;254;151;250" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="127;127;225;327;327;225;127" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- 流动令牌：逆时针 -->
  <rect x="-5" y="-5" width="10" height="10" fill="#3451b2">
    <animate attributeName="x" values="249;146;245;461;564;461;249" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333;1" dur="8s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="322;220;122;122;220;322;322" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333;1" dur="8s" begin="1s" repeatCount="indefinite"/>
  </rect>
</svg>
