<text x="560" y="200" font-size="12" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">仍可扰动</text>
<circle cx="560" cy="250" r="7" fill="#1F4680" opacity="1" class="e2"/>
<line x1="650" y1="250" x2="680" y2="250" stroke="#6E6B60" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<line x1="650" y1="250" x2="680" y2="250" stroke="#1F4680" stroke-width="2" stroke-linecap="round" opacity="1" class="f2"/>
<rect x="680" y="140" width="180" height="90" fill="#F7EFDA" opacity="1" rx="8" stroke="#1F4680" stroke-width="1.5"/>
<text x="770" y="172" font-size="15" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">边沿 4</text>
<text x="770" y="200" font-size="12" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">锁存 BOOT</text>
<circle cx="770" cy="250" r="7" fill="#1F4680" opacity="1" class="e3"/>
<rect x="40" y="290" width="820" height="120" fill="#F7EFDA" opacity="1" rx="8" stroke="#7A5B14" stroke-width="1.5"/>
<text x="56" y="322" font-size="16" fill="#7A5B14" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PA14 = BOOT0 输入  ∩  SWCLK</text>
<text x="56" y="352" font-size="14" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">锁存前：脚上电平必须对启动源成立；锁存后：同一脚交给调试时钟。</text>
<text x="56" y="380" font-size="13" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">动画语义：高亮沿 1→4 前进；第 4 沿冻结启动源——不是装饰扫光。</text>
<rect x="40" y="427" width="3" height="18" fill="#2E5F42" opacity="1"/>
<text x="52" y="440" font-size="14" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">失联时的第一分支</text>
<rect x="40" y="470" width="260" height="70" fill="#F7EFDA" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="170" y="498" font-size="14" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Under Reset</text>
<text x="170" y="522" font-size="12" fill="#2F2E2B" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不保证可连接</text>
<rect x="320" y="470" width="260" height="70" fill="#F7EFDA" opacity="1" rx="8" stroke="#7A5B14" stroke-width="1.5"/>
<text x="450" y="498" font-size="14" fill="#7A5B14" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">读选项字节</text>
<text x="450" y="522" font-size="12" fill="#2F2E2B" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">BOOT_LOCK / RDP / DBG_SWEN</text>
<rect x="600" y="470" width="260" height="70" fill="#F7EFDA" opacity="1" rx="8" stroke="#2E5F42" stroke-width="1.5"/>
<text x="730" y="498" font-size="14" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">受控恢复</text>
<text x="730" y="522" font-size="12" fill="#2F2E2B" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">读回验证后再改</text>
