<line x1="230" y1="250" x2="260" y2="250" stroke="#6E6B60" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<line x1="230" y1="250" x2="260" y2="250" stroke="#1F4680" stroke-width="2" stroke-linecap="round" opacity="1" class="f0"/>
