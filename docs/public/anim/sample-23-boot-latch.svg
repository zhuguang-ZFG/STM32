<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="G0 启动锁存：第四个 SYSCLK 上升沿采样 BOOT0/SWCLK 共脚">
<title>G0 启动锁存：第四个 SYSCLK 上升沿采样 BOOT0/SWCLK 共脚</title>
<style>
@keyframes m0-flash{0%,0.00%{opacity:0.08}0.30%,5.50%{opacity:0.42}5.80%,100%{opacity:0.08}}
.m0{animation:m0-flash 5.2s linear infinite;}
@keyframes m1-flash{0%,25.00%{opacity:0.08}25.30%,30.50%{opacity:0.42}30.80%,100%{opacity:0.08}}
.m1{animation:m1-flash 5.2s linear infinite;}
@keyframes m2-flash{0%,50.00%{opacity:0.08}50.30%,55.50%{opacity:0.42}55.80%,100%{opacity:0.08}}
.m2{animation:m2-flash 5.2s linear infinite;}
@keyframes m3-flash{0%,75.00%{opacity:0.08}75.30%,80.50%{opacity:0.42}80.80%,100%{opacity:0.08}}
.m3{animation:m3-flash 5.2s linear infinite;}

.f0{stroke-dasharray:6 12;animation:f0-flow 1.2s linear infinite;}@keyframes f0-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes e0-tx{0%{transform:translateX(0px)}100%{transform:translateX(30px)}}
.e0{animation:e0-tx 1.2s linear infinite 0.00s;}

.f1{stroke-dasharray:6 12;animation:f1-flow 1.2s linear infinite;}@keyframes f1-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes e1-tx{0%{transform:translateX(0px)}100%{transform:translateX(30px)}}
.e1{animation:e1-tx 1.2s linear infinite 0.25s;}

.f2{stroke-dasharray:6 12;animation:f2-flow 1.2s linear infinite;}@keyframes f2-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes e2-tx{0%{transform:translateX(0px)}100%{transform:translateX(30px)}}
.e2{animation:e2-tx 1.2s linear infinite 0.50s;}
@keyframes e3-latch{0%,70%{opacity:0.25}78%,100%{opacity:1}}
.e3{animation:e3-latch 5.2s linear infinite;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#F7EFDA" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#6E6B60" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1F4680" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">BOOT 锁存机制：共脚上的四个上升沿</text>
<text x="22" y="50" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">sample then freeze · SWD after latch</text>
