<text x="350" y="172" font-size="15" fill="#2F2E2B" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">边沿 2</text>
<text x="350" y="200" font-size="12" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">采样窗逼近</text>
<circle cx="350" cy="250" r="7" fill="#1F4680" opacity="1" class="e1"/>
<line x1="440" y1="250" x2="470" y2="250" stroke="#6E6B60" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<line x1="440" y1="250" x2="470" y2="250" stroke="#1F4680" stroke-width="2" stroke-linecap="round" opacity="1" class="f1"/>
