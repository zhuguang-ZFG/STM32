<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>一次函数调用：栈帧的一生（AAPCS）</title>
  <desc>一次函数调用：栈帧的一生（AAPCS）。参数 r0–r3 · 返回值 r0 · push 保护现场 · pop 一步回家 · 栈向下生长。sp 是滑过去的而不是瞬移：push 走两级、sub 走一级、pop 弹回去；同时有点在跑——1 和 2 飞进 r0/r1，lr 的值落进栈里的 lr 槽，pop 时那个返回地址又从栈槽送回 pc。</desc>
  <rect width="720" height="420" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">一次函数调用：栈帧的一生（AAPCS）</text>
  <text x="24" y="50" font-size="12" fill="#666">参数 r0–r3 · 返回值 r0 · push 保护现场 · pop 一步回家 · 栈向下生长</text>

  <!-- ===== 栈区面板 ===== -->
  <rect x="40" y="62" width="248" height="300" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="56" y="84" font-size="13" font-weight="bold" fill="#3451b2">SRAM 栈区</text>
  <text x="232" y="84" font-size="11" fill="#888">高地址 ↑</text>

  <!-- main 帧（常驻） -->
  <rect x="56" y="92" width="212" height="58" fill="#dbe7ff" stroke="#3451b2" rx="4"/>
  <text x="162" y="126" font-size="13" fill="#3451b2" text-anchor="middle">main 的栈帧</text>

  <!-- 保护现场槽（虚线基底） -->
  <rect x="56" y="150" width="212" height="30" fill="none" stroke="#94a3b8" stroke-dasharray="4 3" rx="3"/>
  <rect x="56" y="180" width="212" height="30" fill="none" stroke="#94a3b8" stroke-dasharray="4 3" rx="3"/>
  <!-- 局部变量槽（虚线基底） -->
  <rect x="56" y="210" width="212" height="40" fill="none" stroke="#94a3b8" stroke-dasharray="4 3" rx="3"/>
  <text x="162" y="276" font-size="11" fill="#94a3b8" text-anchor="middle">↓ 更低地址（空闲栈空间）</text>

  <!-- 地址标注画在最上层（见文件尾）：压栈块是不透明的，谁先画谁被吃字 -->

  <!-- sp 指针（S0→150 S1→210 S2→250 S3→150，段与段之间是滑过去的：push 走两级、sub 一级、pop 一步回家） -->
  <g transform="translate(272,150)">
    <animateTransform attributeName="transform" type="translate"
      values="272 150;272 150;272 180;272 210;272 210;272 250;272 250;272 150;272 150"
      keyTimes="0;0.25;0.29;0.33;0.50;0.54;0.75;0.80;1"
      dur="12s" repeatCount="indefinite"/>
    <polygon points="0,0 12,-7 12,7" fill="#d97706">
      <animate attributeName="opacity" values="1;0.35;1" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>
    </polygon>
    <text x="16" y="4" font-size="12" font-weight="bold" fill="#d97706" font-family="Consolas,monospace">sp</text>
  </g>

  <!-- ===== 寄存器面板 ===== -->
  <rect x="320" y="62" width="380" height="300" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="336" y="84" font-size="13" font-weight="bold" fill="#3451b2">Cortex-M4 寄存器</text>
  <g font-size="12" font-family="Consolas,monospace">
    <!-- 寄存器名 -->
    <g fill="#eef2ff" stroke="#3451b2">
      <rect x="336" y="96"  width="44" height="24" rx="3"/>
      <rect x="336" y="128" width="44" height="24" rx="3"/>
      <rect x="336" y="160" width="44" height="24" rx="3"/>
      <rect x="336" y="192" width="44" height="24" rx="3"/>
      <rect x="336" y="224" width="44" height="24" rx="3"/>
      <rect x="336" y="256" width="44" height="24" rx="3"/>
      <rect x="336" y="288" width="44" height="24" rx="3"/>
    </g>
    <g fill="#3451b2" font-weight="bold">
      <text x="358" y="112" text-anchor="middle">r0</text>
      <text x="358" y="144" text-anchor="middle">r1</text>
      <text x="358" y="176" text-anchor="middle">r2</text>
      <text x="358" y="208" text-anchor="middle">r3</text>
      <text x="358" y="240" text-anchor="middle">sp</text>
      <text x="358" y="272" text-anchor="middle">lr</text>
      <text x="358" y="304" text-anchor="middle">pc</text>
    </g>
    <text x="512" y="112" fill="#94a3b8" font-size="11">← 第1个参数</text>
    <text x="512" y="144" fill="#94a3b8" font-size="11">← 第2个参数</text>
    <text x="512" y="240" fill="#94a3b8" font-size="11">← 栈顶指针</text>
    <text x="512" y="272" fill="#94a3b8" font-size="11">← 返回地址（回家路）</text>
    <text x="512" y="304" fill="#94a3b8" font-size="11">← 正在执行的指令</text>
  </g>

  <!-- 参数装车：1 → r0、2 → r1，两颗点从代码那头飞进寄存器格子 -->
  <circle cy="108" r="4" fill="#d97706" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.02;0.07;0.5;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="560;560;358;358" keyTimes="0;0.02;0.07;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cy="140" r="4" fill="#d97706" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.04;0.09;0.5;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600;358;358" keyTimes="0;0.04;0.09;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- push {r4, lr}：栈里的 lr 槽是寄存器 lr 送下来的值（数据在走，不是整格浮现） -->
  <circle r="4" fill="#d97706" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.30;0.40;0.6;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="358;358;162;162" keyTimes="0;0.30;0.37;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="268;268;195;195" keyTimes="0;0.30;0.37;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- pop {r4, pc}：栈里存着的返回地址被送回 pc，于是一步跳回 main -->
  <circle r="4" fill="#3451b2" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.78;0.88;0.95;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="162;162;358;358" keyTimes="0;0.78;0.86;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="195;195;300;300" keyTimes="0;0.78;0.86;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== 阶段 0：参数装车 ===== -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <g font-size="13" font-family="Consolas,monospace">
      <text x="392" y="112" fill="#d97706" font-weight="bold">1</text>
      <text x="392" y="144" fill="#d97706" font-weight="bold">2</text>
      <text x="392" y="176" fill="#333">—</text>
      <text x="392" y="208" fill="#333">—</text>
      <text x="392" y="240" fill="#333">0x2000FFF0</text>
      <text x="392" y="272" fill="#333">—</text>
      <text x="392" y="304" fill="#3451b2">main: bl 之前</text>
    </g>
    <text x="40" y="392" font-size="14" font-family="Consolas,monospace" fill="#333">▶ main: mov r0,#1 / mov r1,#2 / <tspan fill="#d97706" font-weight="bold">bl add_two</tspan>  ← 参数装车，出发！</text>
  </g>

  <!-- ===== 阶段 1：保护现场 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="56" y="150" width="212" height="30" fill="#d8f3e5" stroke="#3eaf7c" rx="3"/>
    <rect x="56" y="180" width="212" height="30" fill="#d8f3e5" stroke="#3eaf7c" rx="3"/>
    <text x="162" y="170" font-size="12" fill="#1a7f56" text-anchor="middle" font-family="Consolas,monospace">r4'（借来的，要还）</text>
    <text x="162" y="200" font-size="12" fill="#1a7f56" text-anchor="middle" font-family="Consolas,monospace">lr（返回地址 0x08000234）</text>
    <g font-size="13" font-family="Consolas,monospace">
      <text x="392" y="112" fill="#333">1</text>
      <text x="392" y="144" fill="#333">2</text>
      <text x="392" y="176" fill="#333">—</text>
      <text x="392" y="208" fill="#333">—</text>
      <text x="392" y="240" fill="#d97706" font-weight="bold">0x2000FFE8</text>
      <text x="392" y="272" fill="#d97706" font-weight="bold">0x08000234</text>
      <text x="392" y="304" fill="#3451b2">add_two: push</text>
    </g>
    <text x="40" y="392" font-size="14" font-family="Consolas,monospace" fill="#333">▶ add_two: <tspan fill="#d97706" font-weight="bold">push {r4, lr}</tspan>  ← 保护现场：r4 要用，lr 是回家路</text>
  </g>

  <!-- ===== 阶段 2：局部变量占坑 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="56" y="150" width="212" height="30" fill="#d8f3e5" stroke="#3eaf7c" rx="3"/>
    <rect x="56" y="180" width="212" height="30" fill="#d8f3e5" stroke="#3eaf7c" rx="3"/>
    <text x="162" y="170" font-size="12" fill="#1a7f56" text-anchor="middle" font-family="Consolas,monospace">r4'（借来的，要还）</text>
    <text x="162" y="200" font-size="12" fill="#1a7f56" text-anchor="middle" font-family="Consolas,monospace">lr（返回地址 0x08000234）</text>
    <rect x="56" y="210" width="212" height="40" fill="#fdf0d5" stroke="#d97706" rx="3"/>
    <text x="162" y="234" font-size="12" fill="#a16207" text-anchor="middle" font-family="Consolas,monospace">局部变量 buf[2]</text>
    <g font-size="13" font-family="Consolas,monospace">
      <text x="392" y="112" fill="#d97706" font-weight="bold">3</text>
      <text x="392" y="144" fill="#333">2</text>
      <text x="392" y="176" fill="#333">—</text>
      <text x="392" y="208" fill="#333">—</text>
      <text x="392" y="240" fill="#d97706" font-weight="bold">0x2000FFE0</text>
      <text x="392" y="272" fill="#333">0x08000234</text>
      <text x="392" y="304" fill="#3451b2">add_two: adds</text>
    </g>
    <text x="40" y="392" font-size="14" font-family="Consolas,monospace" fill="#333">▶ <tspan fill="#d97706" font-weight="bold">sub sp,#8</tspan> … adds r0,r0,r1 → r0=3  ← 局部变量占坑，算出结果</text>
  </g>

  <!-- ===== 阶段 3：满血返回 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <g font-size="13" font-family="Consolas,monospace">
      <text x="392" y="112" fill="#d97706" font-weight="bold">3 ← 返回值</text>
      <text x="392" y="144" fill="#333">2</text>
      <text x="392" y="176" fill="#333">—</text>
      <text x="392" y="208" fill="#333">—</text>
      <text x="392" y="240" fill="#d97706" font-weight="bold">0x2000FFF0</text>
      <text x="392" y="272" fill="#333">0x08000234</text>
      <text x="392" y="304" fill="#d97706" font-weight="bold">回到 main!</text>
    </g>
    <text x="40" y="392" font-size="14" font-family="Consolas,monospace" fill="#333">▶ <tspan fill="#d97706" font-weight="bold">pop {r4, pc}</tspan>  ← 现场复原，sp 弹回，pc 一步跳回 main</text>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(620,384)">
    <g fill="#3451b2">
      <circle cx="0"  cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <!-- 地址标注：贴在槽的左上角、压着那条分界线，所以必须最后画。
       放在前面时 150/210/250 三条边界上的不透明压栈块会把 11px 字的
       上半截（~4px）整块吃掉，"0x2000FFF0" 看着像被裁了一半。
       白描边 + paint-order 让字在任何填充色上都立得住。 -->
  <g font-size="11" fill="#888" font-family="Consolas,monospace"
     stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">
    <text x="60" y="154">0x2000FFF0</text>
    <text x="60" y="214">0x2000FFE8</text>
    <text x="60" y="254">0x2000FFE0</text>
  </g>
</svg>
