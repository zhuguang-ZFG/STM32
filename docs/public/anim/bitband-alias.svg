<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>位带别名：一个位搬进一个字</title>
  <desc>GPIOF-&gt;ODR（0x4002_1414）这一个字节的 8 个位，在别名区各有一个专属的字：0x4242_8280 到 0x4242_829C，共 32 字节。五个阶段依次演示：①一位摊成一字；②PF6 的别名地址 0x4242_8298 由公式 0x4200_0000 + (0x4002_1414 − 0x4000_0000)×32 + 6×4 算出，探针脚本用三条 _Static_assert 验算；③实测 -O2 下 GPIOF-&gt;ODR |= 1u&lt;&lt;6 编成 ldr/orr.w/str 三条，读与写之间有窗口；④写别名字只剩 movs #1 与 str.w [r3,#664]，源码层面不存在"读回来再改"；⑤边界——一个字只管一位，多比特字段请回 BSRR/掩码，而 CCM 在 CMSIS 里连别名基址都没有。</desc>
  <rect width="720" height="452" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">位带别名：一个位搬进一个字</text>
  <text x="24" y="50" font-size="12" fill="#666">别名地址 = 0x4200_0000 + 偏移×32 + 位号×4（式子出自 Cortex-M4 TRM）；图里每个数由 probe.sh 现场算出。</text>

  <!-- ===== 真实字节 ===== -->
  <rect x="40" y="64" width="640" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="84" font-size="12" font-weight="bold" fill="#3451b2">真实字节 GPIOF-&gt;ODR · 0x4002_1414</text>
  <text x="56" y="108" font-size="11" fill="#666">8 个位挤在一格里</text>
  <g font-size="11" font-family="Consolas,monospace" fill="#333" text-anchor="middle">
    <rect x="302" y="92" width="40" height="30" fill="#f8fafc" stroke="#94a3b8"/><text x="322" y="112">b7</text>
    <rect x="346" y="92" width="40" height="30" fill="#f8fafc" stroke="#94a3b8"/><text x="366" y="112">b6</text>
    <rect x="390" y="92" width="40" height="30" fill="#f8fafc" stroke="#94a3b8"/><text x="410" y="112">b5</text>
    <rect x="434" y="92" width="40" height="30" fill="#f8fafc" stroke="#94a3b8"/><text x="454" y="112">b4</text>
    <rect x="478" y="92" width="40" height="30" fill="#f8fafc" stroke="#94a3b8"/><text x="498" y="112">b3</text>
    <rect x="522" y="92" width="40" height="30" fill="#f8fafc" stroke="#94a3b8"/><text x="542" y="112">b2</text>
    <rect x="566" y="92" width="40" height="30" fill="#f8fafc" stroke="#94a3b8"/><text x="586" y="112">b1</text>
    <rect x="610" y="92" width="40" height="30" fill="#f8fafc" stroke="#94a3b8"/><text x="630" y="112">b0</text>
  </g>

  <!-- ===== 别名区 ===== -->
  <rect x="40" y="160" width="640" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="180" font-size="12" font-weight="bold" fill="#3451b2">外设别名区 0x4200_0000</text>
  <text x="56" y="206" font-size="11" fill="#666">8 位 × 4 字节 = 32 字节</text>
  <g font-size="11" font-family="Consolas,monospace" fill="#333" text-anchor="middle">
    <rect x="302" y="204" width="40" height="40" fill="#f8fafc" stroke="#94a3b8"/><text x="322" y="228">829C</text>
    <rect x="346" y="204" width="40" height="40" fill="#f8fafc" stroke="#94a3b8"/><text x="366" y="228">8298</text>
    <rect x="390" y="204" width="40" height="40" fill="#f8fafc" stroke="#94a3b8"/><text x="410" y="228">8294</text>
    <rect x="434" y="204" width="40" height="40" fill="#f8fafc" stroke="#94a3b8"/><text x="454" y="228">8290</text>
    <rect x="478" y="204" width="40" height="40" fill="#f8fafc" stroke="#94a3b8"/><text x="498" y="228">828C</text>
    <rect x="522" y="204" width="40" height="40" fill="#f8fafc" stroke="#94a3b8"/><text x="542" y="228">8288</text>
    <rect x="566" y="204" width="40" height="40" fill="#f8fafc" stroke="#94a3b8"/><text x="586" y="228">8284</text>
    <rect x="610" y="204" width="40" height="40" fill="#f8fafc" stroke="#94a3b8"/><text x="630" y="228">8280</text>
  </g>

  <!-- ===== 汇编对照 ===== -->
  <rect x="40" y="268" width="640" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="360" y1="276" x2="360" y2="352" stroke="#e2e8f0" stroke-width="2"/>
  <text x="56" y="288" font-size="11" font-weight="bold" fill="#92400e">GPIOF-&gt;ODR |= 1u&lt;&lt;6（实测 -O2）</text>
  <!-- 插队窗口的琥珀条：画在指令字之前（文档序即 z 序）。它一条一条往下滑，
       压在谁身上谁就该还能读——原来放在 ③ 组里、字之后，orr/str 两行被整块吃掉。
       透明度跟着 ③ 组的开场走，滑动的节拍不变。 -->
  <rect x="50" y="294" width="250" height="18" fill="#fdf0d5" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="y" values="294;312;330;330" keyTimes="0;0.34;0.67;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <g font-size="11" font-family="Consolas,monospace" fill="#333">
    <text x="56" y="308">ldr   r3, [r2, #20]</text>
    <text x="56" y="326">orr.w r3, r3, #64</text>
    <text x="56" y="344">str   r3, [r2, #20]</text>
  </g>
  <text x="376" y="288" font-size="11" font-weight="bold" fill="#1a7f56">*0x4242_8298 = 1u（实测 -O2）</text>
  <g font-size="11" font-family="Consolas,monospace" fill="#333">
    <text x="376" y="308">ldr   r3, [pc, #8]   ; 0x4242_8000</text>
    <text x="376" y="326">movs  r2, #1</text>
    <text x="376" y="344">str.w r2, [r3, #664] ; +0x298</text>
  </g>

  <!-- ===== ① 一位摊成一字：八条连线逐点爬通 ===== -->
  <g opacity="1" stroke="#94a3b8" stroke-width="2">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
    <line x1="322" y1="122" x2="322" y2="122"><animate attributeName="y2" values="122;204;204" keyTimes="0;0.1;1" dur="15s" repeatCount="indefinite"/></line>
    <line x1="366" y1="122" x2="366" y2="122"><animate attributeName="y2" values="122;204;204" keyTimes="0;0.14;1" dur="15s" repeatCount="indefinite"/></line>
    <line x1="410" y1="122" x2="410" y2="122"><animate attributeName="y2" values="122;204;204" keyTimes="0;0.18;1" dur="15s" repeatCount="indefinite"/></line>
    <line x1="454" y1="122" x2="454" y2="122"><animate attributeName="y2" values="122;204;204" keyTimes="0;0.22;1" dur="15s" repeatCount="indefinite"/></line>
    <line x1="498" y1="122" x2="498" y2="122"><animate attributeName="y2" values="122;204;204" keyTimes="0;0.26;1" dur="15s" repeatCount="indefinite"/></line>
    <line x1="542" y1="122" x2="542" y2="122"><animate attributeName="y2" values="122;204;204" keyTimes="0;0.3;1" dur="15s" repeatCount="indefinite"/></line>
    <line x1="586" y1="122" x2="586" y2="122"><animate attributeName="y2" values="122;204;204" keyTimes="0;0.34;1" dur="15s" repeatCount="indefinite"/></line>
    <line x1="630" y1="122" x2="630" y2="122"><animate attributeName="y2" values="122;204;204" keyTimes="0;0.38;1" dur="15s" repeatCount="indefinite"/></line>
  </g>

  <!-- ===== ② PF6 那一列：地址是推出来的 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
    <line x1="366" y1="122" x2="366" y2="122" stroke="#3451b2" stroke-width="3">
      <animate attributeName="y2" values="122;204;204" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
    </line>
    <rect x="346" y="92" width="40" height="30" fill="none" stroke="#3451b2" stroke-width="2"/>
    <rect x="346" y="204" width="40" height="40" fill="none" stroke="#3451b2" stroke-width="2"/>
    <text x="56" y="232" font-size="11" font-family="Consolas,monospace" fill="#3451b2">0x4242_8298</text>
  </g>

  <!-- ===== ③ 读-改-写：三步之间有窗口 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
    <text x="302" y="330" font-size="11" font-weight="bold" fill="#dc2626">插队窗口</text>
  </g>

  <!-- ===== ④ 别名写：一条 str 到位 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
    <rect x="370" y="330" width="250" height="18" fill="#d8f3e5">
      <animate attributeName="opacity" values="0.3;0.75;0.3" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="346" y="204" width="40" height="40" fill="none" stroke="#3eaf7c" stroke-width="2"/>
    <text x="56" y="232" font-size="11" fill="#1a7f56">没有「读回来再改」</text>
  </g>

  <!-- ===== ⑤ 边界：一个字只管一位 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
    <rect x="344" y="88" width="88" height="38" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="344" y="200" width="88" height="48" fill="none" stroke="#dc2626" stroke-width="2"/>
    <g stroke="#dc2626" stroke-width="3">
      <line x1="380" y1="216" x2="396" y2="232"/>
      <line x1="396" y1="216" x2="380" y2="232"/>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1s" repeatCount="indefinite"/>
    </g>
    <text x="56" y="232" font-size="11" font-weight="bold" fill="#dc2626">两位 = 两个别名字</text>
  </g>

  <!-- ===== 每阶段解说 ===== -->
  <g font-size="12" fill="#333">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
      <text x="40" y="378">上面一个字节 8 个位，下面 8 个字：每个位独占 4 字节，整个字节被摊成 32 字节。</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
      <text x="40" y="378">PF6 的字 = 0x4200_0000 + 0x21414×32 + 6×4 = 0x4242_8298；探针用三条 _Static_assert 验算。</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
      <text x="40" y="378">orr 用的是第二次 ldr 读回来的那份——中间被改过，写回的就是过期值。</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
      <text x="40" y="378">0x4242_8000 + 0x298 正是 0x4242_8298：读-改-写挪进了硬件，源码里只剩一次 store。</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
      <text x="40" y="378">改两位请回掩码或 BSRR；而 CCM（0x1000_0000）在 CMSIS 里连别名基址都没有。</text></g>
  </g>

  <!-- ===== 阶段字幕 ===== -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="402">① 位带机制：把 SRAM/外设的每一位，映射成别名区里的一个字</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="402">② 地址不用背：基址 +（偏移 ×32）+ 位号 ×4，还能编译期断言</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="402">③ 读-改-写有窗口：ldr、orr、str 三步之间谁都能进来</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="402">④ 写别名字只剩一条 str：窗口从源码上消失</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="402">⑤ 边界：一次改一位；BSRR 同样单写；CCM 不在位带源区</text></g>
  </g>

  <!-- ===== 阶段指示点 ===== -->
  <g transform="translate(612,426)" fill="#3451b2">
    <circle cx="0" cy="0" r="5" opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2;1" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="72" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;0.2;1;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="15s" repeatCount="indefinite"/></circle>
  </g>
</svg>
