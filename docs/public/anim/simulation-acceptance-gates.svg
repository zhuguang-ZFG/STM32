<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="从仿真到真板：结论要过四道门">
<title>从仿真到真板：结论要过四道门</title>
<style>
@keyframes simg0-sq{0%,0.00%{opacity:0.45}0.30%,18.00%{opacity:1.0}18.30%,100%{opacity:0.45}}
.simg0{animation:simg0-sq 6.4s linear infinite;}
@keyframes simg1-sq{0%,25.00%{opacity:0.45}25.30%,43.00%{opacity:1.0}43.30%,100%{opacity:0.45}}
.simg1{animation:simg1-sq 6.4s linear infinite;}
@keyframes simg2-sq{0%,50.00%{opacity:0.45}50.30%,68.00%{opacity:1.0}68.30%,100%{opacity:0.45}}
.simg2{animation:simg2-sq 6.4s linear infinite;}
@keyframes simg3-sq{0%,75.00%{opacity:0.45}75.30%,93.00%{opacity:1.0}93.30%,100%{opacity:0.45}}
.simg3{animation:simg3-sq 6.4s linear infinite;}

.sim-flow{stroke-dasharray:5 8;animation:sim-flow-flow 1.1s linear infinite;}@keyframes sim-flow-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-13px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#FBF3DF"/>
<rect x="0" y="0" width="900" height="58" fill="#F7EFDA" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#6E6B60" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1F4680" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">从仿真到真板：结论要过四道门</text>
<text x="22" y="50" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">模型用来缩短反馈；供电、边沿、时钟和 silicon revision 只能回到目标板确认</text>
<rect x="738" y="15" width="140" height="28" fill="#DCE6F2" opacity="1" rx="8" stroke="#6E6B60" stroke-width="1.5"/>
<text x="808" y="33.32" font-size="12" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">22 验收 · IG-009</text>
<rect x="38" y="126" width="190" height="132" fill="#F7EFDA" opacity="1" rx="8" stroke="#6E569B" stroke-width="1.5" class="simg0"/>
<rect x="38" y="126" width="190" height="8" fill="#6E569B" opacity="1" rx="2"/>
<text x="133" y="166" font-size="12" fill="#6E569B" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">1 · BUILD</text>
<text x="133" y="200" font-size="10.2" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">同一 ELF / map</text>
<text x="133" y="224" font-size="10.2" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">版本与配置可追溯</text>
<line x1="232" y1="192" x2="246" y2="192" stroke="#1F4680" stroke-width="2" stroke-linecap="round" opacity="1" class="sim-flow"/>
<polygon points="252.00,192.00 246.00,195.00 246.00,189.00" fill="#1F4680" opacity="1"/>
<rect x="256" y="126" width="190" height="132" fill="#F7EFDA" opacity="1" rx="8" stroke="#1F4680" stroke-width="1.5" class="simg1"/>
<rect x="256" y="126" width="190" height="8" fill="#1F4680" opacity="1" rx="2"/>
<text x="351" y="166" font-size="12" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">2 · MODEL</text>
<text x="351" y="200" font-size="10.2" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">输入可复现</text>
<text x="351" y="224" font-size="10.2" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">支持列表覆盖该外设</text>
<line x1="450" y1="192" x2="464" y2="192" stroke="#1F4680" stroke-width="2" stroke-linecap="round" opacity="1" class="sim-flow"/>
<polygon points="470.00,192.00 464.00,195.00 464.00,189.00" fill="#1F4680" opacity="1"/>
<rect x="474" y="126" width="190" height="132" fill="#F7EFDA" opacity="1" rx="8" stroke="#7A5B14" stroke-width="1.5" class="simg2"/>
<rect x="474" y="126" width="190" height="8" fill="#7A5B14" opacity="1" rx="2"/>
<text x="569" y="166" font-size="12" fill="#7A5B14" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">3 · BOARD</text>
<text x="569" y="200" font-size="10.2" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">供电 / BOOT / 时钟</text>
<text x="569" y="224" font-size="10.2" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">波形与寄存器对账</text>
<line x1="668" y1="192" x2="682" y2="192" stroke="#1F4680" stroke-width="2" stroke-linecap="round" opacity="1" class="sim-flow"/>
<polygon points="688.00,192.00 682.00,195.00 682.00,189.00" fill="#1F4680" opacity="1"/>
<rect x="692" y="126" width="190" height="132" fill="#F7EFDA" opacity="1" rx="8" stroke="#2E5F42" stroke-width="1.5" class="simg3"/>
<rect x="692" y="126" width="190" height="8" fill="#2E5F42" opacity="1" rx="2"/>
<text x="787" y="166" font-size="12" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">4 · ACCEPT</text>
<text x="787" y="200" font-size="10.2" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">输出 + 失败分支</text>
<text x="787" y="224" font-size="10.2" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">证据归档</text>
<rect x="40" y="306" width="820" height="116" fill="#F7EFDA" opacity="1" rx="8" stroke="#6E6B60" stroke-width="1.5"/>
<text x="58" y="334" font-size="12.5" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">在哪一门停下</text>
<text x="58" y="365" font-size="10" fill="#6E569B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">BUILD</text>
<text x="134" y="365" font-size="10" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">固件路径或构建参数不同</text>
<text x="474" y="365" font-size="10" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">冻结 ELF、map、命令和依赖版本</text>
<text x="58" y="390" font-size="10" fill="#1F4680" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">MODEL</text>
<text x="134" y="390" font-size="10" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DMA / RTC / IWDG 等模型缺失</text>
<text x="474" y="390" font-size="10" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">换最小轮询例或记录模型边界</text>
<text x="58" y="415" font-size="10" fill="#7A5B14" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">BOARD</text>
<text x="134" y="415" font-size="10" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">仿真通过，实物波形/供电失败</text>
<text x="474" y="415" font-size="10" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">从电源、BOOT、时钟和引脚开始测</text>
<rect x="40" y="454" width="820" height="88" fill="#F7EFDA" opacity="1" rx="8" stroke="#B3392F" stroke-width="1.5"/>
<text x="58" y="482" font-size="11.5" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">边界</text>
<text x="112" y="482" font-size="10.4" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">仿真里灯亮，只证明这组模型和输入能产生该现象；不证明真实引脚边沿、电流或抗干扰。</text>
<text x="112" y="510" font-size="10.1" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">真板失败时保留仿真记录，它仍能帮助区分算法错误与板级错误。</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">视觉规范：FA-002 概念连续线 · IG-009 时间轴节点 · C-03 / C-10 / C-27 / C-31</text>
<text x="876" y="602" font-size="11" fill="#6E6B60" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
