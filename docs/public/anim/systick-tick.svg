<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei',sans-serif">
  <title>SysTick 的心跳：倒数归零重载，和一个"读一次就清"的标志</title>
  <desc>四阶段动画：SysTick 是 24 位倒数秒表，LOAD 定周期、VAL 看进度、CTRL 开关机。计数从 LOAD 一路减到 0，第 LOAD+1 个时钟才归零重载并置 COUNTFLAG；COUNTFLAG 是 read-to-clear——读 CTRL 这个动作本身把它清 0。阶段三对比单读法（5 中 5）与"先偷看再查"的双读法（0 中）：标志被第一次读偷走，查询式延时死等。正确写法是读一次存进变量再判断。图上有一个真在跑的计数器：计数点沿 LOAD→0 一路递减、归零瞬间弹回 LOAD，COUNTFLAG 灯在每个 carry tick 点亮一次。</desc>
  <rect width="720" height="452" fill="#FDF8EA"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#2B5EA7">SysTick 的心跳：倒数归零重载，和一个"读就清"的标志</text>
  <text x="24" y="50" font-size="12" fill="#6E6B60">周期 = LOAD + 1；COUNTFLAG 是 read-to-clear——读 CTRL 这个动作本身就把标志清掉</text>

  <!-- ===== 定时器面板（常驻）：倒数计数轴 + COUNTFLAG 灯 ===== -->
  <rect x="40" y="66" width="640" height="110" rx="8" fill="#FFFDF6" stroke="#D8D2C0"/>
  <text x="56" y="90" font-size="13" font-weight="bold" fill="#2B5EA7">24 位倒数秒表（内核外设 @ 0xE000E010）</text>
  <text x="56" y="112" font-size="12" font-family="Consolas,monospace" fill="#6E6B60">CTRL = ENABLE|TICKINT|CLKSOURCE   LOAD = 167999   VAL = 计数中...</text>
  <!-- 倒数轴 -->
  <text x="192" y="134" font-size="11" fill="#888">LOAD</text>
  <line x1="230" y1="142" x2="500" y2="142" stroke="#D8D2C0" stroke-width="2"/>
  <text x="500" y="134" font-size="11" fill="#888" text-anchor="end">0</text>
  <text x="360" y="158" font-size="11" fill="#9A937F" text-anchor="middle">VAL 沿此轴一路减到底，到底即归零重载</text>
  <!-- 跑动的计数点：LOAD→0 递减，到底瞬间弹回重载 -->
  <circle cx="230" cy="142" r="6" fill="#2B5EA7">
    <animate attributeName="cx" values="230;500;500;230" keyTimes="0;0.85;0.92;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <!-- COUNTFLAG 灯：每个 carry tick 亮一次（与计数点同步） -->
  <g transform="translate(560,142)">
    <circle r="6" fill="#A8801F" opacity="0.15">
      <animate attributeName="opacity" values="0.15;1;0.15" keyTimes="0;0.04;0.1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="560" y="168" font-size="11" fill="#A8801F" text-anchor="middle">COUNTFLAG</text>
  <text x="560" y="150" font-size="11" fill="#a16207" text-anchor="middle">归零亮</text>

  <!-- ===== 阶段一：倒数与归零重载 ===== -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="190" width="640" height="150" rx="8" fill="#FBF3DF" stroke="#E7E2D4"/>
    <text x="56" y="214" font-size="13" font-weight="bold" fill="#2B5EA7">周期 = LOAD + 1：数到 0 的那一拍才重载</text>
    <text x="56" y="238" font-size="13" font-family="Consolas,monospace" fill="#2F2E2B">168MHz 要 1ms → 168000 个时钟 → LOAD = 168000 − 1 = 167999</text>
    <text x="56" y="262" font-size="13" fill="#2F2E2B">硬件语义：每个周期 VAL--；<tspan fill="#A8801F" font-weight="bold">VAL 已经为 0 的那一拍</tspan>执行重载并置 COUNTFLAG</text>
    <text x="56" y="290" font-size="12" fill="#6E6B60">从 LOAD 数到 0 再重载，一个完整周期是 LOAD+1 个时钟——"减一"不是口诀，是数出来的。</text>
  </g>

  <!-- ===== 阶段二：读就所见 / read-to-clear ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="190" width="640" height="150" rx="8" fill="#FBF3DF" stroke="#E7E2D4"/>
    <text x="56" y="214" font-size="13" font-weight="bold" fill="#2B5EA7">COUNTFLAG 是 read-to-clear：读它本身有副作用</text>
    <text x="56" y="238" font-size="13" font-family="Consolas,monospace" fill="#2F2E2B">软件读 CTRL 这个动作，会把 COUNTFLAG 直接清成 0</text>
    <text x="56" y="270" font-size="13" fill="#2F2E2B">清零之后 → 下一次归零才会再把它置 1；期间读多少次都是 0。</text>
    <text x="56" y="300" font-size="12" fill="#A8801F">调试器 watch 窗口点一下 CTRL 都算"读"——实地这个坑表现为延时偶发死等。</text>
  </g>

  <!-- ===== 阶段三：单读 vs 双读对照 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="190" width="310" height="150" rx="8" fill="#d8f3e5" stroke="#3F7D57"/>
    <text x="60" y="214" font-size="13" font-weight="bold" fill="#3F7D57">单读法（正确）</text>
    <text x="60" y="238" font-size="12" font-family="Consolas,monospace" fill="#2F2E2B">if (read() &amp; FLAG) n++</text>
    <text x="60" y="268" font-size="14" font-weight="bold" fill="#3F7D57">5 个周期读到 5 次</text>
    <text x="60" y="292" font-size="12" fill="#6E6B60">读一次就判断，标志不被别人碰。</text>
    <text x="60" y="316" font-size="12" fill="#3F7D57">✓ 全部命中</text>
    <rect x="374" y="192" width="306" height="150" rx="8" fill="#fff7ed" stroke="#A8801F"/>
    <text x="394" y="214" font-size="13" font-weight="bold" fill="#A8801F">双读法（先偷看再查）</text>
    <text x="394" y="238" font-size="12" font-family="Consolas,monospace" fill="#2F2E2B">(void)read(); if (read() &amp; flag)</text>
    <text x="394" y="268" font-size="14" font-weight="bold" fill="#A8801F">5 个周期读到 0 次</text>
    <text x="394" y="292" font-size="12" fill="#6E6B60">第一次读已把标志清掉，第二次读永远 0。</text>
    <text x="394" y="316" font-size="12" fill="#92400e">✗ 查询式延时死等</text>
  </g>

  <!-- ===== 阶段四：正确写法 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="190" width="640" height="150" rx="8" fill="#FBF3DF" stroke="#E7E2D4"/>
    <text x="56" y="214" font-size="13" font-weight="bold" fill="#2B5EA7">正确写法：读一次，存进变量，再判断</text>
    <text x="56" y="242" font-size="13" font-family="Consolas,monospace" fill="#2F2E2B">uint32_t f = SysTick-&gt;CTRL;</text>
    <text x="56" y="264" font-size="13" font-family="Consolas,monospace" fill="#2F2E2B">if (f &amp; SysTick_CTRL_COUNTFLAG_Msk) { n++; }</text>
    <text x="56" y="296" font-size="12" fill="#6E6B60">一次性把"读到并判断"做完，不留下第二次读的机会——现场在判断前那一刻就冻结。</text>
    <text x="56" y="320" font-size="12" fill="#3F7D57">同一原则贯穿全站：S9 采样超时、F 篇事件等待，都是"读一次用一次"。</text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#2B5EA7">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="410">① 倒数 + 归零重载：周期 = LOAD+1，VAL 归零那一拍置 COUNTFLAG</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="410">② read-to-clear：读 CTRL 这个动作把 COUNTFLAG 清 0</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="410">③ 对照：单读 5 中 5 · 双读 0 中——标志被第一次读偷走，延时死等</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="410">④ 正解：读一次存进变量再判断，不留第二次读取的机会</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,432)" fill="#2B5EA7">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>