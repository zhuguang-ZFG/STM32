<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="USB 设备枚举：从地址 0 到可用">
<title>USB 设备枚举：从地址 0 到可用</title>
<style>
@keyframes usb-row0-on{0%,100%{stroke:#6E6B60}0.00%,12.00%{stroke:#B3392F}}
.usb-row0{animation:usb-row0-on 5.6s linear infinite;}
@keyframes usb-p0-mv{0%,100%{opacity:0;transform:translateX(0)}1.00%{opacity:0;transform:translateX(0)}1.70%{opacity:1;transform:translateX(0)}11.00%{opacity:1;transform:translateX(-464px)}11.70%{opacity:0;transform:translateX(-464px)}}
.usb-p0{animation:usb-p0-mv 5.6s ease-in-out infinite;}
@keyframes usb-row1-on{0%,100%{stroke:#6E6B60}14.29%,26.29%{stroke:#B3392F}}
.usb-row1{animation:usb-row1-on 5.6s linear infinite;}
@keyframes usb-p1-mv{0%,100%{opacity:0;transform:translateX(0)}15.29%{opacity:0;transform:translateX(0)}15.99%{opacity:1;transform:translateX(0)}25.29%{opacity:1;transform:translateX(464px)}25.99%{opacity:0;transform:translateX(464px)}}
.usb-p1{animation:usb-p1-mv 5.6s ease-in-out infinite;}
@keyframes usb-row2-on{0%,100%{stroke:#6E6B60}28.57%,40.57%{stroke:#7A5B14}}
.usb-row2{animation:usb-row2-on 5.6s linear infinite;}
