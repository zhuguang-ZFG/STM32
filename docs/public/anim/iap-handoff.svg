<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>STM32 IAP 跳转接力：Bootloader 把控制权交给 App</title>
  <desc>四阶段动画：IAP（应用内编程）的跳转不是"函数调用"，是硬件级接力。① 双固件布局：Bootloader 住扇区 0（0x08000000，16KB），App 住扇区 1 起（0x08004000），各有独立向量表（第一字=初始 MSP、第二字=reset 入口）；② 关中断 + 复位 SysTick：__disable_irq 置 PRIMASK 把 VTOR 切换窗口期焊死、SysTick->CTRL=0 让内核定时器干净，防止挂着的请求按旧向量表取入口取到垃圾地址 HardFault；③ 设 VTOR + MSP：SCB->VTOR 指向 App 起始（新向量表归位），__set_MSP 从 App 第一字载入栈顶（顺序：先让表归位再从新表读栈顶）；④ 跳 App 复位入口：取向量表第二字（reset handler，Thumb 位已由链接器置好）并跳，App 重新走 .data/.bss 初始化与 SystemClock_Config，等于一次"软上电"。图上有一个真在跑的接力点：执行流从 Bootloader 末尾沿 Flash 滑到 App 的 reset handler，像接力棒从 Bootloader 交到 App。IAP 区别于普通函数调用的全部秘密：App 有自己的栈、自己的向量表、自己的复位序列，跳过去就回不来。</desc>
  <rect width="720" height="460" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">STM32 IAP 跳转接力：关断 · 换栈 · 改向量 · 跳 reset</text>
  <text x="24" y="50" font-size="12" fill="#666">跳过去就回不来——App 有自己的栈、向量表与复位序列</text>

  <!-- Flash 双固件布局（常驻）：扇区 0 Bootloader / 扇区 1+ App，各自向量表 -->
  <rect x="40" y="66" width="640" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="42" y="68" width="180" height="30" rx="3" fill="#dbe7ff"/>
  <text x="132" y="82" font-size="11" fill="#3451b2" text-anchor="middle">扇区 0  Bootloader</text>
  <text x="132" y="94" font-size="11" fill="#64748b" text-anchor="middle">0x08000000  16KB</text>
  <rect x="224" y="68" width="454" height="30" rx="3" fill="#d8f3e5"/>
  <text x="451" y="82" font-size="11" fill="#1a7f56" text-anchor="middle">扇区 1+  App</text>
  <text x="451" y="94" font-size="11" fill="#64748b" text-anchor="middle">0x08004000  起其余扇区</text>
  <text x="300" y="112" font-size="11" fill="#94a3b8" text-anchor="middle">两块各有独立向量表：[MSP | reset_handler | IRQ0..]</text>

  <!-- 四步卡片（常驻） -->
  <rect x="40" y="120" width="155" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="140" font-size="12" font-weight="bold" fill="#3451b2">① 关中断</text>
  <text x="52" y="160" font-size="11" fill="#666">__disable_irq()</text>
  <text x="52" y="176" font-size="11" fill="#333">PRIMASK=1 焊窗口</text>
  <text x="52" y="192" font-size="11" fill="#94a3b8">防按旧表取入口</text>

  <rect x="205" y="120" width="155" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="217" y="140" font-size="12" font-weight="bold" fill="#d97706">② 复位 SysTick</text>
  <text x="217" y="160" font-size="11" fill="#666">SysTick->CTRL=0</text>
  <text x="217" y="176" font-size="11" fill="#333">清 PENDSTCLR</text>
  <text x="217" y="192" font-size="11" fill="#94a3b8">App 启动时它干净</text>

  <rect x="370" y="120" width="155" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="382" y="140" font-size="12" font-weight="bold" fill="#d97706">③ 设 VTOR+MSP</text>
  <text x="382" y="160" font-size="11" fill="#666">SCB->VTOR=0x08004000</text>
  <text x="382" y="176" font-size="11" fill="#333">__set_MSP(第一字)</text>
  <text x="382" y="192" font-size="11" fill="#94a3b8">先表归位再读栈顶</text>

  <rect x="535" y="120" width="155" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="547" y="140" font-size="12" font-weight="bold" fill="#1a7f56">④ 跳 reset 入口</text>
  <text x="547" y="160" font-size="11" fill="#666">取第二字跳</text>
  <text x="547" y="176" font-size="11" fill="#333">App 软上电</text>
  <text x="547" y="192" font-size="11" fill="#94a3b8">.data/.bss/时钟</text>

  <!-- 接力棒：执行流从 Bootloader 滑到 App reset（一直转） -->
  <line x1="90" y1="220" x2="630" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="90" cy="220" r="6" fill="#3451b2">
    <animate attributeName="cx" values="90;630;630;90" keyTimes="0;0.86;0.93;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="360" y="240" font-size="11" fill="#94a3b8" text-anchor="middle">执行流：从 Bootloader 末尾交到 App 的 reset handler</text>

  <!-- 阶段一：双固件布局 -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="256" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="278" font-size="13" font-weight="bold" fill="#3451b2">① 双固件布局：两块 Flash 各有独立向量表</text>
    <text x="56" y="302" font-size="13" fill="#333">Bootloader 链接在 0x08000000，App 链接在 0x08004000——MEMORY 划块的实战（B3）。</text>
    <text x="56" y="328" font-size="12" font-family="Consolas,monospace" fill="#333">向量表：[0] = 初始 MSP   [1] = reset_handler   [2..] = IRQ0..N</text>
    <text x="56" y="354" font-size="12" fill="#d97706">App 有自己的栈顶、自己的中断入口——跳转不是"继续跑"，是"换一套身份"。</text>
  </g>

  <!-- 阶段二：关中断 + 复位 SysTick -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="256" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="278" font-size="13" font-weight="bold" fill="#d97706">② 关中断 + 复位 SysTick：焊死 VTOR 切换的窗口期</text>
    <text x="56" y="302" font-size="13" fill="#333">__disable_irq() 置 PRIMASK——VTOR 切换期间任何中断都会按<tspan font-weight="bold">当前 VTOR</tspan>取入口，此刻表正被覆盖。</text>
    <text x="56" y="328" font-size="12" font-family="Consolas,monospace" fill="#333">SysTick->CTRL = 0;   SCB->ICSR = SCB_ICSR_PENDSTCLR_Msk;</text>
    <text x="56" y="354" font-size="12" fill="#d97706">挂着的请求 + 旧表 = 取到垃圾地址 HardFault。关 PRIMASK 把窗口期焊死。</text>
  </g>

  <!-- 阶段三：设 VTOR + MSP -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="256" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="278" font-size="13" font-weight="bold" fill="#d97706">③ 设 VTOR + MSP：先让表归位，再从新表读栈顶</text>
    <text x="56" y="302" font-size="13" fill="#333">VTOR 指向 0x08004000（向量表归位 App），再从 App 向量表第一字载入 MSP。</text>
    <text x="56" y="328" font-size="12" font-family="Consolas,monospace" fill="#333">SCB->VTOR = APP_ADDR;   __set_MSP(*(uint32_t*)APP_ADDR);</text>
    <text x="56" y="354" font-size="12" fill="#d97706">顺序反了：MSP 是从旧表读的——VTOR 必须在 MSP 之前。</text>
  </g>

  <!-- 阶段四：跳 App 复位入口 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="256" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="278" font-size="13" font-weight="bold" fill="#1a7f56">④ 跳 App 复位入口：等于一次"软上电"</text>
    <text x="56" y="300" font-size="13" fill="#333">取 App 向量表第二字（reset handler）并跳——Thumb 位 0 已由链接器置好。</text>
    <text x="56" y="322" font-size="13" fill="#333">App 从 reset 走完整序列：.data 拷贝、.bss 清零、SystemClock_Config、main。</text>
    <text x="56" y="344" font-size="12" font-family="Consolas,monospace" fill="#333">handler = (void(*)(void))(*(uint32_t*)(APP_ADDR+4));   handler();</text>
    <text x="56" y="366" font-size="12" fill="#3eaf7c">跳 main 会跳过启动代码——必须跳 reset 入口，让 App 走完整上电序列。</text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="410">① 双固件布局：两块 Flash 各有独立向量表</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="410">② 关中断 + 复位 SysTick：焊死 VTOR 切换窗口期</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="410">③ 设 VTOR + MSP：先让表归位再从新表读栈顶</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="410">④ 跳 App reset 入口：等于一次软上电，跳过去回不来</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,428)" fill="#3451b2">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>
