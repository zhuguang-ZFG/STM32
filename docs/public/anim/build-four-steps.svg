<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>B1 四步构建：main.c 到机器码的流水线</title>
  <desc>四阶段动画：gcc 是调度员，把 main.c 变成 blink.elf 拆成四道工序。① 预处理 -E：65 行 main.c 膨胀成 1575 行 main.i，include 展开、宏替换、条件裁剪都是纯文本操作；② 编译 -S：cc1 把 C 翻译成 3757 行 main.s，开时钟那三行 ldr/ldr/orr/str 就是源码 |= 的读-改-写；③ 汇编 -c：as 产出 main.o，机器码有了但地址全是 0——可重定位的半成品；④ 链接：ld 把 main.o 与 startup.o 拼成 blink.elf，按链接脚本把 .text 钉在 0x08000188，U 符号一个个对上。报错分诊：fatal error 是预处理、error 是编译、undefined reference 是链接——报错阶段就是嫌疑人范围。图上有一个真在跑的产品：一份"产物文件"沿流水线从左到右流转，归零后回到起点再来一轮。</desc>
  <rect width="720" height="452" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">B1 四步构建：main.c 到 blink.elf 的流水线</text>
  <text x="24" y="50" font-size="12" fill="#666">E 出 .i · S 出 .s · c 出 .o · 链接出 .elf——报错先问死在哪一步（fatal/error/undefined reference 分诊）</text>

  <!-- 流水线：四个工序站（常驻） -->
  <rect x="40" y="66" width="640" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="86" font-size="12" font-weight="bold" fill="#3451b2">arm-none-eabi-gcc -### 的内部分工</text>
  <g font-size="11" font-family="Consolas,monospace" fill="#333">
    <text x="56" y="108">① cc1 -E → main.i</text>
    <text x="218" y="108">② cc1 -S → main.s</text>
    <text x="388" y="108">③ as -c → main.o</text>
    <!-- ④ 站左移：11px 等宽在 Linux 回退字体（DejaVu Sans Mono）下宽约 10%，
         x=558 时右端会越过 720 被裁掉 -->
    <text x="540" y="108">④ collect2/ld → blink.elf</text>
  </g>

  <!-- 传送带 -->
  <line x1="80" y1="160" x2="640" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="110" cy="160" r="6" fill="#3451b2">
    <animate attributeName="cx" values="110;640;640;110" keyTimes="0;0.88;0.94;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 阶段一：预处理 -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="184" width="640" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="208" font-size="13" font-weight="bold" fill="#3451b2">① 预处理 -E：宏在纸上摊平（纯文本，不查语法）</text>
    <text x="56" y="234" font-size="13" font-family="Consolas,monospace" fill="#333">main.c（65 行） → main.i（1575 行）：#include 整份贴进来 + 宏替换 + 条件编译裁剪</text>
    <!-- 一行 88 列的代码在宽字体下必然出界，按运算符断成两行 -->
    <text x="56" y="256" font-size="13" font-family="Consolas,monospace" fill="#333">(*(volatile uint32_t *)(((0x40000000UL + 0x20000UL)</text>
    <text x="84" y="272" font-size="13" font-family="Consolas,monospace" fill="#333">+ 0x3800UL) + 0x30UL)) |= (1UL &lt;&lt; 5);</text>
    <text x="56" y="296" font-size="12" fill="#666">RCC_BASE 的宏在使用处已被摊平成纯算术式——指针、volatile、位运算的语义从这一行就已确定。</text>
    <text x="56" y="322" font-size="12" fill="#d97706">报错关键字：fatal error: ... No such file or directory → 只出现在这一阶段</text>
  </g>

  <!-- 阶段二：编译 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="184" width="640" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="208" font-size="13" font-weight="bold" fill="#3451b2">② 编译：cc1 把 C 翻成汇编（语法/类型检查 + 优化）</text>
    <text x="56" y="234" font-size="13" font-family="Consolas,monospace" fill="#333">main.i → main.s（实测 3757 行）</text>
    <text x="56" y="258" font-size="13" font-family="Consolas,monospace" fill="#333">ldr r3, .L6    @ 读 RCC-&gt;AHB1ENR</text>
    <text x="56" y="278" font-size="13" font-family="Consolas,monospace" fill="#333">orr r3, r3, #32  @ 32 = 1&lt;&lt;5，|= 被常量折叠</text>
    <text x="56" y="298" font-size="13" font-family="Consolas,monospace" fill="#333">str r3, [r2]   @ 写回——读-改-写一条不少</text>
    <text x="56" y="322" font-size="12" fill="#d97706">报错关键字：error: expected ...（语法/类型，行号精确到列）</text>
  </g>

  <!-- 阶段三：汇编 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="184" width="640" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="208" font-size="13" font-weight="bold" fill="#3451b2">③ 汇编：as 产出 .o——机器码有了，地址还没有</text>
    <text x="56" y="234" font-size="13" font-family="Consolas,monospace" fill="#333">main.s → main.o（可重定位目标文件）</text>
    <text x="56" y="260" font-size="13" font-family="Consolas,monospace" fill="#333">objdump -h main.o:  .text  000000a8  00000000  00000000</text>
    <text x="56" y="286" font-size="13" fill="#333">地址栏是 <tspan fill="#dc2626" font-weight="bold">0</tspan>——"放哪个地址"没决定；startup.o 里躺着 7 个 <tspan font-family="Consolas,monospace">U</tspan>（_sdata/_estack/main…），等链接器补。</text>
    <text x="56" y="314" font-size="12" fill="#666">main.o 一个 U 都没有：外设访问是硬编码常量，不需要符号决议。</text>
  </g>

  <!-- 阶段四：链接 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="184" width="640" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="208" font-size="13" font-weight="bold" fill="#3451b2">④ 链接：ld 决议符号 + 按链接脚本排座</text>
    <text x="56" y="234" font-size="13" font-family="Consolas,monospace" fill="#333">main.o + startup.o -T stm32f407xx.ld → blink.elf</text>
    <text x="56" y="258" font-size="13" font-family="Consolas,monospace" fill="#333">0 .isr_vector  00000188  08000000  ← 向量表钉在 Flash 起始</text>
    <text x="56" y="278" font-size="13" font-family="Consolas,monospace" fill="#333">1 .text        0000010c  08000188  ← 代码紧随其后</text>
    <text x="56" y="302" font-size="13" fill="#333">U 符号全部对上；main 的地址 0x080001aa 末位 1 = Thumb 标记位。</text>
    <text x="56" y="326" font-size="12" fill="#d97706">报错关键字：undefined reference to '...'——编译已全过，缺的是符号定义</text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">① 预处理 -E：65 → 1575 行，宏在使用处摊平；fatal error 只出在这</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">② 编译 -S：C → 汇编，读-改-写三连在汇编里看得一清二楚</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">③ 汇编 -c：.o 的半成品状态——机器码齐了，地址全是 0</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">④ 链接：U 符号对上、.text 钉在 0x08000188——undefined reference 出在这</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,426)" fill="#3451b2">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>