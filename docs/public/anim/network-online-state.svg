<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="网线亮灯不等于业务在线">
<title>网线亮灯不等于业务在线</title>
<style>

.net-line{stroke-dasharray:8 8;animation:net-line-flow 1.5s linear infinite;}@keyframes net-line-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-16px}}
@keyframes netg0-sq{0%,0.00%{opacity:0.38}0.30%,12.00%{opacity:1.0}12.30%,100%{opacity:0.38}}
.netg0{animation:netg0-sq 8.0s linear infinite;}
@keyframes netg1-sq{0%,16.67%{opacity:0.38}16.97%,28.67%{opacity:1.0}28.97%,100%{opacity:0.38}}
.netg1{animation:netg1-sq 8.0s linear infinite;}
@keyframes netg2-sq{0%,33.33%{opacity:0.38}33.63%,45.33%{opacity:1.0}45.63%,100%{opacity:0.38}}
.netg2{animation:netg2-sq 8.0s linear infinite;}
@keyframes netg3-sq{0%,50.00%{opacity:0.38}50.30%,62.00%{opacity:1.0}62.30%,100%{opacity:0.38}}
.netg3{animation:netg3-sq 8.0s linear infinite;}
@keyframes netg4-sq{0%,66.67%{opacity:0.38}66.97%,78.67%{opacity:1.0}78.97%,100%{opacity:0.38}}
.netg4{animation:netg4-sq 8.0s linear infinite;}
@keyframes netg5-sq{0%,83.33%{opacity:0.38}83.63%,95.33%{opacity:1.0}95.63%,100%{opacity:0.38}}
.netg5{animation:netg5-sq 8.0s linear infinite;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#FBF3DF"/>
<rect x="0" y="0" width="900" height="58" fill="#F7EFDA" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#6E6B60" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#2E5F42" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">网线亮灯不等于业务在线</text>
<text x="22" y="50" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">从物理链路到 MQTT 可用，每一道门都有自己的证据、超时和回退位置</text>
<rect x="738" y="15" width="140" height="28" fill="#DCE6F2" opacity="1" rx="8" stroke="#6E6B60" stroke-width="1.5"/>
<text x="808" y="33.32" font-size="12" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">27 网络 · IG-009</text>
<line x1="70" y1="190" x2="830" y2="190" stroke="#6E6B60" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 8" class="net-line"/>
<circle cx="82" cy="190" r="22" fill="#FBF3DF" opacity="1" stroke="#B3392F" stroke-width="2" class="netg0"/>
<text x="82" y="195" font-size="12" fill="#B3392F" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">1</text>
<text x="82" y="148" font-size="13" fill="#B3392F" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">LINK</text>
<text x="82" y="244" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PHY BSR</text>
<text x="82" y="264" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">50 MHz</text>
<circle cx="228" cy="190" r="22" fill="#FBF3DF" opacity="1" stroke="#1F4680" stroke-width="2" class="netg1"/>
<text x="228" y="195" font-size="12" fill="#1F4680" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">2</text>
<text x="228" y="148" font-size="13" fill="#1F4680" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">IP</text>
<text x="228" y="244" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DHCP lease</text>
<text x="228" y="264" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">或静态地址</text>
<circle cx="374" cy="190" r="22" fill="#FBF3DF" opacity="1" stroke="#2E5F42" stroke-width="2" class="netg2"/>
<text x="374" y="195" font-size="12" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">3</text>
<text x="374" y="148" font-size="13" fill="#2E5F42" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">DNS</text>
<text x="374" y="244" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">A/AAAA</text>
<text x="374" y="264" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">目标地址</text>
<circle cx="520" cy="190" r="22" fill="#FBF3DF" opacity="1" stroke="#7A5B14" stroke-width="2" class="netg3"/>
<text x="520" y="195" font-size="12" fill="#7A5B14" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">4</text>
<text x="520" y="148" font-size="13" fill="#7A5B14" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">TIME</text>
<text x="520" y="244" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">RTC/NTP</text>
<text x="520" y="264" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">证书时钟</text>
<circle cx="666" cy="190" r="22" fill="#FBF3DF" opacity="1" stroke="#6E569B" stroke-width="2" class="netg4"/>
<text x="666" y="195" font-size="12" fill="#6E569B" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">5</text>
<text x="666" y="148" font-size="13" fill="#6E569B" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">TLS</text>
<text x="666" y="244" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">链 + 主机名</text>
<text x="666" y="264" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">握手通过</text>
<circle cx="812" cy="190" r="22" fill="#FBF3DF" opacity="1" stroke="#8e2f5b" stroke-width="2" class="netg5"/>
<text x="812" y="195" font-size="12" fill="#8e2f5b" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">6</text>
<text x="812" y="148" font-size="13" fill="#8e2f5b" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">MQTT</text>
<text x="812" y="244" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CONNACK</text>
<text x="812" y="264" font-size="9.7" fill="#6E6B60" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">业务订阅</text>
<rect x="40" y="318" width="820" height="104" fill="#F7EFDA" opacity="1" rx="8" stroke="#6E6B60" stroke-width="1.5"/>
<text x="58" y="346" font-size="12.5" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">状态机必须保留的三条边</text>
<text x="58" y="372" font-size="10.5" fill="#B3392F" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">失败</text>
<text x="112" y="372" font-size="10.2" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">回到当前门或更低一层，不把 link 断开伪装成 MQTT 超时</text>
<text x="58" y="394" font-size="10.5" fill="#7A5B14" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">超时</text>
<text x="112" y="394" font-size="10.2" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">每一门都有单独截止点；总启动截止点不能靠无限重试延长</text>
<text x="58" y="416" font-size="10.5" fill="#2E5F42" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">恢复</text>
<text x="112" y="416" font-size="10.2" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">指数退避有上限；成功后清零退避并重新验证依赖</text>
<rect x="40" y="446" width="820" height="78" fill="#F7EFDA" opacity="1" rx="8" stroke="#1F4680" stroke-width="1.5"/>
<text x="58" y="473" font-size="11.5" fill="#1F4680" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">验收日志</text>
<text x="132" y="473" font-size="10.5" fill="#2F2E2B" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">boot_id | state | attempt | deadline_ms | result | next_state</text>
<text x="132" y="500" font-size="10.2" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">第一次偏离在哪一门，PCAP、错误码和配置快照就在哪一门对齐。</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#6E6B60" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">视觉规范：FA-002 概念连续线 · IG-009 时间轴节点 · C-03 / C-10 / C-27 / C-31</text>
<text x="876" y="602" font-size="11" fill="#6E6B60" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
