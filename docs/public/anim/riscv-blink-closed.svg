<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>RISC-V 点灯闭环：GD32VF103 五步点亮第一个 LED</title>
  <desc>四阶段动画：GD32VF103（RISC-V）第一个点灯闭环的五步，每步都藏着与 STM32 的同与不同。① 时钟使能：RCU_APB2EN 的 PAEN 位打开 GPIOA 时钟（RCU 即 STM32 的 RCC）；VF103 是 F1 血统、AFIO_BASE 存在，用到重映射还要再开 AFEN（AFIO 时钟）——漏开时钟，寄存器写不进去。② GPIO 模式：CTL0 寄存器里每个 pin 占四位——CTL[3:2] 选推挽/开漏 + MD[1:0] 选方向/速度，pin×4 定位、掩码 0xF，推挽输出 MD=01；这是 F1 的“四位一坑”，与 F4xx MODER 的“两位一坑”不同，肌肉记忆要重灌。③ 输出写值：GD32 命名 OCTL（=F1 的 ODR）可整字直写但有读改写竞态；BOP 对应位写 1 置位、BC 写 1 清零——F1 BSRR 的拆分版，原子翻转不用关中断。④ MTIME 延时 + 循环：Bumblebee 核心按 RISC-V 规范在 CLINT 里放 64 位 MTIME 恒速计数器，delay_ms 轮询 MTIME 差值（或 WFI 等到点），到点返回翻转 OCTL，while(1) 跳回写值步——点亮即验证时钟、模式、输出、延时、循环全通的闭环，RISC-V 的 Hello World。图上有一个真在跑的点灯脉冲：LED 亮灭循环，与 MTIME 计数条同步填满/复位。</desc>
  <rect width="720" height="460" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">RISC-V 点灯闭环：GD32VF103 五步点亮第一个 LED</text>
  <text x="24" y="50" font-size="12" fill="#666">时钟 → 模式 → 写值 → 延时 → 循环：F1 血统的“四位一坑” + RISC-V 的 MTIME</text>

  <!-- 五步流程框（常驻） -->
  <rect x="40" y="62" width="112" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="96" y="80" font-size="11.5" font-weight="bold" fill="#3451b2" text-anchor="middle">① 时钟使能</text>
  <text x="96" y="97" font-size="11" font-family="Consolas,monospace" fill="#64748b" text-anchor="middle">RCU_APB2EN</text>
  <text x="96" y="114" font-size="11" fill="#57606a" text-anchor="middle">PAEN=1 打开 GPIOA</text>
  <text x="96" y="128" font-size="11" fill="#57606a" text-anchor="middle">F1 血统：AFIO 加 AFEN</text>

  <rect x="172" y="62" width="112" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="228" y="80" font-size="11.5" font-weight="bold" fill="#d97706" text-anchor="middle">② GPIO 模式</text>
  <text x="228" y="97" font-size="11" font-family="Consolas,monospace" fill="#64748b" text-anchor="middle">CTL0 · 4bits/pin</text>
  <text x="228" y="114" font-size="11" fill="#57606a" text-anchor="middle">pin×4 定位，掩码 0xF</text>
  <text x="228" y="128" font-size="11" fill="#57606a" text-anchor="middle">推挽输出：MD=01</text>

  <rect x="304" y="62" width="112" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="360" y="80" font-size="11.5" font-weight="bold" fill="#1a7f56" text-anchor="middle">③ 输出写值</text>
  <text x="360" y="97" font-size="11" font-family="Consolas,monospace" fill="#64748b" text-anchor="middle">OCTL / BOP / BC</text>
  <text x="360" y="114" font-size="11" fill="#57606a" text-anchor="middle">置位 BOP · 清零 BC</text>
  <text x="360" y="128" font-size="11" fill="#57606a" text-anchor="middle">或 OCTL 整字直写</text>

  <rect x="436" y="62" width="112" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="492" y="80" font-size="11.5" font-weight="bold" fill="#3451b2" text-anchor="middle">④ MTIME 延时</text>
  <text x="492" y="97" font-size="11" font-family="Consolas,monospace" fill="#64748b" text-anchor="middle">mtime · 64bit</text>
  <text x="492" y="114" font-size="11" fill="#57606a" text-anchor="middle">CLINT 恒速计数器</text>
  <text x="492" y="128" font-size="11" fill="#57606a" text-anchor="middle">delay_ms 轮询差值</text>

  <rect x="568" y="62" width="112" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="624" y="80" font-size="11.5" font-weight="bold" fill="#d97706" text-anchor="middle">⑤ 循环点灯</text>
  <text x="624" y="97" font-size="11" font-family="Consolas,monospace" fill="#64748b" text-anchor="middle">while (1)</text>
  <text x="624" y="114" font-size="11" fill="#57606a" text-anchor="middle">翻转→延时→再翻转</text>
  <text x="624" y="128" font-size="11" fill="#57606a" text-anchor="middle">闭环 = 全链路验证</text>

  <!-- 步骤间箭头 -->
  <g stroke="#94a3b8" stroke-width="1.8" fill="none">
    <line x1="155" y1="100" x2="165" y2="100"/><polyline points="162,95 169,100 162,105"/>
    <line x1="287" y1="100" x2="297" y2="100"/><polyline points="294,95 301,100 294,105"/>
    <line x1="419" y1="100" x2="429" y2="100"/><polyline points="426,95 433,100 426,105"/>
    <line x1="551" y1="100" x2="561" y2="100"/><polyline points="558,95 565,100 558,105"/>
  </g>

  <!-- 点灯脉冲：LED 亮灭 + MTIME 计数（一直转，dur=2s 整除 12s） -->
  <g stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;1" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
    <line x1="100" y1="157" x2="100" y2="147"/>
    <line x1="100" y1="199" x2="100" y2="209"/>
    <line x1="72" y1="178" x2="62" y2="178"/>
    <line x1="128" y1="178" x2="138" y2="178"/>
  </g>
  <circle cx="100" cy="178" r="15" fill="#3eaf7c" stroke="#1a7f56" stroke-width="2">
    <animate attributeName="fill" calcMode="discrete" values="#3eaf7c;#dcfce7;#3eaf7c" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="222" font-size="11" fill="#64748b" text-anchor="middle">PA1 推挽输出驱动</text>

  <rect x="170" y="172" width="200" height="12" rx="2" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="170" y="172" width="0" height="12" fill="#3451b2">
    <animate attributeName="width" values="0;200;0;200;0" keyTimes="0;0.48;0.52;0.96;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="270" y="164" font-size="11" fill="#64748b" text-anchor="middle">MTIME 64 位计数（CLINT 恒速）</text>
  <text x="270" y="196" font-size="11" fill="#64748b" text-anchor="middle">计满 500ms → delay_ms 返回 → 翻转</text>

  <!-- 与 STM32 的同与不同（常驻） -->
  <rect x="400" y="146" width="280" height="68" rx="6" fill="#fdf0d5" stroke="#cbd5e1"/>
  <text x="412" y="164" font-size="11" font-weight="bold" fill="#92400e">与 STM32 的同与不同</text>
  <text x="412" y="180" font-size="11" fill="#57606a">同：F1 血统——AFIO_BASE 存在，重映射走 AFIO</text>
  <text x="412" y="194" font-size="11" fill="#57606a">异：F4xx MODER 两位一坑，这里 CTL0/CTL1 四位一坑</text>
  <text x="412" y="208" font-size="11" fill="#57606a">改名：ODR→OCTL，BSRR→BOP（置）/BC（清）</text>

  <!-- 执行流：五步走完跳回（一直转，dur=4s 整除 12s） -->
  <line x1="90" y1="232" x2="640" y2="232" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="90" cy="232" r="6" fill="#3451b2">
    <animate attributeName="cx" values="90;640;640;90" keyTimes="0;0.86;0.93;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="360" y="250" font-size="11" fill="#94a3b8" text-anchor="middle">执行流：①→⑤ 走完跳回 ③——翻转、延时、再翻转，点灯即闭环</text>

  <!-- 阶段一：时钟使能 -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="256" width="640" height="126" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="278" font-size="13" font-weight="bold" fill="#3451b2">① 时钟使能：RCU_APB2EN.PAEN——F1 血统别忘了 AFEN</text>
    <text x="56" y="304" font-size="13" fill="#333">RCC 在 GD32 叫 RCU：PAEN 开 GPIOA 时钟；VF103 有 AFIO_BASE（F1 血统），重映射还要开 AFEN。</text>
    <text x="56" y="330" font-size="12" font-family="Consolas,monospace" fill="#333">rcu_periph_clock_enable(RCU_GPIOA);  /* PAEN；重映射再加 RCU_AF */</text>
    <text x="56" y="354" font-size="12" fill="#d97706">没开时钟的寄存器写不进去——第一步永远是开时钟，换到 RISC-V 也逃不掉。</text>
  </g>

  <!-- 阶段二：CTL0 四位编码 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="256" width="640" height="126" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="278" font-size="13" font-weight="bold" fill="#d97706">② CTL0 四位编码：pin×4 一坑，MD=01 输出</text>
    <text x="56" y="296" font-size="13" fill="#333">每个 pin 占 CTL0 四位：CTL[3:2] 推挽/开漏 + MD[1:0] 方向/速度——pin1 即位 [7:4]。</text>
    <text x="56" y="314" font-size="13" fill="#333">掩码 0xF 左移 4 位先清后置，推挽输出 MD=01 + CTL=00 = 0x1。</text>
    <text x="56" y="334" font-size="12" font-family="Consolas,monospace" fill="#333">GPIOA-&gt;CTL0 = (GPIOA-&gt;CTL0 &amp; ~0xF0U) | 0x10U;  /* pin1: MD=01, CTL=00 */</text>
    <text x="56" y="356" font-size="12" fill="#d97706">四位一坑是 F1 基因——F4xx MODER 两位一坑（pin×2），两套肌肉记忆别串台。</text>
  </g>

  <!-- 阶段三：写值 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="256" width="640" height="126" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="278" font-size="13" font-weight="bold" fill="#1a7f56">③ 写值：OCTL 直写，BOP 置位 / BC 清零</text>
    <text x="56" y="296" font-size="13" fill="#333">GD32 输出寄存器叫 OCTL（=F1 的 ODR），整字直写有读改写竞态——中断里别裸写。</text>
    <text x="56" y="314" font-size="13" fill="#333">BOP 对应位写 1 置位、BC 写 1 清零——BSRR 的拆分版，原子操作免关中断。</text>
    <text x="56" y="334" font-size="12" font-family="Consolas,monospace" fill="#333">GPIOA-&gt;BOP = 0x2U;  /* 原子置位 */   GPIOA-&gt;BC = 0x2U;  /* 原子清零 */</text>
    <text x="56" y="356" font-size="12" fill="#3eaf7c">中断里翻转优先 BOP/BC：免读改写、免关中断，一步到位。</text>
  </g>

  <!-- 阶段四：MTIME 延时 + 循环 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="256" width="640" height="126" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="278" font-size="13" font-weight="bold" fill="#3451b2">④ MTIME 延时 + 循环：RISC-V 规范自带的表</text>
    <text x="56" y="304" font-size="13" fill="#333">Bumblebee 在 CLINT 放 64 位 MTIME 恒速计数（RISC-V 规范）；delay_ms 轮询差值到点翻转 OCTL。</text>
    <text x="56" y="330" font-size="12" font-family="Consolas,monospace" fill="#333">while (1) { GPIOA-&gt;OCTL ^= 0x2U; delay_ms(500); }  /* 点灯闭环 */</text>
    <text x="56" y="354" font-size="12" fill="#3451b2">灯亮 = 时钟/模式/输出/延时/循环全通——RISC-V 的 Hello World。</text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="408">① 时钟使能：PAEN 开 GPIOA，F1 血统 AFIO 再加 AFEN</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="408">② CTL0 四位编码：pin×4 掩 0xF，推挽输出 MD=01</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="408">③ ODR/BOP/BC 写值：OCTL 直写或原子置位/清零</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="408">④ MTIME 延时+循环：64 位表到点翻转，点灯即验证</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,426)" fill="#3451b2">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>
