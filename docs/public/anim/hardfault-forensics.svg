<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>HardFault 现场：故障升级、栈帧取证、PC 对行号</title>
  <desc>四阶段动画，把"程序死了怎么破案"画成一条流水线：① 案发——crash_null 先从 g_null_ptr 取出 0，再用 str r2,[r3,#0] 往地址 0 写，访问不存在的内存；② 故障升级——可配置故障（MemManage/BusFault/UsageFault）没使能就上调成 HardFault，HFSR.FORCED=1，真凶要去 CFSR 找；③ 现场取证——异常进入时硬件按 r0、r1、r2、r3、r12、LR、PC、xPSR 自动压 8 个字，案发 PC 在偏移 24；④ PC 对行号——把 0x0800008E 喂给 addr2line，得到 fault_ctx.c:70，正是那行空指针写。底部流水线上的 PC 令牌随阶段前进，始终带着同一个案发地址。</desc>
  <rect width="720" height="452" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">HardFault 现场：故障升级 → 栈帧取证 → PC 对行号</text>
  <text x="24" y="50" font-size="12" fill="#666">先看 HFSR.FORCED 判定"升级案"，再回 CFSR 找真凶；栈帧偏移 24 是案发 PC，addr2line 反查源码行</text>

  <!-- ===== 阶段一：案发 ===== -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="66" width="640" height="174" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="56" y="90" font-size="13" font-weight="bold" fill="#dc2626">案发：crash_null 往地址 0 写</text>
    <g font-size="13" font-family="Consolas,monospace" fill="#333">
      <text x="56" y="114">08000084 &lt;crash_null&gt;:</text>
      <text x="56" y="136">  8000088:  4b03  ldr r3, [pc, #12]   ; r3 = &amp;g_null_ptr</text>
      <text x="56" y="158">  800008a:  681b  ldr r3, [r3, #0]    ; r3 = g_null_ptr = 0</text>
      <text x="56" y="180">  800008c:  4a03  ldr r2, [pc, #12]   ; r2 = 0xDEADBEEF</text>
    </g>
    <rect x="56" y="188" width="420" height="24" fill="#fdf0d5" rx="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="62" y="205" font-size="13" font-family="Consolas,monospace" font-weight="bold" fill="#dc2626">800008e:  601a  str r2, [r3, #0]   ; 往地址 0 写 → 崩溃</text>
    <text x="56" y="230" font-size="12" fill="#666">地址 0 处没有可写的内存，str 一执行就是精确总线错误（PRECISERR）。</text>
  </g>

  <!-- ===== 阶段二：升级 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="66" width="640" height="174" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="56" y="90" font-size="13" font-weight="bold" fill="#d97706">故障升级：可配置故障没使能 → 上调成 HardFault</text>
    <text x="56" y="118" font-size="13" fill="#333">BusFault / MemManage / UsageFault 各自有 SHCSR 里的使能位（16/17/18）。</text>
    <text x="56" y="142" font-size="13" fill="#333">没使能时 <tspan fill="#d97706" font-weight="bold">不单独上报，直接升级成 HardFault</tspan>——此时 HFSR.FORCED=1。</text>
    <text x="56" y="172" font-size="13" font-family="Consolas,monospace" fill="#333">HFSR = 0x40000000 → FORCED —— 被升级：真凶在 CFSR，去查它</text>
    <text x="56" y="206" font-size="12" fill="#666">所以看到 HardFault 别急着翻 HardFault，先看 FORCED，再回 CFSR 找真凶。</text>
  </g>
  <!-- ===== 阶段三：现场取证（8 个字按压栈顺序逐个落下） ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="66" width="640" height="174" rx="8" fill="#ffffff" stroke="#3451b2" stroke-width="2"/>
    <text x="56" y="90" font-size="13" font-weight="bold" fill="#3451b2">现场取证：异常进入，硬件自动压 8 个字（偏移以字节计）</text>
    <g font-size="12" font-family="Consolas,monospace">
      <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.5;0.5001;0.75;1" dur="12s" repeatCount="indefinite"/>
        <rect x="56" y="104" width="72" height="28" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="92" y="123" fill="#64748b" text-anchor="middle">r0</text>
        <text x="92" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">+0</text></g>
      <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.525;0.5251;0.75;1" dur="12s" repeatCount="indefinite"/>
        <rect x="132" y="104" width="72" height="28" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="168" y="123" fill="#64748b" text-anchor="middle">r1</text>
        <text x="168" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">+4</text></g>
      <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.55;0.5501;0.75;1" dur="12s" repeatCount="indefinite"/>
        <rect x="208" y="104" width="72" height="28" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="244" y="123" fill="#64748b" text-anchor="middle">r2</text>
        <text x="244" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">+8</text></g>
      <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.575;0.5751;0.75;1" dur="12s" repeatCount="indefinite"/>
        <rect x="284" y="104" width="72" height="28" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="320" y="123" fill="#64748b" text-anchor="middle">r3</text>
        <text x="320" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">+12</text></g>
      <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.6;0.6001;0.75;1" dur="12s" repeatCount="indefinite"/>
        <rect x="360" y="104" width="72" height="28" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="396" y="123" fill="#64748b" text-anchor="middle">r12</text>
        <text x="396" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">+16</text></g>
      <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.625;0.6251;0.75;1" dur="12s" repeatCount="indefinite"/>
        <rect x="436" y="104" width="72" height="28" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="472" y="123" fill="#64748b" text-anchor="middle">LR</text>
        <text x="472" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">+20</text></g>
      <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.65;0.6501;0.75;1" dur="12s" repeatCount="indefinite"/>
        <rect x="512" y="104" width="72" height="28" fill="#fdf0d5" stroke="#dc2626" stroke-width="2" rx="3"/><text x="548" y="123" fill="#dc2626" text-anchor="middle">PC</text>
        <text x="548" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">+24</text></g>
      <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.675;0.6751;0.75;1" dur="12s" repeatCount="indefinite"/>
        <rect x="588" y="104" width="72" height="28" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="624" y="123" fill="#64748b" text-anchor="middle">xPSR</text>
        <text x="624" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">+28</text></g>
    </g>
    <text x="548" y="168" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">↑ 偏移 24 = 案发 PC</text>
    <text x="56" y="196" font-size="13" fill="#333">案发 PC 就在偏移 24（frame[6]）；LR 在偏移 20（还原调用链）。</text>
    <text x="56" y="222" font-size="12" fill="#666">拿错栈（MSP/PSP）读出来全是垃圾——判据是 EXC_RETURN 的 bit2。</text>
  </g>

  <!-- ===== 阶段四：PC 对行号 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="66" width="640" height="174" rx="8" fill="#ffffff" stroke="#3eaf7c" stroke-width="2"/>
    <text x="56" y="90" font-size="13" font-weight="bold" fill="#1a7f56">PC 对行号：addr2line 反查源码</text>
    <text x="56" y="120" font-size="13" font-family="Consolas,monospace" fill="#333">arm-none-eabi-addr2line -e fault_ctx.elf 0x0800008e</text>
    <text x="56" y="148" font-size="14" font-weight="bold" fill="#1a7f56" font-family="Consolas,monospace">→ fault_ctx.c:70</text>
    <text x="56" y="178" font-size="13" fill="#333">那行正是 <tspan font-family="Consolas,monospace" font-weight="bold">*g_null_ptr = 0xDEADBEEF;</tspan>——空指针写的真凶行。</text>
    <text x="56" y="204" font-size="12" fill="#d97706">nm 给的 0x08000084 是函数入口（:69），出错指令是 0x0800008e（:70）；</text>
    <text x="56" y="222" font-size="12" fill="#d97706">差 10 字节、差 1 行——要喂栈里的 PC，不是 nm 的入口地址。</text>
  </g>

  <!-- ===== 常驻：破案流水线，PC 令牌随阶段前进 ===== -->
  <rect x="40" y="252" width="640" height="122" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="52" y="264" width="136" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="52" y="264" width="136" height="70" rx="6" fill="none" stroke="#dc2626" stroke-width="2.5" opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></rect>
  <text x="120" y="284" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">① 案发</text>
  <text x="120" y="304" font-size="12" fill="#333" text-anchor="middle">str 写地址 0</text>
  <text x="120" y="322" font-size="12" fill="#666" text-anchor="middle">PRECISERR</text>
  <path d="M192 299 L206 299" stroke="#94a3b8" stroke-width="2"/><path d="M204 294 L210 299 L204 304 Z" fill="#94a3b8"/>
  <rect x="212" y="264" width="136" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="212" y="264" width="136" height="70" rx="6" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></rect>
  <text x="280" y="284" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">② 升级</text>
  <text x="280" y="304" font-size="12" fill="#333" text-anchor="middle">HFSR.FORCED=1</text>
  <text x="280" y="322" font-size="12" fill="#666" text-anchor="middle">真凶在 CFSR</text>
  <path d="M352 299 L366 299" stroke="#94a3b8" stroke-width="2"/><path d="M364 294 L370 299 L364 304 Z" fill="#94a3b8"/>
  <rect x="372" y="264" width="136" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="372" y="264" width="136" height="70" rx="6" fill="none" stroke="#3451b2" stroke-width="2.5" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></rect>
  <text x="440" y="284" font-size="13" font-weight="bold" fill="#3451b2" text-anchor="middle">③ 取证</text>
  <text x="440" y="304" font-size="12" fill="#333" text-anchor="middle">硬件压 8 个字</text>
  <text x="440" y="322" font-size="12" fill="#666" text-anchor="middle">PC 在 +24</text>
  <path d="M512 299 L526 299" stroke="#94a3b8" stroke-width="2"/><path d="M524 294 L530 299 L524 304 Z" fill="#94a3b8"/>
  <rect x="532" y="264" width="136" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="532" y="264" width="136" height="70" rx="6" fill="none" stroke="#1a7f56" stroke-width="2.5" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></rect>
  <text x="600" y="284" font-size="13" font-weight="bold" fill="#1a7f56" text-anchor="middle">④ 对行号</text>
  <text x="600" y="304" font-size="12" fill="#333" text-anchor="middle">addr2line</text>
  <text x="600" y="322" font-size="12" fill="#666" text-anchor="middle">fault_ctx.c:70</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="120 0;120 0;280 0;280 0;440 0;440 0;600 0;600 0;600 0" keyTimes="0.0;0.2167;0.25;0.4667;0.5;0.7167;0.75;0.9667;1" dur="12s" repeatCount="indefinite"/>
    <rect x="-64" y="341" width="128" height="22" rx="11" fill="#fdf0d5" stroke="#dc2626"/>
    <text x="0" y="356" font-size="12" font-family="Consolas,monospace" font-weight="bold" fill="#dc2626" text-anchor="middle">PC=0x0800008e</text>
  </g>
  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">① 案发：str r2,[r3,#0] 往地址 0 写，触及不存在的内存</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">② 升级——故障没使能就上调 HardFault，HFSR.FORCED=1，真凶在 CFSR</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">③ 取证——硬件自动压 8 个字，案发 PC 在偏移 24（frame[6]）</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">④ 对行号——PC=0x0800008e 喂给 addr2line → fault_ctx.c:70</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,426)" fill="#3451b2">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>
