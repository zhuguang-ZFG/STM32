<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>GPIO 交换矩阵：外设信号自由换岗</title>
  <desc>四阶段动画：外设信号经 GPIO Matrix 路由到有效焊盘；同一 LEDC 信号先在 GPIO10、再换到 GPIO11；IO35~37 被 PSRAM 占用——驱动不拦、物理上失败（没波形/干扰 PSRAM 总线）。"任意引脚"= 有效焊盘 + 没被占用 + 板卡接出来。路由线都是从发端爬向焊盘的，换岗时先把旧线收回总机再重新爬向新脚，红箭头爬到 IO35 后才落下那个 ✗。</desc>
  <rect width="720" height="440" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">GPIO Matrix：外设信号先到总机，再转任意工位</text>
  <text x="24" y="50" font-size="12" fill="#666">外设信号 → GPIO Matrix → 有效焊盘 · IO_MUX 是专线（高速）· "任意"有前提</text>

  <!-- ===== 左：外设信号源 ===== -->
  <rect x="30" y="100" width="150" height="120" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="46" y="122" font-size="13" font-weight="bold" fill="#3451b2">外设信号</text>
  <rect x="46" y="136" width="118" height="28" fill="#dbe7ff" stroke="#3451b2" rx="4"/>
  <text x="105" y="155" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">LEDC PWM</text>
  <rect x="46" y="172" width="118" height="28" fill="#dbe7ff" stroke="#3451b2" rx="4"/>
  <text x="105" y="191" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">UART TX</text>

  <!-- ===== 中：交换矩阵 ===== -->
  <rect x="230" y="80" width="220" height="200" fill="#ffffff" stroke="#3451b2" stroke-width="2" rx="8"/>
  <text x="340" y="104" font-size="13" font-weight="bold" fill="#3451b2" text-anchor="middle">GPIO Matrix（总机）</text>
  <text x="340" y="124" font-size="11" fill="#666" text-anchor="middle">任意外设信号 ↔ 任意有效引脚</text>
  <!-- 交叉点 -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="260" y1="150" x2="420" y2="150"/><line x1="260" y1="180" x2="420" y2="180"/>
    <line x1="260" y1="210" x2="420" y2="210"/><line x1="260" y1="240" x2="420" y2="240"/>
    <line x1="280" y1="140" x2="280" y2="250"/><line x1="320" y1="140" x2="320" y2="250"/>
    <line x1="360" y1="140" x2="360" y2="250"/><line x1="400" y1="140" x2="400" y2="250"/>
  </g>
  <!-- 激活的交叉点（阶段切换）：换岗时跳一次，同时每秒明暗一下表示"这一路正在导通" -->
  <circle cx="320" cy="180" r="7" fill="#3eaf7c">
    <animate attributeName="cy" calcMode="discrete" values="180;210;180;180;180" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="340" y="270" font-size="11" fill="#666" text-anchor="middle">选中的交叉点 = 当前路由</text>

  <!-- ===== 右：焊盘 ===== -->
  <rect x="500" y="80" width="190" height="200" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="516" y="104" font-size="13" font-weight="bold" fill="#3451b2">焊盘（引脚）</text>
  <rect x="516" y="116" width="158" height="30" fill="#ffffff" stroke="#3eaf7c" stroke-width="2" rx="4"/>
  <text x="595" y="136" font-size="12" font-weight="bold" fill="#3eaf7c" text-anchor="middle">GPIO10（扩展口）</text>
  <rect x="516" y="152" width="158" height="30" fill="#ffffff" stroke="#3eaf7c" stroke-width="2" rx="4"/>
  <text x="595" y="172" font-size="12" font-weight="bold" fill="#3eaf7c" text-anchor="middle">GPIO11（扩展口）</text>
  <rect x="516" y="188" width="158" height="30" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" rx="4"/>
  <text x="595" y="208" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">IO35~37（PSRAM 占用）</text>
  <rect x="516" y="224" width="158" height="30" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3" rx="4"/>
  <text x="595" y="244" font-size="12" fill="#888" text-anchor="middle">GPIO0（BOOT/strapping）</text>
  <!-- 当前生效的焊盘：跟着路由跳，并持续明暗（PWM 正从这只脚出去） -->
  <rect x="512" y="112" width="166" height="38" fill="none" stroke="#3eaf7c" stroke-width="2" rx="6" opacity="1">
    <animate attributeName="y" calcMode="discrete" values="112;112;148;112;112" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- 连线：外设→矩阵→焊盘（两条线都是从发端爬出来的，箭头骑在尖端） -->
  <line x1="164" y1="150" x2="164" y2="150" stroke="#3eaf7c" stroke-width="3" marker-end="url(#arrM)">
    <animate attributeName="x2" values="164;164;258;258" keyTimes="0;0.02;0.10;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="150;150;180;180" keyTimes="0;0.02;0.10;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <!-- 换岗：先把线收回总机（旧路由拆掉），再重新爬到新的焊盘 -->
  <line x1="422" y1="180" x2="422" y2="180" stroke="#3eaf7c" stroke-width="3" marker-end="url(#arrM)">
    <animate attributeName="x2" values="422;514;514;422;514;514;422;514;514" keyTimes="0;0.06;0.25;0.28;0.35;0.50;0.53;0.60;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="180;131;131;180;167;167;180;131;131" keyTimes="0;0.06;0.25;0.28;0.35;0.50;0.53;0.60;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <defs>
    <marker id="arrM" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#3eaf7c"/>
    </marker>
    <marker id="arrX" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 占用演示（阶段③点亮）：驱动接受、物理失败 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <line x1="422" y1="180" x2="422" y2="180" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrX)">
      <animate attributeName="x2" values="422;422;514;514" keyTimes="0;0.53;0.63;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="180;180;203;203" keyTimes="0;0.53;0.63;1" dur="12s" repeatCount="indefinite"/>
    </line>
    <text x="595" y="296" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle" opacity="0">✗ 被占用，路由失败<animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;0.63;1" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="320">① LEDC 信号路由到 GPIO10——程序不动，波形就在这根脚上</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="320">② 换岗：ledc_set_pin 重新路由到 GPIO11——同一个信号，换了个工位</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="320">③ 往 IO35（PSRAM 占用）上路由：驱动返回 0，但波形出不来——约束在物理层</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="320">④ 对照 STM32：AF 复用表是"专线可选工位有限"，Matrix 是"总机可转任意工位"</text></g>
  </g>

  <!-- 底部注释 -->
  <text x="36" y="352" font-size="12" fill="#666">立创实战派 S3：多功能扩展口 = GPIO10/GPIO11；IO35/36/37 = 八线 PSRAM 占用；GPIO0 = BOOT 键</text>
  <text x="36" y="374" font-size="12" fill="#666">IO_MUX 是专线（高速信号必走），Matrix 是总机（布局自由，多一级延迟）</text>

  <!-- 阶段指示点 -->
  <g transform="translate(630,392)" fill="#3451b2">
    <circle cx="0" cy="0" r="5" opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>