<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>TIM PWM：CNT 斜升、CCR 比较、ARR 归零</title>
  <desc>四阶段动画：CNT 斜升；CNT 越过 CCR=500 输出翻转；CNT 到 ARR=999 归零（更新事件）；改 CCR=250 后占空比变 25% 而频率不变。f = 84MHz/(PSC+1)/(ARR+1) = 1kHz，占空比 = CCR/(ARR+1)。游标沿锯齿跑，一条扫描线把当前 CNT 投到 OC 那一行；比较点每计数一轮（画面 3s = 1000 拍）跳一次脉冲，OC 方波像示波器那样被逐点抓出来。</desc>
  <rect width="720" height="460" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">PWM 的本质是"比较"：CNT、CCR、ARR 三段分立</text>
  <text x="24" y="50" font-size="12" fill="#666">PSC=83 → 计数时钟 1MHz（1拍=1µs）· ARR=999 → 周期 1000 拍 · CCR=500 → 占空比 50%</text>

  <!-- ===== CNT 锯齿图 ===== -->
  <line x1="110" y1="240" x2="700" y2="240" stroke="#57606a" stroke-width="2"/>
  <line x1="110" y1="70" x2="110" y2="240" stroke="#57606a" stroke-width="2"/>
  <text x="104" y="66" font-size="12" fill="#57606a" text-anchor="end">CNT</text>

  <!-- ARR 终点线 / CCR 比较线 -->
  <line x1="110" y1="80" x2="700" y2="80" stroke="#3451b2" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="104" y="84" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="end">ARR=999</text>
  <line x1="110" y1="160" x2="700" y2="160" stroke="#3eaf7c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="104" y="164" font-size="12" font-weight="bold" fill="#1a7f56" text-anchor="end">CCR=500</text>
  <text x="104" y="244" font-size="12" fill="#57606a" text-anchor="end">0</text>

  <!-- 锯齿：两个周期 -->
  <polyline points="110,240 390,80 390,240 670,80" fill="none" stroke="#3451b2" stroke-width="3"/>
  <text x="392" y="256" font-size="12" fill="#888" text-anchor="middle">更新事件：归零重数</text>

  <!-- 游标：沿锯齿离散跳 -->
  <g transform="translate(180,200)">
    <animateTransform attributeName="transform" type="translate" calcMode="discrete"
      values="180 200;250 160;390 80;460 200;180 200" keyTimes="0;0.25;0.5;0.75;1"
      dur="12s" repeatCount="indefinite"/>
    <circle r="7" fill="#3451b2" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- 扫描线：x 与上面游标同拍跳，把当前 CNT 垂直到 OC 那一行 -->
  <line x1="180" y1="70" x2="180" y2="345" stroke="#d97706" stroke-width="2" opacity="0.35">
    <animate attributeName="x1" calcMode="discrete" values="180;250;390;460;180" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="x2" calcMode="discrete" values="180;250;390;460;180" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <!-- 比较点脉冲：ARR=999 一计数周期 = 画面 3s，每个周期 CNT 越过 CCR 那一刻硬件比较器跳一下 -->
  <circle cx="250" cy="160" r="11" fill="none" stroke="#d97706" stroke-width="2">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== OC 输出方波 ===== -->
  <!-- 爬线：画成 H/V path（与原 polyline 逐点等价），随计数逐点抓出来 -->
  <text x="104" y="320" font-size="12" font-weight="bold" fill="#57606a" text-anchor="end">OC</text>
  <path d="M110,295 H250 V345 H390 V295 H530 V345 H670" pathLength="1000"
        fill="none" stroke="#3eaf7c" stroke-width="3" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.75;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="120" y="290" font-size="12" fill="#1a7f56">高：CNT &lt; CCR</text>
  <text x="560" y="362" font-size="12" fill="#888">低：CNT ≥ CCR</text>

  <!-- 公式条 -->
  <text x="360" y="395" font-size="12" fill="#333" font-family="Consolas,monospace" text-anchor="middle">f = 84MHz/(PSC+1)/(ARR+1) = 84M/84/1000 = 1kHz · 占空比 = CCR/(ARR+1) = 500/1000 = 50%</text>

  <!-- ===== 阶段 ①：计数 ===== -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <line x1="110" y1="240" x2="180" y2="200" stroke="#3451b2" stroke-width="7" opacity="0.4"/>
    <text x="150" y="230" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">1µs 一拍</text>
  </g>

  <!-- ===== 阶段 ②：过 CCR 翻转 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <line x1="250" y1="80" x2="250" y2="345" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="250" cy="320" r="9" fill="none" stroke="#d97706" stroke-width="3"/>
    <text x="262" y="272" font-size="12" font-weight="bold" fill="#d97706">翻转点：OC 由高变低</text>
  </g>

  <!-- ===== 阶段 ③：到 ARR 归零 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <line x1="390" y1="80" x2="390" y2="345" stroke="#3eaf7c" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="390" cy="80" r="9" fill="none" stroke="#3eaf7c" stroke-width="3"/>
    <text x="404" y="72" font-size="12" font-weight="bold" fill="#1a7f56">CNT=ARR=999 → 归零，一周期 1000 拍</text>
  </g>

  <!-- ===== 阶段 ④：改 CCR=250，频率不变 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <line x1="110" y1="200" x2="700" y2="200" stroke="#d97706" stroke-width="2" stroke-dasharray="8 4">
      <!-- 写 CCR 这个动作：比较门限从 500 那条线滑到 250，占空比是"被写出来"的 -->
      <animate attributeName="y1" values="160;160;200;200" keyTimes="0;0.75;0.8;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="160;160;200;200" keyTimes="0;0.75;0.8;1" dur="12s" repeatCount="indefinite"/>
    </line>
    <text x="660" y="222" font-size="12" font-weight="bold" fill="#d97706" text-anchor="end">新 CCR=250</text>
    <polyline points="110,305 180,305 180,335 390,335 390,305 460,305 460,335 670,335" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="112" y="368" font-size="12" font-weight="bold" fill="#d97706">虚线 OC：占空比 = 250/1000 = 25%，周期仍 1000 拍</text>
  </g>

  <!-- ===== 阶段字幕 ===== -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="438">① 计数：84MHz÷(83+1)=1MHz，CNT 每 1µs 涨一拍</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="438">② 比较：CNT 越过 CCR=500，OC 由高翻低——占空比的"开关点"</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="438">③ 归零：CNT 到 ARR=999 触发更新事件，周期 1000 拍 = 1ms → f = 1kHz</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="438">④ 改 CCR=250：占空比变 25%，频率纹丝不动——占空比和频率分家</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,434)" fill="#3451b2">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>
