<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI','Microsoft YaHei',sans-serif" role="img" aria-label="E05 接线与事务：PB6/PB7 接 AT24C02，SCL/SDA 各 4.7kΩ 上拉，分析仪 CH0 接 SDA、CH1 接 SCL；写事务 S 0xA0 A 0x10 A 0x5A A P，读事务 S 0xA0 A 0x10 A Sr 0xA1 A 0x5A N P">
  <rect width="720" height="420" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#3451b2">E05 接线与事务：把 0x5A 写进 0x10，再读回来</text>
  <text x="24" y="50" font-size="12" fill="#666">SCL/SDA 都是开漏，只能拉低，高电平全靠上拉；分析仪两根探针并在总线上旁听，GND 共地</text>

  <!-- 3V3 轨 -->
  <path d="M110 96 V78 H615 V96" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="72" font-size="12" fill="#c0392b">3V3</text>

  <!-- 上拉电阻 -->
  <line x1="300" y1="78" x2="300" y2="86" stroke="#333" stroke-width="2"/>
  <rect x="294" y="86" width="12" height="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="112" x2="300" y2="132" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="78" x2="330" y2="86" stroke="#333" stroke-width="2"/>
  <rect x="324" y="86" width="12" height="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M330 112 V126 A6 6 0 0 1 330 138 V156" fill="none" stroke="#333" stroke-width="2"/>
  <text x="344" y="104" font-size="12" fill="#333">上拉 4.7kΩ ×2</text>
  <text x="344" y="120" font-size="12" fill="#666">（模块自带则免）</text>

  <!-- 霸天虎 -->
  <rect x="30" y="96" width="160" height="100" fill="#fff" stroke="#3451b2" stroke-width="2" rx="8"/>
  <text x="110" y="116" font-size="13" font-weight="bold" fill="#3451b2" text-anchor="middle">霸天虎 F407</text>
  <text x="180" y="136" font-size="12" fill="#333" text-anchor="end" font-family="Consolas,monospace">PB6 SCL</text>
  <text x="180" y="160" font-size="12" fill="#333" text-anchor="end" font-family="Consolas,monospace">PB7 SDA</text>
  <text x="180" y="186" font-size="12" fill="#333" text-anchor="end" font-family="Consolas,monospace">GND</text>

  <!-- AT24C02 -->
  <rect x="540" y="96" width="150" height="100" fill="#fff" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="615" y="116" font-size="13" font-weight="bold" fill="#a16207" text-anchor="middle">AT24C02 模块</text>
  <text x="550" y="136" font-size="12" fill="#333">SCL</text>
  <text x="550" y="160" font-size="12" fill="#333">SDA</text>
  <text x="550" y="186" font-size="12" fill="#333">GND</text>
  <text x="600" y="150" font-size="12" fill="#666">A2~A0 接地</text>
  <text x="600" y="168" font-size="12" fill="#666">→ 地址 0x50</text>

  <!-- 总线 -->
  <line x1="190" y1="132" x2="540" y2="132" stroke="#3451b2" stroke-width="2"/>
  <line x1="190" y1="156" x2="540" y2="156" stroke="#1a7f56" stroke-width="2"/>
  <line x1="190" y1="182" x2="540" y2="182" stroke="#333" stroke-width="2" stroke-dasharray="6 3"/>
  <circle cx="300" cy="132" r="3.5" fill="#333"/>
  <circle cx="330" cy="156" r="3.5" fill="#333"/>

  <!-- 分析仪探针 -->
  <circle cx="440" cy="132" r="5" fill="#3eaf7c"/>
  <text x="448" y="126" font-size="12" fill="#1a7f56">分析仪 CH1</text>
  <circle cx="440" cy="156" r="5" fill="#3eaf7c"/>
  <text x="448" y="150" font-size="12" fill="#1a7f56">分析仪 CH0</text>
  <circle cx="440" cy="182" r="5" fill="#3eaf7c"/>
  <text x="448" y="176" font-size="12" fill="#1a7f56">分析仪 GND</text>
  <!-- 图例 -->
  <rect x="30" y="212" width="14" height="14" fill="#e8edfb" stroke="#3451b2"/>
  <text x="50" y="224" font-size="12" fill="#333">主机驱动 SDA</text>
  <rect x="150" y="212" width="14" height="14" fill="#e6f6ee" stroke="#3eaf7c"/>
  <text x="170" y="224" font-size="12" fill="#333">从机驱动 SDA</text>
  <text x="280" y="224" font-size="12" fill="#666">A = ACK（第 9 位拉低）　N = NACK（主机放手不拉）</text>

  <!-- 写事务 -->
  <text x="30" y="250" font-size="13" font-weight="bold" fill="#3451b2">写事务（复位后只写一次）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="258" width="40" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="50" y="276" fill="#3451b2">S</text>
    <rect x="70" y="258" width="80" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="110" y="276" fill="#3451b2">0xA0</text>
    <rect x="150" y="258" width="30" height="26" fill="#e6f6ee" stroke="#3eaf7c"/><text x="165" y="276" fill="#1a7f56">A</text>
    <rect x="180" y="258" width="80" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="220" y="276" fill="#3451b2">0x10</text>
    <rect x="260" y="258" width="30" height="26" fill="#e6f6ee" stroke="#3eaf7c"/><text x="275" y="276" fill="#1a7f56">A</text>
    <rect x="290" y="258" width="80" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="330" y="276" fill="#3451b2">0x5A</text>
    <rect x="370" y="258" width="30" height="26" fill="#e6f6ee" stroke="#3eaf7c"/><text x="385" y="276" fill="#1a7f56">A</text>
    <rect x="400" y="258" width="40" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="420" y="276" fill="#3451b2">P</text>
    <text x="110" y="300" fill="#666">0x50 + 写</text>
    <text x="220" y="300" fill="#666">字地址</text>
    <text x="330" y="300" fill="#666">数据</text>
  </g>
  <text x="456" y="270" font-size="12" fill="#a16207">STOP 后芯片内部擦写约数 ms，</text>
  <text x="456" y="286" font-size="12" fill="#a16207">期间对地址不应答 → ACK polling</text>

  <!-- 读事务 -->
  <text x="30" y="330" font-size="13" font-weight="bold" fill="#3451b2">读事务（随机读：先"假写"定位，再重复 START 转向读）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="338" width="40" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="50" y="356" fill="#3451b2">S</text>
    <rect x="70" y="338" width="80" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="110" y="356" fill="#3451b2">0xA0</text>
    <rect x="150" y="338" width="30" height="26" fill="#e6f6ee" stroke="#3eaf7c"/><text x="165" y="356" fill="#1a7f56">A</text>
    <rect x="180" y="338" width="80" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="220" y="356" fill="#3451b2">0x10</text>
    <rect x="260" y="338" width="30" height="26" fill="#e6f6ee" stroke="#3eaf7c"/><text x="275" y="356" fill="#1a7f56">A</text>
    <rect x="290" y="338" width="50" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="315" y="356" fill="#3451b2">Sr</text>
    <rect x="340" y="338" width="80" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="380" y="356" fill="#3451b2">0xA1</text>
    <rect x="420" y="338" width="30" height="26" fill="#e6f6ee" stroke="#3eaf7c"/><text x="435" y="356" fill="#1a7f56">A</text>
    <rect x="450" y="338" width="80" height="26" fill="#e6f6ee" stroke="#3eaf7c"/><text x="490" y="356" fill="#1a7f56">0x5A</text>
    <rect x="530" y="338" width="30" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="545" y="356" fill="#c0392b">N</text>
    <rect x="560" y="338" width="40" height="26" fill="#e8edfb" stroke="#3451b2"/><text x="580" y="356" fill="#3451b2">P</text>
    <text x="110" y="380" fill="#666">0x50 + 写</text>
    <text x="220" y="380" fill="#666">字地址</text>
    <text x="315" y="380" fill="#666">重复起始</text>
    <text x="380" y="380" fill="#666">0x50 + 读</text>
    <text x="490" y="380" fill="#666">EEPROM 回数据</text>
  </g>
  <text x="30" y="406" font-size="12" fill="#666">地址字节 = (0x50 &lt;&lt; 1) | 方向位：写 0xA0、读 0xA1；解码器显示 0x50 只是报了 7 位地址</text>
</svg>
