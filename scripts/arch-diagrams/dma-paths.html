<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMA 转运通路：外设、流、内存各管一段</title>
<style>
:root {
  color-scheme: light;
  --color-paper:   oklch(98.5% 0.004 250);
  --color-paper-2: oklch(96.5% 0.005 252);
  --color-rule:    oklch(93% 0.007 255);
  --color-rule-2:  oklch(83% 0.011 255);
  --color-muted:   oklch(56% 0.013 255);
  --color-neutral: oklch(46% 0.015 255);
  --color-ink-2:   oklch(34% 0.018 257);
  --color-ink:     oklch(24% 0.020 258);
  --color-accent:  oklch(58% 0.20 256);
  --color-graphite:oklch(24% 0.018 260);
  --color-g1:      oklch(68% 0.15 55);
  --color-g1-soft: oklch(78% 0.12 55);
  --color-g1-ink:  oklch(52% 0.14 50);
  --color-g1-tint: oklch(96.5% 0.015 60 / .5);
  --color-accent-soft: oklch(58% 0.20 256 / .45);
  --color-accent-tint: oklch(97% 0.012 256 / .5);
  --font-display: "Geist", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Microsoft YaHei", "Noto Sans CJK SC", ui-monospace, Menlo, monospace;
  --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --radius-card: 10px; --radius-tile: 12px;
  --color-veil: oklch(98.5% 0.004 250 / .78);
}
[data-theme="dark"] { color-scheme: dark; }
@font-face { font-family:"Geist"; font-style:normal; font-weight:100 900; font-display:swap;
  src:url(data:font/woff2;base64,%%FONT_DISPLAY%%) format("woff2"); }
@font-face { font-family:"JetBrains Mono"; font-style:normal; font-weight:100 800; font-display:swap;
  src:url(data:font/woff2;base64,%%FONT_JBM%%) format("woff2"); }
.kicker, .node .role, .el, .legend, .foot { letter-spacing: 0.04em; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { overflow-x: clip; }
body { background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); padding: var(--space-xl) var(--space-lg) var(--space-2xl); }
.page { width: fit-content; max-width: 100%; margin: 0 auto; }
.head { display:grid; grid-template-columns: 1fr auto; gap: var(--space-lg); align-items:end;
  padding-bottom: var(--space-md); border-bottom: 1px solid var(--color-rule-2); margin-bottom: var(--space-lg); }
.kicker { font-family: var(--font-mono); font-size: 11px; color: var(--color-accent); margin-bottom: var(--space-sm); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 4vw, 30px); letter-spacing: -0.005em; line-height: 1.2; }
.lede { max-width: 300px; font-size: 12px; line-height: 1.7; color: var(--color-neutral); padding-bottom: 2px; }
@media (max-width: 680px) { .head { grid-template-columns: 1fr; align-items:start; } .lede { max-width:none; } }
.scroller { overflow-x: auto; border: 1px solid var(--color-rule-2); border-radius: var(--radius-card); }
.canvas { position: relative; width: 1020px; height: 480px; background: var(--color-paper);
  background-image:
    linear-gradient(var(--color-rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--color-rule) 1px, transparent 1px);
  background-size: 24px 24px; background-position: -1px -1px; }
.group { position:absolute; border-radius: var(--radius-tile); }
.g-label { position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:6px;
  font-family: var(--font-display); font-size: 12px; font-weight: 600; color: var(--color-neutral); white-space: nowrap; }
.g-label img { width: 14px; height: 14px; }
.group.ga { border:1.5px solid var(--color-g1); background: var(--color-g1-tint); }
.group.ga > .g-label { color: var(--color-g1-ink); }
.group.gb { border:1.5px solid var(--color-accent-soft); background: var(--color-accent-tint); }
.group.gb > .g-label { color: var(--color-accent); }
.node { position:absolute; width:132px; text-align:center; }
.tile { width:60px; height:60px; margin:0 auto; border-radius: var(--radius-tile);
  background:#fff; border:1px solid var(--color-rule-2); display:grid; place-items:center;
  box-shadow: 0 1px 2px oklch(24% 0.02 258 / 0.05); }
.tile img { width:34px; height:34px; object-fit:contain; }
.node .name { font-family: var(--font-display); font-weight:600; font-size:13px; margin-top: var(--space-sm); letter-spacing:0; }
.node .role { font-family: var(--font-mono); font-size:9.5px; color: var(--color-muted); margin-top:2px; }
.node .name span, .node .role span { background: var(--color-veil); padding: 0 var(--space-xs); border-radius: 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
svg.edges { position:absolute; inset:0; width:1020px; height:480px; pointer-events:none; }
.e  { stroke: var(--color-accent); stroke-width:1.6; fill:none; }
.n  { stroke: var(--color-neutral); stroke-width:1.4; fill:none; }
.dash { stroke-dasharray:4 5; }
.el { font-family: var(--font-mono); font-size:10.5px; fill: var(--color-neutral);
  paint-order: stroke; stroke: var(--color-paper); stroke-width:4px; stroke-linejoin:round; }
.el.a { fill: var(--color-accent); }
.legend { display:flex; gap: var(--space-lg); align-items:center; margin-top: var(--space-md);
  font-family: var(--font-mono); font-size:10px; color: var(--color-muted); flex-wrap:wrap; }
.legend .sw { display:inline-block; width:30px; vertical-align:middle; margin-right:6px; border-top:1.6px solid var(--color-accent); }
.foot { margin-top: var(--space-xl); padding-top: var(--space-md); border-top: 1px solid var(--color-rule-2);
  display:flex; justify-content:space-between; gap: var(--space-md); flex-wrap:wrap;
  font-family: var(--font-mono); font-size:10px; color: var(--color-muted); }
.foot a { color: inherit; text-decoration-color: var(--color-rule-2); text-underline-offset: 2px; }
</style>
</head>
<body>
<div class="page">

  <header class="head">
    <div>
      <div class="kicker">御舆 MCU 书 · S8 DMA · 配图</div>
      <h1>DMA 转运通路：外设、流、内存各管一段</h1>
    </div>
    <p class="lede">外设固定、内存自增，NDTR 倒数到零敲个铃；DMA 只管搬，不替你还债。</p>
  </header>

  <div class="scroller">
  <div class="canvas">

    <!-- GROUPS -->
    <div class="group ga" style="left:20px; top:80px; width:220px; height:210px;">
      <div class="g-label"><img src="%%ICON_cpu%%" alt="">外设侧 · 固定地址</div>
    </div>
    <div class="group gb" style="left:300px; top:80px; width:420px; height:210px;">
      <div class="g-label"><img src="%%ICON_workflow%%" alt="">DMA 控制器 · 8 流 × 8 通道</div>
    </div>
    <div class="group ga" style="left:780px; top:80px; width:220px; height:210px;">
      <div class="g-label"><img src="%%ICON_database%%" alt="">内存侧 · 自增</div>
    </div>

    <!-- EDGES -->
    <svg class="edges" viewBox="0 0 1020 480" aria-hidden="true">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/>
        </marker>
      </defs>
      <path class="e" d="M164 170 H366" marker-end="url(#ar)"/>
      <text class="el a" x="265" y="162" text-anchor="middle">请求</text>
      <path class="e" d="M466 170 H576" marker-end="url(#ar)"/>
      <path class="e" d="M676 170 H856" marker-end="url(#ar)"/>
      <text class="el a" x="766" y="162" text-anchor="middle">转运</text>
    </svg>

    <!-- NODES -->
    <div class="node" style="left:64px;top:140px">
      <div class="tile"><img src="%%ICON_cpu%%" alt=""></div>
      <div class="name"><span>USART_TX 等</span></div><div class="role"><span>外设固定 · 不自增</span></div>
    </div>
    <div class="node" style="left:334px;top:140px">
      <div class="tile"><img src="%%ICON_list-tree%%" alt=""></div>
      <div class="name"><span>流 × 通道</span></div><div class="role"><span>选定流和通道</span></div>
    </div>
    <div class="node" style="left:544px;top:140px">
      <div class="tile"><img src="%%ICON_binary%%" alt=""></div>
      <div class="name"><span>NDTR 计数器</span></div><div class="role"><span>倒数到零 · 敲铃 TC</span></div>
    </div>
    <div class="node" style="left:824px;top:140px">
      <div class="tile"><img src="%%ICON_database%%" alt=""></div>
      <div class="name"><span>SRAM 缓冲</span></div><div class="role"><span>内存自增</span></div>
    </div>
  </div>
  </div>

  <div class="legend">
    <span><span class="sw"></span>数据转运主路</span>
  </div>

  <div class="foot">
    <span>Boot 引脚决定 0 号地址是谁：Flash 还是系统存储器</span>
    <span>icons: Lucide · made with <a href="https://github.com/caru-ini/stack-diagram" target="_blank" rel="noopener">stack-diagram</a></span>
  </div>

</div>
</body>
</html>
