<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>cover</title>
<style>
:root {
  --paper: #f7f8fa;
  --ink: #16213a;
  --muted: #6b7280;
  --accent: #3451b2;   /* 站点动画主色 */
  --ok: #3eaf7c;       /* 站点强调绿 */
  --warn: #d97706;     /* 站点警示橙 */
  --rule: #d5d9e0;
  --mono: "JetBrains Mono", Consolas, "Microsoft YaHei", monospace;
  --disp: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#e8eaee; font-family: var(--disp); padding:40px; display:flex; flex-direction:column; gap:40px; align-items:center; }

.poster { width:750px; height:1000px; background:var(--paper); position:relative;
  padding:72px 64px 56px; display:flex; flex-direction:column;
  box-shadow:0 8px 30px rgba(22,33,58,.14); }
.poster .corner { position:absolute; width:18px; height:18px; }
.poster .corner::before, .poster .corner::after { content:""; position:absolute; background:var(--ink); }
.poster .corner::before { width:18px; height:1.5px; }
.poster .corner::after { width:1.5px; height:18px; }
.c-tl { top:28px; left:28px; } .c-tr { top:28px; right:28px; transform:scaleX(-1); }
.c-bl { bottom:28px; left:28px; transform:scaleY(-1); } .c-br { bottom:28px; right:28px; transform:scale(-1); }

.kicker { font-family:var(--mono); font-size:15px; letter-spacing:.14em; color:var(--accent); font-weight:700; }
.kicker .no { color:var(--muted); }
.hr { height:1.5px; background:var(--ink); margin:26px 0 0; }
.hr.thin { height:1px; background:var(--rule); }

.giant { font-size:76px; font-weight:900; line-height:1.16; letter-spacing:.01em; color:var(--ink); margin-top:44px; }
.giant .em { color:var(--accent); }
.giant.small { font-size:64px; }

.quote { margin-top:40px; font-size:27px; line-height:1.72; color:var(--ink); font-weight:600; }
.quote .hl { background:linear-gradient(transparent 62%, rgba(52,81,178,.22) 0); }

.rows { margin-top:auto; }
.row { display:flex; align-items:baseline; gap:18px; padding:17px 0; border-top:1px solid var(--rule); }
.row:first-child { border-top:1.5px solid var(--ink); }
.row .mark { font-family:var(--mono); font-weight:700; font-size:24px; width:36px; flex:none; }
.row .mark.yes { color:var(--ok); } .row .mark.no { color:var(--warn); }
.row .t { font-size:24px; font-weight:700; color:var(--ink); }
.row .d { font-size:17px; color:var(--muted); margin-left:auto; font-weight:400; }

.foot { margin-top:34px; display:flex; justify-content:space-between; align-items:baseline;
  font-family:var(--mono); font-size:14px; color:var(--muted); letter-spacing:.08em; }
.foot .brand { color:var(--accent); font-weight:700; }

/* B站 16:9 封面 */
.cover16 { width:1280px; height:720px; background:var(--paper); position:relative; padding:64px 72px;
  display:flex; flex-direction:column; box-shadow:0 8px 30px rgba(22,33,58,.14); }
.cover16 .grid-bg { position:absolute; inset:0;
  background-image:linear-gradient(rgba(52,81,178,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(52,81,178,.055) 1px, transparent 1px);
  background-size:64px 64px; }
.cover16 > * { position:relative; }
.cv-top { display:flex; justify-content:space-between; font-family:var(--mono); font-size:16px; font-weight:700; letter-spacing:.14em; }
.cv-top .l { color:var(--ink); } .cv-top .r { color:var(--accent); }
.cv-title { font-size:96px; font-weight:900; line-height:1.12; color:var(--ink); margin-top:64px; letter-spacing:.01em; }
.cv-title .em { color:var(--accent); }
.cv-sub { margin-top:30px; display:flex; align-items:center; gap:20px; }
.cv-sub .bar { width:56px; height:6px; background:var(--accent); flex:none; }
.cv-sub .t { font-size:30px; font-weight:600; color:var(--ink); }
.cv-foot { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; }
.cv-foot .badges { display:flex; gap:12px; }
.cv-foot .badge { font-family:var(--mono); font-size:15px; font-weight:700; color:var(--ink);
  border:1.5px solid var(--ink); padding:8px 16px; letter-spacing:.06em; }
.cv-foot .badge.solid { background:var(--accent); border-color:var(--accent); color:#fff; }
.cv-foot .src { font-family:var(--mono); font-size:15px; color:var(--muted); letter-spacing:.06em; }
</style>
</head>
<body style="padding:0;background:#f7f8fa;">

<div class="cover16" id="cover-c3-bili">
  <div class="grid-bg"></div>
  <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span>
  <div class="cv-top"><span class="l">御舆视频 · C3</span><span class="r">通往单片机之路</span></div>
  <div class="cv-title">你的 <span class="em">volatile</span><br>白加了？</div>
  <div class="cv-sub"><span class="bar"></span><span class="t">一条 testb 的轮询，和六个变体的顺序</span></div>
  <div class="cv-foot">
    <div class="badges"><span class="badge solid">-O2 实测</span><span class="badge">六变体对照</span><span class="badge">两套工具链取证</span></div>
    <span class="src">寄存器级 · 代码可复现</span>
  </div>
</div>
</body>
</html>
