# Ruff 配置：只启用「能抓到真错误」的规则。
#
# 为什么不启用格式化与行长类规则：
#   1. E501 按**字符数**算行长，而中文注释一个字符占两列宽，按字符数卡长度
#      会逼着人把中文注释砍成半句——尺度本身失真。
#   2. `ruff format` 会把 mcu-book/build_html.py 里对齐的注释表打散，
#      那种对齐表（位域/寄存器说明）本身就是给人读的。
#
# 选用范围（与姊妹项目 BMS-Z 同口径）：
#   E4  import 相关错误        E7  语句级陷阱
#   E9  运行时错误（含语法）   F   pyflakes：未定义名、未用导入/变量
#   B   flake8-bugbear：可变默认参数、可疑比较等真 bug
#   UP  pyupgrade：过时写法    W605 非 raw 字符串里的无效转义
# 不纳入本门的目录，两条都要有理由，不许"跑红了就排除"：
#   .trellis/  —— Trellis 框架自己托管并会随 `trellis update` 覆盖的脚本，
#                 不属于本仓库维护面对；把它们纳入只会让升级永远撞红。
#   video/    —— 视频流水线正在另一个在途任务（feat/video-v2-remaster）手里改，
#                 本任务不碰它的源码；唯一的 B905 需要改运行时行为（zip strict），
#                 那要连同渲染回归一起评估，留给视频任务处理。
extend-exclude = [".trellis", "video"]

[lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "UP",
  "W605",
]