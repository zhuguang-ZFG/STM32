<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI','Microsoft YaHei',sans-serif" role="img" aria-label="霸天虎 RGB 灯共阳接法：3V3 经 LED 和限流电阻接到 PF6/PF7/PF8，引脚拉低才点亮">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#3eaf7c"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#3451b2">霸天虎 RGB 灯原理：共阳接法，低电平点亮</text>
  <text x="24" y="50" font-size="12" fill="#666">三路结构相同：3V3 → LED → 限流电阻 → GPIO。引脚拉低才有电流，所以写 0 亮、写 1 灭</text>

  <!-- 3V3 竖轨 -->
  <line x1="70" y1="88" x2="70" y2="232" stroke="#d97706" stroke-width="3"/>
  <text x="70" y="80" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">3V3</text>

  <!-- 第 1 路：红（主角） -->
  <g>
    <line x1="70" y1="110" x2="124" y2="110" stroke="#333" stroke-width="2"/>
    <polygon points="124,96 124,124 152,110" fill="none" stroke="#c0392b" stroke-width="2"/>
    <line x1="152" y1="96" x2="152" y2="124" stroke="#c0392b" stroke-width="2"/>
    <line x1="140" y1="92" x2="152" y2="80" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="150" y1="96" x2="162" y2="84" stroke="#c0392b" stroke-width="1.5"/>
    <text x="138" y="140" font-size="12" fill="#c0392b" text-anchor="middle">LED_R</text>
    <line x1="152" y1="110" x2="206" y2="110" stroke="#333" stroke-width="2"/>
    <rect x="206" y="100" width="56" height="20" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="234" y="94" font-size="12" fill="#333" text-anchor="middle">R 限流</text>
    <line x1="262" y1="110" x2="440" y2="110" stroke="#333" stroke-width="2"/>
    <circle cx="440" cy="110" r="4" fill="#3451b2"/>
  </g>
  <!-- 电流路径 -->
  <line x1="180" y1="150" x2="428" y2="150" stroke="#3eaf7c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="300" y="144" font-size="12" fill="#1a7f56" text-anchor="middle">PF6=0：电流流过 LED 和 R，灌入引脚</text>

  <!-- 第 2、3 路：绿 / 蓝（结构相同，淡显） -->
  <g opacity="0.55">
    <line x1="70" y1="180" x2="124" y2="180" stroke="#333" stroke-width="2"/>
    <polygon points="124,166 124,194 152,180" fill="none" stroke="#1a7f56" stroke-width="2"/>
    <line x1="152" y1="166" x2="152" y2="194" stroke="#1a7f56" stroke-width="2"/>
    <text x="138" y="210" font-size="12" fill="#1a7f56" text-anchor="middle">LED_G</text>
    <line x1="152" y1="180" x2="206" y2="180" stroke="#333" stroke-width="2"/>
    <rect x="206" y="170" width="56" height="20" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="262" y1="180" x2="440" y2="180" stroke="#333" stroke-width="2"/>
    <circle cx="440" cy="180" r="4" fill="#3451b2"/>

    <line x1="70" y1="230" x2="124" y2="230" stroke="#333" stroke-width="2"/>
    <polygon points="124,216 124,244 152,230" fill="none" stroke="#3451b2" stroke-width="2"/>
    <line x1="152" y1="216" x2="152" y2="244" stroke="#3451b2" stroke-width="2"/>
    <text x="138" y="262" font-size="12" fill="#3451b2" text-anchor="middle">LED_B</text>
    <line x1="152" y1="230" x2="206" y2="230" stroke="#333" stroke-width="2"/>
    <rect x="206" y="220" width="56" height="20" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="262" y1="230" x2="440" y2="230" stroke="#333" stroke-width="2"/>
    <circle cx="440" cy="230" r="4" fill="#3451b2"/>
  </g>

  <!-- MCU -->
  <rect x="440" y="76" width="250" height="180" fill="#fff" stroke="#3451b2" stroke-width="2" rx="8"/>
  <text x="565" y="98" font-size="13" fill="#3451b2" text-anchor="middle" font-weight="bold">STM32F407ZGT6</text>
  <text x="454" y="115" font-size="12" fill="#c0392b" font-family="Consolas,monospace">PF6  红</text>
  <text x="454" y="185" font-size="12" fill="#1a7f56" font-family="Consolas,monospace">PF7  绿</text>
  <text x="454" y="235" font-size="12" fill="#3451b2" font-family="Consolas,monospace">PF8  蓝</text>
  <text x="560" y="140" font-size="12" fill="#666">输出 0 → 亮</text>
  <text x="560" y="158" font-size="12" fill="#666">输出 1 → 灭</text>

  <!-- 两种写法 -->
  <text x="70" y="290" font-size="12" fill="#333" font-family="Consolas,monospace">GPIOF-&gt;BSRR = 1u &lt;&lt; (6 + 16);  // 高 16 位：PF6 → 0 → 亮</text>
  <text x="70" y="308" font-size="12" fill="#333" font-family="Consolas,monospace">GPIOF-&gt;BSRR = 1u &lt;&lt; 6;         // 低 16 位：PF6 → 1 → 灭</text>

  <!-- 结论条 -->
  <rect x="60" y="320" width="600" height="28" fill="#fdf0d5" stroke="#d97706" rx="6"/>
  <text x="360" y="339" font-size="13" fill="#a16207" text-anchor="middle">口诀：共阳灯，反着点 —— 拉低 = 亮，拉高 = 灭；三色同时拉低混出白光</text>
</svg>
