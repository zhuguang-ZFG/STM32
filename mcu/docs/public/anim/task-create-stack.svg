<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>任务创建：栈与 TCB 的出生证</title>
  <desc>四阶段动画：xTaskCreate 先分栈再分 TCB；pxPortInitialiseStack 把新栈伪装成"刚被中断打断"的异常现场（xPSR=0x01000000、PC=任务函数、LR=prvTaskExitError、r0=任务参数）；TCB 挂进就绪链表；第一次 PendSV 弹栈，弹出来的就是任务开始跑。</desc>
  <rect width="720" height="440" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">任务创建：新栈化个"中断妆"，一弹栈任务就出生</text>
  <text x="24" y="50" font-size="12" fill="#666">FreeRTOS V11.1.0 · tasks.c:1718 xTaskCreate → port.c:202 pxPortInitialiseStack · 栈深单位是字（uint32_t）</text>

  <!-- ===== 左：新栈（化妆后的异常现场） ===== -->
  <rect x="30" y="70" width="330" height="300" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="46" y="92" font-size="13" font-weight="bold" fill="#3451b2">新任务的栈（向下生长）</text>
  <text x="330" y="92" font-size="11" fill="#888" text-anchor="end">高地址 ↑</text>

  <g font-size="11" font-family="Consolas,monospace">
    <rect x="56" y="102" width="220" height="24" fill="#dbe7ff" stroke="#3451b2" rx="3"/>
    <text x="64" y="119" fill="#3451b2">xPSR = 0x01000000</text>
    <text x="286" y="119" fill="#888" text-anchor="end" font-size="11">Thumb 位</text>

    <rect x="56" y="128" width="220" height="24" fill="#dbe7ff" stroke="#3451b2" rx="3"/>
    <text x="64" y="145" fill="#3451b2">PC = 任务函数</text>
    <text x="286" y="145" fill="#888" text-anchor="end" font-size="11">从这里开始跑</text>

    <rect x="56" y="154" width="220" height="24" fill="#ffffff" stroke="#d97706" rx="3"/>
    <text x="64" y="171" fill="#d97706">LR = prvTaskExitError</text>
    <text x="286" y="171" fill="#888" text-anchor="end" font-size="11">不许 return</text>

    <rect x="56" y="180" width="220" height="24" fill="#ffffff" stroke="#94a3b8" rx="3"/>
    <text x="64" y="197" fill="#666">r12, r3, r2, r1</text>

    <rect x="56" y="206" width="220" height="24" fill="#dbe7ff" stroke="#3eaf7c" rx="3"/>
    <text x="64" y="223" fill="#3eaf7c">r0 = pvParameters</text>
    <text x="286" y="223" fill="#888" text-anchor="end" font-size="11">任务参数</text>

    <rect x="56" y="232" width="220" height="24" fill="#ffffff" stroke="#94a3b8" rx="3"/>
    <text x="64" y="249" fill="#666">r11 … r4</text>
  </g>
  <!-- SP 指向最低 -->
  <text x="56" y="280" font-size="12" font-weight="bold" fill="#d97706">SP ↓（弹栈方向 ↓ 恢复现场）</text>
  <text x="56" y="300" font-size="11" fill="#666">第一次 PendSV 从这开始弹：xPSR/PC/LR/r12/r3-r0/r11-r4</text>
  <text x="56" y="322" font-size="11" fill="#666">弹完 PC=任务函数 → 任务"出生"</text>

  <!-- ===== 右：TCB ===== -->
  <rect x="390" y="70" width="300" height="180" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="406" y="92" font-size="13" font-weight="bold" fill="#3451b2">TCB（tskTCB，tasks.c:358）</text>
  <g font-size="11" font-family="Consolas,monospace">
    <rect x="410" y="102" width="260" height="24" fill="#dbe7ff" stroke="#3451b2" rx="3"/>
    <text x="418" y="119" fill="#3451b2">pxTopOfStack  ← 必须排第一</text>
    <rect x="410" y="128" width="260" height="22" fill="#ffffff" stroke="#94a3b8" rx="3"/>
    <text x="418" y="144" fill="#666">xStateListItem / xEventListItem</text>
    <rect x="410" y="152" width="260" height="22" fill="#ffffff" stroke="#94a3b8" rx="3"/>
    <text x="418" y="168" fill="#666">uxPriority（数值越大越高）</text>
    <rect x="410" y="176" width="260" height="22" fill="#ffffff" stroke="#94a3b8" rx="3"/>
    <text x="418" y="192" fill="#666">pxStack（栈底，溢出检查用）</text>
    <rect x="410" y="200" width="260" height="22" fill="#ffffff" stroke="#94a3b8" rx="3"/>
    <text x="418" y="216" fill="#666">pcTaskName</text>
  </g>
  <text x="406" y="244" font-size="11" fill="#666">切换器拿到 TCB，第一个字就是栈顶——其余布局不用管</text>

  <!-- 就绪链表 -->
  <rect x="390" y="268" width="300" height="102" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="406" y="290" font-size="13" font-weight="bold" fill="#3451b2">就绪货架 pxReadyTasksLists[]</text>
  <text x="406" y="312" font-size="11" fill="#666">按优先级分格的链表数组</text>
  <text x="406" y="332" font-size="11" fill="#666">创建 = 挂进对应优先级链表的尾巴</text>
  <text x="406" y="352" font-size="11" fill="#666">同级任务在时间片里轮转</text>

  <!-- SP 指针：化妆时往下走，第一次 PendSV 弹栈时往上退 -->
  <g transform="translate(0,0)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,0;0,142;0,142;0,0" keyTimes="0;0.25;0.5;0.75;1"
      dur="12s" repeatCount="indefinite"/>
    <path d="M312,108 L296,114 L312,120 Z" fill="#d97706"/>
    <text x="318" y="118" font-size="11" font-weight="bold" font-family="Consolas,monospace" fill="#d97706">SP</text>
  </g>

  <!-- pxTopOfStack → SP：TCB 的第一个字指向栈顶（阶段③画出来） -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <path d="M408,114 C390,114 378,120 378,138 L378,236 C378,252 368,256 350,256 L330,256"
      fill="none" stroke="#d97706" stroke-width="2" pathLength="1000" stroke-dasharray="1000">
      <animate attributeName="stroke-dashoffset" values="1000;1000;0;0" keyTimes="0;0.5;0.62;1" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="400">① 分栈 + 分 TCB：栈深按字不按字节，传 128 是 512 字节</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="400">② 化妆：把异常现场摆进新栈——xPSR 的 Thumb 位必须是 1</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="400">③ TCB 初始化 + 挂进就绪链表对应优先级的尾巴</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="400">④ 第一次 PendSV 弹栈：弹出来的 PC 就是任务函数——任务出生</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,392)" fill="#3451b2">
    <circle cx="0" cy="0" r="5" opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>