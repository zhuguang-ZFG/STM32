<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>DMA 环形缓冲：NDTR 倒数与生产者追上消费者</title>
  <desc>四阶段动画：64 字节环形缓冲，DMA 写指针绕圈，NDTR 从 64 倒数到 0 自动回装；HTIF 在半圈敲铃、TCIF 在整圈敲铃；CPU 读指针跟不上时旧数据被新数据覆盖——环形模式不防丢，消费必须跟上生产。蓝色搬运指针 8s 爬完一整圈（=一圈 NDTR），跑道左边写满右边回绕，两个指针同向跑，才看得见"生产追上消费"这件事。</desc>
  <rect width="720" height="440" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">DMA 环形缓冲：跑道上一圈 64 格，生产者不停，消费者别掉队</text>
  <text x="24" y="50" font-size="12" fill="#666">NDTR 倒数到 0 自动回装 · HTIF 半圈敲铃 / TCIF 整圈敲铃 · 生产追上消费 = 覆盖</text>

  <!-- ===== 环形跑道 ===== -->
  <rect x="40" y="80" width="640" height="150" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="56" y="102" font-size="13" font-weight="bold" fill="#3451b2">环形数组 g_rx_buf[64]（画成直线，尾接回头）</text>

  <!-- 跑道格子：64 格缩成 16 段表示 -->
  <g font-size="11" font-family="Consolas,monospace" fill="#888" text-anchor="middle">
    <text x="80"  y="196">0</text><text x="200" y="196">16</text>
    <text x="320" y="196">32</text><text x="440" y="196">48</text>
    <text x="560" y="196">63→0</text>
  </g>
  <rect x="70" y="160" width="580" height="22" fill="#e2e8f0" rx="4"/>
  <!-- 写指针填充条（绕圈两次） -->
  <rect x="70" y="160" width="0" height="22" fill="#d97706" rx="4">
    <animate attributeName="width" calcMode="discrete" values="0;290;580;0;290;580;580;580" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/>
  </rect>
  <!-- 读指针标记 -->
  <rect x="70" y="160" width="6" height="22" fill="#3eaf7c">
    <animate attributeName="x" calcMode="discrete" values="70;70;140;140;220;220;220;220" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/>
  </rect>
  <!-- 搬运指针（DMA）：8s 爬完 580px = 一整圈 64 格，爬到右端就回装再跑第二圈（16s 主循环正好两圈） -->
  <circle cx="70" cy="171" r="6" fill="#3451b2" stroke="#ffffff" stroke-width="2">
    <animate attributeName="cx" values="70;650" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- 追上的一瞬：第二圈跑到读指针所在位置（≈10s，0.625）炸一圈红——覆盖就发生在这半秒 -->
  <circle cx="220" cy="171" r="8" fill="none" stroke="#dc2626" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.6;0.625;0.66;1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="r" values="8;8;22;22;8" keyTimes="0;0.6;0.625;0.66;1" dur="16s" repeatCount="indefinite"/>
  </circle>
  <text x="70" y="150" font-size="11" font-weight="bold" fill="#d97706">写指针（DMA）</text>
  <text x="180" y="150" font-size="11" font-weight="bold" fill="#3eaf7c">读指针（CPU）</text>

  <!-- NDTR 计数牌 -->
  <rect x="400" y="90" width="270" height="56" fill="#ffffff" stroke="#3451b2" rx="6"/>
  <text x="415" y="112" font-size="12" font-weight="bold" fill="#3451b2">NDTR（还要搬几个）</text>
  <!-- 箭头两侧不留空格：14px 等宽在宽字体下会顶到 x=580 的 TCIF 铃铛 -->
  <text x="415" y="132" font-size="14" font-weight="bold" font-family="Consolas,monospace" fill="#d97706">64→32→0→回装 64
    <animate attributeName="opacity" calcMode="discrete" values="1;1;1;1;1;1;1;1" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/>
  </text>

  <!-- ===== 中断铃铛 ===== -->
  <g font-size="18">
    <text x="240" y="126" opacity="0">🔔 HTIF<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;1;0;0;0" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="580" y="126" opacity="0">🔔 TCIF<animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;1;0;0" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/></text>
  </g>

  <!-- ===== 覆盖反例（阶段④点亮） ===== -->
  <rect x="40" y="250" width="640" height="90" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="8" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;1;1;1;1" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;1;1;1;1" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/>
    <text x="56" y="278" font-size="13" font-weight="bold" fill="#dc2626">覆盖反例：写指针绕回起点时，读指针还在半路</text>
    <text x="56" y="300" font-size="12" fill="#dc2626">→ 写指针追上读指针，没读走的旧数据被新数据盖上，静默丢失</text>
    <text x="56" y="322" font-size="12" fill="#666">判据：跟踪"写位置 − 读位置"的差值，差值在涨 = 你在欠债</text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0;0" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/>
      <text x="36" y="392">① DMA 一路写，NDTR 从 64 倒数；CPU 该干嘛干嘛</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0;0" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/>
      <text x="36" y="392">② 写到一半（32）HTIF 敲铃：前半圈可以开始读了——这是 CPU 的处理窗口</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0;0" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/>
      <text x="36" y="392">③ NDTR 到 0 自动回装成 64，写指针绕回起点；TCIF 敲铃：后半圈也满了</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;1;1;1;1" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;1" dur="16s" repeatCount="indefinite"/>
      <text x="36" y="392">④ 环形模式保证"永不停"，不保证"永不丢"——消费速度 ≥ 生产速度是硬约束</text></g>
  </g>

  <!-- 阶段指示点：字幕只有四行，但阶段槽位是 0;0.125;0.25;0.375;1（④独占后半圈），点位照抄槽位 -->
  <g transform="translate(630,414)" fill="#3451b2">
    <circle cx="0" cy="0" r="5" opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.125;0.25;0.375;1" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.125;0.25;0.375;1" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.125;0.25;0.375;1" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;1" keyTimes="0;0.125;0.25;0.375;1" dur="16s" repeatCount="indefinite"/></circle>
  </g>
</svg>