<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440">
  <title>FSM Table-Driven Dispatch via Function Pointers</title>
  <desc>Animation showing how a table-driven finite state machine dispatches actions through function pointers: character classification, table lookup, indirect call via blx r3, and state update.</desc>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3451b2"/>
    </marker>
    <marker id="ahg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#d97706"/>
    </marker>
    <marker id="ahgr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3eaf7c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="440" fill="#f6f8fa"/>

  <!-- Title -->
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2" font-family="sans-serif">FSM Table-Driven Dispatch</text>
  <text x="24" y="50" font-size="12" fill="#666" font-family="sans-serif">Function-pointer dispatch pipeline from table lookup to state transition</text>

  <!-- Stage indicators -->
  <g transform="translate(648,52)">
    <circle cx="0" cy="0" r="5" fill="#3eaf7c">
      <set attributeName="fill" to="#cbd5e1" begin="3s"/>
    </circle>
    <circle cx="16" cy="0" r="5" fill="#cbd5e1">
      <set attributeName="fill" to="#3eaf7c" begin="3s"/>
    </circle>
    <circle cx="32" cy="0" r="5" fill="#cbd5e1">
      <set attributeName="fill" to="#3eaf7c" begin="6s"/>
    </circle>
    <circle cx="48" cy="0" r="5" fill="#cbd5e1">
      <set attributeName="fill" to="#3eaf7c" begin="9s"/>
    </circle>
  </g>

  <!-- ========== STAGE 1: Character Arrival + Classification (0-3s) ========== -->
  <g>
    <set attributeName="opacity" to="0" begin="3s"/>
    <text x="24" y="78" font-size="13" font-weight="bold" fill="#3451b2" font-family="sans-serif">1. Character Arrival + Classification</text>

    <!-- Input character bubble -->
    <rect x="30" y="140" width="44" height="44" rx="8" fill="#dbe7ff" stroke="#3451b2" stroke-width="1.5"/>
    <text x="52" y="169" text-anchor="middle" font-size="22" font-weight="bold" fill="#3451b2" font-family="Consolas,monospace">'R'</text>

    <!-- Flowing character (continuous motion) -->
    <circle r="11" fill="#dbe7ff" stroke="#3451b2" stroke-width="1.5">
      <animateMotion dur="12s" repeatCount="indefinite"
        path="M 52,162 L 110,162 L 110,360 L 180,360 L 180,172 L 605,172"
        keyPoints="0;0.12;0.32;0.52;0.72;1"
        keyTimes="0;0.15;0.35;0.55;0.75;1"
        calcMode="linear"/>
      <set attributeName="opacity" to="0" begin="3s"/>
      <set attributeName="opacity" to="1" begin="12s"/>
    </circle>
    <!-- Arrow to classify -->
    <line x1="78" y1="162" x2="108" y2="162" stroke="#3451b2" stroke-width="1.5" marker-end="url(#ah)"/>

    <!-- classify() box -->
    <rect x="112" y="140" width="82" height="44" rx="6" fill="#ffffff" stroke="#3451b2" stroke-width="1.5"/>
    <text x="153" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#3451b2" font-family="Consolas,monospace">classify()</text>
    <text x="153" y="174" text-anchor="middle" font-size="11" fill="#666" font-family="Consolas,monospace">switch</text>

    <!-- Classification output -->
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="1.5s"/>
      <line x1="153" y1="184" x2="112" y2="220" stroke="#3eaf7c" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ahgr)"/>
      <rect x="36" y="222" width="120" height="26" rx="5" fill="#d8f3e5" stroke="#3eaf7c" stroke-width="1"/>
      <text x="96" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a7f56" font-family="Consolas,monospace">EV_LETTER(0)</text>
    </g>

    <!-- Code snippet -->
    <text x="30" y="210" font-size="11" fill="#888" font-family="Consolas,monospace">// 'R' is alpha -> event index 0</text>
  </g>

  <!-- ========== STAGE 2: Table Lookup (3-6s) ========== -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="3s"/>
    <set attributeName="opacity" to="0" begin="6s"/>

    <text x="24" y="78" font-size="13" font-weight="bold" fill="#3451b2" font-family="sans-serif">2. Table Lookup: FSM[state][event]</text>

    <!-- Row highlight -->
    <rect x="253" y="136" width="342" height="30" fill="#fdf0d5" opacity="0.5"/>
    <!-- Column highlight -->
    <rect x="320" y="108" width="69" height="150" fill="#fdf0d5" opacity="0.3"/>
    <!-- Cell highlight -->
    <rect x="322" y="138" width="65" height="26" fill="#d97706" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="0.8s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="322" y="138" width="65" height="26" fill="none" stroke="#d97706" stroke-width="2.5">
      <animate attributeName="stroke-width" values="2;3.5;2" dur="0.8s" begin="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Annotations -->
    <text x="250" y="159" text-anchor="end" font-size="11" fill="#d97706" font-family="Consolas,monospace" font-weight="bold">state=0</text>
    <text x="354" y="104" text-anchor="middle" font-size="11" fill="#d97706" font-family="Consolas,monospace" font-weight="bold">event=0</text>

    <!-- Pointer formula -->
    <rect x="400" y="280" width="200" height="28" rx="5" fill="#fdf0d5" stroke="#d97706" stroke-width="1"/>
    <text x="500" y="299" text-anchor="middle" font-size="12" fill="#92400e" font-family="Consolas,monospace" font-weight="bold">FSM[0][0] = act_save_cmd</text>
  </g>

  <!-- ========== STAGE 3: Indirect Call (6-9s) ========== -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="6s"/>
    <set attributeName="opacity" to="0" begin="9s"/>

    <text x="24" y="78" font-size="13" font-weight="bold" fill="#3451b2" font-family="sans-serif">3. Indirect Call: blx r3</text>

    <!-- Growing arrow from table cell to act_save_cmd -->
    <line x1="390" y1="150" x2="600" y2="170" stroke="#d97706" stroke-width="2" marker-end="url(#ahg)"
      pathLength="1000" stroke-dasharray="1000">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="0.8s" begin="6.3s"/>
    </line>

    <!-- blx r3 instruction box -->
    <rect x="410" y="82" width="90" height="28" rx="5" fill="#fdf0d5" stroke="#d97706" stroke-width="1.5"/>
    <text x="455" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e" font-family="Consolas,monospace">blx r3</text>

    <!-- Function pointer label -->
    <text x="455" y="74" text-anchor="middle" font-size="11" fill="#666" font-family="Consolas,monospace">r3 = &amp;act_save_cmd</text>

    <!-- Target function highlight -->
    <rect x="605" y="152" width="110" height="40" rx="6" fill="#d8f3e5" stroke="#3eaf7c" stroke-width="2.5">
      <animate attributeName="stroke-width" values="2;3.5;2" dur="0.6s" begin="7.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ========== STAGE 4: State Update (9-12s) ========== -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="9s"/>

    <text x="24" y="78" font-size="13" font-weight="bold" fill="#3451b2" font-family="sans-serif">4. State Update: f->state = S_ARG</text>

    <!-- Return arrow from act_save_cmd to state box -->
    <line x1="600" y1="192" x2="190" y2="360" stroke="#3eaf7c" stroke-width="2" marker-end="url(#ahgr)"
      pathLength="1000" stroke-dasharray="1000">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="0.8s" begin="9.3s"/>
    </line>
    <text x="380" y="268" font-size="11" fill="#1a7f56" font-family="Consolas,monospace">return S_ARG (1)</text>

    <!-- New state display -->
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="10.25s"/>
      <rect x="55" y="340" width="130" height="40" rx="6" fill="#d8f3e5" stroke="#3eaf7c" stroke-width="2"/>
      <text x="120" y="356" text-anchor="middle" font-size="11" fill="#666" font-family="Consolas,monospace">f->state</text>
      <text x="120" y="373" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a7f56" font-family="Consolas,monospace">S_ARG (1)</text>
    </g>

    <!-- Next character hint -->
    <text x="360" y="365" text-anchor="middle" font-size="12" fill="#888" font-family="sans-serif" opacity="0">
      <set attributeName="opacity" to="1" begin="11s"/>
      next character...
    </text>
    <text x="360" y="382" text-anchor="middle" font-size="11" fill="#888" font-family="Consolas,monospace" opacity="0">
      <set attributeName="opacity" to="1" begin="11s"/>
      loop back to classify()
    </text>
  </g>

  <!-- ========== SHARED: FSM Table (always visible) ========== -->
  <g>
    <!-- Table title -->
    <text x="255" y="100" text-anchor="start" font-size="12" font-weight="bold" fill="#3451b2" font-family="Consolas,monospace">FSM[3][4]</text>

    <!-- Table frame -->
    <rect x="255" y="108" width="340" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Header row background -->
    <rect x="255" y="108" width="340" height="28" rx="3" fill="#f1f5f9"/>
    <rect x="255" y="108" width="340" height="28" fill="#f1f5f9"/>

    <!-- State label column background -->
    <rect x="255" y="108" width="65" height="150" fill="#f8fafc"/>

    <!-- Header dividers -->
    <line x1="389" y1="108" x2="389" y2="258" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="458" y1="108" x2="458" y2="258" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="526" y1="108" x2="526" y2="258" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="255" y1="136" x2="595" y2="136" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="255" y1="166" x2="595" y2="166" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="255" y1="196" x2="595" y2="196" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="255" y1="226" x2="595" y2="226" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="320" y1="108" x2="320" y2="258" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Column headers -->
    <text x="354" y="127" text-anchor="middle" font-size="11" fill="#333" font-family="Consolas,monospace" font-weight="bold">EV_LETTER</text>
    <text x="423" y="127" text-anchor="middle" font-size="11" fill="#333" font-family="Consolas,monospace" font-weight="bold">EV_DIGIT</text>
    <text x="492" y="127" text-anchor="middle" font-size="11" fill="#333" font-family="Consolas,monospace" font-weight="bold">EV_LF</text>
    <text x="561" y="127" text-anchor="middle" font-size="11" fill="#333" font-family="Consolas,monospace" font-weight="bold">EV_OTHER</text>

    <!-- Row labels -->
    <text x="287" y="155" text-anchor="middle" font-size="11" fill="#333" font-family="Consolas,monospace" font-weight="bold">S_IDLE</text>
    <text x="287" y="185" text-anchor="middle" font-size="11" fill="#333" font-family="Consolas,monospace" font-weight="bold">S_ARG</text>
    <text x="287" y="215" text-anchor="middle" font-size="11" fill="#333" font-family="Consolas,monospace" font-weight="bold">S_END</text>

    <!-- Row 0: S_IDLE -->
    <text x="354" y="155" text-anchor="middle" font-size="11" fill="#3eaf7c" font-family="Consolas,monospace">save_cmd</text>
    <text x="423" y="155" text-anchor="middle" font-size="11" fill="#888" font-family="Consolas,monospace">ignore</text>
    <text x="492" y="155" text-anchor="middle" font-size="11" fill="#888" font-family="Consolas,monospace">ignore</text>
    <text x="561" y="155" text-anchor="middle" font-size="11" fill="#888" font-family="Consolas,monospace">ignore</text>

    <!-- Row 1: S_ARG -->
    <text x="354" y="185" text-anchor="middle" font-size="11" fill="#3eaf7c" font-family="Consolas,monospace">save_cmd</text>
    <text x="423" y="185" text-anchor="middle" font-size="11" fill="#3eaf7c" font-family="Consolas,monospace">save_arg</text>
    <text x="492" y="185" text-anchor="middle" font-size="11" fill="#dc2626" font-family="Consolas,monospace">error</text>
    <text x="561" y="185" text-anchor="middle" font-size="11" fill="#dc2626" font-family="Consolas,monospace">error</text>

    <!-- Row 2: S_END -->
    <text x="354" y="215" text-anchor="middle" font-size="11" fill="#dc2626" font-family="Consolas,monospace">error</text>
    <text x="423" y="215" text-anchor="middle" font-size="11" fill="#dc2626" font-family="Consolas,monospace">error</text>
    <text x="492" y="215" text-anchor="middle" font-size="11" fill="#3eaf7c" font-family="Consolas,monospace">exec</text>
    <text x="561" y="215" text-anchor="middle" font-size="11" fill="#dc2626" font-family="Consolas,monospace">error</text>
  </g>

  <!-- ========== SHARED: Action Functions (always visible) ========== -->
  <g>
    <rect x="605" y="152" width="110" height="40" rx="6" fill="#ffffff" stroke="#3eaf7c" stroke-width="1.5"/>
    <text x="660" y="168" text-anchor="middle" font-size="12" fill="#1a7f56" font-family="Consolas,monospace" font-weight="bold">act_save_cmd</text>
    <text x="660" y="183" text-anchor="middle" font-size="11" fill="#666" font-family="Consolas,monospace">-> S_ARG</text>

    <rect x="605" y="200" width="110" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="215" text-anchor="middle" font-size="12" fill="#888" font-family="Consolas,monospace">act_ignore</text>
    <text x="660" y="228" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Consolas,monospace">-> same</text>

    <rect x="605" y="244" width="110" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="259" text-anchor="middle" font-size="12" fill="#888" font-family="Consolas,monospace">act_save_arg</text>
    <text x="660" y="272" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Consolas,monospace">-> S_END</text>

    <rect x="605" y="288" width="110" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="303" text-anchor="middle" font-size="12" fill="#888" font-family="Consolas,monospace">act_exec</text>
    <text x="660" y="316" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Consolas,monospace">-> S_IDLE</text>

    <rect x="605" y="332" width="110" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="660" y="347" text-anchor="middle" font-size="12" fill="#888" font-family="Consolas,monospace">act_error</text>
    <text x="660" y="360" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Consolas,monospace">-> S_IDLE</text>
  </g>

  <!-- ========== SHARED: State Variable (always visible, content changes) ========== -->
  <g>
    <text x="30" y="290" font-size="12" font-weight="bold" fill="#3451b2" font-family="sans-serif">State Register</text>

    <!-- Old state (visible in stages 1-3) -->
    <g>
      <rect x="55" y="300" width="130" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="120" y="316" text-anchor="middle" font-size="11" fill="#666" font-family="Consolas,monospace">f->state</text>
      <text x="120" y="333" text-anchor="middle" font-size="16" font-weight="bold" fill="#3451b2" font-family="Consolas,monospace">S_IDLE (0)</text>
      <set attributeName="opacity" to="0" begin="10s"/>
    </g>
  </g>

  <!-- ========== SHARED: Dispatch Code ========== -->
  <g>
    <rect x="220" y="310" width="280" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="232" y="328" font-size="11" fill="#666" font-family="Consolas,monospace">trans_t t = FSM[f->state][ev];</text>
    <text x="232" y="348" font-size="11" fill="#666" font-family="Consolas,monospace">f->state = t(f, ch);</text>
  </g>

  <!-- ========== Continuous Motion: Pipeline Path ========== -->
  <path d="M 153,184 L 153,360 L 180,360 M 180,360 L 180,172 L 605,172"
    fill="none" stroke="#3451b2" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.2"
    pathLength="1000">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Pipeline labels on continuous path -->
  <text x="140" y="270" font-size="11" fill="#94a3b8" font-family="Consolas,monospace" transform="rotate(-90,140,270)" text-anchor="middle">pipeline</text>
</svg>
