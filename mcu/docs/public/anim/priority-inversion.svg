<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Microsoft YaHei',sans-serif">
  <title>优先级反转与优先级继承：一把锁引发的悬案</title>
  <desc>优先级反转与优先级继承：一把锁引发的悬案。三条时间线对照：H 抢锁失败被阻塞，M 抢占持锁的 L 造成反转；开启继承后 L 临时借到 H 的优先级，M 抢不动它，H 尽快拿锁返回。继承的红色箭头从 L 向上逐段画到 H 级——优先级是借上去的。</desc>
  <rect width="720" height="400" fill="#f6f8fa"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">优先级反转与优先级继承：一把锁引发的悬案</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#57606a">三条时间线对照：H 抢锁失败被阻塞，M 抢占持锁的 L 造成反转；继承后 L 临时借到 H 的优先级</text>

  <!-- 时间轴与分格 -->
  <line x1="90" y1="330" x2="700" y2="330" stroke="#57606a" stroke-width="2"/>
  <text x="695" y="350" text-anchor="end" font-size="12" fill="#57606a">时间 →</text>
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="190" y1="70" x2="190" y2="330"/><line x1="290" y1="70" x2="290" y2="330"/>
    <line x1="390" y1="70" x2="390" y2="330"/><line x1="490" y1="70" x2="490" y2="330"/>
    <line x1="590" y1="70" x2="590" y2="330"/>
  </g>

  <!-- 三条任务泳道 -->
  <g font-size="13" font-weight="bold">
    <text x="80" y="105" text-anchor="end" fill="#cf222e">H 高优先级</text>
    <text x="80" y="185" text-anchor="end" fill="#d97706">M 中优先级</text>
    <text x="80" y="265" text-anchor="end" fill="#3451b2">L 低优先级</text>
  </g>
  <g stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3">
    <line x1="90" y1="100" x2="700" y2="100"/>
    <line x1="90" y1="180" x2="700" y2="180"/>
    <line x1="90" y1="260" x2="700" y2="260"/>
  </g>

  <!-- 图例 -->
  <g font-size="12" fill="#57606a">
    <rect x="90" y="354" width="14" height="14" fill="#3eaf7c" rx="2"/><text x="110" y="366">运行中</text>
    <rect x="180" y="354" width="14" height="14" fill="#e7c54b" rx="2"/><text x="200" y="366">就绪被压</text>
    <rect x="290" y="354" width="14" height="14" fill="#9ea7b3" rx="2"/><text x="310" y="366">阻塞等锁</text>
  </g>

  <!-- L 道:拿锁跑→被M压→继承后跑→回落 -->
  <rect x="90" y="250" width="200" height="20" fill="#3eaf7c" rx="3"/>
  <rect x="290" y="250" width="100" height="20" fill="#e7c54b" rx="3"/>
  <rect x="390" y="250" width="100" height="20" fill="#3eaf7c" rx="3"/>
  <rect x="490" y="250" width="200" height="20" fill="#e7c54b" rx="3"/>
  <text x="95" y="245" font-size="12" fill="#24292f">🔑 拿锁</text>
  <text x="395" y="245" font-size="12" fill="#cf222e">★ 继承到 H 级</text>
  <text x="493" y="245" font-size="12" fill="#24292f">🔓 还锁,回落</text>

  <!-- M 道:抢占→被继承顶住→补上 -->
  <rect x="290" y="170" width="100" height="20" fill="#3eaf7c" rx="3"/>
  <rect x="390" y="170" width="100" height="20" fill="#e7c54b" rx="3"/>
  <rect x="590" y="170" width="100" height="20" fill="#3eaf7c" rx="3"/>
  <text x="295" y="165" font-size="12" fill="#24292f">M 就绪→抢占 L</text>

  <!-- H 道:阻塞等锁→终于运行 -->
  <rect x="190" y="90" width="300" height="20" fill="#9ea7b3" rx="3"/>
  <rect x="490" y="90" width="100" height="20" fill="#3eaf7c" rx="3"/>
  <text x="195" y="85" font-size="12" fill="#24292f">H 抢锁失败→阻塞(优先级再高也得等)</text>
  <text x="495" y="85" font-size="12" fill="#24292f">🔑 H 终于运行</text>

  <!-- 继承箭头：虚线换成爬线（描边逐点画出来 = 优先级是一点点借过去的），箭头仍骑在尖端 -->
  <path d="M 440 240 L 440 120" stroke="#cf222e" stroke-width="2" fill="none" marker-end="url(#arrR)" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;1000;0;0" keyTimes="0;0.5;0.6;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <defs><marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#cf222e"/></marker></defs>
  <text x="450" y="150" font-size="12" fill="#cf222e">继承:L 临时借 H 的优先级</text>
  <text x="450" y="166" font-size="12" fill="#cf222e">→ M 抢不动它了</text>

  <!-- 游标:6 拍离散推进,周期 9s（第 7 个值是回环瞬间的占位，落回 90） -->
  <line x1="90" y1="65" x2="90" y2="330" stroke="#3451b2" stroke-width="3">
    <animate attributeName="x1" values="90;140;240;340;440;540;90" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="90;140;240;340;440;540;90" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- 阶段解说:各自 1/6 窗口亮（7 个 keyTimes 才切得出 6 个可见窗口） -->
  <g font-size="14" fill="#24292f" text-anchor="middle">
    <text x="360" y="380" opacity="0">① L 拿着锁干活,一切正常<animate attributeName="opacity" values="1;0;0;0;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
    <text x="360" y="380" opacity="0">② H 醒来抢锁:锁在 L 手里,H 只能阻塞排队<animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
    <text x="360" y="380" opacity="0">③ M 就绪,优先级比 L 高→把 L 挤下台(H 还在等锁!)<animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
    <text x="360" y="380" opacity="0">④ 优先级继承:L 临时升到 H 级,M 挤不动,临界区赶紧跑完<animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
    <text x="360" y="380" opacity="0">⑤ L 还锁、回落原位;H 立刻被唤醒拿锁运行<animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
    <text x="360" y="380" opacity="0">⑥ H 干完 M 补上,最后才轮 L——没有继承时,H 会被 M 无限插队<animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
  </g>
</svg>
