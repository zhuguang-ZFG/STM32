<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>IDF UART：字节与事件走两条路</title>
  <desc>四阶段动画：字节走 FIFO(128B)→ring buffer→用户 buf；事件走 ISR→queue→任务。UART_DATA 的 size/timeout_flag 是元数据，字节要 uart_read_bytes 取。timeout_flag 就是 IDF 版的 IDLE 帧边界。上面那颗蓝点每 3 秒从 FIFO 一路跑到用户 buf——字节是连续在动的；下面那颗绿点只在 ISR→队列、队列→任务两个交接点各爬一次，箭头也就在那两下从发端长出来。</desc>
  <rect width="720" height="440" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">IDF UART：字节走一条路，事件走另一条路</text>
  <text x="24" y="50" font-size="12" fill="#666">FIFO 128B → ring buffer → 用户 buf · ISR 记账发事件 → 队列 → 任务 · 事件 ≠ 数据</text>

  <!-- ===== 上：字节路 ===== -->
  <rect x="30" y="80" width="660" height="110" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="46" y="102" font-size="13" font-weight="bold" fill="#3451b2">字节路径（真正的数据在这）</text>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="60" y="120" width="150" height="40" fill="#dbe7ff" stroke="#3451b2" rx="4"/>
    <text x="135" y="145" fill="#3451b2">硬件 FIFO（128B）</text>
    <rect x="280" y="120" width="160" height="40" fill="#dbe7ff" stroke="#3451b2" rx="4"/>
    <text x="360" y="145" fill="#3451b2">驱动 ring buffer</text>
    <rect x="510" y="120" width="150" height="40" fill="#dbe7ff" stroke="#3451b2" rx="4"/>
    <text x="585" y="145" fill="#3451b2">你的 buf</text>
  </g>
  <!-- 搬运箭头从发端爬到收端（搬完就停在那儿），字节流则一路上不停跑 -->
  <line x1="210" y1="140" x2="210" y2="140" stroke="#3451b2" stroke-width="3" marker-end="url(#arrU)">
    <animate attributeName="x2" values="210;210;280;280" keyTimes="0;0.03;0.07;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <line x1="440" y1="140" x2="440" y2="140" stroke="#3451b2" stroke-width="3" marker-end="url(#arrU)">
    <animate attributeName="x2" values="440;440;510;510" keyTimes="0;0.09;0.13;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <circle r="4" fill="#3451b2">
    <animateMotion calcMode="linear" path="M60,140 L660,140" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="245" y="132" font-size="11" fill="#666" text-anchor="middle">ISR 搬</text>
  <text x="475" y="132" font-size="11" fill="#666" text-anchor="middle">read_bytes</text>
  <defs>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#3451b2"/>
    </marker>
    <marker id="arrE" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#3eaf7c"/>
    </marker>
  </defs>

  <!-- ===== 下：事件路 ===== -->
  <rect x="30" y="210" width="660" height="110" fill="#ffffff" stroke="#3eaf7c" stroke-width="2" rx="8"/>
  <text x="46" y="232" font-size="13" font-weight="bold" fill="#3eaf7c">事件路径（只带"发生了什么"的元数据）</text>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="60" y="250" width="150" height="40" fill="#ffffff" stroke="#3eaf7c" stroke-width="2" rx="4"/>
    <text x="135" y="275" fill="#3eaf7c">ISR（记账不办事）</text>
    <rect x="280" y="250" width="160" height="40" fill="#ffffff" stroke="#3eaf7c" stroke-width="2" rx="4"/>
    <text x="360" y="275" fill="#3eaf7c">事件队列 queue</text>
    <rect x="510" y="250" width="150" height="40" fill="#ffffff" stroke="#3eaf7c" stroke-width="2" rx="4"/>
    <text x="585" y="275" fill="#3eaf7c">你的任务</text>
  </g>
  <!-- 事件只在两个交接点各爬一次：ISR→队列（发事件）、队列→任务（xQueueReceive 取走） -->
  <line x1="210" y1="270" x2="210" y2="270" stroke="#3eaf7c" stroke-width="3" marker-end="url(#arrE)">
    <animate attributeName="x2" values="210;210;280;280" keyTimes="0;0.25;0.31;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <line x1="440" y1="270" x2="440" y2="270" stroke="#3eaf7c" stroke-width="3" marker-end="url(#arrE)">
    <animate attributeName="x2" values="440;440;510;510" keyTimes="0;0.50;0.56;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <circle cy="270" r="5" fill="#3eaf7c">
    <animate attributeName="cx" values="135;135;360;360;585;585" keyTimes="0;0.25;0.32;0.50;0.58;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="245" y="262" font-size="11" fill="#666" text-anchor="middle">发事件</text>
  <text x="475" y="262" font-size="11" fill="#666" text-anchor="middle">xQueueReceive</text>

  <!-- ===== 元数据卡 ===== -->
  <rect x="30" y="336" width="660" height="60" fill="#ffffff" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="46" y="358" font-size="12" font-weight="bold" fill="#d97706">UART_DATA 事件的 size / timeout_flag 是元数据：</text>
  <text x="46" y="378" font-size="12" fill="#666">size="现在可读多少字节"，timeout_flag="是不是超时收尾（帧尾）"——字节在 ring buffer 里，要自己读</text>
  <!-- 事件带着元数据的那两个阶段，把元数据卡框出来 -->
  <rect x="30" y="336" width="660" height="60" fill="none" stroke="#d97706" stroke-width="3" rx="8" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="424">① 字节进 FIFO，ISR 搬进 ring buffer——搬运全自动，你还没出场</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="424">② 同时 ISR 发一个 UART_DATA 事件进队列：size=可读字节数，timeout_flag=是否帧尾</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="424">③ 你的任务收到事件 → uart_read_bytes 读走字节 → timeout_flag=1 说明这一帧完了</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="424">④ 对照 STM32：IDLE 标志判帧尾 = 这里 timeout_flag；DMA 环形 = 这里 ring buffer</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,404)" fill="#3451b2">
    <circle cx="0" cy="0" r="5" opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>