<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440">
  <title>vTaskDelay() Lifecycle in FreeRTOS</title>
  <desc>Animation showing the FreeRTOS task lifecycle when vTaskDelay is called: Task A runs, calls vTaskDelay, moves to the Delayed list, the scheduler picks Task B, the tick interrupt counts up, and Task A unblocks when the delay expires.</desc>

  <!-- Background -->
  <rect width="720" height="440" fill="#f6f8fa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" font-family="sans-serif">vTaskDelay() Lifecycle</text>

  <!-- ==================== READY LIST (top area) ==================== -->
  <rect x="30" y="42" width="660" height="82" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#666" font-family="sans-serif">Ready List</text>

  <!-- Task A box -->
  <g>
    <rect x="60" y="66" width="130" height="46" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="80" cy="89" r="8" fill="#3451b2"/>
    <text x="96" y="93" font-size="13" fill="#333" font-family="sans-serif">Task A</text>
    <!-- State label: Ready / Ready / Ready / Ready -->
    <text x="182" y="79" text-anchor="end" font-size="11" fill="#3451b2" font-family="sans-serif">
      Ready
      <animate attributeName="opacity" values="1;1;1;1" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- Running label (hidden when in delayed list) -->
    <text x="182" y="106" text-anchor="end" font-size="11" fill="#3eaf7c" font-weight="bold" font-family="sans-serif" opacity="0">
      Running
      <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Task B box -->
  <g>
    <rect x="295" y="66" width="130" height="46" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="315" cy="89" r="8" fill="#3eaf7c"/>
    <text x="331" y="93" font-size="13" fill="#333" font-family="sans-serif">Task B</text>
    <text x="417" y="79" text-anchor="end" font-size="11" fill="#3eaf7c" font-family="sans-serif">
      Ready
      <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="417" y="106" text-anchor="end" font-size="11" fill="#3eaf7c" font-weight="bold" font-family="sans-serif" opacity="0">
      Running
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Task C box -->
  <g>
    <rect x="530" y="66" width="130" height="46" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="550" cy="89" r="8" fill="#d97706"/>
    <text x="566" y="93" font-size="13" fill="#333" font-family="sans-serif">Task C</text>
    <text x="652" y="106" text-anchor="end" font-size="11" fill="#666" font-family="sans-serif">Ready</text>
  </g>

  <!-- ==================== RUNNING INDICATOR ==================== -->
  <!-- Pulsing ring around Task A when running (stages 1 only) -->
  <circle cx="80" cy="89" r="14" fill="none" stroke="#3451b2" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="r" values="12;18;12" keyTimes="0;0.5;1" calcMode="linear" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulsing ring around Task B when running (stage 3 only) -->
  <circle cx="315" cy="89" r="14" fill="none" stroke="#3eaf7c" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="r" values="12;18;12" keyTimes="0;0.5;1" calcMode="linear" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== DELAYED LIST (middle area) ==================== -->
  <rect x="200" y="155" width="320" height="90" rx="6" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="360" y="174" text-anchor="middle" font-size="12" fill="#d97706" font-family="sans-serif">Delayed List (sorted by wake time)</text>

  <!-- Task A in delayed list -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <rect x="240" y="185" width="240" height="44" rx="5" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="262" cy="207" r="8" fill="#3451b2"/>
    <text x="278" y="211" font-size="13" fill="#333" font-family="sans-serif">Task A</text>
    <text x="340" y="211" font-size="12" fill="#d97706" font-family="sans-serif">wake @ tick 100</text>
  </g>

  <!-- ==================== TRANSITION ARROWS ==================== -->

  <!-- Arrow 1: Running to Delayed (stage 2) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <line x1="125" y1="112" x2="290" y2="182" stroke="#d97706" stroke-width="2"/>
    <polygon points="290,182 280,174 283,186" fill="#d97706"/>
    <rect x="130" y="130" width="140" height="20" rx="3" fill="#f6f8fa" stroke="none"/>
    <text x="200" y="144" text-anchor="middle" font-size="11" fill="#d97706" font-family="sans-serif">vTaskDelay(100)</text>
  </g>

  <!-- Arrow 2: Delayed back to Ready (stage 4) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <line x1="420" y1="182" x2="170" y2="112" stroke="#3eaf7c" stroke-width="2"/>
    <polygon points="170,112 180,120 177,108" fill="#3eaf7c"/>
    <rect x="260" y="130" width="120" height="20" rx="3" fill="#f6f8fa" stroke="none"/>
    <text x="320" y="144" text-anchor="middle" font-size="11" fill="#3eaf7c" font-family="sans-serif">Delay expired!</text>
  </g>

  <!-- Arrow 3: Ready to Running for Task B (stage 3) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <path d="M 360 60 Q 360 42 360 60" fill="none" stroke="#3eaf7c" stroke-width="1.5"/>
    <text x="360" y="38" text-anchor="middle" font-size="11" fill="#3eaf7c" font-family="sans-serif">Scheduler picks Task B</text>
  </g>

  <!-- ==================== TICK COUNTER & TIMELINE (bottom) ==================== -->
  <rect x="30" y="275" width="660" height="145" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" font-family="sans-serif">System Tick Counter</text>

  <!-- Tick value display -->
  <rect x="280" y="305" width="160" height="36" rx="5" fill="#fff" stroke="#3451b2" stroke-width="1.5"/>

  <!-- Animated tick number overlay -->
  <text x="360" y="329" text-anchor="middle" font-size="18" font-weight="bold" fill="#3451b2" font-family="monospace" opacity="0">
    Tick: 000
    <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="360" y="329" text-anchor="middle" font-size="18" font-weight="bold" fill="#d97706" font-family="monospace" opacity="0">
    Tick: 033
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="360" y="329" text-anchor="middle" font-size="18" font-weight="bold" fill="#3451b2" font-family="monospace" opacity="0">
    Tick: 066
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="360" y="329" text-anchor="middle" font-size="18" font-weight="bold" fill="#3eaf7c" font-family="monospace" opacity="0">
    Tick: 100
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- Timeline bar -->
  <rect x="80" y="355" width="560" height="6" rx="3" fill="#e2e8f0"/>
  <!-- Progress fill -->
  <rect x="80" y="355" width="0" height="6" rx="3" fill="#3451b2">
    <animate attributeName="width" values="0;140;280;560" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Timeline tick markers -->
  <line x1="80" y1="352" x2="80" y2="368" stroke="#666" stroke-width="1"/>
  <text x="80" y="380" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">0</text>

  <line x1="220" y1="352" x2="220" y2="368" stroke="#666" stroke-width="1"/>
  <text x="220" y="380" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">33</text>

  <line x1="360" y1="352" x2="360" y2="368" stroke="#666" stroke-width="1"/>
  <text x="360" y="380" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">66</text>

  <line x1="640" y1="352" x2="640" y2="368" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706" font-family="sans-serif">100</text>

  <!-- Stage labels at bottom -->
  <text x="150" y="400" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">A Running</text>
  <text x="290" y="400" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">A calls delay</text>
  <text x="430" y="400" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">B Running</text>
  <text x="570" y="400" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">A unblocks</text>

  <!-- Stage divider lines on timeline -->
  <line x1="220" y1="390" x2="220" y2="405" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="360" y1="390" x2="360" y2="405" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="500" y1="390" x2="500" y2="405" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================== CONTINUOUS TICK PULSE ==================== -->
  <!-- A continuously pulsing dot to represent the tick interrupt firing -->
  <circle cx="50" cy="323" r="6" fill="#dc2626">
    <animate attributeName="r" values="4;8;4" keyTimes="0;0.5;1" calcMode="linear" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" keyTimes="0;0.5;1" calcMode="linear" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="345" text-anchor="middle" font-size="11" fill="#dc2626" font-family="sans-serif">Tick IRQ</text>

  <!-- ==================== ANNOTATIONS ==================== -->
  <!-- Stage description box -->
  <rect x="30" y="415" width="660" height="20" rx="3" fill="none" stroke="none"/>
  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#666" font-family="sans-serif">
    Stage 1: Running
    <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#666" font-family="sans-serif" opacity="0">
    Stage 2: vTaskDelay(100) - moved to Delayed list
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#666" font-family="sans-serif" opacity="0">
    Stage 3: Scheduler runs Task B, tick IRQ counting
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#666" font-family="sans-serif" opacity="0">
    Stage 4: Tick=100, Task A unblocked back to Ready
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
</svg>
