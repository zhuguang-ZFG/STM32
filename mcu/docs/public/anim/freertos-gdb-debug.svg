<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>FreeRTOS GDB 调试实战：指认 TCB 与栈内容</title>
  <desc>四阶段动画：连接目标 → 查看当前任务 → 检查栈内容 → 设置断点，展示 FreeRTOS 调试的核心 GDB 命令与证据链</desc>

  <rect width="720" height="460" fill="#f6f8fa"/>

  <!-- Stage 1: Connect (top-left) -->
  <text x="20" y="22" font-size="13" font-weight="bold" fill="#3451b2">① 连接目标</text>
  <rect x="20" y="30" width="330" height="90" rx="4" fill="#ffffff" stroke="#3451b2" stroke-width="1.5"/>
  <text x="30" y="48" font-size="11" fill="#333" font-family="monospace">
    <tspan x="30" dy="0" fill="#666"># 启动 OpenOCD + GDB 连接</tspan>
    <tspan x="30" dy="15">openocd -f interface/stlink.cfg \</tspan>
    <tspan x="30" dy="15" fill="#666">        -f target/stm32f4x.cfg</tspan>
    <tspan x="30" dy="15">(gdb) target remote :3333</tspan>
  </text>
  <text x="30" y="112" font-size="10" fill="#3eaf7c" font-weight="bold">✓ 连接成功</text>

  <!-- Stage 2: Inspect TCB (top-right) -->
  <text x="370" y="22" font-size="13" font-weight="bold" fill="#3451b2">② 查看当前任务</text>
  <rect x="370" y="30" width="330" height="90" rx="4" fill="#ffffff" stroke="#3eaf7c" stroke-width="1.5"/>
  <text x="380" y="48" font-size="11" fill="#333" font-family="monospace">
    <tspan x="380" dy="0" fill="#666"># 当前任务 TCB 指针</tspan>
    <tspan x="380" dy="15">(gdb) p pxCurrentTCB</tspan>
    <tspan x="380" dy="15">$1 = (tskTCB*) 0x20001a80</tspan>
    <tspan x="380" dy="15">(gdb) p pxCurrentTCB-&gt;pcTaskName</tspan>
  </text>
  <text x="380" y="112" font-size="10" fill="#d97706" font-weight="bold">⚠ 正在运行 high 任务</text>

  <!-- Stage 3: Examine stack (bottom-left) -->
  <text x="20" y="142" font-size="13" font-weight="bold" fill="#3451b2">③ 检查栈内容</text>
  <rect x="20" y="150" width="330" height="90" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="30" y="168" font-size="11" fill="#333" font-family="monospace">
    <tspan x="30" dy="0" fill="#666"># 栈顶指针</tspan>
    <tspan x="30" dy="15">(gdb) p pxCurrentTCB-&gt;pxTopOfStack</tspan>
    <tspan x="30" dy="15">$3 = (StackType_t*) 0x20001b80</tspan>
    <tspan x="30" dy="15">(gdb) x/16xw $3</tspan>
  </text>
  <text x="30" y="232" font-size="10" fill="#dc2626" font-weight="bold">⚠ Thumb 位 = 1 ✓</text>

  <!-- Stage 4: Set breakpoint (bottom-right) -->
  <text x="370" y="142" font-size="13" font-weight="bold" fill="#3451b2">④ 设置断点</text>
  <rect x="370" y="150" width="330" height="90" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="168" font-size="11" fill="#333" font-family="monospace">
    <tspan x="380" dy="0" fill="#666"># 在任务函数打断</tspan>
    <tspan x="380" dy="15">(gdb) break high_task</tspan>
    <tspan x="380" dy="15">Breakpoint 1 at 0x8000189</tspan>
    <tspan x="380" dy="15">(gdb) continue</tspan>
  </text>
  <text x="380" y="232" font-size="10" fill="#3eaf7c" font-weight="bold">✓ 断点命中</text>

  <!-- Common commands -->
  <rect x="20" y="255" width="680" height="90" rx="6" fill="#ffffff" stroke="#3451b2" stroke-width="2"/>
  <text x="30" y="275" font-size="12" font-weight="bold" fill="#3451b2">FreeRTOS 调试常用命令</text>
  <text x="30" y="295" font-size="11" fill="#333" font-family="monospace">
    <tspan x="30" dy="0" fill="#3451b2">p pxCurrentTCB</tspan>
    <tspan fill="#666"> → 当前任务 TCB</tspan>
    <tspan x="30" dy="16" fill="#3451b2">p pxCurrentTCB-&gt;uxPriority</tspan>
    <tspan fill="#666"> → 当前优先级</tspan>
    <tspan x="30" dy="16" fill="#3451b2">x/16xw pxCurrentTCB-&gt;pxTopOfStack</tspan>
    <tspan fill="#666"> → 栈内容（指认 xPSR/PC/LR）</tspan>
  </text>

  <!-- Debugging tips -->
  <rect x="20" y="360" width="680" height="85" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="30" y="378" font-size="12" font-weight="bold" fill="#d97706">调试纪律</text>
  <text x="30" y="396" font-size="11" fill="#333">
    <tspan x="30" dy="0">1. <tspan font-weight="bold" fill="#dc2626">断点会改变时序</tspan>：实时任务调试时断点暂停会让其他任务"饿死"</tspan>
    <tspan x="30" dy="16">2. <tspan font-weight="bold" fill="#dc2626">看门狗会咬人</tspan>：调试暂停时 TWDT 可能超时复位——调试前禁用看门狗</tspan>
    <tspan x="30" dy="16">3. <tspan font-weight="bold" fill="#3eaf7c">用 watchpoint 抓变量</tspan>：值变化时自动暂停，比断点更精准</tspan>
  </text>

  <!-- Continuous animation: pulse on breakpoint -->
  <circle cx="690" cy="210" r="8" fill="#dc2626" opacity="0.2">
    <animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
