<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>TXE 与 TC：可写不等于发完</title>
  <desc>四阶段动画：写 DR 后 TXE 立刻置位（数据寄存器空了，可以塞下一个），但移位寄存器还在一位一位往外蹦；停止位发完 TC 才置位。RS-485 切方向必须等 TC——等 TXE 就切，最后一位被拦腰砍断。两支交接箭头从发端爬到收端（数据真的在走），时间轴被逐点画出，移位寄存器每 1.2s 跳一下节拍、TXE 旗标在"还在发"的窗口里一直闪。</desc>
  <rect width="720" height="430" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">TXE 与 TC：数据寄存器 vs 移位寄存器，两级缓冲两个标志</text>
  <text x="24" y="50" font-size="12" fill="#666">写 DR → TXE 置位（能塞下一个）→ 移位寄存器慢慢发 → 停止位跑完 TC 才置位（真的发完了）</text>

  <!-- ===== 两级缓冲结构 ===== -->
  <rect x="40" y="80" width="640" height="120" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <rect x="70" y="110" width="180" height="60" fill="#dbe7ff" stroke="#3451b2" rx="6"/>
  <text x="160" y="135" font-size="13" font-weight="bold" fill="#3451b2" text-anchor="middle">数据寄存器 DR</text>
  <text x="160" y="155" font-size="11" fill="#666" text-anchor="middle">CPU 写的入口</text>
  <rect x="290" y="110" width="180" height="60" fill="#ffffff" stroke="#d97706" stroke-width="2" rx="6">
    <!-- 移位节拍：一轮 12s 正好跳 10 下 = 一位一下（起始位 + 8 数据位 + 停止位） -->
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="380" y="135" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">移位寄存器</text>
  <text x="380" y="155" font-size="11" fill="#666" text-anchor="middle">一位一位蹦上 TX 线</text>
  <!-- 交接箭头：生长——d 的终点从发端爬到收端，箭头 marker 骑在尖端；阶段①(t0)起点、阶段②(t1)之前爬完 -->
  <path d="M250,140 L250,140" stroke="#3451b2" stroke-width="3" fill="none" marker-end="url(#arrB2)">
    <animate attributeName="d" values="M250,140 L250,140;M250,140 L250,140;M250,140 L290,140;M250,140 L290,140" keyTimes="0;0.083;0.25;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M470,140 L470,140" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#arrO2)">
    <animate attributeName="d" values="M470,140 L470,140;M470,140 L470,140;M470,140 L650,140;M470,140 L650,140" keyTimes="0;0.25;0.5;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="655" y="135" font-size="11" fill="#666">TX 线</text>
  <defs>
    <marker id="arrB2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#3451b2"/>
    </marker>
    <marker id="arrO2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ===== 时间线 ===== -->
  <rect x="40" y="220" width="640" height="130" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="56" y="242" font-size="13" font-weight="bold" fill="#3451b2">时间线（写一个字节的全过程）</text>
  <!-- 爬线：时间轴跟着移位过程往前长，t3(TC) 那端在阶段③到位 -->
  <path d="M70,300 H660" pathLength="1000" stroke="#94a3b8" stroke-width="2" fill="none"
        stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="70" y="320" font-size="11" font-family="Consolas,monospace" fill="#666">t0 写DR</text>
  <text x="220" y="320" font-size="11" font-family="Consolas,monospace" fill="#666">t1 TXE=1</text>
  <text x="400" y="320" font-size="11" font-family="Consolas,monospace" fill="#666">t2 位移完</text>
  <text x="560" y="320" font-size="11" font-family="Consolas,monospace" fill="#666">t3 TC=1</text>

  <!-- TXE 旗标（阶段②点亮） -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;1;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="220" cy="300" r="7" fill="#3451b2">
      <!-- TXE 亮着≠发完：移位还在跑，所以这面旗子在"还能塞"的窗口里每 2s 闪一下 -->
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="212" y="285" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="end">TXE=1：DR 空了</text>
    <text x="212" y="336" font-size="11" fill="#3451b2" text-anchor="end">可以塞下一个字节</text>
  </g>

  <!-- TC 旗标（阶段③点亮） -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="560" cy="300" r="7" fill="#3eaf7c"/>
    <text x="560" y="285" font-size="12" font-weight="bold" fill="#3eaf7c" text-anchor="middle">TC=1：停止位跑完</text>
    <text x="560" y="336" font-size="11" fill="#3eaf7c" text-anchor="middle">这时才真的发完了</text>
  </g>

  <!-- 反例：等 TXE 就切方向（阶段④点亮） -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <line x1="220" y1="250" x2="220" y2="330" stroke="#dc2626" stroke-width="3"/>
    <text x="232" y="262" font-size="12" font-weight="bold" fill="#dc2626">反例：这里就切 RS-485 方向</text>
    <text x="232" y="280" font-size="11" fill="#dc2626">→ 移位寄存器里的字节被拦腰砍断</text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="412">① t0：CPU 把字节写进 DR。此时它只到了"门口"，还没上线</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="412">② t1：DR 交给移位寄存器，TXE 置位——"可写下一个"≠"上一个发完"</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="412">③ t3：停止位跑完，TC 置位——这才是"发完了"的唯一证据</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="412">④ 纪律：切方向/断电/进低功耗之前等 TC；塞下一个字节只看 TXE</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,404)" fill="#3451b2">
    <circle cx="0" cy="0" r="5" opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>