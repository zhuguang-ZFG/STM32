<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>构建全过程路线图：从源码到运行</title>
  <desc>B 篇导览路线图：B0 工具链→B1 四步→B2 ELF→B3 链接脚本→B4 启动→B5 体积→B6 烧录→B7 构建系统</desc>

  <rect width="720" height="380" fill="#f6f8fa"/>
  <text x="360" y="22" font-size="14" font-weight="bold" fill="#3451b2" text-anchor="middle">构建与运行全过程路线图</text>

  <!-- Main flow -->
  <rect x="20" y="45" width="80" height="40" rx="4" fill="#ffffff" stroke="#3451b2" stroke-width="1.5"/>
  <text x="60" y="69" font-size="10" fill="#333" text-anchor="middle">B0 工具链</text>
  <path d="M100,65 L115,65" stroke="#666" stroke-width="1" marker-end="url(#a)"/>

  <rect x="115" y="45" width="80" height="40" rx="4" fill="#ffffff" stroke="#3eaf7c" stroke-width="2"/>
  <text x="155" y="69" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">B1 四步</text>
  <path d="M195,65 L210,65" stroke="#666" stroke-width="1" marker-end="url(#a)"/>

  <rect x="210" y="45" width="80" height="40" rx="4" fill="#ffffff" stroke="#3451b2" stroke-width="1.5"/>
  <text x="250" y="69" font-size="10" fill="#333" text-anchor="middle">B2 ELF</text>
  <path d="M290,65 L305,65" stroke="#666" stroke-width="1" marker-end="url(#a)"/>

  <rect x="305" y="45" width="80" height="40" rx="4" fill="#ffffff" stroke="#3451b2" stroke-width="1.5"/>
  <text x="345" y="69" font-size="10" fill="#333" text-anchor="middle">B3 链接</text>
  <path d="M385,65 L400,65" stroke="#666" stroke-width="1" marker-end="url(#a)"/>

  <rect x="400" y="45" width="80" height="40" rx="4" fill="#ffffff" stroke="#3451b2" stroke-width="1.5"/>
  <text x="440" y="69" font-size="10" fill="#333" text-anchor="middle">B4 启动</text>
  <path d="M480,65 L495,65" stroke="#666" stroke-width="1" marker-end="url(#a)"/>

  <rect x="495" y="45" width="80" height="40" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="535" y="69" font-size="10" fill="#333" text-anchor="middle">B5 体积</text>
  <path d="M575,65 L590,65" stroke="#666" stroke-width="1" marker-end="url(#a)"/>

  <rect x="590" y="45" width="110" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="645" y="69" font-size="10" fill="#333" text-anchor="middle">B6 烧录调试</text>

  <!-- B7 separate -->
  <rect x="260" y="105" width="200" height="40" rx="4" fill="#ffffff" stroke="#3eaf7c" stroke-width="2"/>
  <text x="360" y="129" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">B7 构建系统（Makefile→CMake）</text>

  <!-- Core concepts -->
  <rect x="20" y="165" width="330" height="90" rx="6" fill="#ffffff" stroke="#3451b2" stroke-width="2"/>
  <text x="30" y="185" font-size="12" font-weight="bold" fill="#3451b2">核心概念链</text>
  <text x="30" y="205" font-size="11" fill="#333">
    <tspan>源码 → </tspan>
    <tspan fill="#3eaf7c" font-weight="bold">预处理/编译/汇编/链接</tspan>
    <tspan> → ELF → bin → Flash</tspan>
  </text>
  <text x="30" y="225" font-size="11" fill="#333">
    <tspan>上电 → </tspan>
    <tspan fill="#d97706" font-weight="bold">向量表 → Reset_Handler</tspan>
    <tspan> → main</tspan>
  </text>
  <text x="30" y="245" font-size="10" fill="#666" font-style="italic">每步都有动画演示，每章配短自测</text>

  <!-- Tools -->
  <rect x="370" y="165" width="330" height="90" rx="6" fill="#ffffff" stroke="#3eaf7c" stroke-width="2"/>
  <text x="380" y="185" font-size="12" font-weight="bold" fill="#3eaf7c">工具兵器谱</text>
  <text x="380" y="205" font-size="11" fill="#333" font-family="monospace">
    <tspan fill="#3451b2">gcc</tspan>
    <tspan> 编译 | </tspan>
    <tspan fill="#3451b2">ld</tspan>
    <tspan> 链接 | </tspan>
    <tspan fill="#3451b2">nm</tspan>
    <tspan> 符号</tspan>
  </text>
  <text x="380" y="225" font-size="11" fill="#333" font-family="monospace">
    <tspan fill="#3451b2">objdump</tspan>
    <tspan> 反汇编 | </tspan>
    <tspan fill="#3451b2">readelf</tspan>
    <tspan> 段信息</tspan>
  </text>
  <text x="380" y="245" font-size="11" fill="#333" font-family="monospace">
    <tspan fill="#3451b2">size</tspan>
    <tspan> 体积 | </tspan>
    <tspan fill="#3451b2">gdb</tspan>
    <tspan> 调试</tspan>
  </text>

  <!-- Outcome -->
  <rect x="20" y="275" width="680" height="50" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="30" y="295" font-size="12" font-weight="bold" fill="#d97706">学完能做到</text>
  <text x="30" y="315" font-size="11" fill="#333">看懂固件每一字节的来历，能审计 Flash/RAM 占用，能用 GDB 从复位向量单步到 main</text>

  <!-- Prerequisites -->
  <rect x="20" y="340" width="680" height="30" rx="4" fill="#ffffff" stroke="#666" stroke-width="1"/>
  <text x="360" y="360" font-size="10" fill="#666" text-anchor="middle">先修：C 语言基础（C0-C2）| 并行：C1 内存模型、C6 调用约定</text>

  <defs><marker id="a" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0 0, 6 2, 0 4" fill="#666"/></marker></defs>

  <circle r="4" fill="#3451b2" opacity="0.7">
    <animate attributeName="cx" values="60;155;250;345;440;535;645" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="65;65;65;65;65;65;65" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
