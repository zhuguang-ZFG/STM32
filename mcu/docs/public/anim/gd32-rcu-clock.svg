<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>GD32F4xx RCU 时钟树：25MHz 晶振到 200MHz 主频</title>
  <desc>四阶段动画：复位先跑 IRC16M 16MHz；HXTAL 25MHz 起振（超时回退 IRC16M）；PLL 经 PSC=25、N=400、P=2 锁定 200MHz（VCO 400MHz，Q=9）；CK_OUT0 输出 PLLP/4=50MHz 理论对账（待上板实测）。电压档三件套 LDOVS→HDEN→HDS 带 HDRF/HDSRF 回执。每一阶段的时钟路由都是被逐点爬通的：①一条 16MHz 的节拍从 IRC16M 爬到 CK_AHB，②晶振盒子每半秒抖一次再把时钟爬进 PLL，③电压档先接线、PLL 锁定后三个分频口依次亮起来，④节拍穿过 CK_OUT0 引向 PA8；③④两阶段里 APB1/APB2 各有一颗节拍不停往返。</desc>
  <rect width="720" height="470" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">GD32F4xx RCU：25MHz 晶振怎么变成 200MHz 主频</text>
  <text x="24" y="50" font-size="12" fill="#666">HXTAL 25M → PLL（PSC=25 / N=400 / P=2 / Q=9）→ CK_SYS 200MHz → AHB/1、APB1/4、APB2/2 → 外设</text>

  <!-- 源 -->
  <rect x="30" y="90" width="120" height="44" fill="#ffffff" stroke="#3451b2" rx="6"/>
  <text x="90" y="108" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">IRC16M</text>
  <text x="90" y="124" font-size="12" fill="#666" text-anchor="middle">内部 16MHz</text>

  <rect x="30" y="160" width="120" height="44" fill="#ffffff" stroke="#3451b2" rx="6"/>
  <text x="90" y="178" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">HXTAL</text>
  <text x="90" y="194" font-size="12" fill="#666" text-anchor="middle">晶振 25MHz</text>

  <!-- PLL -->
  <rect x="220" y="120" width="150" height="80" fill="#ffffff" stroke="#3eaf7c" stroke-width="2" rx="8"/>
  <text x="295" y="142" font-size="13" font-weight="bold" fill="#3eaf7c" text-anchor="middle">PLL</text>
  <text x="295" y="160" font-size="12" fill="#333" text-anchor="middle">PSC=25 → VCO 1MHz</text>
  <text x="295" y="176" font-size="12" fill="#333" text-anchor="middle">N=400 → 400MHz</text>
  <text x="295" y="192" font-size="12" fill="#333" text-anchor="middle">P=2 / Q=9</text>

  <!-- 总线 -->
  <rect x="440" y="76" width="80" height="40" fill="#ffffff" stroke="#3451b2" rx="6"/>
  <text x="480" y="93" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">CK_AHB</text>
  <text x="480" y="108" font-size="12" fill="#666" text-anchor="middle">/1 = 200MHz</text>

  <rect x="440" y="140" width="80" height="40" fill="#ffffff" stroke="#3451b2" rx="6"/>
  <text x="480" y="157" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">CK_APB2</text>
  <text x="480" y="172" font-size="12" fill="#666" text-anchor="middle">/2 = 100MHz</text>

  <rect x="440" y="204" width="80" height="40" fill="#ffffff" stroke="#3451b2" rx="6"/>
  <text x="480" y="221" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">CK_APB1</text>
  <text x="480" y="236" font-size="12" fill="#666" text-anchor="middle">/4 = 50MHz</text>

  <!-- 电压档三件套 -->
  <rect x="220" y="250" width="300" height="66" fill="#fff7ed" stroke="#d97706" rx="8"/>
  <text x="236" y="270" font-size="12" font-weight="bold" fill="#d97706">电压档三件套（都有回执！）</text>
  <text x="236" y="288" font-size="12" fill="#333">① PMUEN 开时钟（APB1 bit28）</text>
  <text x="236" y="306" font-size="12" fill="#333">② LDOVS → ③ HDEN 等 HDRF → ④ HDS 等 HDSRF</text>

  <!-- CK_OUT0 -->
  <rect x="560" y="96" width="130" height="64" fill="#ffffff" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="625" y="116" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">CK_OUT0 = /4</text>
  <text x="625" y="134" font-size="12" fill="#666" text-anchor="middle">引到 PA8（AF0）</text>
  <text x="625" y="150" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">理论 50MHz</text>

  <!-- 连线（静态底图） -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M150 182 L220 160" marker-end="url(#arr)"/>
    <path d="M370 160 L440 96" marker-end="url(#arr)"/>
    <path d="M370 160 L440 160" marker-end="url(#arr)"/>
    <path d="M370 170 L440 224" marker-end="url(#arr)"/>
    <path d="M520 96 L560 120" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== 阶段 ①：复位先跑 IRC16M（盒子每秒抖一次，16MHz 的节拍沿直线爬向 CK_AHB） ===== -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="30" y="90" width="120" height="44" fill="none" stroke="#3eaf7c" stroke-width="3" rx="6">
      <animate attributeName="stroke-width" values="3;4.6;3" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <path d="M150,110 L440,110" stroke="#3eaf7c" stroke-width="4" fill="none"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.10;1" dur="12s" repeatCount="indefinite"/>
    </path>
    <circle r="4" fill="#3eaf7c">
      <animateMotion calcMode="linear" path="M150,110 L440,110" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="300" y="104" font-size="12" font-weight="bold" fill="#1a7f56" text-anchor="middle">复位后先跑这条：16MHz</text>
  </g>

  <!-- ===== 阶段 ②：HXTAL 起振（晶振每半秒抖一次，等来 HXTALSTB 后时钟爬进 PLL） ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="30" y="160" width="120" height="44" fill="none" stroke="#d97706" stroke-width="3" rx="6">
      <animate attributeName="stroke-width" values="3;5;3" keyTimes="0;0.5;1" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    <path d="M150,182 L220,160" stroke="#d97706" stroke-width="4" fill="none"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;1000;0;0" keyTimes="0;0.25;0.32;1" dur="12s" repeatCount="indefinite"/>
    </path>
    <circle r="4" fill="#d97706">
      <animateMotion calcMode="linear" path="M150,182 L220,160" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="156" y="216" font-size="12" font-weight="bold" fill="#d97706">等 HXTALSTB</text>
  </g>

  <!-- ===== 阶段 ③：PLL 锁定 200MHz（电压档先接线，再逐条爬亮三个分频口） ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="220" y="250" width="300" height="66" fill="none" stroke="#d97706" stroke-width="3" rx="8">
      <animate attributeName="stroke-width" values="3;4.6;3" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="220" y="120" width="150" height="80" fill="none" stroke="#3eaf7c" stroke-width="3" rx="8"/>
    <!-- 电压档 → PLL：先有这个，才敢开 PLL -->
    <path d="M295,250 L295,200" stroke="#d97706" stroke-width="3" fill="none"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;1000;0;0" keyTimes="0;0.50;0.54;1" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M370,160 L440,96" stroke="#3eaf7c" stroke-width="4" fill="none"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;1000;0;0" keyTimes="0;0.55;0.60;1" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M370,160 L440,160" stroke="#3eaf7c" stroke-width="4" fill="none"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;1000;0;0" keyTimes="0;0.60;0.65;1" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M370,170 L440,224" stroke="#3eaf7c" stroke-width="4" fill="none"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;1000;0;0" keyTimes="0;0.65;0.70;1" dur="12s" repeatCount="indefinite"/>
    </path>
    <circle r="4.5" fill="#3451b2">
      <animateMotion calcMode="linear" path="M150,182 L220,160 L295,160 L370,160 L440,96" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="300" y="242" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">先电压档，再 PLLEN</text>
  </g>

  <!-- ===== 阶段 ④：CK_OUT0 理论对账（节拍爬到 PA8，盒子每秒出一趟；待上板实测） ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="560" y="96" width="130" height="64" fill="none" stroke="#3eaf7c" stroke-width="3" rx="8">
      <animate attributeName="stroke-width" values="3;5;3" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <path d="M520,96 L560,120" stroke="#3eaf7c" stroke-width="4" fill="none"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;1000;0;0" keyTimes="0;0.75;0.80;1" dur="12s" repeatCount="indefinite"/>
    </path>
    <line x1="690" y1="128" x2="690" y2="128" stroke="#3eaf7c" stroke-width="3" marker-end="url(#arr2)">
      <animate attributeName="x2" values="690;690;712;712" keyTimes="0;0.80;0.86;1" dur="12s" repeatCount="indefinite"/>
    </line>
    <circle r="4" fill="#d97706">
      <animateMotion calcMode="linear" path="M520,96 L560,120 L690,128 L712,128" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="625" y="176" font-size="12" font-weight="bold" fill="#1a7f56" text-anchor="middle">示波器对账（待上板）</text>
  </g>

  <!-- PLL 锁定之后，两个分频口的时钟一直在往下送（③④阶段常驻往返） -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <circle r="3.5" fill="#3eaf7c">
      <animateMotion calcMode="linear" path="M370,160 L440,160" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#3eaf7c">
      <animateMotion calcMode="linear" path="M370,170 L440,224" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="452">① 复位：CK_SYS 先挂 IRC16M 16MHz——不靠外部晶振也能跑</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="452">② HXTAL 25MHz 起振：等 HXTALSTB，超时退回 IRC16M 而不是死等</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="452">③ PLL 锁定：25÷25×400÷2 = 200MHz，顺序是先电压档再等 PLLSTB</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="452">④ CK_OUT0 对账：PLLP/4 = 50MHz 引到 PA8——理论值，待上板实测</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,448)" fill="#3451b2">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3eaf7c"/>
    </marker>
  </defs>

  <!-- 对照与出处 -->
  <g font-size="11" fill="#888">
    <text x="24" y="344">对照 S2（STM32F407）：PLL 公式同布局，但 ST 的 VOS 无回执 → GD32 三件套件件有回执</text>
    <text x="24" y="358">FLASH_ACR → FMC_WS（0~11 档）；MCO1 与 CK_OUT0 同为 /1~/5（编码 0/4/5/6/7）</text>
    <text x="24" y="380">官方源：GigaDevice-GD32-MCU/GD32F4xx_Firmware_Library @10d02f4</text>
    <text x="24" y="394">system_gd32f4xx.c / gd32f4xx_rcu.h / gd32f4xx_pmu.h / gd32f4xx_fmc.h</text>
  </g>
</svg>
