<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>NVIC PRIGROUP：4位优先级字段的抢占组与子优先级切分</title>
  <desc>ARM NVIC 的 PRIGROUP 寄存器将 4 位优先级字段 [7:4] 切分为抢占组和子优先级两部分。PRIGROUP 值不同，切分点不同，同一优先级数值的行为完全不同。阶段1展示4位原始字段；阶段2展示 PRIGROUP=1 切分（3位抢占+1位子优先级），IRQ_A 和 IRQ_B 同组不能抢占；阶段3展示 PRIGROUP=2 切分（2位抢占+2位子优先级），IRQ_C 不同组可以抢占；阶段4总结全部4种切分方式。中间的竖线分隔器在不同 PRIGROUP 值之间连续滑动。</desc>
  <rect width="720" height="440" fill="#f6f8fa"/>

  <!-- Title -->
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">NVIC PRIGROUP：4 位优先级字段的抢占/子优先级切分</text>
  <text x="24" y="50" font-size="12" fill="#666">同一组数字，不同切法含义完全不同</text>

  <!-- ===== STAGE 1: 4位优先级字段 ===== -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0" keyTimes="0;0.25;0.5;1" dur="12s" repeatCount="indefinite"/>

    <!-- Stage title -->
    <text x="24" y="76" font-size="13" font-weight="bold" fill="#3451b2">① 4 位优先级字段 [7:4]</text>

    <!-- 4 bit cells -->
    <rect x="200" y="110" width="80" height="60" rx="6" fill="#dbe7ff" stroke="#3451b2" stroke-width="2"/>
    <text x="240" y="148" font-size="22" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">7</text>
    <rect x="280" y="110" width="80" height="60" rx="6" fill="#dbe7ff" stroke="#3451b2" stroke-width="2"/>
    <text x="320" y="148" font-size="22" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">6</text>
    <rect x="360" y="110" width="80" height="60" rx="6" fill="#d8f3e5" stroke="#3eaf7c" stroke-width="2"/>
    <text x="400" y="148" font-size="22" font-family="Consolas,monospace" fill="#1a7f56" text-anchor="middle">5</text>
    <rect x="440" y="110" width="80" height="60" rx="6" fill="#d8f3e5" stroke="#3eaf7c" stroke-width="2"/>
    <text x="480" y="148" font-size="22" font-family="Consolas,monospace" fill="#1a7f56" text-anchor="middle">4</text>

    <!-- Bit position labels -->
    <text x="240" y="190" font-size="11" font-family="Consolas,monospace" fill="#888" text-anchor="middle">bit 7</text>
    <text x="320" y="190" font-size="11" font-family="Consolas,monospace" fill="#888" text-anchor="middle">bit 6</text>
    <text x="400" y="190" font-size="11" font-family="Consolas,monospace" fill="#888" text-anchor="middle">bit 5</text>
    <text x="480" y="190" font-size="11" font-family="Consolas,monospace" fill="#888" text-anchor="middle">bit 4</text>

    <!-- Description -->
    <text x="24" y="224" font-size="13" fill="#333">4 个比特，同一组数字，不同 PRIGROUP 切法含义完全不同。</text>
    <text x="24" y="248" font-size="12" fill="#d97706">PRIGROUP 决定在哪里"切一刀"：左边 = 抢占组，右边 = 子优先级。</text>
  </g>

  <!-- ===== STAGE 2: PRIGROUP=1 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.25;0.5;1" dur="12s" repeatCount="indefinite"/>

    <text x="24" y="76" font-size="13" font-weight="bold" fill="#3451b2">② PRIGROUP=1：3 位抢占 + 1 位子优先级</text>

    <!-- Preemption group bracket -->
    <line x1="200" y1="96" x2="440" y2="96" stroke="#3451b2" stroke-width="2"/>
    <text x="320" y="92" font-size="12" fill="#3451b2" text-anchor="middle">抢占组 [7:5]</text>

    <!-- Sub-priority bracket -->
    <line x1="440" y1="96" x2="520" y2="96" stroke="#3eaf7c" stroke-width="2"/>
    <text x="480" y="92" font-size="12" fill="#3eaf7c" text-anchor="middle">子优先级 [4]</text>

    <!-- 4 bit cells -->
    <rect x="200" y="110" width="80" height="60" rx="6" fill="#dbe7ff" stroke="#3451b2" stroke-width="2"/>
    <text x="240" y="148" font-size="22" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">7</text>
    <rect x="280" y="110" width="80" height="60" rx="6" fill="#dbe7ff" stroke="#3451b2" stroke-width="2"/>
    <text x="320" y="148" font-size="22" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">6</text>
    <rect x="360" y="110" width="80" height="60" rx="6" fill="#dbe7ff" stroke="#3451b2" stroke-width="2"/>
    <text x="400" y="148" font-size="22" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">5</text>
    <rect x="440" y="110" width="80" height="60" rx="6" fill="#d8f3e5" stroke="#3eaf7c" stroke-width="2"/>
    <text x="480" y="148" font-size="22" font-family="Consolas,monospace" fill="#1a7f56" text-anchor="middle">4</text>

    <!-- IRQ examples -->
    <text x="24" y="200" font-size="12" font-weight="bold" fill="#333">中断示例：</text>
    <rect x="24" y="208" width="310" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="36" y="226" font-size="12" font-family="Consolas,monospace" fill="#333">IRQ_A = 0b</text>
    <text x="136" y="226" font-size="12" font-family="Consolas,monospace" fill="#3451b2">100</text>
    <text x="163" y="226" font-size="12" font-family="Consolas,monospace" fill="#888">_</text>
    <text x="173" y="226" font-size="12" font-family="Consolas,monospace" fill="#3eaf7c">0</text>
    <text x="200" y="226" font-size="12" font-family="Consolas,monospace" fill="#333">IRQ_B = 0b</text>
    <text x="136" y="248" font-size="12" font-family="Consolas,monospace" fill="#3451b2">100</text>
    <text x="163" y="248" font-size="12" font-family="Consolas,monospace" fill="#888">_</text>
    <text x="173" y="248" font-size="12" font-family="Consolas,monospace" fill="#3eaf7c">1</text>
    <text x="200" y="248" font-size="12" fill="#dc2626">同组(100)，不同子 → 不能抢占！</text>

    <!-- 8 groups × 2 sub label -->
    <text x="360" y="226" font-size="12" fill="#666">8 组 × 2 子优先级</text>
  </g>

  <!-- ===== STAGE 3: PRIGROUP=2 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>

    <text x="24" y="76" font-size="13" font-weight="bold" fill="#3451b2">③ PRIGROUP=2：2 位抢占 + 2 位子优先级</text>

    <!-- Preemption group bracket -->
    <line x1="200" y1="96" x2="360" y2="96" stroke="#3451b2" stroke-width="2"/>
    <text x="280" y="92" font-size="12" fill="#3451b2" text-anchor="middle">抢占组 [7:6]</text>

    <!-- Sub-priority bracket -->
    <line x1="360" y1="96" x2="520" y2="96" stroke="#3eaf7c" stroke-width="2"/>
    <text x="440" y="92" font-size="12" fill="#3eaf7c" text-anchor="middle">子优先级 [5:4]</text>

    <!-- 4 bit cells -->
    <rect x="200" y="110" width="80" height="60" rx="6" fill="#dbe7ff" stroke="#3451b2" stroke-width="2"/>
    <text x="240" y="148" font-size="22" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">7</text>
    <rect x="280" y="110" width="80" height="60" rx="6" fill="#dbe7ff" stroke="#3451b2" stroke-width="2"/>
    <text x="320" y="148" font-size="22" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">6</text>
    <rect x="360" y="110" width="80" height="60" rx="6" fill="#d8f3e5" stroke="#3eaf7c" stroke-width="2"/>
    <text x="400" y="148" font-size="22" font-family="Consolas,monospace" fill="#1a7f56" text-anchor="middle">5</text>
    <rect x="440" y="110" width="80" height="60" rx="6" fill="#d8f3e5" stroke="#3eaf7c" stroke-width="2"/>
    <text x="480" y="148" font-size="22" font-family="Consolas,monospace" fill="#1a7f56" text-anchor="middle">4</text>

    <!-- IRQ examples -->
    <text x="24" y="200" font-size="12" font-weight="bold" fill="#333">中断示例：</text>
    <rect x="24" y="208" width="340" height="72" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="36" y="226" font-size="12" font-family="Consolas,monospace" fill="#333">IRQ_A = 0b</text>
    <text x="136" y="226" font-size="12" font-family="Consolas,monospace" fill="#3451b2">10</text>
    <text x="158" y="226" font-size="12" font-family="Consolas,monospace" fill="#888">_</text>
    <text x="170" y="226" font-size="12" font-family="Consolas,monospace" fill="#3eaf7c">00</text>
    <text x="210" y="226" font-size="12" font-family="Consolas,monospace" fill="#333">IRQ_B = 0b</text>
    <text x="136" y="244" font-size="12" font-family="Consolas,monospace" fill="#3451b2">10</text>
    <text x="158" y="244" font-size="12" font-family="Consolas,monospace" fill="#888">_</text>
    <text x="170" y="244" font-size="12" font-family="Consolas,monospace" fill="#3eaf7c">01</text>
    <text x="210" y="244" font-size="12" fill="#dc2626">同组(10) → 不能抢占</text>
    <text x="36" y="268" font-size="12" font-family="Consolas,monospace" fill="#333">IRQ_C = 0b</text>
    <text x="136" y="268" font-size="12" font-family="Consolas,monospace" fill="#3451b2">01</text>
    <text x="158" y="268" font-size="12" font-family="Consolas,monospace" fill="#888">_</text>
    <text x="170" y="268" font-size="12" font-family="Consolas,monospace" fill="#3eaf7c">00</text>
    <text x="210" y="268" font-size="12" fill="#3eaf7c">不同组(01) → 可以抢占！</text>

    <!-- 4 groups × 4 sub label -->
    <text x="390" y="226" font-size="12" fill="#666">4 组 × 4 子优先级</text>
  </g>

  <!-- ===== STAGE 4: 结论 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>

    <text x="24" y="76" font-size="13" font-weight="bold" fill="#3451b2">④ 结论：相同数值，不同 PRIGROUP 下行为完全不同</text>

    <!-- Summary table -->
    <rect x="60" y="95" width="600" height="28" rx="4" fill="#3451b2"/>
    <text x="160" y="114" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PRIGROUP</text>
    <text x="310" y="114" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">抢占组位数</text>
    <text x="440" y="114" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">子优先级位数</text>
    <text x="570" y="114" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">组数 × 子数</text>

    <!-- Row 0 -->
    <rect x="60" y="123" width="600" height="26" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="160" y="141" font-size="12" font-family="Consolas,monospace" fill="#333" text-anchor="middle">0</text>
    <text x="310" y="141" font-size="12" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">4 bits</text>
    <text x="440" y="141" font-size="12" font-family="Consolas,monospace" fill="#3eaf7c" text-anchor="middle">0 bits</text>
    <text x="570" y="141" font-size="12" fill="#333" text-anchor="middle">16 × 1</text>

    <!-- Row 1 -->
    <rect x="60" y="149" width="600" height="26" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="160" y="167" font-size="12" font-family="Consolas,monospace" fill="#333" text-anchor="middle">1</text>
    <text x="310" y="167" font-size="12" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">3 bits</text>
    <text x="440" y="167" font-size="12" font-family="Consolas,monospace" fill="#3eaf7c" text-anchor="middle">1 bit</text>
    <text x="570" y="167" font-size="12" fill="#333" text-anchor="middle">8 × 2</text>

    <!-- Row 2 -->
    <rect x="60" y="175" width="600" height="26" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="160" y="193" font-size="12" font-family="Consolas,monospace" fill="#333" text-anchor="middle">2</text>
    <text x="310" y="193" font-size="12" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">2 bits</text>
    <text x="440" y="193" font-size="12" font-family="Consolas,monospace" fill="#3eaf7c" text-anchor="middle">2 bits</text>
    <text x="570" y="193" font-size="12" fill="#333" text-anchor="middle">4 × 4</text>

    <!-- Row 3 -->
    <rect x="60" y="201" width="600" height="26" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="160" y="219" font-size="12" font-family="Consolas,monospace" fill="#333" text-anchor="middle">3</text>
    <text x="310" y="219" font-size="12" font-family="Consolas,monospace" fill="#3451b2" text-anchor="middle">1 bit</text>
    <text x="440" y="219" font-size="12" font-family="Consolas,monospace" fill="#3eaf7c" text-anchor="middle">3 bits</text>
    <text x="570" y="219" font-size="12" fill="#333" text-anchor="middle">2 × 8</text>

    <!-- Key insight -->
    <rect x="60" y="245" width="600" height="44" rx="6" fill="#fdf0d5" stroke="#d97706"/>
    <text x="360" y="265" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">优先级数值 = 5，在不同 PRIGROUP 下抢占行为完全不同！</text>
    <text x="360" y="282" font-size="12" fill="#d97706" text-anchor="middle">配置 PRIGROUP 时必须明确抢占组和子优先级的位数分配。</text>
  </g>

  <!-- ===== CONTINUOUS MOTION: Sliding divider line ===== -->
  <!-- Vertical dashed line that slides between bit positions as PRIGROUP changes -->
  <line y1="100" y2="180" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 3">
    <animate attributeName="x1" calcMode="linear"
      values="520;520;440;440;360;360;520"
      keyTimes="0;0.22;0.28;0.47;0.53;0.72;1"
      dur="12s" repeatCount="indefinite"/>
    <animate attributeName="x2" calcMode="linear"
      values="520;520;440;440;360;360;520"
      keyTimes="0;0.22;0.28;0.47;0.53;0.72;1"
      dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete"
      values="0.3;1;1;0.3"
      keyTimes="0;0.25;0.5;1"
      dur="12s" repeatCount="indefinite"/>
  </line>
  <!-- Divider label -->
  <text font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">
    <animate attributeName="x" calcMode="linear"
      values="520;520;440;440;360;360;520"
      keyTimes="0;0.22;0.28;0.47;0.53;0.72;1"
      dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete"
      values="0.3;1;1;0;0"
      keyTimes="0;0.25;0.5;0.75;1"
      dur="12s" repeatCount="indefinite"/>
    <tspan y="196">切分点</tspan>
  </text>

  <!-- ===== STAGE SUBTITLES (bottom) ===== -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1">
      <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0" keyTimes="0;0.25;0.5;1" dur="12s" repeatCount="indefinite"/>
      <text x="24" y="398">① 4 位优先级字段：同一组数字，不同切法含义完全不同</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.25;0.5;1" dur="12s" repeatCount="indefinite"/>
      <text x="24" y="398">② PRIGROUP=1：同抢占组，子优先级不同 → 不能抢占</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="24" y="398">③ PRIGROUP=2：不同抢占组 → 可以抢占！</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="24" y="398">④ 结论：PRIGROUP 决定切分点，配置时必须明确位数分配</text>
    </g>
  </g>

  <!-- Stage indicator dots -->
  <g transform="translate(648, 52)" fill="#3451b2">
    <circle cx="0" cy="0" r="5">
      <animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="0" r="5">
      <animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="0" r="5">
      <animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="0" r="5">
      <animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
