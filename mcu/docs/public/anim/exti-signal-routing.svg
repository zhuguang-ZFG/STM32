<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
  <title>EXTI Signal Routing in STM32</title>
  <desc>Animated diagram showing how GPIO pins map to EXTI lines through SYSCFG mux, then to NVIC. PA5, PB5, PC5 share EXTI5 but only one port can be active at a time.</desc>

  <!-- Background -->
  <rect width="720" height="420" fill="#f6f8fa"/>

  <!-- Section titles -->
  <text x="85" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">GPIO Ports</text>
  <text x="300" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">SYSCFG / AFIO</text>
  <text x="510" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">EXTI Controller</text>
  <text x="660" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">NVIC</text>

  <!-- ==================== GPIO PORT BOXES ==================== -->
  <!-- Port A -->
  <rect x="15" y="40" width="140" height="100" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#3451b2;#3451b2;#e2e8f0;#e2e8f0" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="85" y="57" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Port A</text>
  <text x="30" y="78" font-size="11" fill="#666">PA0</text>
  <text x="70" y="78" font-size="11" fill="#666">PA3</text>
  <!-- PA5 pin -->
  <rect x="100" y="66" width="32" height="18" rx="3" fill="#e2e8f0" stroke="#666" stroke-width="1">
    <animate attributeName="fill" values="#3451b2;#3451b2;#e2e8f0;#e2e8f0" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#333;#333;#666;#666" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="116" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">
    <animate attributeName="fill" values="#fff;#fff;#333;#333" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    PA5
  </text>
  <text x="30" y="100" font-size="11" fill="#666">PA7</text>
  <text x="70" y="100" font-size="11" fill="#666">PA9</text>
  <text x="110" y="100" font-size="11" fill="#666">PA12</text>
  <text x="30" y="125" font-size="11" fill="#666">PA14</text>
  <text x="70" y="125" font-size="11" fill="#666">PA15</text>

  <!-- Port B -->
  <rect x="15" y="155" width="140" height="100" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="85" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Port B</text>
  <text x="30" y="193" font-size="11" fill="#666">PB0</text>
  <text x="70" y="193" font-size="11" fill="#666">PB3</text>
  <!-- PB5 pin -->
  <rect x="100" y="181" width="32" height="18" rx="3" fill="#e2e8f0" stroke="#666" stroke-width="1"/>
  <text x="116" y="194" text-anchor="middle" font-size="11" fill="#666">PB5</text>
  <text x="30" y="215" font-size="11" fill="#666">PB7</text>
  <text x="70" y="215" font-size="11" fill="#666">PB9</text>
  <text x="110" y="215" font-size="11" fill="#666">PB12</text>
  <text x="30" y="240" font-size="11" fill="#666">PB14</text>
  <text x="70" y="240" font-size="11" fill="#666">PB15</text>

  <!-- Port C -->
  <rect x="15" y="270" width="140" height="100" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="85" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Port C</text>
  <text x="30" y="308" font-size="11" fill="#666">PC0</text>
  <text x="70" y="308" font-size="11" fill="#666">PC3</text>
  <!-- PC5 pin -->
  <rect x="100" y="296" width="32" height="18" rx="3" fill="#e2e8f0" stroke="#666" stroke-width="1"/>
  <text x="116" y="309" text-anchor="middle" font-size="11" fill="#666">PC5</text>
  <text x="30" y="330" font-size="11" fill="#666">PC7</text>
  <text x="70" y="330" font-size="11" fill="#666">PC9</text>
  <text x="110" y="330" font-size="11" fill="#666">PC12</text>
  <text x="30" y="355" font-size="11" fill="#666">PC14</text>
  <text x="70" y="355" font-size="11" fill="#666">PC15</text>

  <!-- Shared pin number annotation -->
  <text x="12" y="390" text-anchor="start" font-size="12" fill="#d97706">PA5 / PB5 / PC5 all share EXTI line 5</text>

  <!-- ==================== ROUTING LINES: GPIO to SYSCFG ==================== -->
  <!-- Line from PA5 to SYSCFG input 0 (active) -->
  <line x1="155" y1="75" x2="230" y2="130" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#3451b2;#3451b2;#3451b2;#e2e8f0" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2.5;2.5;2.5;1.5" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </line>
  <!-- Line from PB5 to SYSCFG input 1 (inactive) -->
  <line x1="155" y1="190" x2="230" y2="195" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Line from PC5 to SYSCFG input 2 (inactive) -->
  <line x1="155" y1="305" x2="230" y2="260" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== SYSCFG MUX BOX ==================== -->
  <rect x="230" y="90" width="140" height="210" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#3451b2;#3451b2;#e2e8f0;#e2e8f0" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="300" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">SYSCFG</text>
  <text x="300" y="128" text-anchor="middle" font-size="11" fill="#666">EXTICR2 register</text>

  <!-- Mux selector triangle -->
  <polygon points="270,145 330,145 300,195" fill="#e2e8f0" stroke="#666" stroke-width="1">
    <animate attributeName="fill" values="#3451b2;#3451b2;#e2e8f0;#e2e8f0" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#333;#333;#666;#666" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </polygon>
  <text x="300" y="178" text-anchor="middle" font-size="11" fill="#fff">
    <animate attributeName="fill" values="#fff;#fff;#333;#333" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    SEL
  </text>

  <!-- Mux input labels -->
  <text x="248" y="148" font-size="11" fill="#3451b2">
    <animate attributeName="fill" values="#3451b2;#3451b2;#666;#666" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    PA5
  </text>
  <text x="248" y="210" font-size="11" fill="#666">PB5</text>
  <text x="248" y="268" font-size="11" fill="#666">PC5</text>

  <!-- Mux output label -->
  <text x="340" y="195" font-size="11" fill="#3451b2">
    <animate attributeName="fill" values="#3451b2;#3451b2;#666;#666" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    EXTI5
  </text>

  <!-- Key insight annotation inside SYSCFG -->
  <rect x="245" y="220" width="110" height="30" rx="4" fill="#fff" stroke="#d97706" stroke-width="1"/>
  <text x="300" y="233" text-anchor="middle" font-size="11" fill="#d97706">Only one port</text>
  <text x="300" y="246" text-anchor="middle" font-size="11" fill="#d97706">active at a time</text>

  <!-- ==================== LINE: SYSCFG to EXTI ==================== -->
  <line x1="370" y1="190" x2="420" y2="190" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#3451b2;#3451b2;#3451b2;#e2e8f0" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2.5;2.5;2.5;1.5" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </line>

  <!-- ==================== EXTI LINE BOX ==================== -->
  <rect x="420" y="60" width="120" height="70" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#e2e8f0;#3451b2;#3451b2;#e2e8f0" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="480" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">EXTI Line</text>
  <text x="480" y="100" text-anchor="middle" font-size="12" fill="#666">
    <animate attributeName="fill" values="#666;#3451b2;#3451b2;#666" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    EXTI5 active
  </text>
  <text x="480" y="118" text-anchor="middle" font-size="11" fill="#666">Edge detect</text>

  <!-- ==================== LINE: EXTI to EXTI_PR ==================== -->
  <line x1="480" y1="130" x2="480" y2="165" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#e2e8f0;#e2e8f0;#3451b2;#3451b2" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;1.5;2.5;2.5" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </line>

  <!-- ==================== EXTI PR (Pending Register) BOX ==================== -->
  <rect x="420" y="165" width="120" height="60" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#e2e8f0;#e2e8f0;#3451b2;#3451b2" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="480" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">EXTI_PR</text>
  <text x="480" y="205" text-anchor="middle" font-size="11" fill="#666">
    <animate attributeName="fill" values="#666;#666;#3451b2;#3451b2" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    PR5 = 1 (pending)
  </text>

  <!-- ==================== LINE: EXTI_PR to NVIC ==================== -->
  <line x1="540" y1="195" x2="600" y2="195" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#e2e8f0;#e2e8f0;#3451b2;#3451b2" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;1.5;2.5;2.5" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </line>

  <!-- ==================== NVIC BOX ==================== -->
  <rect x="600" y="130" width="105" height="130" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#e2e8f0;#e2e8f0;#3451b2;#3451b2" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="652" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">NVIC</text>
  <text x="652" y="172" text-anchor="middle" font-size="11" fill="#666">IRQ Pending</text>
  <!-- IRQ bit indicator -->
  <circle cx="652" cy="192" r="8" fill="#e2e8f0" stroke="#666" stroke-width="1">
    <animate attributeName="fill" values="#e2e8f0;#e2e8f0;#3451b2;#3451b2" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </circle>
  <text x="652" y="196" text-anchor="middle" font-size="11" fill="#fff">
    <animate attributeName="fill" values="#333;#333;#fff;#fff" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    !
  </text>
  <text x="652" y="220" text-anchor="middle" font-size="11" fill="#666">
    <animate attributeName="fill" values="#666;#666;#3451b2;#3451b2" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    IRQ23
  </text>
  <text x="652" y="238" text-anchor="middle" font-size="11" fill="#666">EXTI4-15</text>

  <!-- ==================== LINE: NVIC to CPU/ISR ==================== -->
  <line x1="652" y1="260" x2="652" y2="295" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#e2e8f0;#e2e8f0;#dc2626;#dc2626" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;1.5;2.5;2.5" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </line>

  <!-- ==================== CPU / ISR BOX ==================== -->
  <rect x="590" y="295" width="120" height="55" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5">
    <animate attributeName="stroke" values="#e2e8f0;#e2e8f0;#dc2626;#dc2626" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="650" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">
    <animate attributeName="fill" values="#333;#333;#dc2626;#dc2626" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    CPU jumps to ISR
  </text>
  <text x="650" y="336" text-anchor="middle" font-size="11" fill="#3eaf7c">
    <animate attributeName="fill" values="#666;#666;#3eaf7c;#3eaf7c" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    EXTI9_5_IRQHandler()
  </text>

  <!-- ==================== CONTINUOUS ANIMATION: Pulsing signal dot ==================== -->
  <!-- A dot that travels the full signal path continuously, dur=3s divides 12s -->
  <circle r="4" fill="#3451b2">
    <animate attributeName="cx" values="140;300;480;480;652;652;140" keyTimes="0;0.167;0.333;0.5;0.667;0.833;1" dur="6s" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="cy" values="75;190;95;195;195;310;75" keyTimes="0;0.167;0.333;0.5;0.667;0.833;1" dur="6s" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;1;1;1;0" keyTimes="0;0.167;0.333;0.5;0.667;0.833;1" dur="6s" calcMode="discrete" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== STAGE LABELS ==================== -->
  <rect x="15" y="398" width="690" height="18" rx="3" fill="#e2e8f0"/>
  <text x="95" y="411" text-anchor="middle" font-size="11" fill="#333">
    <animate attributeName="font-weight" values="bold;normal;normal;normal" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    1. GPIO pin event
  </text>
  <text x="270" y="411" text-anchor="middle" font-size="11" fill="#333">
    <animate attributeName="font-weight" values="normal;bold;normal;normal" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    2. SYSCFG routes to EXTI5
  </text>
  <text x="460" y="411" text-anchor="middle" font-size="11" fill="#333">
    <animate attributeName="font-weight" values="normal;normal;bold;normal" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    3. Pending bit set
  </text>
  <text x="630" y="411" text-anchor="middle" font-size="11" fill="#333">
    <animate attributeName="font-weight" values="normal;normal;normal;bold" keyTimes="0;0.25;0.5;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    4. NVIC fires ISR
  </text>
</svg>
