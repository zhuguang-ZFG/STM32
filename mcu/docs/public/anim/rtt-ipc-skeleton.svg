<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>RT-Thread IPC 五种武器一副骨架</title>
  <desc>四阶段动画：RT-Thread 五种 IPC（信号量/互斥量/事件集/邮箱/消息队列）拆开全是同一副骨架：一个对象头 rt_object + 一个资源计数/存储区 + 一条按优先级排队的挂起列表 suspend list。创建时一个标志位决定排队秩序是 FIFO 还是 PRIO。挂起统一走 rt_ipc_list_suspend，唤醒统一走 rt_ipc_list_resume。五张皮一副骨架——信号量计数令牌、互斥量带持有者与继承、事件集 32 位旗语、邮箱定长 4 字节池、消息队列变长环形队。图上有一个真在跑的等待线程：从挂起列表尾部排进，被 resume 时从头部唤醒。</desc>
  <rect width="720" height="460" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">RT-Thread IPC：五种武器，一副骨架</text>
  <text x="24" y="50" font-size="12" fill="#666">信号量/互斥量/事件集/邮箱/消息队列——差异只在资源区，骨架全是 rt_object + 资源 + 挂起列表</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 左侧 IPC 卡片 -->
  <rect x="40" y="86" width="130" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="105" y="103" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">信号量</text>
  <text x="105" y="118" font-size="11" fill="#666" text-anchor="middle">count 计数令牌</text>

  <rect x="40" y="136" width="130" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="105" y="153" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">互斥量</text>
  <text x="105" y="168" font-size="11" fill="#666" text-anchor="middle">owner + 优先级继承</text>

  <rect x="40" y="186" width="130" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="105" y="203" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">事件集</text>
  <text x="105" y="218" font-size="11" fill="#666" text-anchor="middle">32 位旗语 set</text>

  <!-- 右侧 IPC 卡片 -->
  <rect x="550" y="110" width="130" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="615" y="127" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">邮箱</text>
  <text x="615" y="142" font-size="11" fill="#666" text-anchor="middle">定长 4 字节池</text>

  <rect x="550" y="170" width="130" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="615" y="187" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">消息队列</text>
  <text x="615" y="202" font-size="11" fill="#666" text-anchor="middle">变长环形队列</text>

  <!-- 中央：通用 IPC 骨架 -->
  <rect x="240" y="80" width="240" height="160" rx="8" fill="#ffffff" stroke="#3451b2" stroke-width="1.5"/>
  <text x="360" y="100" font-size="13" font-weight="bold" fill="#3451b2" text-anchor="middle">通用 IPC 骨架</text>

  <!-- ① rt_object 头 -->
  <rect x="256" y="110" width="208" height="26" rx="4" fill="#dbeafe"/>
  <text x="360" y="128" font-size="11" fill="#3451b2" text-anchor="middle">① rt_object 头（type / flag / list）</text>

  <!-- ② 资源计数/存储区 -->
  <rect x="256" y="140" width="208" height="26" rx="4" fill="#fef3c7"/>
  <text x="360" y="158" font-size="11" fill="#92400e" text-anchor="middle">② 资源计数 / 存储区</text>

  <!-- ③ 挂起列表 -->
  <rect x="256" y="170" width="208" height="62" rx="4" fill="#dcfce7"/>
  <text x="360" y="184" font-size="11" fill="#166534" text-anchor="middle">③ 挂起列表 suspend list</text>
  <rect x="266" y="192" width="36" height="32" rx="3" fill="#ffffff" stroke="#1a7f56"/>
  <text x="284" y="212" font-size="11" fill="#1a7f56" text-anchor="middle">头</text>
  <rect x="306" y="192" width="36" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="346" y="192" width="36" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="386" y="192" width="36" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="432" y="212" font-size="11" fill="#166534" text-anchor="middle">尾</text>

  <!-- 箭头：卡片 → 中央骨架 -->
  <line x1="170" y1="105" x2="234" y2="105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="155" x2="234" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="205" x2="234" y2="205" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="129" x2="486" y2="129" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="189" x2="486" y2="189" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 连续运动：等待线程从尾部排进、从头部唤醒 -->
  <circle cx="432" cy="208" r="5" fill="#3eaf7c">
    <animate attributeName="cx" values="432;284;432" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="360" y="248" font-size="11" fill="#3eaf7c" text-anchor="middle">等待线程：尾部排进 → resume 时从头部唤醒</text>

  <!-- 阶段一：通用骨架三件套 -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="266" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="288" font-size="13" font-weight="bold" fill="#3451b2">① 通用骨架三件套：头 + 资源区 + 挂起列表</text>
    <text x="56" y="312" font-size="13" fill="#333">每个 IPC 对象都是一个 rt_object（type/flag/双向链表节点），管注册与命名。</text>
    <text x="56" y="336" font-size="13" fill="#333">中间是资源计数或存储区（信号量的 count、邮箱的池），管 IPC 的语义。</text>
    <text x="56" y="360" font-size="13" fill="#333">尾巴是挂起列表 suspend list，等资源的线程在这排队。</text>
    <text x="56" y="380" font-size="11" fill="#d97706">三件套缺一不可：头管注册、资源区管语义、挂起列表管等待。</text>
  </g>

  <!-- 阶段二：五种 IPC 的差异字段 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="266" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="288" font-size="13" font-weight="bold" fill="#3451b2">② 五张皮一副骨架：差异只在资源区</text>
    <text x="56" y="312" font-size="13" fill="#333">信号量 count 计数令牌；互斥量 owner + 优先级继承；事件集 32 位 set 可 OR/AND。</text>
    <text x="56" y="336" font-size="13" fill="#333">邮箱定长 4 字节池存指针或 32 位值；消息队列变长环形队列拷贝发送。</text>
    <text x="56" y="360" font-size="12" font-family="Consolas,monospace" fill="#333">struct rt_semaphore / rt_mutex / rt_event / rt_mailbox / rt_mq</text>
    <text x="56" y="380" font-size="11" fill="#3eaf7c">五个结构体首字段都是 rt_object，差别只在中间那一段——五张皮一副骨架。</text>
  </g>

  <!-- 阶段三：FIFO vs PRIO 两秩序 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="266" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="288" font-size="13" font-weight="bold" fill="#1a7f56">③ FIFO vs PRIO：一个标志位切换排队秩序</text>
    <text x="56" y="312" font-size="13" fill="#333">创建时 rt_ipc_flag 的值决定排队秩序：RT_IPC_FLAG_FIFO 先来先服务。</text>
    <text x="56" y="336" font-size="13" fill="#333">RT_IPC_FLAG_PRIO 按线程优先级排队，高优先级先唤醒——抢救紧急任务。</text>
    <text x="56" y="360" font-size="12" font-family="Consolas,monospace" fill="#333">rt_sem_create("sem0", 1, RT_IPC_FLAG_PRIO);  // 默认 PRIO</text>
    <text x="56" y="380" font-size="11" fill="#3eaf7c">同一副骨架，秩序由一个标志位切换——这就是"五张皮一副骨架"的精髓。</text>
  </g>

  <!-- 阶段四：挂起/唤醒统一路径 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="266" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="288" font-size="13" font-weight="bold" fill="#d97706">④ 挂起/唤醒统一路径：suspend 尾进 resume 头出</text>
    <text x="56" y="312" font-size="13" fill="#333">挂起：rt_ipc_list_suspend 把线程挂到挂起列表，按 FIFO 或 PRIO 秩序插入。</text>
    <text x="56" y="336" font-size="13" fill="#333">唤醒：rt_ipc_list_resume 从挂起列表取一个线程唤醒，释放资源时统一调用。</text>
    <text x="56" y="360" font-size="12" font-family="Consolas,monospace" fill="#333">rt_ipc_list_suspend(thread, &amp;ipc->suspend_list, ipc->parent.flag);</text>
    <text x="56" y="380" font-size="11" fill="#3eaf7c">五种 IPC 走同一条挂起/唤醒路径，差异只在资源区的操作——图上圆点在演示。</text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">① 三件套：rt_object 头 + 资源区 + 挂起列表</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">② 五张皮：五 IPC 差异只在资源区字段</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">③ 两秩序：FIFO vs PRIO 由创建标志位切换</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">④ 统一路径：suspend 尾进 resume 头出</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,438)" fill="#3451b2">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>
