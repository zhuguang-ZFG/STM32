<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>工具链接力赛：四件套把 C 源码变成 ARM 机器码</title>
  <desc>四阶段动画：预处理→编译→汇编→链接，展示 x86 主机上的 gcc/binutils 如何接力产出 ARM 目标固件</desc>

  <rect width="720" height="440" fill="#f6f8fa"/>

  <!-- Stage 1: Preprocess -->
  <text x="20" y="22" font-size="13" font-weight="bold" fill="#3451b2">① 预处理（gcc -E）</text>
  <rect x="20" y="30" width="160" height="110" rx="4" fill="#ffffff" stroke="#3451b2" stroke-width="1.5"/>
  <text x="30" y="50" font-size="11" fill="#333">
    <tspan x="30" dy="0" fill="#666">输入：main.c</tspan>
    <tspan x="30" dy="16" font-family="monospace" font-size="10">#include 展开</tspan>
    <tspan x="30" dy="15" font-family="monospace" font-size="10">#define 替换</tspan>
    <tspan x="30" dy="15" font-family="monospace" font-size="10">#if 条件求值</tspan>
    <tspan x="30" dy="16" fill="#3eaf7c">输出：main.i</tspan>
  </text>

  <!-- Arrow 1→2 -->
  <path d="M180,85 L200,85" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Stage 2: Compile -->
  <text x="200" y="22" font-size="13" font-weight="bold" fill="#3eaf7c">② 编译（gcc -S）</text>
  <rect x="200" y="30" width="160" height="110" rx="4" fill="#ffffff" stroke="#3eaf7c" stroke-width="1.5"/>
  <text x="210" y="50" font-size="11" fill="#333">
    <tspan x="210" dy="0" fill="#666">输入：main.i</tspan>
    <tspan x="210" dy="16" font-family="monospace" font-size="10">语法分析</tspan>
    <tspan x="210" dy="15" font-family="monospace" font-size="10">优化（-Og/-O2）</tspan>
    <tspan x="210" dy="15" font-family="monospace" font-size="10">C → ARM 汇编</tspan>
    <tspan x="210" dy="16" fill="#3eaf7c">输出：main.s</tspan>
  </text>

  <!-- Arrow 2→3 -->
  <path d="M360,85 L380,85" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Stage 3: Assemble -->
  <text x="380" y="22" font-size="13" font-weight="bold" fill="#d97706">③ 汇编（as）</text>
  <rect x="380" y="30" width="160" height="110" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="50" font-size="11" fill="#333">
    <tspan x="390" dy="0" fill="#666">输入：main.s</tspan>
    <tspan x="390" dy="16" font-family="monospace" font-size="10">汇编 → 机器码</tspan>
    <tspan x="390" dy="15" font-family="monospace" font-size="10">符号表生成</tspan>
    <tspan x="390" dy="15" font-family="monospace" font-size="10">重定位信息</tspan>
    <tspan x="390" dy="16" fill="#3eaf7c">输出：main.o</tspan>
  </text>

  <!-- Arrow 3→4 -->
  <path d="M540,85 L560,85" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Stage 4: Link -->
  <text x="560" y="22" font-size="13" font-weight="bold" fill="#dc2626">④ 链接（ld）</text>
  <rect x="560" y="30" width="140" height="110" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="570" y="50" font-size="11" fill="#333">
    <tspan x="570" dy="0" fill="#666">输入：.o + .a</tspan>
    <tspan x="570" dy="16" font-family="monospace" font-size="10">符号解析</tspan>
    <tspan x="570" dy="15" font-family="monospace" font-size="10">段合并</tspan>
    <tspan x="570" dy="15" font-family="monospace" font-size="10">地址分配（.ld）</tspan>
    <tspan x="570" dy="16" fill="#3eaf7c">输出：firmware.elf</tspan>
  </text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- Cross-compilation context -->
  <rect x="20" y="160" width="340" height="100" rx="6" fill="#ffffff" stroke="#3451b2" stroke-width="2"/>
  <text x="30" y="180" font-size="12" font-weight="bold" fill="#3451b2">交叉编译：在"鸡"上孵"鸭"蛋</text>
  <text x="30" y="200" font-size="11" fill="#333">
    <tspan x="30" dy="0">build = x86-64（你的 PC）</tspan>
    <tspan x="30" dy="16">host = x86-64（工具链跑在 PC）</tspan>
    <tspan x="30" dy="16">target = ARM Cortex-M4（芯片）</tspan>
    <tspan x="30" dy="16" fill="#d97706" font-weight="bold">arm-none-eabi- 前缀 = 身份铭牌</tspan>
  </text>

  <!-- Four tools summary -->
  <rect x="380" y="160" width="320" height="100" rx="6" fill="#ffffff" stroke="#3eaf7c" stroke-width="2"/>
  <text x="390" y="180" font-size="12" font-weight="bold" fill="#3eaf7c">四件套口诀</text>
  <text x="390" y="200" font-size="11" fill="#333" font-family="monospace">
    <tspan x="390" dy="0" fill="#3451b2">gcc</tspan>
    <tspan> → 总指挥（编译+链接调度）</tspan>
    <tspan x="390" dy="16" fill="#3451b2">binutils</tspan>
    <tspan> → 七兵器（as/ld/nm/objdump...）</tspan>
    <tspan x="390" dy="16" fill="#3451b2">newlib</tspan>
    <tspan> → 裸机口粮（精简 C 库）</tspan>
    <tspan x="390" dy="16" fill="#3451b2">gdb</tspan>
    <tspan> → 随队医生（调试）</tspan>
  </text>

  <!-- newlib hooks -->
  <rect x="20" y="275" width="680" height="75" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="30" y="295" font-size="12" font-weight="bold" fill="#d97706">newlib 钩子：裸机也能用 printf</text>
  <text x="30" y="315" font-size="11" fill="#333">
    <tspan x="30" dy="0">glibc 依赖 Linux 系统调用 → 裸机用不了。newlib 把"系统相关"抽成钩子：</tspan>
    <tspan x="30" dy="16" font-family="monospace">_write()</tspan>
    <tspan> → 你实现它把字节塞进 UART → printf 走串口（S7 实操）</tspan>
    <tspan x="30" dy="16" fill="#666" font-style="italic">同一份 printf，钩子不同，出口不同：串口 / ITM / Semihosting</tspan>
  </text>

  <!-- Bottom: self-check -->
  <rect x="20" y="365" width="680" height="60" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="30" y="385" font-size="12" font-weight="bold" fill="#dc2626">自查三命令</text>
  <text x="30" y="405" font-size="11" fill="#333" font-family="monospace">
    <tspan x="30" dy="0">arm-none-eabi-gcc --version</tspan>
    <tspan fill="#666"> → 版本</tspan>
    <tspan x="300" dy="0">-print-search-dirs</tspan>
    <tspan fill="#666"> → 搜索路径</tspan>
    <tspan x="520" dy="0">where gcc</tspan>
    <tspan fill="#666"> → PATH 优先级</tspan>
  </text>

  <!-- Continuous animation: relay baton smoothly flowing through 4 stages -->
  <circle r="6" fill="#dc2626" opacity="0.8">
    <animate attributeName="cx" values="100;280;460;630;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="85;85;85;85;85" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
