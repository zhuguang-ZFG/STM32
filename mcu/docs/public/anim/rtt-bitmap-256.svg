<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>RT-Thread 二级位图：32×8 实现 256 级优先级选优</title>
  <desc>四阶段动画：RT-Thread 的二级位图选优：256 级优先级用 32×8 两级行实现。第一级 rt_thread_ready_priority_group 是 32 位，每 bit 对应一个 ready_table[8] 字节；第二级每个字节 8 位管 8 个优先级。选优两步：① 对 ready_priority_group 做 CLZ 找到最高非空字节索引（0-31），② 对该字节再做 CLZ 找到字节内最高位（0-7），两者组合 index*8+bit 即最高优先级（0-255，0 最高）。与 FreeRTOS 单级 32 位位图对比：单级一次 CLZ 完事最多 32 级，二级两次 CLZ/查表到 256 级，都是 O(1)。图上有一个真在跑的查表指针：先在 32 字节条上扫到最高非空字节，再钻进该字节的 8 位里扫到最高位。</desc>
  <rect width="720" height="460" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">RT-Thread 二级位图：32×8 = 256 级优先级 O(1) 选优</text>
  <text x="24" y="50" font-size="12" fill="#666">第一级 32 位找非空字节，第二级 8 位找字节内最高位，两次 CLZ 拼出 0-255</text>

  <!-- 第一级：32 字节条 ready_priority_group -->
  <text x="40" y="74" font-size="11" fill="#57606a">rt_thread_ready_priority_group（32 位，每 bit 管一个 ready_table[i] 字节）</text>
  <rect x="40" y="80" width="640" height="20" fill="#f1f5f9" stroke="#cbd5e1"/>
  <path d="M60 80v20 M80 80v20 M100 80v20 M120 80v20 M140 80v20 M160 80v20 M180 80v20 M200 80v20 M220 80v20 M240 80v20 M260 80v20 M280 80v20 M300 80v20 M320 80v20 M340 80v20 M360 80v20 M380 80v20 M400 80v20 M420 80v20 M440 80v20 M460 80v20 M480 80v20 M500 80v20 M520 80v20 M540 80v20 M560 80v20 M580 80v20 M600 80v20 M620 80v20 M640 80v20 M660 80v20" stroke="#cbd5e1" fill="none"/>
  <rect x="140" y="80" width="20" height="20" fill="#dbe7ff" stroke="#3451b2" stroke-width="1.5"/>
  <text x="50" y="94" font-size="11" fill="#94a3b8" text-anchor="middle">0</text>
  <text x="150" y="94" font-size="11" fill="#3451b2" text-anchor="middle" font-weight="bold">5</text>
  <text x="670" y="94" font-size="11" fill="#94a3b8" text-anchor="middle">31</text>

  <!-- 第二级：8 位条 ready_table[5] -->
  <text x="40" y="128" font-size="11" fill="#57606a">ready_table[5]（8 位，展开第 5 个字节看 bit 级）</text>
  <rect x="240" y="134" width="320" height="20" fill="#f1f5f9" stroke="#cbd5e1"/>
  <path d="M280 134v20 M320 134v20 M360 134v20 M400 134v20 M440 134v20 M480 134v20 M520 134v20" stroke="#cbd5e1" fill="none"/>
  <rect x="320" y="134" width="40" height="20" fill="#d8f3e5" stroke="#1a7f56" stroke-width="1.5"/>
  <text x="260" y="148" font-size="11" fill="#94a3b8" text-anchor="middle">bit0</text>
  <text x="340" y="148" font-size="11" fill="#1a7f56" text-anchor="middle" font-weight="bold">2</text>
  <text x="540" y="148" font-size="11" fill="#94a3b8" text-anchor="middle">bit7</text>

  <!-- 连续运动：查表指针1 在 32 字节条上扫描（阶段2可见） -->
  <circle cx="50" cy="90" r="4" fill="#3451b2" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="50;150;50" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 连续运动：查表指针2 在 8 位条上扫描（阶段3可见） -->
  <circle cx="260" cy="144" r="4" fill="#1a7f56" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="260;340;260" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 公式区 -->
  <rect x="40" y="174" width="640" height="52" rx="6" fill="#fff7ed" stroke="#d0d7de"/>
  <text x="56" y="198" font-size="13" font-family="Consolas,monospace" fill="#92400e">CLZ(group) = 5  →  CLZ(ready_table[5]) = 2  →  priority = 5×8 + 2 = 42</text>
  <text x="56" y="218" font-size="11" fill="#666">FreeRTOS 单级 32 位：一次 CLZ 最多 32 级；RT-Thread 二级 32×8：两次 CLZ 到 256 级，都 O(1)</text>

  <!-- 阶段一：32 级不够要 256 -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="266" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="288" font-size="13" font-weight="bold" fill="#3451b2">① 32 级不够要 256：单级位图的天花板</text>
    <text x="56" y="312" font-size="13" fill="#333">FreeRTOS 用一个 32 位变量 + CLZ，一次到位最多管 32 级优先级。</text>
    <text x="56" y="336" font-size="13" fill="#333">RT-Thread 要支持 256 级，一个 32 位装不下——得上"两级位图"。</text>
    <text x="56" y="360" font-size="12" font-family="Consolas,monospace" fill="#333">32 位 × 8 位 = 256 级：group(32) × ready_table[32](每字节 8 位)</text>
    <text x="56" y="380" font-size="11" fill="#d97706">思路同：用位图把"找最高优先级"变成 CLZ，只是从一级索引变两级索引。</text>
  </g>

  <!-- 阶段二：第一级 32 字节扫 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="266" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="288" font-size="13" font-weight="bold" fill="#3451b2">② 第一级：32 字节条扫——找最高非空字节</text>
    <text x="56" y="312" font-size="13" fill="#333">rt_thread_ready_priority_group 是 32 位，每 bit 对应一个 ready_table[i] 字节。</text>
    <text x="56" y="336" font-size="13" fill="#333">bit=1 表示该字节有就绪线程，bit=0 表示空。对 group 做 CLZ 找最高非空字节。</text>
    <text x="56" y="360" font-size="12" font-family="Consolas,monospace" fill="#333">index = __builtin_clz(rt_thread_ready_priority_group)  // 0-31</text>
    <text x="56" y="380" font-size="11" fill="#3eaf7c">图上指针扫到 index=5：第 5 个字节非空，前 5 位为空，5 就是最高。</text>
  </g>

  <!-- 阶段三：第二级 8 位钻 -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="266" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="288" font-size="13" font-weight="bold" fill="#1a7f56">③ 第二级：8 位钻——找字节内最高位</text>
    <text x="56" y="312" font-size="13" fill="#333">对 ready_table[index] 字节再做 CLZ，找字节内最高位 bit（0-7）。</text>
    <text x="56" y="336" font-size="13" fill="#333">bit=1 表示该优先级有就绪线程。这一步只看一个字节，8 位范围。</text>
    <text x="56" y="360" font-size="12" font-family="Consolas,monospace" fill="#333">bit = __builtin_clz(ready_table[index])  // 0-7</text>
    <text x="56" y="380" font-size="11" fill="#3eaf7c">图上指针钻到 bit=2：第 5 字节的 bit2 非空，前 2 位为空，2 就是最高。</text>
  </g>

  <!-- 阶段四：组合得优先级 O(1) -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="266" width="640" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="288" font-size="13" font-weight="bold" fill="#d97706">④ 组合得优先级 O(1)：index×8 + bit = 256 级选优</text>
    <text x="56" y="312" font-size="13" fill="#333">priority = index*8 + bit（0 最高，255 最低），两次 CLZ 都是 O(1)。</text>
    <text x="56" y="336" font-size="13" fill="#333">单级一次 CLZ 32 级 vs 二级两次 CLZ 256 级，都是 O(1)——这就是 RT-Thread 256 级 O(1) 的根。</text>
    <text x="56" y="360" font-size="12" font-family="Consolas,monospace" fill="#333">highest_ready_priority = index * 8 + bit;  // 5*8+2 = 42</text>
    <text x="56" y="380" font-size="11" fill="#3eaf7c">要 1024 级？再加一级成 32×32×8，思路不变，仍是 O(1)。</text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">① 32 级不够：FreeRTOS 单级位图天花板是 32</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">② 第一级扫：32 位 group 做 CLZ 找非空字节</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">③ 第二级钻：字节内 8 位再做 CLZ 找最高位</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="420">④ 组合 O(1)：index×8+bit = 256 级选优仍是 O(1)</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,438)" fill="#3451b2">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>
