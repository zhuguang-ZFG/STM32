<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="Preserve the fault snapshot, then decode">
<title>Preserve the fault snapshot, then decode</title>
<style>

      @keyframes fault-valid-route {
        0%,16%{transform:translate(0,0)} 24%{transform:translate(0,22px)}
        50%,62%{transform:translate(-208px,22px)} 82%,100%{transform:translate(-208px,48px)}
      }
      @keyframes fault-invalid-route {
        0%,16%{transform:translate(0,0)} 24%{transform:translate(0,22px)}
        50%,62%{transform:translate(208px,22px)} 82%,100%{transform:translate(208px,48px)}
      }
      .fault-valid{animation:fault-valid-route 6s linear infinite;opacity:.8}
      .fault-invalid{animation:fault-invalid-route 6s linear infinite;opacity:.8}
      @media(prefers-reduced-motion:reduce){.fault-dot{animation:none!important;display:none}}
      @media print{.fault-dot{animation:none!important;display:none}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<metadata>FA-002 · IG-008 · knowledge-track branch</metadata>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#7a4e00" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">HardFault：先保存，再判读地址</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103 · BFARVALID = CFSR bit 15</text>
<rect x="846" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="862" y="33.32" font-size="12" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">17</text>
<rect x="40" y="100" width="820" height="108" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="60" y="132" font-size="19" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">保存 BFAR / MMFAR，再检查对应 VALID 位</text>
<text x="60" y="164" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">同时保留 HFSR、CFSR、EXC_RETURN 与异常栈；避免嵌套异常更新现场。</text>
<text x="60" y="191" font-size="14" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HFSR.FORCED = bit 30：进一步解码保存的 CFSR。</text>
<line x1="450" y1="208" x2="450" y2="242" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="242" y1="242" x2="658" y2="242" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="242" y1="242" x2="242" y2="273" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="242.00,280.00 238.50,273.00 245.50,273.00" fill="#1b5c45" opacity="1"/>
<line x1="658" y1="242" x2="658" y2="273" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="658.00,280.00 654.50,273.00 661.50,273.00" fill="#8f2d2d" opacity="1"/>
<rect x="40" y="280" width="400" height="124" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="60" y="313" font-size="19" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">bit 15 = 1</text>
<text x="60" y="347" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">BFAR 地址有效</text>
<text x="60" y="381" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">继续结合故障类型与指令分析</text>
<rect x="460" y="280" width="400" height="124" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="480" y="313" font-size="19" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">bit 15 = 0</text>
<text x="480" y="347" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">弃用 BFAR 地址</text>
<text x="480" y="381" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">地址看起来合理也不能采用</text>
<circle cx="450" cy="220" r="6" fill="#1b5c45" opacity="1" class="fault-dot fault-valid"/>
<circle cx="450" cy="220" r="6" fill="#8f2d2d" opacity="1" class="fault-dot fault-invalid"/>
<text x="40" y="437" font-size="15" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">IMPRECISERR：PC 可能滞后；STKERR / MSTKERR：栈帧可能不完整。</text>
<text x="40" y="465" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">addr2line 使用同一 ELF 与可信的栈 PC；BFAR 是访问地址。</text>
<line x1="40" y1="490" x2="860" y2="490" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="40" y="520" font-size="16" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">另一个实验：DWT Δ = 72，在 72 MHz 下换算为 1 µs。</text>
<text x="40" y="546" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">需同时使能 TRCENA 与 CYCCNTENA；不属于故障地址判读流程。</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · ARM DUI0552A §4.3.10–4.3.15 · 两种有效位结果的分支示意</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32 知识库</text>
</svg>
