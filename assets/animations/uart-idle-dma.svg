<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="UART + DMA + IDLE：两类接收契约">
<title>UART + DMA + IDLE：两类接收契约</title>
<style>
@keyframes bus0-sq{0%,0.00%{opacity:0.06}0.30%,6.25%{opacity:0.5}6.55%,100%{opacity:0.06}}
.bus0{animation:bus0-sq 6.0s linear infinite;}
@keyframes bus1-sq{0%,12.50%{opacity:0.06}12.80%,18.75%{opacity:0.5}19.05%,100%{opacity:0.06}}
.bus1{animation:bus1-sq 6.0s linear infinite;}
@keyframes bus2-sq{0%,25.00%{opacity:0.06}25.30%,31.25%{opacity:0.5}31.55%,100%{opacity:0.06}}
.bus2{animation:bus2-sq 6.0s linear infinite;}
@keyframes bus3-sq{0%,37.50%{opacity:0.06}37.80%,43.75%{opacity:0.5}44.05%,100%{opacity:0.06}}
.bus3{animation:bus3-sq 6.0s linear infinite;}
@keyframes bus4-sq{0%,50.00%{opacity:0.06}50.30%,56.25%{opacity:0.5}56.55%,100%{opacity:0.06}}
.bus4{animation:bus4-sq 6.0s linear infinite;}
@keyframes bus5-sq{0%,62.50%{opacity:0.06}62.80%,68.75%{opacity:0.5}69.05%,100%{opacity:0.06}}
.bus5{animation:bus5-sq 6.0s linear infinite;}
@keyframes bus6-sq{0%,75.00%{opacity:0.06}75.30%,81.25%{opacity:0.5}81.55%,100%{opacity:0.06}}
.bus6{animation:bus6-sq 6.0s linear infinite;}
@keyframes bus7-sq{0%,87.50%{opacity:0.06}87.80%,93.75%{opacity:0.5}94.05%,100%{opacity:0.06}}
.bus7{animation:bus7-sq 6.0s linear infinite;}
@keyframes busscan-tx{0%{transform:translateX(0px)}100%{transform:translateX(780px)}}
.busscan{animation:busscan-tx 6s linear infinite 0s;}
@keyframes dmafill-kf{0%,55%{opacity:0}62%,88%{opacity:.22}94%,100%{opacity:0}}
.dmafill{animation:dmafill-kf 6s linear infinite;}

.loopa{stroke-dasharray:10 14;animation:loopa-flow 2.4s linear infinite;}@keyframes loopa-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-24px}}

.loopb{stroke-dasharray:10 14;animation:loopb-flow 2.4s linear infinite;}@keyframes loopb-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-24px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#7a4e00" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">UART + DMA + IDLE：两类接收契约</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Size 是首个未写位置；交给业务的永远是新增字节区间</text>
<rect x="828" y="15" width="50" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="853" y="33.32" font-size="12" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">附录 A</text>
<rect x="40" y="83" width="3" height="18" fill="#075e84" opacity="1"/>
<text x="52" y="96" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">① 总线：字节成阵到达，间隙触发 IDLE</text>
