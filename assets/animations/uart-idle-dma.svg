<rect x="60" y="128" width="38" height="44" fill="#1b5c45" opacity="0.14" rx="4" class="bus0"/>
<rect x="104" y="128" width="38" height="44" fill="#f1f5f7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<text x="123" y="155" font-size="11" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">D1</text>
<rect x="104" y="128" width="38" height="44" fill="#1b5c45" opacity="0.14" rx="4" class="bus1"/>
<rect x="148" y="128" width="38" height="44" fill="#f1f5f7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<text x="167" y="155" font-size="11" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">D2</text>
<rect x="148" y="128" width="38" height="44" fill="#1b5c45" opacity="0.14" rx="4" class="bus2"/>
<rect x="192" y="128" width="38" height="44" fill="#f1f5f7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<text x="211" y="155" font-size="11" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">D3</text>
<rect x="192" y="128" width="38" height="44" fill="#1b5c45" opacity="0.14" rx="4" class="bus3"/>
<rect x="236" y="128" width="38" height="44" fill="#f1f5f7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<text x="255" y="155" font-size="11" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">D4</text>
<rect x="236" y="128" width="38" height="44" fill="#1b5c45" opacity="0.14" rx="4" class="bus4"/>
<rect x="280" y="128" width="38" height="44" fill="none" opacity="1" rx="4" stroke="#7a4e00" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="324" y="128" width="38" height="44" fill="none" opacity="1" rx="4" stroke="#7a4e00" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="368" y="128" width="38" height="44" fill="none" opacity="1" rx="4" stroke="#7a4e00" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="336" y="122" font-size="10.5" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">空闲 ≥ 1 帧</text>
<rect x="412" y="128" width="38" height="44" fill="#f1f5f7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<rect x="412" y="128" width="38" height="44" fill="#1b5c45" opacity="0.14" rx="4" class="bus5"/>
<rect x="456" y="128" width="38" height="44" fill="#f1f5f7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<rect x="456" y="128" width="38" height="44" fill="#1b5c45" opacity="0.14" rx="4" class="bus6"/>
<rect x="500" y="128" width="38" height="44" fill="#f1f5f7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<rect x="500" y="128" width="38" height="44" fill="#1b5c45" opacity="0.14" rx="4" class="bus7"/>
<path d="M406 110 L406 84" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#8f2d2d" stroke-width="2"/>
<path d="M396 88 L406 84 L396 96 Z" fill="#8f2d2d" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420" y="92" font-size="11" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">IDLE 事件</text>
<line x1="60" y1="120" x2="60" y2="186" stroke="#8f2d2d" stroke-width="1.5" stroke-linecap="round" opacity="1" class="busscan"/>
<rect x="40" y="213" width="3" height="18" fill="#5b3a8c" opacity="1"/>
<text x="52" y="226" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">② DMA 缓冲（cap = 128）：Size = 首个未写位置</text>
<rect x="60" y="244" width="640" height="46" fill="#f1f5f7" opacity="1" rx="4" stroke="#5e6872" stroke-width="1.5"/>
<line x1="100" y1="244" x2="100" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="140" y1="244" x2="140" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="180" y1="244" x2="180" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="220" y1="244" x2="220" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="260" y1="244" x2="260" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="300" y1="244" x2="300" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="340" y1="244" x2="340" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="380" y1="244" x2="380" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="420" y1="244" x2="420" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="460" y1="244" x2="460" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="500" y1="244" x2="500" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="540" y1="244" x2="540" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="580" y1="244" x2="580" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="620" y1="244" x2="620" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<line x1="660" y1="244" x2="660" y2="290" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="60" y="244" width="280" height="46" fill="#5b3a8c" opacity="0.2" rx="4" class="dmafill"/>
<path d="M340.0 236 L340.0 296" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#8f2d2d" stroke-width="2"/>
<text x="348" y="234" font-size="11" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Size = 7（范围 1..128）</text>
<text x="64" y="308" font-size="10" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0</text>
<text x="676" y="308" font-size="10" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">127</text>
<text x="380" y="308" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HT 在半缓冲（契约 B 才用）</text>
<rect x="40" y="340" width="400" height="200" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="60" y="366" font-size="13" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">契约 A：Normal，每次重新武装</text>
<circle cx="70" cy="392" r="4" fill="#075e84" opacity="1"/>
<text x="84" y="396" font-size="11" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ReceiveToIdle_DMA 后立即关 HT 中断</text>
<circle cx="70" cy="422" r="4" fill="#075e84" opacity="1"/>
<text x="84" y="426" font-size="11" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">IDLE（或 TC）触发 RxEventCallback(Size)</text>
<circle cx="70" cy="452" r="4" fill="#075e84" opacity="1"/>
<text x="84" y="456" font-size="11" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">复制 [0, Size) 进软件队列，溢出计数</text>
<circle cx="70" cy="482" r="4" fill="#075e84" opacity="1"/>
<text x="84" y="486" font-size="11" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">回调里重新武装，并再次关 HT</text>
<path d="M390 520 C400 545 320 552 240 552 S90 545 96 522" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#075e84" stroke-width="1.5" stroke-dasharray="5 4" class="loopa"/>
<rect x="460" y="340" width="400" height="200" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="480" y="366" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">契约 B：Circular，三事件取模</text>
<circle cx="490" cy="392" r="4" fill="#1b5c45" opacity="1"/>
<text x="504" y="396" font-size="11" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">开 HT、TC、IDLE 三个回调来源</text>
<circle cx="490" cy="422" r="4" fill="#1b5c45" opacity="1"/>
<text x="504" y="426" font-size="11" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">new = (Size - old_pos) mod cap</text>
<circle cx="490" cy="452" r="4" fill="#1b5c45" opacity="1"/>
<text x="504" y="456" font-size="11" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">只把新增区间交给业务，再 old_pos = Size</text>
<circle cx="490" cy="482" r="4" fill="#1b5c45" opacity="1"/>
<text x="504" y="486" font-size="11" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">回卷照常；队列满则 dropped_bytes += 1</text>
<path d="M810 520 C820 548 740 556 660 556 S510 548 516 524" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#1b5c45" stroke-width="1.5" stroke-dasharray="5 4" class="loopb"/>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不变量：DMA 写区应用不改写；Size 不是“本次长度”；交给业务的是新增字节区间；静默覆盖不算可靠接收</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
