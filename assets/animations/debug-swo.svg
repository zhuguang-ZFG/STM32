<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="调试与跟踪：SWD + SWO/ITM">
<style>
@keyframes swd-run{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(110px);opacity:0}}@keyframes swo-run{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(-110px);opacity:0}}.wSWDIO{animation:swd-run 1.6s linear infinite;}.wSWCLK{animation:swd-run 1.6s linear infinite .4s;}.wSWO{animation:swo-run 1.2s linear infinite .2s;}.wNRST{animation:swd-run 2s linear infinite .8s;}
@keyframes itm-fade{0%,10%{opacity:.15}40%,100%{opacity:1}}.itm{animation:itm-fade 3s linear infinite;}
</style>

<rect x="0" y="0" width="900" height="620" fill="#0b1220"/>
<rect x="0" y="0" width="900" height="58" fill="#0e1626" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#243354" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#fb923c" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">调试与跟踪：SWD + SWO/ITM</text>
<text x="22" y="50" font-size="12" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不用串口也能 printf，还能定位 HardFault</text>
<rect x="819" y="15" width="59" height="28" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="848.5" y="33.32" font-size="12" fill="#fb923c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">17 调试</text>
<rect x="40" y="82" width="420" height="250" fill="#111c31" opacity="1" rx="12" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="108" font-size="13" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">接线（4 线 SWD + 1 线 SWO）</text>
<rect x="62" y="130" width="110" height="170" fill="#16233c" opacity="1" rx="8" stroke="#22d3ee" stroke-width="1.5"/>
<text x="117" y="154" font-size="13" fill="#22d3ee" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">ST-Link</text>
<text x="117" y="174" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">调试器</text>
<rect x="310" y="130" width="130" height="170" fill="#16233c" opacity="1" rx="8" stroke="#34d399" stroke-width="1.5"/>
<text x="375" y="154" font-size="13" fill="#34d399" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">STM32</text>
<text x="375" y="174" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Cortex-M</text>
<line x1="172" y1="188" x2="310" y2="188" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="1"/>
<text x="241" y="182" font-size="10.5" fill="#60a5fa" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SWCLK</text>
<circle cx="180" cy="188" r="3.4" fill="#60a5fa" opacity="1" class="wSWCLK"/>
<line x1="172" y1="210" x2="310" y2="210" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="1"/>
<text x="241" y="204" font-size="10.5" fill="#22d3ee" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SWDIO</text>
<circle cx="180" cy="210" r="3.4" fill="#22d3ee" opacity="1" class="wSWDIO"/>
<line x1="172" y1="232" x2="310" y2="232" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="1"/>
<text x="241" y="226" font-size="10.5" fill="#fbbf24" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SWO</text>
<circle cx="292" cy="232" r="3.4" fill="#fbbf24" opacity="1" class="wSWO"/>
<line x1="172" y1="254" x2="310" y2="254" stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="1"/>
<text x="241" y="248" font-size="10.5" fill="#f87171" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">NRST</text>
<circle cx="180" cy="254" r="3.4" fill="#f87171" opacity="1" class="wNRST"/>
<line x1="172" y1="276" x2="310" y2="276" stroke="#93a4c0" stroke-width="2" stroke-linecap="round" opacity="1"/>
<text x="241" y="270" font-size="10.5" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GND</text>
<circle cx="180" cy="276" r="3.4" fill="#93a4c0" opacity="1"/>
<text x="58" y="314" font-size="11" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SWO=PB3，方向是 MCU → 调试器；必须共地。廉价 ST-Link 常没接 SWO</text>
<rect x="480" y="82" width="380" height="250" fill="#0e1626" opacity="1" rx="12" stroke="#243354" stroke-width="1.5"/>
<text x="498" y="108" font-size="13" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">ITM 输出（SWV Console）</text>
<text x="498" y="136" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" class="itm">ITM_SendChar('T');        // 重定向 printf</text>
<text x="498" y="154" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" class="itm"></text>
<text x="498" y="172" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" class="itm">T=25.4C  adc=1024</text>
<text x="498" y="190" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" class="itm">T=25.6C  adc=1031</text>
<text x="498" y="208" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" class="itm">T=25.6C  adc=1028</text>
<text x="498" y="226" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" class="itm">T=25.7C  adc=1035</text>
<text x="498" y="300" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">异步 SWO 常见 2 MHz（约 2 Mbit/s，不是 2 MB/s）</text>
<text x="498" y="320" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">比 UART 少占一个串口，且不干扰被测程序时序</text>
<rect x="40" y="351" width="3" height="18" fill="#f87171" opacity="1"/>
<text x="52" y="364" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">HardFault 四步定位法</text>
<rect x="40" y="376" width="196" height="82" fill="#111c31" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="54" y="400" font-size="12.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">① CFSR / HFSR</text>
<text x="54" y="420" font-size="10.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0xE000ED28 / ED2C</text>
<text x="54" y="442" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">总线、用法还是取指错误</text>
<line x1="238" y1="417" x2="239" y2="417" stroke="#243354" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="244.00,417.00 239.00,419.50 239.00,414.50" fill="#243354" opacity="1"/>
<rect x="246" y="376" width="196" height="82" fill="#111c31" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="260" y="400" font-size="12.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">② BFAR / MMFAR</text>
<text x="260" y="420" font-size="10.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0xE000ED38 / ED34</text>
<text x="260" y="442" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">非法访问落到哪个地址</text>
<line x1="444" y1="417" x2="445" y2="417" stroke="#243354" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="450.00,417.00 445.00,419.50 445.00,414.50" fill="#243354" opacity="1"/>
<rect x="452" y="376" width="196" height="82" fill="#111c31" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="466" y="400" font-size="12.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">③ 反查 PC</text>
<text x="466" y="420" font-size="10.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">栈帧 PC → addr2line</text>
<text x="466" y="442" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">对应到哪一行 C</text>
<line x1="650" y1="417" x2="651" y2="417" stroke="#243354" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="656.00,417.00 651.00,419.50 651.00,414.50" fill="#243354" opacity="1"/>
<rect x="658" y="376" width="196" height="82" fill="#111c31" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="672" y="400" font-size="12.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">④ 常见原因</text>
<text x="672" y="420" font-size="10.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">空指针 / 栈溢出</text>
<text x="672" y="442" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">越界、递归、中断里用浮点</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DWT-&gt;CYCCNT 可做微秒级计时：使能 DWT_CTRL 后读 CYCCNT，比 HAL_GetTick 精确 1000 倍</text>
<text x="876" y="602" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
