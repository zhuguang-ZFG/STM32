<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="时钟树：8 MHz 晶振如何变成 72 MHz">
<style>
@keyframes pulse0-tx{0%{transform:translateX(0px)}100%{transform:translateX(8px)}}
.pulse0{animation:pulse0-tx 1.2s linear infinite 0s;}
@keyframes pulse1-tx{0%{transform:translateX(0px)}100%{transform:translateX(12px)}}
.pulse1{animation:pulse1-tx 1.2s linear infinite 0s;}
@keyframes pulse2-tx{0%{transform:translateX(0px)}100%{transform:translateX(42px)}}
.pulse2{animation:pulse2-tx 1.2s linear infinite 0s;}
@keyframes pulse3-tx{0%{transform:translateX(0px)}100%{transform:translateX(12px)}}
.pulse3{animation:pulse3-tx 1.2s linear infinite 0s;}

.clk{stroke-dasharray:5 11;animation:clk-flow 1.2s linear infinite;}@keyframes clk-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-16px}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1b5c45" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">时钟树：8 MHz 晶振如何变成 72 MHz</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">以 STM32F103（HSE 8 MHz × 9 = 72 MHz）为例</text>
<rect x="810" y="15" width="68" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="844" y="33.32" font-size="12" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">02 时钟树</text>
<rect x="40" y="108" width="150" height="72" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="115" y="136" font-size="15" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">HSE</text>
<text x="115" y="158" font-size="11" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">8 MHz 外部晶振</text>
<rect x="200" y="108" width="150" height="72" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="275" y="136" font-size="15" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PLLXTPRE</text>
<text x="275" y="158" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">本例 ÷1（也可 ÷2）</text>
<rect x="370" y="108" width="140" height="72" fill="#f1f5f7" opacity="1" rx="8" stroke="#9a3412" stroke-width="1.5"/>
<text x="440" y="136" font-size="15" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PLL</text>
<text x="440" y="158" font-size="11" fill="#9a3412" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PLLMUL = ×9</text>
<rect x="560" y="108" width="140" height="72" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="630" y="136" font-size="15" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SYSCLK</text>
<text x="630" y="158" font-size="11" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">72 MHz</text>
<rect x="720" y="108" width="140" height="72" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="790" y="136" font-size="15" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">HCLK</text>
<text x="790" y="158" font-size="11" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">AHB ÷1 = 72 MHz</text>
<line x1="190" y1="144" x2="200" y2="144" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="clk"/>
<circle cx="190" cy="144" r="4.5" fill="#075e84" opacity="1" class="pulse0"/>
<line x1="350" y1="144" x2="370" y2="144" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="clk"/>
<circle cx="350" cy="144" r="4.5" fill="#075e84" opacity="1" class="pulse1"/>
<line x1="510" y1="144" x2="560" y2="144" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="clk"/>
<circle cx="510" cy="144" r="4.5" fill="#075e84" opacity="1" class="pulse2"/>
<line x1="700" y1="144" x2="720" y2="144" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="clk"/>
<circle cx="700" cy="144" r="4.5" fill="#075e84" opacity="1" class="pulse3"/>
<line x1="790" y1="180" x2="790" y2="244" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="790" y1="210" x2="790" y2="236" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="790.00,242.00 787.00,236.00 793.00,236.00" fill="#075e84" opacity="1"/>
<rect x="40" y="244" width="400" height="92" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="58" y="274" font-size="15" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">APB2</text>
<text x="136" y="274" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">÷1 = 72 MHz</text>
<text x="58" y="298" font-size="11.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">GPIOA~E / USART1 / SPI1 / ADC1 / TIM1</text>
<text x="58" y="320" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ADC 另有分频，最高 14 MHz</text>
<rect x="460" y="244" width="400" height="92" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="478" y="274" font-size="15" fill="#8e2f5b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">APB1</text>
<text x="556" y="274" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">÷2 = 36 MHz</text>
<text x="478" y="298" font-size="11.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">USART2/3 · I2C · TIM2~7 · SPI2 · CAN</text>
<text x="478" y="320" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TIM2~7 时钟 ×2 = 72 MHz；USB 另要 48 MHz</text>
<line x1="790" y1="290" x2="860" y2="290" stroke="#075e84" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="4 6"/>
<rect x="40" y="359" width="3" height="18" fill="#7a4e00" opacity="1"/>
<text x="52" y="372" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">CubeMX 里对应的三处配置</text>
<rect x="40" y="384" width="820" height="126" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="56" y="408" font-size="12.5" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">RCC_OscInitStruct.HSEState = RCC_HSE_ON;             // 打开 8 MHz 晶振</text>
<text x="56" y="428" font-size="12.5" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">RCC_OscInitStruct.PLL.PLLMUL = RCC_PLL_MUL9;         // 8 MHz × 9 = 72 MHz</text>
<text x="56" y="448" font-size="12.5" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">RCC_ClkInitStruct.AHBCLKDivider  = RCC_SYSCLK_DIV1;  // HCLK  = 72 MHz</text>
<text x="56" y="468" font-size="12.5" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">RCC_ClkInitStruct.APB1CLKDivider = RCC_HCLK_DIV2;    // PCLK1 = 36 MHz</text>
<text x="56" y="488" font-size="12.5" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">RCC_ClkInitStruct.APB2CLKDivider = RCC_HCLK_DIV1;    // PCLK2 = 72 MHz</text>
<text x="56" y="508" font-size="12.5" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SystemCoreClockUpdate();   // 更新 SystemCoreClock，否则延时/波特率全错</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F411 例：25 MHz ÷ 25 × 200 ÷ 2 = 100 MHz（÷25×400÷2 会得到 200 MHz，超出上限）</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
