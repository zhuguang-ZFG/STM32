<text x="844" y="33.32" font-size="12" fill="#34d399" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">10 DMA</text>
<rect x="40" y="96" width="150" height="90" fill="#111c31" opacity="1" rx="12" stroke="#fbbf24" stroke-width="1.5"/>
<text x="115" y="124" font-size="14" fill="#fbbf24" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">ADC1</text>
<text x="115" y="146" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CH0 · PA0</text>
<text x="115" y="168" font-size="11" fill="#64748b" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DR 寄存器</text>
<rect x="300" y="96" width="170" height="90" fill="#111c31" opacity="1" rx="12" stroke="#22d3ee" stroke-width="1.5"/>
<text x="385" y="122" font-size="14" fill="#22d3ee" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">DMA1 CH1</text>
<text x="385" y="144" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">循环模式 / 半字</text>
<text x="385" y="166" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">MINC = 1（地址自增）</text>
<line x1="194" y1="141" x2="289" y2="141" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round" opacity="1" class="w1"/>
<polygon points="296.00,141.00 289.00,144.50 289.00,137.50" fill="#fbbf24" opacity="1"/>
<line x1="474" y1="141" x2="629" y2="141" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" opacity="1" class="w2"/>
<polygon points="636.00,141.00 629.00,144.50 629.00,137.50" fill="#22d3ee" opacity="1"/>
<circle cx="206" cy="141" r="4.5" fill="#22d3ee" opacity="1" class="pk0"/>
<circle cx="206" cy="141" r="4.5" fill="#22d3ee" opacity="1" class="pk1"/>
<circle cx="206" cy="141" r="4.5" fill="#22d3ee" opacity="1" class="pk2"/>
<text x="640" y="108" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">RAM 数组 buf[8]</text>
<rect x="640" y="120" width="52" height="40" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="666" y="136" font-size="10" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">[0]</text>
<text x="666" y="152" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">----</text>
<rect x="640" y="120" width="52" height="40" fill="#22d3ee" opacity="0.2" rx="8" class="b0"/>
<rect x="700" y="120" width="52" height="40" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="726" y="136" font-size="10" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">[1]</text>
<text x="726" y="152" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">----</text>
<rect x="700" y="120" width="52" height="40" fill="#22d3ee" opacity="0.2" rx="8" class="b1"/>
<rect x="760" y="120" width="52" height="40" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="786" y="136" font-size="10" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">[2]</text>
<text x="786" y="152" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">----</text>
<rect x="760" y="120" width="52" height="40" fill="#22d3ee" opacity="0.2" rx="8" class="b2"/>
<rect x="820" y="120" width="52" height="40" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="846" y="136" font-size="10" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">[3]</text>
<text x="846" y="152" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">----</text>
<rect x="820" y="120" width="52" height="40" fill="#22d3ee" opacity="0.2" rx="8" class="b3"/>
<rect x="640" y="172" width="52" height="40" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="666" y="188" font-size="10" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">[4]</text>
<text x="666" y="204" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">----</text>
<rect x="640" y="172" width="52" height="40" fill="#22d3ee" opacity="0.2" rx="8" class="b4"/>
<rect x="700" y="172" width="52" height="40" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="726" y="188" font-size="10" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">[5]</text>
<text x="726" y="204" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">----</text>
<rect x="700" y="172" width="52" height="40" fill="#22d3ee" opacity="0.2" rx="8" class="b5"/>
<rect x="760" y="172" width="52" height="40" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="786" y="188" font-size="10" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">[6]</text>
<text x="786" y="204" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">----</text>
<rect x="760" y="172" width="52" height="40" fill="#22d3ee" opacity="0.2" rx="8" class="b6"/>
<rect x="820" y="172" width="52" height="40" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="846" y="188" font-size="10" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">[7]</text>
<text x="846" y="204" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">----</text>
<rect x="820" y="172" width="52" height="40" fill="#22d3ee" opacity="0.2" rx="8" class="b7"/>
<rect x="40" y="214" width="820" height="88" fill="#0e1626" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="240" font-size="12.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">CPU 同时在干什么？</text>
<text x="58" y="262" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">滤波 / 通信 / 刷屏 / 跑 PID —— 一次搬运都不参与，总线空闲时 DMA 自动抢占一个周期</text>
<text x="58" y="284" font-size="11" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">轮询把 CPU 绑在采样循环里；中断是每样本进一次 ISR；DMA 只需半满、全满两次中断</text>
<rect x="40" y="309" width="3" height="18" fill="#22d3ee" opacity="1"/>
<text x="52" y="322" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">DMA 使用四步走</text>
<rect x="40" y="336" width="196" height="56" fill="#111c31" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="54" y="360" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">① 使能时钟</text>
<text x="54" y="380" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F1 在 AHB，F4 在 AHB1</text>
<rect x="248" y="336" width="196" height="56" fill="#111c31" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="262" y="360" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">② 配通道映射</text>
<text x="262" y="380" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F1 固定通道表，F4 用 Stream+Channel</text>
<rect x="456" y="336" width="196" height="56" fill="#111c31" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="470" y="360" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">③ 配参数</text>
<text x="470" y="380" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">方向 / 宽度 / 自增 / 循环 / 优先级</text>
<rect x="664" y="336" width="196" height="56" fill="#111c31" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="678" y="360" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">④ 开中断</text>
<text x="678" y="380" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">半传输 + 传输完成 + 错误</text>
<rect x="40" y="408" width="820" height="132" fill="#0e1626" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="56" y="432" font-size="12" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">HAL_ADC_Start_DMA(&amp;hadc1, (uint32_t *)adc_buf, 8);   // 8 个半字，循环</text>
<text x="56" y="453" font-size="12" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace"></text>
<text x="56" y="474" font-size="12" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">void HAL_ADC_ConvHalfCpltCallback(ADC_HandleTypeDef *h) { 处理前 4 个 }</text>
<text x="56" y="495" font-size="12" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">void HAL_ADC_ConvCpltCallback(ADC_HandleTypeDef *h)     { 处理后 4 个 }</text>
<text x="56" y="516" font-size="12" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace"></text>
<text x="56" y="537" font-size="12" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">// 易错点：缓冲区要 4 字节对齐、加 volatile，H7 上还要处理 D-Cache 一致性</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F1 只有 7 个 DMA 通道、没有 FIFO；F4/H7 是 Stream + FIFO + 双缓冲，映射表见 10 章</text>
<text x="876" y="602" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
