<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="DMA 循环模式：CPU 与搬运工并行">
<title>DMA 循环模式：CPU 与搬运工并行</title>
<style>

.dma-f{stroke-dasharray:7 10;animation:dma-f-flow 1.1s linear infinite;}@keyframes dma-f-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-17px}}
