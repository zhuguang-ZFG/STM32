.cd3{animation:cd3-hl 6.0s linear infinite;}
@keyframes cd4-hl{0%,80.00%{opacity:0.06}80.25%,83.20%{opacity:0.35}83.45%,100%{opacity:0.06}}
.cd4{animation:cd4-hl 6.0s linear infinite;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

