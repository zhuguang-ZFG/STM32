<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="DMA 循环模式：CPU 与搬运工并行工作">
<style>

.w1{stroke-dasharray:7 10;animation:w1-flow 1.2s linear infinite;}@keyframes w1-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-17px}}

.w2{stroke-dasharray:7 10;animation:w2-flow 1.2s linear infinite;}@keyframes w2-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-17px}}
@keyframes pk0-mv{0%{transform:translateX(0)}45%{transform:translateX(420px)}46%,100%{transform:translateX(420px)}}.pk0{animation:pk0-mv 1.6s linear infinite 0.0s;}
@keyframes pk1-mv{0%{transform:translateX(0)}45%{transform:translateX(420px)}46%,100%{transform:translateX(420px)}}.pk1{animation:pk1-mv 1.6s linear infinite 0.5s;}
@keyframes pk2-mv{0%{transform:translateX(0)}45%{transform:translateX(420px)}46%,100%{transform:translateX(420px)}}.pk2{animation:pk2-mv 1.6s linear infinite 1.0s;}
@keyframes b0-sq{0%,0.00%{opacity:0.1}0.30%,6.88%{opacity:0.48}7.18%,100%{opacity:0.1}}
.b0{animation:b0-sq 4.0s linear infinite;}
@keyframes b1-sq{0%,12.50%{opacity:0.1}12.80%,19.38%{opacity:0.48}19.68%,100%{opacity:0.1}}
.b1{animation:b1-sq 4.0s linear infinite;}
@keyframes b2-sq{0%,25.00%{opacity:0.1}25.30%,31.88%{opacity:0.48}32.17%,100%{opacity:0.1}}
.b2{animation:b2-sq 4.0s linear infinite;}
@keyframes b3-sq{0%,37.50%{opacity:0.1}37.80%,44.38%{opacity:0.48}44.67%,100%{opacity:0.1}}
.b3{animation:b3-sq 4.0s linear infinite;}
@keyframes b4-sq{0%,50.00%{opacity:0.1}50.30%,56.88%{opacity:0.48}57.17%,100%{opacity:0.1}}
.b4{animation:b4-sq 4.0s linear infinite;}
@keyframes b5-sq{0%,62.50%{opacity:0.1}62.80%,69.38%{opacity:0.48}69.67%,100%{opacity:0.1}}
.b5{animation:b5-sq 4.0s linear infinite;}
@keyframes b6-sq{0%,75.00%{opacity:0.1}75.30%,81.88%{opacity:0.48}82.17%,100%{opacity:0.1}}
.b6{animation:b6-sq 4.0s linear infinite;}
@keyframes b7-sq{0%,87.50%{opacity:0.1}87.80%,94.38%{opacity:0.48}94.67%,100%{opacity:0.1}}
.b7{animation:b7-sq 4.0s linear infinite;}
</style>

<rect x="0" y="0" width="900" height="620" fill="#0b1220"/>
<rect x="0" y="0" width="900" height="58" fill="#0e1626" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#243354" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#34d399" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">DMA 循环模式：CPU 与搬运工并行工作</text>
<text x="22" y="50" font-size="12" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ADC 每采一个数，DMA 写入数组；半满 HT、写满 TC，各进一次中断</text>
