<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="WWDG：窗口内喂狗就重新计数">
<title>WWDG：窗口内喂狗就重新计数</title>
<style>

@keyframes reload{0%,8%{transform:translateX(0)}76%{transform:translateX(632.5px)}77%{transform:translateX(0)}100%{transform:translateX(0)}}
@keyframes expire{0%,8%{transform:translateX(0)}88%,100%{transform:translateX(736px)}}
.reload{animation:reload 10s linear infinite}.expire{animation:expire 10s linear infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.moving{display:none}}
@media print{*{animation:none!important}.moving{display:none}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#7a4e00" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">WWDG：窗口内喂狗就重新计数</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103 · PCLK1=36 MHz · 预分频 8 · W=0x50 · 初值 0x7F</text>
<rect x="846" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="862" y="33.32" font-size="12" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">11</text>
<text x="40" y="98" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">计数越小，经过的时间越长；下方两条路径从同一个初值分别出发。</text>
<rect x="80" y="126" width="540.5" height="40" fill="#f1f5f7" opacity="1" rx="2" stroke="#8f2d2d" stroke-width="1.5"/>
<rect x="620.5" y="126" width="184" height="40" fill="#f1f5f7" opacity="1" rx="2" stroke="#1b5c45" stroke-width="1.5"/>
<rect x="804.5" y="126" width="11.5" height="40" fill="#8f2d2d" opacity="1" rx="2"/>
<text x="320" y="152" font-size="17" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">T &gt; 0x50：喂早会复位</text>
<text x="711" y="152" font-size="16" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">允许重载</text>
<line x1="80" y1="170" x2="80" y2="182" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="80" y="204" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x7F</text>
<line x1="620.5" y1="170" x2="620.5" y2="182" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="620.5" y="204" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x50</text>
<line x1="804.5" y1="170" x2="804.5" y2="182" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="804.5" y="204" font-size="14" fill="#17202a" text-anchor="end" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x40</text>
<line x1="816" y1="170" x2="816" y2="182" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="828" y="204" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x3F</text>
<text x="40" y="246" font-size="19" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">路径 A：在 T=0x48 时重载 0x7F，开始下一轮</text>
<line x1="80" y1="291" x2="705.5" y2="291" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="712.50,291.00 705.50,294.50 705.50,287.50" fill="#1b5c45" opacity="1"/>
<path d="M712.5 291 V325 H80 V291" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#1b5c45" stroke-width="2"/>
<text x="390" y="348" font-size="16" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">成功喂狗 → 回到初值；不会接着走向 0x3F</text>
<circle cx="80" cy="291" r="7" fill="#1b5c45" opacity="1" class="reload moving"/>
<text x="40" y="394" font-size="19" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">路径 B：一直不重载，0x40 → 0x3F 时复位</text>
<line x1="80" y1="433" x2="809" y2="433" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="816.00,433.00 809.00,436.50 809.00,429.50" fill="#8f2d2d" opacity="1"/>
<circle cx="80" cy="433" r="7" fill="#8f2d2d" opacity="1" class="expire moving"/>
<circle cx="816" cy="433" r="13" fill="none" opacity="1" stroke="#8f2d2d" stroke-width="2"/>
<text x="80" y="474" font-size="16" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">0x40 时可触发 EWI；到 0x3F 时 T6 清零。</text>
<text x="40" y="521" font-size="16" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">一拍 = 4096 × 8 / 36 MHz ≈ 910.2 µs；64 拍 ≈ 58.25 ms。</text>
<text x="40" y="548" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">窗口 0x40 ≤ T ≤ 0x50；示意动画放慢，数轴按计数差等比例。</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">RM0008 Rev 21 §20.3 · 自绘机制对照，非实测超时</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · FA-002 · STM32 知识库</text>
</svg>
