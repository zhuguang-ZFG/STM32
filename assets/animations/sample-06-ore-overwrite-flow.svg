<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="ORE overwrite moment">
<title>ORE overwrite moment</title>
<style>

.f0{stroke-dasharray:6 12;animation:f0-flow 1.2s linear infinite;}@keyframes f0-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}

.f1{stroke-dasharray:6 12;animation:f1-flow 1.2s linear infinite;}@keyframes f1-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}

.f2{stroke-dasharray:6 12;animation:f2-flow 1.2s linear infinite;}@keyframes f2-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}

.f3{stroke-dasharray:6 12;animation:f3-flow 1.2s linear infinite;}@keyframes f3-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}

.f4{stroke-dasharray:6 12;animation:f4-flow 1.2s linear infinite;}@keyframes f4-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes s0-flash{0%,0.00%{opacity:0.06}0.25%,3.33%{opacity:0.35}3.58%,100%{opacity:0.06}}
.s0{animation:s0-flash 7.0s linear infinite;}
@keyframes s1-flash{0%,16.67%{opacity:0.06}16.92%,20.00%{opacity:0.35}20.25%,100%{opacity:0.06}}
.s1{animation:s1-flash 7.0s linear infinite;}
@keyframes s2-flash{0%,33.33%{opacity:0.06}33.58%,36.67%{opacity:0.35}36.92%,100%{opacity:0.06}}
.s2{animation:s2-flash 7.0s linear infinite;}
@keyframes s3-flash{0%,50.00%{opacity:0.06}50.25%,53.33%{opacity:0.35}53.58%,100%{opacity:0.06}}
.s3{animation:s3-flash 7.0s linear infinite;}
@keyframes s4-flash{0%,66.67%{opacity:0.06}66.92%,70.00%{opacity:0.35}70.25%,100%{opacity:0.06}}
.s4{animation:s4-flash 7.0s linear infinite;}
@keyframes s5-flash{0%,83.33%{opacity:0.06}83.58%,86.67%{opacity:0.35}86.92%,100%{opacity:0.06}}
.s5{animation:s5-flash 7.0s linear infinite;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">ORE：RXNE 没人读，字节 2 直接覆盖</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">mechanism · FA-002 continuous-line</text>
<rect x="846" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="862" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">06</text>
<rect x="40" y="100" width="120" height="100" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="100" y="132" font-size="13" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">BYTE 1</text>
<text x="100" y="160" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0xA5 lands</text>
<rect x="40" y="100" width="120" height="100" fill="#1b5c45" opacity="0.12" rx="8" class="s0"/>
<line x1="164" y1="150" x2="167" y2="150" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="174.00,150.00 167.00,153.50 167.00,146.50" fill="#5e6872" opacity="1"/>
<line x1="164" y1="150" x2="174" y2="150" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="f0"/>
<rect x="178" y="100" width="120" height="100" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="238" y="132" font-size="13" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">RXNE=1</text>
<text x="238" y="160" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">wait for read</text>
<rect x="178" y="100" width="120" height="100" fill="#075e84" opacity="0.12" rx="8" class="s1"/>
<line x1="302" y1="150" x2="305" y2="150" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="312.00,150.00 305.00,153.50 305.00,146.50" fill="#5e6872" opacity="1"/>
<line x1="302" y1="150" x2="312" y2="150" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="f1"/>
<rect x="316" y="100" width="120" height="100" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="376" y="132" font-size="13" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">BYTE 2</text>
<text x="376" y="160" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">next 86.8 us</text>
<rect x="316" y="100" width="120" height="100" fill="#7a4e00" opacity="0.12" rx="8" class="s2"/>
<line x1="440" y1="150" x2="443" y2="150" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="450.00,150.00 443.00,153.50 443.00,146.50" fill="#5e6872" opacity="1"/>
<line x1="440" y1="150" x2="450" y2="150" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="f2"/>
<rect x="454" y="100" width="120" height="100" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="514" y="132" font-size="13" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">OVERWRITE</text>
<text x="514" y="160" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">shift reg lost</text>
<rect x="454" y="100" width="120" height="100" fill="#8f2d2d" opacity="0.12" rx="8" class="s3"/>
<line x1="578" y1="150" x2="581" y2="150" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="588.00,150.00 581.00,153.50 581.00,146.50" fill="#5e6872" opacity="1"/>
<line x1="578" y1="150" x2="588" y2="150" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="f3"/>
<rect x="592" y="100" width="120" height="100" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="652" y="132" font-size="13" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">ORE=1</text>
<text x="652" y="160" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">byte 1 safe</text>
<rect x="592" y="100" width="120" height="100" fill="#8f2d2d" opacity="0.12" rx="8" class="s4"/>
<line x1="716" y1="150" x2="719" y2="150" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="726.00,150.00 719.00,153.50 719.00,146.50" fill="#5e6872" opacity="1"/>
<line x1="716" y1="150" x2="726" y2="150" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="f4"/>
<rect x="730" y="100" width="120" height="100" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="790" y="132" font-size="13" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">CLEAR</text>
<text x="790" y="160" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SR then DR</text>
<rect x="730" y="100" width="120" height="100" fill="#1b5c45" opacity="0.12" rx="8" class="s5"/>
<rect x="40" y="217" width="3" height="18" fill="#1b5c45" opacity="1"/>
<text x="52" y="230" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">Motion is the overwrite moment — the FE story stays on the handraw plate</text>
<rect x="40" y="265" width="820" height="38" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="56" y="289" font-size="13" fill="#075e84" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">115200 8N1</text>
<text x="840" y="289" font-size="13" fill="#17202a" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">1 bit = 8.68 us, 10 bits = 86.8 us</text>
<rect x="40" y="309" width="820" height="38" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="56" y="333" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">Clear order</text>
<text x="840" y="333" font-size="13" fill="#17202a" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">read SR (0x00) then DR (0x04)</text>
<rect x="40" y="353" width="820" height="38" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="56" y="377" font-size="13" fill="#7a4e00" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">Wrong order</text>
<text x="840" y="377" font-size="13" fill="#17202a" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DR alone clears nothing; the port stalls</text>
<rect x="40" y="397" width="820" height="38" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="56" y="421" font-size="13" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">FE alone</text>
<text x="840" y="421" font-size="13" fill="#17202a" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">never raises an interrupt (needs RXNE/EIE)</text>
<rect x="40" y="460" width="820" height="70" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="56" y="488" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Motion advances byte1 → RXNE → byte2 → overwrite → ORE → clear — not a bounce loop.</text>
<text x="56" y="510" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">The stop-bit sampling story stays on ch06-ore-fe (handraw) and sample-06-frame-annotated.</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · FA-002 · ORE 覆盖瞬间，非示波器实测</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
