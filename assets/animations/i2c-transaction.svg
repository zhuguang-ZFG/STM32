<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="I2C 一次完整读写事务">
<style>
@keyframes ack-fade{0%,100%{opacity:0.2}50%{opacity:1.0}}
.ack{animation:ack-fade 1.6s ease-in-out infinite 0s;}
</style>

<rect x="0" y="0" width="900" height="560" fill="#0b1220"/>
<rect x="0" y="0" width="900" height="58" fill="#0e1626" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#243354" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#34d399" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">I2C 一次完整读写事务</text>
<text x="22" y="50" font-size="12" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">START → 7 位地址 + R/W → ACK → 数据字节 → ACK → STOP</text>
<rect x="810" y="15" width="68" height="28" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="844" y="33.32" font-size="12" fill="#34d399" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">07 I2C</text>
<text x="40" y="96" font-size="12" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SCL</text>
<line x1="40" y1="104" x2="40" y2="174" stroke="#243354" stroke-width="1.4" stroke-linecap="round" opacity="1"/>
<line x1="40" y1="174" x2="840" y2="174" stroke="#243354" stroke-width="1.4" stroke-linecap="round" opacity="1"/>
<path d="M 40 117.92 L 40.00 117.92 L 84.44 117.92 L 84.44 160.08 L 128.89 160.08 L 128.89 117.92 L 173.33 117.92 L 173.33 160.08 L 217.78 160.08 L 217.78 117.92 L 262.22 117.92 L 262.22 160.08 L 306.67 160.08 L 306.67 117.92 L 351.11 117.92 L 351.11 160.08 L 395.56 160.08 L 395.56 117.92 L 440.00 117.92 L 440.00 160.08 L 484.44 160.08 L 484.44 117.92 L 528.89 117.92 L 528.89 160.08 L 573.33 160.08 L 573.33 117.92 L 617.78 117.92 L 617.78 160.08 L 662.22 160.08 L 662.22 117.92 L 706.67 117.92 L 706.67 160.08 L 751.11 160.08 L 751.11 117.92 L 795.56 117.92 L 795.56 160.08 L 840.00 160.08" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#22d3ee" stroke-width="2.2"/>
<text x="40" y="190" font-size="12" fill="#fbbf24" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SDA</text>
<line x1="40" y1="198" x2="40" y2="268" stroke="#243354" stroke-width="1.4" stroke-linecap="round" opacity="1"/>
<line x1="40" y1="268" x2="840" y2="268" stroke="#243354" stroke-width="1.4" stroke-linecap="round" opacity="1"/>
<path d="M 40 211.92 L 40.00 211.92 L 93.33 211.92 L 93.33 254.08 L 146.67 254.08 L 146.67 254.08 L 200.00 254.08 L 200.00 254.08 L 253.33 254.08 L 253.33 211.92 L 306.67 211.92 L 306.67 211.92 L 360.00 211.92 L 360.00 211.92 L 413.33 211.92 L 413.33 211.92 L 466.67 211.92 L 466.67 254.08 L 520.00 254.08 L 520.00 254.08 L 573.33 254.08 L 573.33 254.08 L 626.67 254.08 L 626.67 211.92 L 680.00 211.92 L 680.00 254.08 L 733.33 254.08 L 733.33 254.08 L 786.67 254.08 L 786.67 211.92 L 840.00 211.92" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#fbbf24" stroke-width="2.4"/>
<line x1="40" y1="104" x2="40" y2="264" stroke="#f87171" stroke-width="1" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 5"/>
<text x="44" y="288" font-size="11" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">START</text>
<line x1="128" y1="104" x2="128" y2="264" stroke="#a78bfa" stroke-width="1" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 5"/>
<text x="132" y="288" font-size="11" fill="#a78bfa" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">7 位从机地址 0x3C</text>
<line x1="440" y1="104" x2="440" y2="264" stroke="#22d3ee" stroke-width="1" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 5"/>
<text x="444" y="288" font-size="11" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">R/W</text>
<line x1="488" y1="104" x2="488" y2="264" stroke="#34d399" stroke-width="1" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 5"/>
<text x="492" y="288" font-size="11" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ACK</text>
<line x1="540" y1="104" x2="540" y2="264" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 5"/>
<text x="544" y="288" font-size="11" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">数据字节</text>
<line x1="680" y1="104" x2="680" y2="264" stroke="#34d399" stroke-width="1" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 5"/>
<text x="684" y="288" font-size="11" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ACK</text>
<line x1="732" y1="104" x2="732" y2="264" stroke="#f87171" stroke-width="1" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 5"/>
<text x="736" y="288" font-size="11" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STOP</text>
<text x="40" y="312" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">START = SCL 为高时 SDA 由高变低；STOP = SCL 为高时 SDA 由低变高</text>
<circle cx="510" cy="240" r="7" fill="#34d399" opacity="1" class="ack"/>
<circle cx="702" cy="240" r="7" fill="#34d399" opacity="1" class="ack"/>
<text x="508" y="336" font-size="10.5" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">从机把 SDA 拉低 = ACK（应答）</text>
<rect x="40" y="356" width="400" height="132" fill="#111c31" opacity="1" rx="12" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="380" font-size="12.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">为什么必须加上拉电阻</text>
<text x="58" y="404" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· I2C 是开漏输出：只能拉低，不能拉高</text>
<text x="58" y="424" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 上拉电阻决定上升沿速度与功耗</text>
<text x="58" y="444" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 3.3 V / 400 kHz：4.7 kΩ 是安全默认值</text>
<text x="58" y="464" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 总线电容 &gt; 200 pF 时减小到 2.2 kΩ</text>
<rect x="460" y="356" width="400" height="132" fill="#111c31" opacity="1" rx="12" stroke="#243354" stroke-width="1.5"/>
<text x="478" y="380" font-size="12.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">地址陷阱：0x3C 还是 0x78？</text>
<text x="478" y="404" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 7 位地址 0x3C = 8 位地址 0x78（左移一位）</text>
<text x="478" y="424" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· HAL 的 HAL_I2C_Mem_Read 用 7 位地址</text>
<text x="478" y="444" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 扫描到 0x78 说明代码里没右移</text>
<text x="478" y="464" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 总线上所有设备地址不能重复</text>
<rect x="40" y="500" width="820" height="30" fill="#0e1626" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="520" font-size="11" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">总线卡死自救：把 SCL 当普通 IO 手动发 9 个脉冲 + 一个 STOP，再 HAL_I2C_DeInit / Init 重新初始化</text>
<line x1="24" y1="518" x2="876" y2="518" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="542" font-size="12" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">标准 100 kHz / 快速 400 kHz / 快速+ 1 MHz；SCL 高电平时间与上拉阻值强相关</text>
<text x="876" y="542" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
