<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="FreeRTOS 任务调度：状态机 + 甘特图">
<style>
@keyframes st就绪-fade{0%,100%{opacity:0.1}50%{opacity:0.45}}
.st就绪{animation:st就绪-fade 4s ease-in-out infinite 0s;}
@keyframes st运行-fade{0%,100%{opacity:0.45}50%{opacity:0.1}}
.st运行{animation:st运行-fade 4s ease-in-out infinite 1s;}
@keyframes st阻塞-fade{0%,100%{opacity:0.1}50%{opacity:0.45}}
.st阻塞{animation:st阻塞-fade 4s ease-in-out infinite 2s;}
@keyframes st挂起-fade{0%,100%{opacity:0.1}50%{opacity:0.45}}
.st挂起{animation:st挂起-fade 4s ease-in-out infinite 3s;}

.e1{stroke-dasharray:6 8;animation:e1-flow 1.4s linear infinite;}@keyframes e1-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-14px}}
@keyframes cursor-tx{0%{transform:translateX(0px)}100%{transform:translateX(700px)}}
.cursor{animation:cursor-tx 5s linear infinite 0s;}
</style>

<rect x="0" y="0" width="900" height="560" fill="#0b1220"/>
<rect x="0" y="0" width="900" height="58" fill="#0e1626" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#243354" stroke-width="1" stroke-linecap="round" opacity="1"/>
