<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="FreeRTOS 任务调度：状态机 + 甘特图">
<style>
@keyframes stReady-fade{0%,100%{opacity:0.1}50%{opacity:0.45}}
.stReady{animation:stReady-fade 4s ease-in-out infinite 0s;}
@keyframes stRun-fade{0%,100%{opacity:0.45}50%{opacity:0.1}}
.stRun{animation:stRun-fade 4s ease-in-out infinite 1s;}
@keyframes stBlock-fade{0%,100%{opacity:0.1}50%{opacity:0.45}}
.stBlock{animation:stBlock-fade 4s ease-in-out infinite 2s;}
@keyframes stSusp-fade{0%,100%{opacity:0.1}50%{opacity:0.45}}
.stSusp{animation:stSusp-fade 4s ease-in-out infinite 3s;}

.e1{stroke-dasharray:6 8;animation:e1-flow 1.4s linear infinite;}@keyframes e1-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-14px}}
@keyframes cursor-tx{0%{transform:translateX(0px)}100%{transform:translateX(700px)}}
.cursor{animation:cursor-tx 5s linear infinite 0s;}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#8e2f5b" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">FreeRTOS 任务调度：状态机 + 甘特图</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SysTick 每 1 ms 打断一次，调度器挑出「就绪队列里优先级最高」的任务</text>
<rect x="765" y="15" width="113" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="821.5" y="33.32" font-size="12" fill="#8e2f5b" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">15 FreeRTOS</text>
<rect x="80" y="110" width="170" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="165" y="136" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">就绪 Ready</text>
<text x="165" y="156" font-size="9" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">等调度器挑选</text>
<rect x="80" y="110" width="170" height="62" fill="#1b5c45" opacity="0.15" rx="8" class="stReady"/>
<rect x="400" y="110" width="170" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="485" y="136" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">运行 Running</text>
<text x="485" y="156" font-size="9" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">正在占用 CPU</text>
<rect x="400" y="110" width="170" height="62" fill="#075e84" opacity="0.15" rx="8" class="stRun"/>
<rect x="400" y="226" width="170" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="485" y="252" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">阻塞 Blocked</text>
<text x="485" y="272" font-size="9" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">等延时 / 队列 / 信号量</text>
<rect x="400" y="226" width="170" height="62" fill="#7a4e00" opacity="0.15" rx="8" class="stBlock"/>
<rect x="80" y="226" width="170" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
