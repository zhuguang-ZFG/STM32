<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="FreeRTOS：事件到了，不必等下一个 tick">
<title>FreeRTOS：事件到了，不必等下一个 tick</title>
<style>

@keyframes rtos-cursor{0%,8%{transform:translateX(0)}44%,60%{transform:translateX(300px)}92%,100%{transform:translateX(600px)}}
@keyframes rtos-wake{0%,43.9%{transform:translate(0,0);opacity:0}44%{transform:translate(0,0);opacity:1}48%{transform:translate(0,-26px)}56%{transform:translate(-610px,-26px)}60%{transform:translate(-610px,0);opacity:1}61%,100%{transform:translate(-610px,0);opacity:0}}
.cursor{animation:rtos-cursor 12s linear infinite}.wake{animation:rtos-wake 12s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.moving{display:none}}
@media print{*{animation:none!important}.moving{display:none}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1b5c45" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">FreeRTOS：事件到了，不必等下一个 tick</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">单核抢占式 · configUSE_PREEMPTION=1 · configTICK_RATE_HZ=1000 · 放慢的逻辑示意</text>
<rect x="801" y="15" width="77" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="839.5" y="33.32" font-size="12" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">15 RTOS</text>
<rect x="40" y="120" width="220" height="80" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="150" y="149" font-size="18" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">就绪 Ready</text>
<text x="150" y="174" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">具备运行条件，等待 CPU</text>
<rect x="350" y="120" width="230" height="80" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="465" y="149" font-size="18" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">运行 Running</text>
<text x="465" y="174" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">单核同一时刻只有一个任务</text>
<rect x="660" y="120" width="200" height="80" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="760" y="149" font-size="18" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">阻塞 Blocked</text>
<text x="760" y="174" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">等待队列或延时到期</text>
<rect x="40" y="284" width="220" height="64" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="150" y="313" font-size="18" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">挂起 Suspended</text>
<text x="150" y="338" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">显式暂停，不因超时唤醒</text>
<line x1="266" y1="156" x2="338" y2="156" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="344.00,156.00 338.00,159.00 338.00,153.00" fill="#1b5c45" opacity="1"/>
<text x="305" y="142" font-size="14" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">选中</text>
<line x1="344" y1="184" x2="272" y2="184" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="266.00,184.00 272.00,181.00 272.00,187.00" fill="#075e84" opacity="1"/>
<text x="305" y="218" font-size="13" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">抢占 / 轮转</text>
<line x1="586" y1="156" x2="648" y2="156" stroke="#7a4e00" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="654.00,156.00 648.00,159.00 648.00,153.00" fill="#7a4e00" opacity="1"/>
<text x="620" y="142" font-size="14" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">等待</text>
<path d="M760 114 V88 H150 V114" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#7a4e00" stroke-width="2"/>
<line x1="150" y1="100" x2="150" y2="108" stroke="#7a4e00" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="150.00,114.00 147.00,108.00 153.00,108.00" fill="#7a4e00" opacity="1"/>
<text x="455" y="81" font-size="16" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">事件到达 / 超时 → 回到 Ready</text>
<circle cx="760" cy="114" r="5" fill="#7a4e00" opacity="1" class="wake moving"/>
<line x1="70" y1="204" x2="70" y2="272" stroke="#5b3a8c" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="70.00,278.00 67.00,272.00 73.00,272.00" fill="#5b3a8c" opacity="1"/>
<text x="83" y="239" font-size="13" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">挂起</text>
<line x1="230" y1="278" x2="230" y2="210" stroke="#5b3a8c" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="230.00,204.00 233.00,210.00 227.00,210.00" fill="#5b3a8c" opacity="1"/>
<text x="240" y="239" font-size="13" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">恢复</text>
<text x="350" y="319" font-size="17" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">下面只演示：队列事件唤醒高优先级任务。</text>
<text x="350" y="345" font-size="15" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">挂起和等待事件是两种不同状态。</text>
<text x="40" y="425" font-size="16" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">H · 优先级 2</text>
<rect x="160" y="400" width="600" height="34" fill="#f1f5f7" opacity="1" rx="4" stroke="#d7dce1" stroke-width="1.5"/>
<rect x="460" y="400" width="200" height="34" fill="#075e84" opacity="1" rx="4"/>
<text x="40" y="481" font-size="16" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">L · 优先级 1</text>
<rect x="160" y="456" width="600" height="34" fill="#f1f5f7" opacity="1" rx="4" stroke="#d7dce1" stroke-width="1.5"/>
<rect x="160" y="456" width="300" height="34" fill="#1b5c45" opacity="1" rx="4"/>
<rect x="660" y="456" width="100" height="34" fill="#1b5c45" opacity="1" rx="4"/>
<text x="200" y="424" font-size="15" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">H 阻塞，等队列</text>
<text x="560" y="424" font-size="15" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">H 运行</text>
<text x="310" y="480" font-size="15" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">L 运行</text>
<text x="710" y="480" font-size="14" fill="#fbfaf7" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">L 继续</text>
<text x="710" y="424" font-size="14" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">阻塞</text>
<line x1="460" y1="390" x2="460" y2="494" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/>
<text x="460" y="379" font-size="16" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">1.5 ms：ISR 发事件并请求切换</text>
<line x1="660" y1="390" x2="660" y2="494" stroke="#7a4e00" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/>
<line x1="160" y1="494" x2="160" y2="503" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="160" y="522" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0 ms</text>
<line x1="360" y1="494" x2="360" y2="503" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="360" y="522" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">1 ms</text>
<line x1="560" y1="494" x2="560" y2="503" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="560" y="522" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">2 ms</text>
<line x1="760" y1="494" x2="760" y2="503" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<text x="760" y="522" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">3 ms</text>
<text x="760" y="542" font-size="14" fill="#7a4e00" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">2.5 ms：H 再次等队列</text>
<line x1="160" y1="394" x2="160" y2="490" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1" class="cursor moving"/>
<text x="40" y="569" font-size="16" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">H 无须等下一个 tick；实际响应仍受 ISR、临界区和调度开销影响。</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">FreeRTOS Kernel V11.3.2 · 时间为教学设定，省略 ISR / 切换耗时</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · FA-002</text>
</svg>
