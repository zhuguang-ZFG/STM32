<polygon points="396.00,128.00 389.00,131.50 389.00,124.50" fill="#1b5c45" opacity="1"/>
<text x="324" y="120" font-size="10" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">调度器选中</text>
<line x1="568" y1="128" x2="694" y2="128" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
