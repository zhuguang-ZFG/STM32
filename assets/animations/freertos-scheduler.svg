<text x="165" y="272" font-size="9" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">vTaskSuspend 挂起</text>
<rect x="80" y="226" width="170" height="62" fill="#5b3a8c" opacity="0.15" rx="8" class="stSusp"/>
