<line x1="376" y1="170" x2="410" y2="170" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" opacity="1"/>
<circle cx="392" cy="118" r="27.3" fill="#f87171" opacity="0.16" class="led-glow"/>
<circle cx="392" cy="118" r="13" fill="#f87171" opacity="1" stroke="#00000066" stroke-width="1" class="led"/>
<circle cx="388.1" cy="113.45" r="3.64" fill="#ffffff" opacity="0.7"/>
<text x="392" y="96" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">LED 亮 / 灭</text>
<line x1="392" y1="140" x2="392" y2="166" stroke="#f87171" stroke-width="1.6" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/>
<circle cx="250" cy="170" r="3.2" fill="#f87171" opacity="1" class="dot"/>
<circle cx="300" cy="170" r="3.2" fill="#f87171" opacity="1" class="dot"/>
<circle cx="340" cy="170" r="3.2" fill="#f87171" opacity="1" class="dot"/>
<circle cx="390" cy="170" r="3.2" fill="#f87171" opacity="1" class="dot"/>
<line x1="410" y1="170" x2="410" y2="232" stroke="#93a4c0" stroke-width="2.4" stroke-linecap="round" opacity="1"/>
<line x1="392" y1="232" x2="428" y2="232" stroke="#93a4c0" stroke-width="2.4" stroke-linecap="round" opacity="1"/>
<line x1="398" y1="240" x2="422" y2="240" stroke="#93a4c0" stroke-width="2.2" stroke-linecap="round" opacity="1"/>
<line x1="404" y1="248" x2="416" y2="248" stroke="#93a4c0" stroke-width="2" stroke-linecap="round" opacity="1"/>
<text x="436" y="236" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">GND</text>
<text x="58" y="300" font-size="12" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">电流路径：PA5 → 330Ω → LED → GND</text>
<text x="58" y="322" font-size="11.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">R = (3.3 V − 2.0 V) / 5 mA ≈ 260 Ω，取 330 Ω 更安全</text>
<rect x="530" y="80" width="330" height="262" fill="#111c31" opacity="1" rx="12" stroke="#243354" stroke-width="1.5"/>
<text x="548" y="106" font-size="13" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">PA5 输出电平（1 Hz）</text>
<line x1="568" y1="130" x2="568" y2="260" stroke="#243354" stroke-width="1.4" stroke-linecap="round" opacity="1"/>
<line x1="568" y1="260" x2="836" y2="260" stroke="#243354" stroke-width="1.4" stroke-linecap="round" opacity="1"/>
<text x="560" y="140" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">3.3V</text>
<text x="836" y="276" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">时间</text>
<text x="568" y="148" font-size="10" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">1</text>
<text x="568" y="250" font-size="10" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">0</text>
<path d="M 568 156.88 L 568.00 156.88 L 601.50 156.88 L 601.50 156.88 L 635.00 156.88 L 635.00 156.88 L 668.50 156.88 L 668.50 156.88 L 702.00 156.88 L 702.00 237.12 L 735.50 237.12 L 735.50 237.12 L 769.00 237.12 L 769.00 237.12 L 802.50 237.12 L 802.50 237.12 L 836.00 237.12" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#34d399" stroke-width="2.6"/>
<text x="568" y="274" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">0</text>
<text x="635" y="274" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">250</text>
<text x="702" y="274" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">500</text>
<text x="769" y="274" font-size="10" fill="#64748b" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">750</text>
<text x="702" y="292" font-size="10.5" fill="#64748b" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ms（高 500 ms + 低 500 ms）</text>
<line x1="568" y1="130" x2="568" y2="262" stroke="#f87171" stroke-width="1.4" stroke-linecap="round" opacity="1" class="cursor"/>
<text x="548" y="320" font-size="11" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HAL_Delay(500) 阻塞式延时；实际项目请用定时器中断</text>
<rect x="40" y="359" width="3" height="18" fill="#22d3ee" opacity="1"/>
<text x="52" y="372" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">三种写法（效果相同，抽象层次不同）</text>
<rect x="40" y="384" width="400" height="122" fill="#0e1626" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="56" y="408" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">// 1) HAL 库</text>
<text x="56" y="425" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">HAL_GPIO_TogglePin(GPIOA, GPIO_PIN_5);</text>
<text x="56" y="442" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">HAL_Delay(500);</text>
<text x="56" y="459" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace"></text>
<text x="56" y="476" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">// 2) 寄存器（BSRR 原子操作）</text>
<text x="56" y="493" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIOA-&gt;BSRR = GPIO_PIN_5;      // 置 1</text>
<text x="56" y="510" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIOA-&gt;BSRR = GPIO_PIN_5 &lt;&lt; 16; // 清 0</text>
<rect x="460" y="384" width="400" height="122" fill="#0e1626" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="476" y="408" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">// 3) CubeMX 生成的初始化</text>
<text x="476" y="425" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIO_InitTypeDef i = {0};</text>
<text x="476" y="442" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">i.Pin  = GPIO_PIN_5;</text>
<text x="476" y="459" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">i.Mode = GPIO_MODE_OUTPUT_PP;</text>
<text x="476" y="476" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">i.Pull = GPIO_NOPULL;</text>
<text x="476" y="493" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">i.Speed= GPIO_SPEED_FREQ_LOW;</text>
<text x="476" y="510" font-size="11.5" fill="#22d3ee" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">HAL_GPIO_Init(GPIOA, &amp;i);</text>
<line x1="24" y1="518" x2="876" y2="518" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="542" font-size="12" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先确认时钟已使能（__HAL_RCC_GPIOA_CLK_ENABLE()），否则写寄存器没有任何反应</text>
<text x="876" y="542" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
