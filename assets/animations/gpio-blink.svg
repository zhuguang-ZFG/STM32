<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="GPIO 推挽输出点亮 LED">
<style>
@keyframes led-blink{0%,48%{opacity:1;filter:drop-shadow(0 0 9px currentColor)}50%,98%{opacity:0.12;filter:none}}
.led{animation:led-blink 1s steps(1,end) infinite 0s;}

.wire{stroke-dasharray:7 9;animation:wire-flow 1.4s linear infinite;}@keyframes wire-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-16px}}
@keyframes dot-run{0%{transform:translateX(0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(150px);opacity:0}}.dot{animation:dot-run 1.4s linear infinite;}.dot:nth-of-type(2){animation-delay:.35s}.dot:nth-of-type(3){animation-delay:.7s}.dot:nth-of-type(4){animation-delay:1.05s}
@keyframes cur-run{0%{transform:translateX(0)}100%{transform:translateX(268px)}}.cursor{animation:cur-run 1s linear infinite;}
</style>

<rect x="0" y="0" width="900" height="560" fill="#0b1220"/>
<rect x="0" y="0" width="900" height="58" fill="#0e1626" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#243354" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#34d399" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">GPIO 推挽输出点亮 LED</text>
<text x="22" y="50" font-size="12" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PA5 每 500 ms 翻转一次，电流路径与波形同步演示</text>
<rect x="801" y="15" width="77" height="28" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="839.5" y="33.32" font-size="12" fill="#34d399" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">03 GPIO</text>
<rect x="40" y="80" width="470" height="262" fill="#111c31" opacity="1" rx="12" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="106" font-size="13" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">电路（拉电流接法：高电平点亮）</text>
<rect x="62" y="130" width="150" height="150" fill="#16233c" opacity="1" rx="10" stroke="#22d3ee" stroke-width="1.5"/>
<text x="137" y="160" font-size="15" fill="#22d3ee" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">STM32</text>
<text x="137" y="182" font-size="12" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">GPIOA</text>
<text x="137" y="204" font-size="16" fill="#e6edf3" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">PA5</text>
<text x="137" y="226" font-size="10.5" fill="#64748b" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">推挽 / 50 MHz</text>
<text x="232" y="152" font-size="12" fill="#e6edf3" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">PA5</text>
<line x1="212" y1="170" x2="268" y2="170" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" opacity="1" class="wire"/>
<circle cx="212" cy="170" r="4" fill="#fbbf24" opacity="1" class="cur"/>
<rect x="268" y="158" width="56" height="24" fill="#0e1626" opacity="1" rx="4" stroke="#fbbf24" stroke-width="1.5"/>
<text x="296" y="176" font-size="11" fill="#fbbf24" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">330Ω</text>
<line x1="324" y1="170" x2="352" y2="170" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" opacity="1"/>
<polygon points="352.00,158.00 352.00,182.00 376.00,170.00" fill="#f87171" opacity="1" stroke="#f87171" stroke-width="1.5"/>
