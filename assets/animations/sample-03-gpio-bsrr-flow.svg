<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="BSRR atomic write">
<title>BSRR atomic write</title>
<style>

.gf0{stroke-dasharray:10 14;animation:gf0-flow 1.2s linear infinite;}@keyframes gf0-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-24px}}

.gf1{stroke-dasharray:10 14;animation:gf1-flow 1.2s linear infinite;}@keyframes gf1-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-24px}}

.gf2{stroke-dasharray:10 14;animation:gf2-flow 1.2s linear infinite;}@keyframes gf2-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-24px}}
@keyframes g0-flash{0%,0.00%{opacity:0.06}0.25%,5.00%{opacity:0.35}5.25%,100%{opacity:0.06}}
.g0{animation:g0-flash 5.0s linear infinite;}
@keyframes g1-flash{0%,25.00%{opacity:0.06}25.25%,30.00%{opacity:0.35}30.25%,100%{opacity:0.06}}
.g1{animation:g1-flash 5.0s linear infinite;}
@keyframes g2-flash{0%,50.00%{opacity:0.06}50.25%,55.00%{opacity:0.35}55.25%,100%{opacity:0.06}}
.g2{animation:g2-flash 5.0s linear infinite;}
@keyframes g3-flash{0%,75.00%{opacity:0.06}75.25%,80.00%{opacity:0.35}80.25%,100%{opacity:0.06}}
.g3{animation:g3-flash 5.0s linear infinite;}
@keyframes ledpulse{0%,45%{opacity:0.25}50%,95%{opacity:0.95}100%{opacity:0.25}}.ledpulse{animation:ledpulse 2s linear infinite;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1b5c45" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">GPIO 点灯：BSRR 原子写，避开 ODR 读改写</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">mechanism · FA-002 continuous-line</text>
<rect x="846" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="862" y="33.32" font-size="12" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">03</text>
<rect x="40" y="100" width="200" height="88" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="140" y="132" font-size="14" fill="#075e84" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">MODER=01</text>
<text x="140" y="160" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PC13 output</text>
<rect x="40" y="100" width="200" height="88" fill="#075e84" opacity="0.12" rx="8" class="g0"/>
<line x1="244" y1="144" x2="244" y2="144" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="251.00,144.00 244.00,147.50 244.00,140.50" fill="#5e6872" opacity="1"/>
<line x1="244" y1="144" x2="251" y2="144" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="gf0"/>
<rect x="255" y="100" width="200" height="88" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="355" y="132" font-size="14" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">OTYPER=0</text>
<text x="355" y="160" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">push-pull</text>
<rect x="255" y="100" width="200" height="88" fill="#1b5c45" opacity="0.12" rx="8" class="g1"/>
<line x1="459" y1="144" x2="459" y2="144" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="466.00,144.00 459.00,147.50 459.00,140.50" fill="#5e6872" opacity="1"/>
<line x1="459" y1="144" x2="466" y2="144" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="gf1"/>
<rect x="470" y="100" width="200" height="88" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="570" y="132" font-size="14" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">BSRR set/reset</text>
<text x="570" y="160" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">one write</text>
<rect x="470" y="100" width="200" height="88" fill="#7a4e00" opacity="0.12" rx="8" class="g2"/>
<line x1="674" y1="144" x2="674" y2="144" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="681.00,144.00 674.00,147.50 674.00,140.50" fill="#5e6872" opacity="1"/>
<line x1="674" y1="144" x2="681" y2="144" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="gf2"/>
<rect x="685" y="100" width="200" height="88" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="785" y="132" font-size="14" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">Pin / LED</text>
<text x="785" y="160" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">active-low</text>
<rect x="685" y="100" width="200" height="88" fill="#8f2d2d" opacity="0.12" rx="8" class="g3"/>
<rect x="40" y="207" width="3" height="18" fill="#7a4e00" opacity="1"/>
<text x="52" y="220" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">Blue Pill PC13: cathode toward MCU (active-low)</text>
<rect x="40" y="250" width="400" height="120" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="56" y="280" font-size="14" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">ON  BSRR = (1&lt;&lt;13)&lt;&lt;16</text>
<text x="56" y="308" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">drives pin LOW → LED lights</text>
<text x="56" y="336" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">EST current ~0.6 mA @ 2.2k</text>
<rect x="460" y="250" width="400" height="120" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="476" y="280" font-size="14" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">OFF BSRR = (1&lt;&lt;13)</text>
<text x="476" y="308" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">drives pin HIGH → LED dark</text>
<text x="476" y="336" font-size="12" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Never ODR |= under IRQ</text>
<rect x="40" y="400" width="820" height="56" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="56" y="424" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Highlight order: mode → type → BSRR → pin. First frame keeps both ON/OFF formulas.</text>
<text x="56" y="444" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Nucleo PA5 is often active-high — polarity follows the schematic, not this PC13 path.</text>
<circle cx="820" cy="160" r="14" fill="#8f2d2d" opacity="0.85" class="ledpulse"/>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · FA-002 · BSRR/PC13 机制，非板级实拍</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
