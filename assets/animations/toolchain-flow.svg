<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="STM32 开发工具链">
<style>

.f0{stroke-dasharray:6 12;animation:f0-flow 1.4s linear infinite;}@keyframes f0-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes p0-tx{0%{transform:translateX(0px)}100%{transform:translateX(38px)}}
.p0{animation:p0-tx 1.4s linear infinite 0.00s;}

.f1{stroke-dasharray:6 12;animation:f1-flow 1.4s linear infinite;}@keyframes f1-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes p1-tx{0%{transform:translateX(0px)}100%{transform:translateX(38px)}}
.p1{animation:p1-tx 1.4s linear infinite 0.28s;}

.f2{stroke-dasharray:6 12;animation:f2-flow 1.4s linear infinite;}@keyframes f2-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes p2-tx{0%{transform:translateX(0px)}100%{transform:translateX(38px)}}
.p2{animation:p2-tx 1.4s linear infinite 0.56s;}

.f3{stroke-dasharray:6 12;animation:f3-flow 1.4s linear infinite;}@keyframes f3-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes p3-tx{0%{transform:translateX(0px)}100%{transform:translateX(38px)}}
.p3{animation:p3-tx 1.4s linear infinite 0.84s;}
@keyframes t0-flash{0%,0.00%{opacity:1}3.50%,100%{opacity:.18}}
.t0{animation:t0-flash 4.0s linear infinite;}
@keyframes t1-flash{0%,25.00%{opacity:1}28.50%,100%{opacity:.18}}
.t1{animation:t1-flash 4.0s linear infinite;}
@keyframes t2-flash{0%,50.00%{opacity:1}53.50%,100%{opacity:.18}}
.t2{animation:t2-flash 4.0s linear infinite;}
@keyframes t3-flash{0%,75.00%{opacity:1}78.50%,100%{opacity:.18}}
.t3{animation:t3-flash 4.0s linear infinite;}
</style>

