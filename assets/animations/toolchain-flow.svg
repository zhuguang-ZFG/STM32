<text x="56" y="456" font-size="12.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -O2 -c main.c -o main.o</text>
<text x="56" y="475" font-size="12.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">arm-none-eabi-gcc -T STM32F411CEUx_FLASH.ld *.o -o build/app.elf</text>
<text x="56" y="494" font-size="12.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">arm-none-eabi-objcopy -O binary build/app.elf build/app.bin</text>
<text x="56" y="513" font-size="12.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">STM32_Programmer_CLI -c port=SWD -w build/app.bin 0x08000000 -rst</text>
