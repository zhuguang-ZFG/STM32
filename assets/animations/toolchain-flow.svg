<text x="24" y="542" font-size="12" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">IDE（Keil / CubeIDE / PlatformIO）只是把上面 4 条命令包了一层图形界面</text>
