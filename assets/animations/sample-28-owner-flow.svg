<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="所有者任务机制：IRQ 只投递，所有者消费，监督者喂狗">
<title>所有者任务机制：IRQ 只投递，所有者消费，监督者喂狗</title>
<style>

.f0{stroke-dasharray:6 12;animation:f0-flow 1.3s linear infinite;}@keyframes f0-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
