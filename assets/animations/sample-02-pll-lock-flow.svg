<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="PLL lock sequence">
<title>PLL lock sequence</title>
<style>

.f0{stroke-dasharray:6 12;animation:f0-flow 1.5s linear infinite;}@keyframes f0-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes p0-tx{0%{transform:translateX(0px)}100%{transform:translateX(24px)}}
.p0{animation:p0-tx 1.5s linear infinite 0.00s;}

.f1{stroke-dasharray:6 12;animation:f1-flow 1.5s linear infinite;}@keyframes f1-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes p1-tx{0%{transform:translateX(0px)}100%{transform:translateX(24px)}}
.p1{animation:p1-tx 1.5s linear infinite 0.30s;}

.f2{stroke-dasharray:6 12;animation:f2-flow 1.5s linear infinite;}@keyframes f2-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-18px}}
@keyframes p2-tx{0%{transform:translateX(0px)}100%{transform:translateX(24px)}}
.p2{animation:p2-tx 1.5s linear infinite 0.60s;}
@keyframes s0-flash{0%,0.00%{opacity:0.06}0.25%,5.00%{opacity:0.35}5.25%,100%{opacity:0.06}}
.s0{animation:s0-flash 5.5s linear infinite;}
@keyframes s1-flash{0%,25.00%{opacity:0.06}25.25%,30.00%{opacity:0.35}30.25%,100%{opacity:0.06}}
.s1{animation:s1-flash 5.5s linear infinite;}
@keyframes s2-flash{0%,50.00%{opacity:0.06}50.25%,55.00%{opacity:0.35}55.25%,100%{opacity:0.06}}
.s2{animation:s2-flash 5.5s linear infinite;}
@keyframes s3-flash{0%,75.00%{opacity:0.06}75.25%,80.00%{opacity:0.35}80.25%,100%{opacity:0.06}}
.s3{animation:s3-flash 5.5s linear infinite;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PLL 上锁：HSE → x9 → SYSCLK 72 MHz</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">mechanism · FA-002 continuous-line</text>
<rect x="846" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="862" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">02</text>
<rect x="50" y="100" width="170" height="96" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="135" y="128" font-size="15" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">HSEON</text>
<text x="135" y="152" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">wait HSERDY</text>
<text x="135" y="176" font-size="12" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">8 MHz</text>
<rect x="50" y="100" width="170" height="96" fill="#7a4e00" opacity="0.12" rx="8" class="s0"/>
<line x1="226" y1="148" x2="243" y2="148" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="250.00,148.00 243.00,151.50 243.00,144.50" fill="#5e6872" opacity="1"/>
<line x1="226" y1="148" x2="250" y2="148" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="f0"/>
<circle cx="226" cy="148" r="4" fill="#075e84" opacity="1" class="p0"/>
<rect x="256" y="100" width="170" height="96" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="341" y="128" font-size="15" fill="#075e84" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">PLLSRC</text>
<text x="341" y="152" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HSE into PLL</text>
<text x="341" y="176" font-size="12" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">no /2</text>
<rect x="256" y="100" width="170" height="96" fill="#075e84" opacity="0.12" rx="8" class="s1"/>
<line x1="432" y1="148" x2="449" y2="148" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="456.00,148.00 449.00,151.50 449.00,144.50" fill="#5e6872" opacity="1"/>
<line x1="432" y1="148" x2="456" y2="148" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="f1"/>
<circle cx="432" cy="148" r="4" fill="#075e84" opacity="1" class="p1"/>
<rect x="462" y="100" width="170" height="96" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="547" y="128" font-size="15" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">PLLMUL</text>
<text x="547" y="152" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">x9 lock</text>
<text x="547" y="176" font-size="12" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">72 MHz</text>
<rect x="462" y="100" width="170" height="96" fill="#1b5c45" opacity="0.12" rx="8" class="s2"/>
<line x1="638" y1="148" x2="655" y2="148" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="662.00,148.00 655.00,151.50 655.00,144.50" fill="#5e6872" opacity="1"/>
<line x1="638" y1="148" x2="662" y2="148" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="f2"/>
<circle cx="638" cy="148" r="4" fill="#075e84" opacity="1" class="p2"/>
<rect x="668" y="100" width="170" height="96" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="753" y="128" font-size="15" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">SW/SWS</text>
<text x="753" y="152" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">switch</text>
<text x="753" y="176" font-size="12" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SWS=10</text>
<rect x="668" y="100" width="170" height="96" fill="#5b3a8c" opacity="0.12" rx="8" class="s3"/>
<rect x="40" y="227" width="3" height="18" fill="#1b5c45" opacity="1"/>
<text x="52" y="240" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">First-frame register ledger (readable in PDF)</text>
<rect x="40" y="270" width="820" height="42" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="56" y="296" font-size="13" fill="#7a4e00" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">RCC_CR HSERDY</text>
<text x="840" y="296" font-size="13" fill="#17202a" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">must be 1 before PLLMUL touch</text>
<rect x="40" y="318" width="820" height="42" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="56" y="344" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">RCC_CR PLLRDY</text>
<text x="840" y="344" font-size="13" fill="#17202a" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">1 means VCO locked at 72 MHz</text>
<rect x="40" y="366" width="820" height="42" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="56" y="392" font-size="13" fill="#075e84" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">RCC_CFGR SWS</text>
<text x="840" y="392" font-size="13" fill="#17202a" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">10 = SYSCLK from PLL (not HSI)</text>
<rect x="40" y="414" width="820" height="42" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="56" y="440" font-size="13" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">FLASH_ACR LATENCY</text>
<text x="840" y="440" font-size="13" fill="#17202a" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">2 wait-states for 48..72 MHz</text>
<rect x="40" y="470" width="820" height="70" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="56" y="498" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Motion meaning: highlight advances only after the prior ready bit — not a bounce loop.</text>
<text x="56" y="520" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Fail path (HSE lost → CSS → HSI) stays on sample-02-hse-fail / clock-css GIF.</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · FA-002 · PLL 上锁机制，非示波器实拍</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
