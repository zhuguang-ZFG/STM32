<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="PWM compare edge">
<title>PWM compare edge</title>
<style>

.f0{stroke-dasharray:5 10;animation:f0-flow 1.0s linear infinite;}@keyframes f0-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-15px}}

