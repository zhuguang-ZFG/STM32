<text x="819" y="126" font-size="10" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">bit0</text>
<text x="819" y="142" font-size="13" fill="#64748b" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">?</text>
<rect x="788" y="108" width="62" height="42" fill="#fbbf24" opacity="0.18" rx="8" class="s11"/>
<text x="40" y="172" font-size="11" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">当前正在比较的位会被点亮；比较完就固定下来（1 或 0）</text>
<rect x="40" y="194" width="400" height="150" fill="#111c31" opacity="1" rx="12" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="220" font-size="12.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">比较器在比较什么</text>
<text x="58" y="246" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DAC 输出（当前猜测值）</text>
<text x="58" y="266" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">VIN（采样保持电容上的电压）</text>
<line x1="58" y1="286" x2="420" y2="286" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="58" y="308" font-size="11.5" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DAC &gt; VIN → 清掉这一位</text>
<text x="58" y="328" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DAC ≤ VIN → 保留这一位</text>
<rect x="460" y="194" width="400" height="150" fill="#0e1626" opacity="1" rx="12" stroke="#243354" stroke-width="1.5"/>
<text x="478" y="220" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">例：VIN = 0.5 × VREF → 结果 0x800</text>
<text x="478" y="244" font-size="11" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">bit11: 猜 2048  → 2048 &lt;= 2048  保留 1</text>
<text x="478" y="261" font-size="11" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">bit10: 猜 3072  → 3072 &gt;  2048  清零 0</text>
<text x="478" y="278" font-size="11" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">bit9 : 猜 2560  → 2560 &gt;  2048  清零 0</text>
<text x="478" y="295" font-size="11" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">bit8 : 猜 2304  → 2304 &gt;  2048  清零 0</text>
<text x="478" y="312" font-size="11" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">bit7 : 猜 2176  → 2176 &gt;  2048  清零 0</text>
<text x="478" y="329" font-size="11" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">…最终 0b1000_0000_0000 = 2048</text>
<rect x="40" y="353" width="3" height="18" fill="#22d3ee" opacity="1"/>
<text x="52" y="366" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">采样时间怎么定</text>
<rect x="40" y="378" width="500" height="116" fill="#0e1626" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="400" font-size="11" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">源阻抗 &lt; 1 kΩ</text>
<text x="216" y="400" font-size="11" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">1.5 周期</text>
<text x="316" y="400" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">跟随器 / 低阻信号源</text>
<text x="58" y="424" font-size="11" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">1 ~ 10 kΩ</text>
<text x="216" y="424" font-size="11" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">7.5 周期</text>
<text x="316" y="424" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">大多数传感器</text>
<text x="58" y="448" font-size="11" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">10 ~ 50 kΩ</text>
<text x="216" y="448" font-size="11" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">41.5 周期</text>
<text x="316" y="448" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">电位器、分压采样</text>
<text x="58" y="472" font-size="11" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">源阻抗很高</text>
<text x="216" y="472" font-size="11" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先加运放缓冲</text>
<text x="316" y="472" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">否则采样电容充不满，读数偏小</text>
<rect x="560" y="378" width="300" height="116" fill="#111c31" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="578" y="402" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">误差与换算</text>
<text x="578" y="424" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 量化误差 = VREF / 4096（±0.5 LSB）</text>
<text x="578" y="442" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 3.3 V 参考 → 每 LSB ≈ 0.806 mV</text>
<text x="578" y="460" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 电压 = ADC值 × 3.3 / 4095</text>
<text x="578" y="478" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 读 VREFINT 可反推真实 VDDA</text>
<rect x="40" y="504" width="820" height="28" fill="#0e1626" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="523" font-size="11" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">读数跳动的三板斧：加去耦电容、延长采样时间、软件滑动平均 / 中值滤波</text>
<line x1="24" y1="518" x2="876" y2="518" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="542" font-size="12" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F1 的 ADC 时钟最高 14 MHz、F4 最高 36 MHz；时钟超了读数会明显失真</text>
<text x="876" y="542" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
