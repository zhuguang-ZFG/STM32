<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="SPL 四步初始化链：每一步都在改变硬件前提">
<title>SPL 四步初始化链：每一步都在改变硬件前提</title>
<style>
@keyframes splp0-sq{0%,0.00%{opacity:0.46}0.30%,22.50%{opacity:1.0}22.80%,100%{opacity:0.46}}
.splp0{animation:splp0-sq 6.0s linear infinite;}
@keyframes splp1-sq{0%,25.00%{opacity:0.46}25.30%,47.50%{opacity:1.0}47.80%,100%{opacity:0.46}}
.splp1{animation:splp1-sq 6.0s linear infinite;}
@keyframes splp2-sq{0%,50.00%{opacity:0.46}50.30%,72.50%{opacity:1.0}72.80%,100%{opacity:0.46}}
.splp2{animation:splp2-sq 6.0s linear infinite;}
@keyframes splp3-sq{0%,75.00%{opacity:0.46}75.30%,97.50%{opacity:1.0}97.80%,100%{opacity:0.46}}
.splp3{animation:splp3-sq 6.0s linear infinite;}

.splp-flow{stroke-dasharray:5 8;animation:splp-flow-flow 1.1s linear infinite;}@keyframes splp-flow-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-13px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SPL 四步初始化链：每一步都在改变硬件前提</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先开总线时钟，再取得默认值、覆盖目标字段，最后写入并使能；缺一步都不是同一个系统</text>
<rect x="729" y="15" width="149" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="803.5" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">26 SPL · IG-008</text>
<rect x="34" y="110" width="192" height="116" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5" class="splp0"/>
<rect x="34" y="110" width="192" height="6" fill="#075e84" opacity="1" rx="2"/>
<text x="50" y="144" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">① 开时钟</text>
<text x="50" y="172" font-size="10.5" fill="#075e84" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">RCC_APB2ENR</text>
<text x="50" y="201" font-size="10" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">寄存器接口开始工作</text>
<line x1="229" y1="168" x2="239" y2="168" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="splp-flow"/>
<polygon points="245.00,168.00 239.00,171.00 239.00,165.00" fill="#075e84" opacity="1"/>
<rect x="248" y="110" width="192" height="116" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5" class="splp1"/>
<rect x="248" y="110" width="192" height="6" fill="#1b5c45" opacity="1" rx="2"/>
<text x="264" y="144" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">② 取默认值</text>
<text x="264" y="172" font-size="10.5" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIO_StructInit</text>
<text x="264" y="201" font-size="10" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">每个字段都有确定起点</text>
<line x1="443" y1="168" x2="453" y2="168" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="splp-flow"/>
<polygon points="459.00,168.00 453.00,171.00 453.00,165.00" fill="#075e84" opacity="1"/>
<rect x="462" y="110" width="192" height="116" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5" class="splp2"/>
<rect x="462" y="110" width="192" height="6" fill="#7a4e00" opacity="1" rx="2"/>
<text x="478" y="144" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">③ 覆盖配置</text>
<text x="478" y="172" font-size="10.5" fill="#7a4e00" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">Pin / Mode / Speed</text>
<text x="478" y="201" font-size="10" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">接线、频率、方向对齐</text>
<line x1="657" y1="168" x2="667" y2="168" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="splp-flow"/>
<polygon points="673.00,168.00 667.00,171.00 667.00,165.00" fill="#075e84" opacity="1"/>
<rect x="676" y="110" width="192" height="116" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5" class="splp3"/>
<rect x="676" y="110" width="192" height="6" fill="#5b3a8c" opacity="1" rx="2"/>
<text x="692" y="144" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">④ 写入并使能</text>
<text x="692" y="172" font-size="10.5" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIO_Init / *_Cmd</text>
<text x="692" y="201" font-size="10" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">状态进入真实外设</text>
<text x="40" y="270" font-size="13.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">把失败放回它第一次可能出现的位置</text>
<rect x="40" y="294" width="400" height="60" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="56" y="318" font-size="11.5" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">时钟没开</text>
<text x="166" y="318" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">写 CRL/CRH 后引脚仍无变化</text>
<text x="56" y="340" font-size="9.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">证据：读回时钟位、配置寄存器和使能位</text>
<rect x="460" y="294" width="400" height="60" fill="#f1f5f7" opacity="1" rx="8" stroke="#9a3412" stroke-width="1.5"/>
<text x="476" y="318" font-size="11.5" fill="#9a3412" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">结构体未初始化</text>
<text x="586" y="318" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">未赋值字段来自栈上的旧数据</text>
<text x="476" y="340" font-size="9.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">证据：读回时钟位、配置寄存器和使能位</text>
<rect x="40" y="372" width="400" height="60" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="56" y="396" font-size="11.5" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">字段对不上</text>
<text x="166" y="396" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">AF_PP、频率或引脚与接线冲突</text>
<text x="56" y="418" font-size="9.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">证据：读回时钟位、配置寄存器和使能位</text>
<rect x="460" y="372" width="400" height="60" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="476" y="396" font-size="11.5" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">只配置未使能</text>
<text x="586" y="396" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">USART / SPI / TIM 仍停在关闭态</text>
<text x="476" y="418" font-size="9.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">证据：读回时钟位、配置寄存器和使能位</text>
<rect x="40" y="470" width="820" height="54" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="58" y="493" font-size="11.5" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">连续线索</text>
<text x="132" y="493" font-size="10.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">函数名只是入口；真正的验收是 RCC → 配置寄存器 → 使能位 → 引脚波形</text>
<text x="132" y="513" font-size="10" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">任何一段没有证据，就不要跳到下一段猜协议。</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">视觉规范：FA-002 概念连续线 · IG-008 多路径流程 · C-03 / C-10 / C-27 / C-31</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
