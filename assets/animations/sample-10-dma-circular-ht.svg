<text x="660" y="200" font-size="13" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">DMA reloads + writes A</text>
<rect x="460" y="100" width="400" height="140" fill="#7a4e00" opacity="0.12" rx="8" class="h1"/>
<rect x="40" y="267" width="3" height="18" fill="#075e84" opacity="1"/>
<text x="52" y="280" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">Example N=256 halfwords · CNDTR live</text>
