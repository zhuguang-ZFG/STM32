<circle cx="60" cy="420" r="5" fill="#5b3a8c" opacity="1" class="tok"/>
<text x="60" y="448" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">peripheral request → DMA grant → mem write → CNDTR--</text>
<rect x="40" y="470" width="820" height="70" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="56" y="498" font-size="13" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Trap: parse the wrong half after HT/TC; printf inside HT longer than half-buffer time.</text>
<text x="56" y="520" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ISR sets a flag; main drains the finished half. Matches sample-10-cndtr-ledger.</text>
