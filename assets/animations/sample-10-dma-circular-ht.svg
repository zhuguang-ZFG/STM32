<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="DMA circular HT/TC">
<title>DMA circular HT/TC</title>
<style>
@keyframes h0-flash{0%,0.00%{opacity:0.06}0.25%,22.50%{opacity:0.28}22.75%,100%{opacity:0.06}}
.h0{animation:h0-flash 3.6s linear infinite;}
@keyframes h1-flash{0%,50.00%{opacity:0.06}50.25%,72.50%{opacity:0.28}72.75%,100%{opacity:0.06}}
.h1{animation:h1-flash 3.6s linear infinite;}
@keyframes c0-flash{0%,0.00%{opacity:0.06}0.25%,3.20%{opacity:0.35}3.45%,100%{opacity:0.06}}
.c0{animation:c0-flash 6.0s linear infinite;}
@keyframes c1-flash{0%,20.00%{opacity:0.06}20.25%,23.20%{opacity:0.35}23.45%,100%{opacity:0.06}}
.c1{animation:c1-flash 6.0s linear infinite;}
@keyframes c2-flash{0%,40.00%{opacity:0.06}40.25%,43.20%{opacity:0.35}43.45%,100%{opacity:0.06}}
.c2{animation:c2-flash 6.0s linear infinite;}
@keyframes c3-flash{0%,60.00%{opacity:0.06}60.25%,63.20%{opacity:0.35}63.45%,100%{opacity:0.06}}
.c3{animation:c3-flash 6.0s linear infinite;}
@keyframes c4-flash{0%,80.00%{opacity:0.06}80.25%,83.20%{opacity:0.35}83.45%,100%{opacity:0.06}}
.c4{animation:c4-flash 6.0s linear infinite;}

.req{stroke-dasharray:8 12;animation:req-flow 2.2s linear infinite;}@keyframes req-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-20px}}
@keyframes tok-tx{0%{transform:translateX(0px)}100%{transform:translateX(780px)}}
.tok{animation:tok-tx 2.2s linear infinite 0s;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#5b3a8c" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">DMA 环形缓冲：CNDTR 倒数与 HT/TC 半区所有权</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">mechanism · FA-002 continuous-line</text>
<rect x="846" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
