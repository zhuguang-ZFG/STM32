<text x="40" y="292" font-size="12" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">每格 = 1 位 = 1/115200 s ≈ 8.68 µs；整帧 10 位 ≈ 86.8 µs。上图是 0xA5，低位 D0 先发（和 SPI 相反）</text>
<rect x="40" y="317" width="3" height="18" fill="#34d399" opacity="1"/>
