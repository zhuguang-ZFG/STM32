<text x="58" y="516" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">阻塞：适合调试打印；中断：适合不定长指令；DMA + IDLE：适合高速连续数据（详见 06 章与 examples/uart-dma-idle）</text>
