<text x="60" y="452" font-size="11" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">BRR = fCK / baud（16 倍过采样）：72 MHz / 115200 = 625 = 0x271</text>
