<text x="58" y="480" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">读图顺序</text>
<text x="148" y="480" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先看睡前状态 → 再看唤醒源 → 最后看醒来后的时钟或复位路径。</text>
<text x="58" y="505" font-size="10.5" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Stop 的 5.4 µs 是事件到第一条指令的指标；PLL 锁定和业务恢复另行计时。</text>
<text x="40" y="554" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">IWDG 超时是复位；Sleep / Stop 的中断与事件必须事先配置。</text>
