@keyframes wake-dot-1-move{0%{transform:translateX(0px);opacity:0}8%{transform:translateX(0px);opacity:1}22.50%{transform:translateX(126.5px);opacity:1}27.50%{transform:translateX(126.5px);opacity:1}42.00%{transform:translateX(253.0px);opacity:1}47.00%{transform:translateX(253.0px);opacity:1}61.50%{transform:translateX(379.5px);opacity:1}66.50%{transform:translateX(379.5px);opacity:1}81.00%{transform:translateX(506.0px);opacity:1}86.00%{transform:translateX(506.0px);opacity:1}100%{transform:translateX(506px);opacity:0}}
