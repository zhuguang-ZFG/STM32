<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="三种低功耗模式的唤醒路径">
<title>三种低功耗模式的唤醒路径</title>
<style>
