<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="USB 设备枚举的 7 个步骤">
<style>
@keyframes p0-mv{0%,100%{opacity:.15}0%,12%{opacity:1}}.p0{animation:p0-mv 4.2s linear infinite;}
@keyframes p1-mv{0%,100%{opacity:.15}13%,25%{opacity:1}}.p1{animation:p1-mv 4.2s linear infinite;}
@keyframes p2-mv{0%,100%{opacity:.15}26%,38%{opacity:1}}.p2{animation:p2-mv 4.2s linear infinite;}
@keyframes p3-mv{0%,100%{opacity:.15}39%,51%{opacity:1}}.p3{animation:p3-mv 4.2s linear infinite;}
@keyframes p4-mv{0%,100%{opacity:.15}52%,64%{opacity:1}}.p4{animation:p4-mv 4.2s linear infinite;}
@keyframes p5-mv{0%,100%{opacity:.15}65%,77%{opacity:1}}.p5{animation:p5-mv 4.2s linear infinite;}
@keyframes p6-mv{0%,100%{opacity:.15}78%,90%{opacity:1}}.p6{animation:p6-mv 4.2s linear infinite;}
</style>

<rect x="0" y="0" width="900" height="620" fill="#0b1220"/>
<rect x="0" y="0" width="900" height="58" fill="#0e1626" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#243354" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#60a5fa" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">USB 设备枚举的 7 个步骤</text>
<text x="22" y="50" font-size="12" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">插上 USB 之后，主机和设备之间到底交换了什么</text>
<rect x="810" y="15" width="68" height="28" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="844" y="33.32" font-size="12" fill="#60a5fa" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">14 USB</text>
<rect x="40" y="84" width="150" height="380" fill="#111c31" opacity="1" rx="12" stroke="#22d3ee" stroke-width="1.5"/>
<text x="115" y="112" font-size="14" fill="#22d3ee" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">主机</text>
<text x="115" y="134" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PC / 树莓派</text>
<text x="115" y="156" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Host</text>
<rect x="710" y="84" width="150" height="380" fill="#111c31" opacity="1" rx="12" stroke="#34d399" stroke-width="1.5"/>
<text x="785" y="112" font-size="14" fill="#34d399" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">设备</text>
<text x="785" y="134" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32</text>
<text x="785" y="156" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Device</text>
<rect x="210" y="96" width="480" height="42" fill="#111c31" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<rect x="210" y="96" width="4" height="42" fill="#f87171" opacity="1" rx="2"/>
<text x="226" y="114" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">① 检测到设备</text>
<text x="226" y="130" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">全速：D+ 经 1.5 kΩ 上拉，主机据此识别速率</text>
<circle cx="704" cy="117" r="5" fill="#f87171" opacity="1" class="p0"/>
<rect x="210" y="148" width="480" height="42" fill="#111c31" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<rect x="210" y="148" width="4" height="42" fill="#fb923c" opacity="1" rx="2"/>
<text x="226" y="166" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">② 总线复位</text>
<text x="226" y="182" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">D+ 与 D− 同时拉低（SE0）≥ 10 ms</text>
<circle cx="196" cy="169" r="5" fill="#fb923c" opacity="1" class="p1"/>
<rect x="210" y="200" width="480" height="42" fill="#111c31" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<rect x="210" y="200" width="4" height="42" fill="#fbbf24" opacity="1" rx="2"/>
<text x="226" y="218" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">③ 读前 8 字节</text>
<text x="226" y="234" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">地址仍是 0，只为拿到 bMaxPacketSize0</text>
<circle cx="196" cy="221" r="5" fill="#fbbf24" opacity="1" class="p2"/>
<rect x="210" y="252" width="480" height="42" fill="#111c31" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<rect x="210" y="252" width="4" height="42" fill="#34d399" opacity="1" rx="2"/>
<text x="226" y="270" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">④ 再读设备描述符</text>
<text x="226" y="286" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">18 字节：VID / PID。不少主机还会再复位一次</text>
<circle cx="196" cy="273" r="5" fill="#34d399" opacity="1" class="p3"/>
<rect x="210" y="304" width="480" height="42" fill="#111c31" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<rect x="210" y="304" width="4" height="42" fill="#22d3ee" opacity="1" rx="2"/>
<text x="226" y="322" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">⑤ SET_ADDRESS</text>
<text x="226" y="338" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">分配 1~127，之后不再使用地址 0</text>
<circle cx="196" cy="325" r="5" fill="#22d3ee" opacity="1" class="p4"/>
<rect x="210" y="356" width="480" height="42" fill="#111c31" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<rect x="210" y="356" width="4" height="42" fill="#60a5fa" opacity="1" rx="2"/>
<text x="226" y="374" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">⑥ 读配置描述符</text>
<text x="226" y="390" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先读 9 字节，再按 wTotalLength 读完</text>
<circle cx="196" cy="377" r="5" fill="#60a5fa" opacity="1" class="p5"/>
<rect x="210" y="408" width="480" height="42" fill="#111c31" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<rect x="210" y="408" width="4" height="42" fill="#a78bfa" opacity="1" rx="2"/>
<text x="226" y="426" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">⑦ SET_CONFIGURATION</text>
<text x="226" y="442" font-size="10" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">选配置 1，CDC / HID 开始工作</text>
<circle cx="196" cy="429" r="5" fill="#a78bfa" opacity="1" class="p6"/>
<rect x="40" y="476" width="400" height="54" fill="#0e1626" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="500" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">描述符是「层层套娃」</text>
<text x="58" y="518" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">设备 → 配置 → 接口 → 端点，主机逐层索取</text>
<rect x="460" y="476" width="400" height="54" fill="#0e1626" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="478" y="500" font-size="12" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">CDC 还是 HID？</text>
<text x="478" y="518" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">要虚拟串口选 CDC，要免驱键鼠/自定义选 HID</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">枚举失败先查：48 MHz 时钟是否精确、D+ 上拉是否正常、USB 中断优先级是否被抢占、描述符长度是否与实际一致</text>
<text x="876" y="602" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
