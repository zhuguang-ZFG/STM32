<rect x="398" y="166" width="52" height="32" fill="#fbbf24" opacity="0.85" rx="5" class="hit"/>
<text x="424" y="186" font-size="11" fill="#0b1220" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">命中</text>
<text x="58" y="226" font-size="11.5" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">缺点：CPU 全程被占用（99% 时间在空转）；按键抖动会被读成多次按下</text>
<rect x="40" y="252" width="820" height="130" fill="#111c31" opacity="1" rx="12" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="278" font-size="14" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">② 外部中断（EXTI + NVIC）</text>
<text x="300" y="278" font-size="11.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">按下瞬间硬件自动打断主程序，执行 ISR</text>
<rect x="58" y="306" width="784" height="40" fill="#0e1626" opacity="1" rx="8" stroke="#1a2742" stroke-width="1.5"/>
<rect x="62" y="310" width="300" height="32" fill="#16233c" opacity="1" rx="5" stroke="#243354" stroke-width="1.5"/>
<text x="212" y="330" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">主程序继续干别的事（低功耗、算数据…）</text>
<rect x="366" y="310" width="56" height="32" fill="#34d399" opacity="1" rx="5" class="isr"/>
<text x="394" y="330" font-size="11" fill="#0b1220" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">ISR</text>
<rect x="426" y="310" width="416" height="32" fill="#16233c" opacity="1" rx="5" stroke="#243354" stroke-width="1.5"/>
<text x="634" y="330" font-size="11" fill="#93a4c0" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">恢复现场，继续原来的循环</text>
<text x="58" y="370" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">优点：响应延迟只有十几个时钟周期；CPU 可进 Sleep 模式省电</text>
<rect x="40" y="399" width="3" height="18" fill="#22d3ee" opacity="1"/>
<text x="52" y="412" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">EXTI 触发方式怎么选</text>
<rect x="40" y="428" width="820" height="22" fill="none" opacity="1" rx="4"/>
<text x="52" y="444" font-size="11.5" fill="#60a5fa" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIO_MODE_IT_RISING</text>
<text x="300" y="444" font-size="11.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">上升沿</text>
<text x="380" y="444" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">按键按下接地（低有效）时，松开才触发</text>
<rect x="40" y="454" width="820" height="22" fill="#0e1626" opacity="1" rx="4"/>
<text x="52" y="470" font-size="11.5" fill="#34d399" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIO_MODE_IT_FALLING</text>
<text x="300" y="470" font-size="11.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">下降沿</text>
<text x="380" y="470" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">最常用：按下瞬间触发</text>
<rect x="40" y="480" width="820" height="22" fill="none" opacity="1" rx="4"/>
<text x="52" y="496" font-size="11.5" fill="#fbbf24" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIO_MODE_IT_RISING_FALLING</text>
<text x="300" y="496" font-size="11.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">双边沿</text>
<text x="380" y="496" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">旋转编码器、需要按下+松开都响应</text>
<rect x="40" y="506" width="820" height="22" fill="#0e1626" opacity="1" rx="4"/>
<text x="52" y="522" font-size="11.5" fill="#a78bfa" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIO_MODE_EVT_*</text>
<text x="300" y="522" font-size="11.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">事件模式</text>
<text x="380" y="522" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">只置事件标志，不产生中断（配合 WFE）</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#64748b" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F1 系列必须开 AFIO 时钟：__HAL_RCC_AFIO_CLK_ENABLE()，否则 EXTI 不工作</text>
<text x="876" y="602" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
