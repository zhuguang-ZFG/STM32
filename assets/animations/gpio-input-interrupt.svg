.hit{animation:hit-fade 2s ease-in-out infinite 0s;}
@keyframes isr-fade{0%,100%{opacity:0.4}50%{opacity:1.0}}
.isr{animation:isr-fade 1.6s ease-in-out infinite 0s;}
</style>

