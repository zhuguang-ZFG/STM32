<rect x="40" y="92" width="4" height="152" fill="#22d3ee" opacity="1" rx="2"/>
<text x="58" y="118" font-size="13.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">① 输出比较翻转</text>
