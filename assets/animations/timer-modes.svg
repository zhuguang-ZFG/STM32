<circle cx="149" cy="184" r="5" fill="#22d3ee" opacity="1" class="mk0"/>
<circle cx="331" cy="184" r="5" fill="#22d3ee" opacity="1" class="mk0"/>
<rect x="460" y="92" width="400" height="152" fill="#111c31" opacity="1" rx="12" stroke="#243354" stroke-width="1.5"/>
<rect x="460" y="92" width="4" height="152" fill="#34d399" opacity="1" rx="2"/>
<text x="478" y="118" font-size="13.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">② PWM 输出</text>
<text x="478" y="138" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CNT &lt; CCR 输出高</text>
<line x1="478" y1="154" x2="478" y2="208" stroke="#243354" stroke-width="1.4" stroke-linecap="round" opacity="1"/>
<line x1="478" y1="208" x2="842" y2="208" stroke="#243354" stroke-width="1.4" stroke-linecap="round" opacity="1"/>
