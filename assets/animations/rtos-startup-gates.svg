.bootg3{animation:bootg3-sq 8.2s linear infinite;}
@keyframes bootg4-sq{0%,66.67%{opacity:0.42}66.97%,78.00%{opacity:1.0}78.30%,100%{opacity:0.42}}
.bootg4{animation:bootg4-sq 8.2s linear infinite;}
@keyframes bootg5-sq{0%,83.33%{opacity:0.42}83.63%,94.67%{opacity:1.0}94.97%,100%{opacity:0.42}}
.bootg5{animation:bootg5-sq 8.2s linear infinite;}

.boot-flow{stroke-dasharray:5 8;animation:boot-flow-flow 1.2s linear infinite;}@keyframes boot-flow-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-13px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
