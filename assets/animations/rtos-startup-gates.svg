<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="RTOS 启动不是一串 delay，而是六道可证明的门">
<title>RTOS 启动不是一串 delay，而是六道可证明的门</title>
<style>
@keyframes bootg0-sq{0%,0.00%{opacity:0.42}0.30%,11.33%{opacity:1.0}11.63%,100%{opacity:0.42}}
.bootg0{animation:bootg0-sq 8.2s linear infinite;}
@keyframes bootg1-sq{0%,16.67%{opacity:0.42}16.97%,28.00%{opacity:1.0}28.30%,100%{opacity:0.42}}
.bootg1{animation:bootg1-sq 8.2s linear infinite;}
