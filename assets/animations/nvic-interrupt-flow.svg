<line x1="580" y1="194" x2="580" y2="209" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="nv-flow"/>
<polygon points="580.00,216.00 576.50,209.00 583.50,209.00" fill="#075e84" opacity="1"/>
<rect x="36" y="238" width="200" height="96" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<rect x="36" y="238" width="200" height="5" fill="#7a4e00" opacity="1" rx="2"/>
<text x="50" y="268" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">④ 取向量</text>
<text x="50" y="292" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">VTOR + 4×(IRQn+16)</text>
<text x="50" y="314" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Reset=0，IRQ 从 16 起</text>
<rect x="36" y="238" width="200" height="96" fill="#7a4e00" opacity="0.12" rx="8" class="nv3"/>
<line x1="239" y1="286" x2="248" y2="286" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="nv-flow"/>
<polygon points="255.00,286.00 248.00,289.50 248.00,282.50" fill="#075e84" opacity="1"/>
<rect x="258" y="238" width="200" height="96" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<rect x="258" y="238" width="200" height="5" fill="#1b5c45" opacity="1" rx="2"/>
<text x="272" y="268" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">⑤ 执行 ISR</text>
<text x="272" y="292" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">清标志 · 置事件 · 快退</text>
<text x="272" y="314" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">禁 HAL_Delay / printf</text>
<rect x="258" y="238" width="200" height="96" fill="#1b5c45" opacity="0.12" rx="8" class="nv4"/>
<line x1="461" y1="286" x2="470" y2="286" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="nv-flow"/>
<polygon points="477.00,286.00 470.00,289.50 470.00,282.50" fill="#075e84" opacity="1"/>
<rect x="480" y="238" width="200" height="96" fill="#f1f5f7" opacity="1" rx="8" stroke="#8e2f5b" stroke-width="1.5"/>
<rect x="480" y="238" width="200" height="5" fill="#8e2f5b" opacity="1" rx="2"/>
<text x="494" y="268" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">⑥ 出栈返回</text>
<text x="494" y="292" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">EXC_RETURN 恢复现场</text>
<text x="494" y="314" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">可 tail-chain 下一 IRQ</text>
<rect x="480" y="238" width="200" height="96" fill="#8e2f5b" opacity="0.12" rx="8" class="nv5"/>
<rect x="36" y="347" width="3" height="18" fill="#5b3a8c" opacity="1"/>
<text x="48" y="360" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">硬件栈帧 8×4 B（低地址在左，SP 停在 R0）</text>
<rect x="36" y="384" width="58" height="44" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="65" y="410" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R0</text>
<rect x="36" y="384" width="58" height="44" fill="#5b3a8c" opacity="0.1" rx="4" class="sf0"/>
<rect x="100" y="384" width="58" height="44" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="129" y="410" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R1</text>
<rect x="100" y="384" width="58" height="44" fill="#5b3a8c" opacity="0.1" rx="4" class="sf1"/>
<rect x="164" y="384" width="58" height="44" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="193" y="410" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R2</text>
<rect x="164" y="384" width="58" height="44" fill="#5b3a8c" opacity="0.1" rx="4" class="sf2"/>
<rect x="228" y="384" width="58" height="44" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="257" y="410" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R3</text>
<rect x="228" y="384" width="58" height="44" fill="#5b3a8c" opacity="0.1" rx="4" class="sf3"/>
<rect x="292" y="384" width="58" height="44" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="321" y="410" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R12</text>
<rect x="292" y="384" width="58" height="44" fill="#5b3a8c" opacity="0.1" rx="4" class="sf4"/>
<rect x="356" y="384" width="58" height="44" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="385" y="410" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">LR</text>
<rect x="356" y="384" width="58" height="44" fill="#5b3a8c" opacity="0.1" rx="4" class="sf5"/>
<rect x="420" y="384" width="58" height="44" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="449" y="410" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">PC</text>
<rect x="420" y="384" width="58" height="44" fill="#5b3a8c" opacity="0.1" rx="4" class="sf6"/>
<rect x="484" y="384" width="58" height="44" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="513" y="410" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">xPSR</text>
<rect x="484" y="384" width="58" height="44" fill="#5b3a8c" opacity="0.1" rx="4" class="sf7"/>
<text x="560" y="410" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ISR 可直接用 C；返回靠 EXC_RETURN</text>
<rect x="36" y="450" width="828" height="100" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="52" y="478" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">同抢占优先级不能互抢 · Tail-chaining 可省一对出入栈</text>
<text x="52" y="504" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">例：TIM2(IRQ=28) 跑着时 EXTI0(IRQ=6) 若抢占更高 → 打断；同级则排队。</text>
<text x="52" y="528" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ISR 只清 SR / 置标志；长活丢主循环。匹配 sample-04-nvic-preempt-flow。</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · FA-002 · NVIC 响应链，非逻辑分析仪实拍</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识轨</text>
</svg>
