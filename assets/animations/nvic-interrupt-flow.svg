<rect x="480" y="96" width="200" height="5" fill="#5b3a8c" opacity="1" rx="2"/>
<text x="494" y="126" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">③ 硬件入栈</text>
<text x="494" y="150" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R0-R3,R12,LR,PC,xPSR</text>
<text x="494" y="172" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">固定 32 B · SP→R0</text>
