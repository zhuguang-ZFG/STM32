<text x="50" y="150" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">EXTI_PR / TIMx_SR</text>
<text x="50" y="172" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">IRQn 例：EXTI0=6</text>
<rect x="36" y="96" width="200" height="96" fill="#1e4d63" opacity="0.12" rx="8" class="nv0"/>
<line x1="239" y1="144" x2="248" y2="144" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="nv-flow"/>
<polygon points="255.00,144.00 248.00,147.50 248.00,140.50" fill="#075e84" opacity="1"/>
