<rect x="258" y="96" width="200" height="5" fill="#075e84" opacity="1" rx="2"/>
<text x="272" y="126" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">② NVIC 仲裁</text>
<text x="272" y="150" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">抢占优先级更小先跑</text>
<text x="272" y="172" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">GROUP_4：4 抢占 / 0 子</text>
<rect x="258" y="96" width="200" height="96" fill="#075e84" opacity="0.12" rx="8" class="nv1"/>
<line x1="461" y1="144" x2="470" y2="144" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="nv-flow"/>
<polygon points="477.00,144.00 470.00,147.50 470.00,140.50" fill="#075e84" opacity="1"/>
