<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="中断响应全流程">
<style>

.fl0{stroke-dasharray:7 10;animation:fl0-flow 1.2s linear infinite;}@keyframes fl0-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-17px}}

.fl1{stroke-dasharray:7 10;animation:fl1-flow 1.2s linear infinite;}@keyframes fl1-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-17px}}

.fl3{stroke-dasharray:7 10;animation:fl3-flow 1.2s linear infinite;}@keyframes fl3-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-17px}}

.fl4{stroke-dasharray:7 10;animation:fl4-flow 1.2s linear infinite;}@keyframes fl4-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-17px}}
</style>

<rect x="0" y="0" width="900" height="620" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">中断响应全流程</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">从外设置标志到 ISR 返回，硬件帮你做了哪些事</text>
<rect x="801" y="15" width="77" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="839.5" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">04 NVIC</text>
<rect x="40" y="100" width="196" height="80" fill="#f1f5f7" opacity="1" rx="8" stroke="#1e4d63" stroke-width="1.5"/>
<text x="54" y="128" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">① 外设置标志</text>
<text x="54" y="152" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SR 寄存器的某位置 1</text>
<line x1="240" y1="140" x2="307" y2="140" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="fl0"/>
<polygon points="314.00,140.00 307.00,143.50 307.00,136.50" fill="#075e84" opacity="1"/>
<rect x="318" y="100" width="196" height="80" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="332" y="128" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">② NVIC 仲裁</text>
<text x="332" y="152" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">比较抢占优先级，数值小者先响应</text>
<line x1="518" y1="140" x2="585" y2="140" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="fl1"/>
<polygon points="592.00,140.00 585.00,143.50 585.00,136.50" fill="#075e84" opacity="1"/>
<rect x="596" y="100" width="196" height="80" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="610" y="128" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">③ 硬件自动入栈</text>
<text x="610" y="152" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">先压 xPSR，SP 停在 R0</text>
<line x1="694" y1="182" x2="694" y2="213" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="694.00,220.00 690.50,213.00 697.50,213.00" fill="#075e84" opacity="1"/>
<rect x="40" y="236" width="196" height="80" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="54" y="264" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">④ 取向量表</text>
<text x="54" y="288" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">VTOR + 4×(IRQn+16)</text>
<line x1="240" y1="276" x2="307" y2="276" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="fl3"/>
<polygon points="314.00,276.00 307.00,279.50 307.00,272.50" fill="#075e84" opacity="1"/>
<line x1="240" y1="276" x2="307" y2="276" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="314.00,276.00 307.00,279.50 307.00,272.50" fill="#075e84" opacity="1"/>
<rect x="318" y="236" width="196" height="80" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="332" y="264" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">⑤ 执行 ISR</text>
<text x="332" y="288" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">清标志、处理数据、越短越好</text>
<line x1="518" y1="276" x2="585" y2="276" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1" class="fl4"/>
<polygon points="592.00,276.00 585.00,279.50 585.00,272.50" fill="#075e84" opacity="1"/>
<line x1="518" y1="276" x2="585" y2="276" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="592.00,276.00 585.00,279.50 585.00,272.50" fill="#075e84" opacity="1"/>
<rect x="596" y="236" width="196" height="80" fill="#f1f5f7" opacity="1" rx="8" stroke="#8e2f5b" stroke-width="1.5"/>
<text x="610" y="264" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">⑥ 出栈返回</text>
<text x="610" y="288" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">恢复现场，继续被打断的指令</text>
<rect x="40" y="335" width="3" height="18" fill="#5b3a8c" opacity="1"/>
<text x="52" y="348" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">硬件栈帧 32 字节：低地址在左，SP 指向 R0</text>
<rect x="40" y="360" width="56" height="40" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="68" y="385" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R0</text>
<rect x="102" y="360" width="56" height="40" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="130" y="385" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R1</text>
<rect x="164" y="360" width="56" height="40" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="192" y="385" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R2</text>
<rect x="226" y="360" width="56" height="40" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="254" y="385" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R3</text>
<rect x="288" y="360" width="56" height="40" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="316" y="385" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">R12</text>
<rect x="350" y="360" width="56" height="40" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="378" y="385" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">LR</text>
<rect x="412" y="360" width="56" height="40" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="440" y="385" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">PC</text>
<rect x="474" y="360" width="56" height="40" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="502" y="385" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">xPSR</text>
<text x="548" y="385" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">高地址 →  硬件自动入栈，ISR 直接写 C</text>
<rect x="40" y="415" width="3" height="18" fill="#7a4e00" opacity="1"/>
<text x="52" y="428" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">优先级分组：谁可以打断谁</text>
<text x="52" y="444" font-size="11.5" fill="#075e84" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">NVIC_PRIORITYGROUP_4</text>
<text x="280" y="444" font-size="11.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">4 位抢占 / 0 位子优先级</text>
<text x="500" y="444" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">只用抢占，最常用</text>
<text x="52" y="468" font-size="11.5" fill="#075e84" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">NVIC_PRIORITYGROUP_2</text>
<text x="280" y="468" font-size="11.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">2 位抢占 / 2 位子优先级</text>
<text x="500" y="468" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">同类外设内部排队</text>
<text x="52" y="492" font-size="11.5" fill="#075e84" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">同抢占优先级</text>
<text x="280" y="492" font-size="11.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不能互相打断</text>
<text x="500" y="492" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">会按子优先级排队执行</text>
<line x1="24" y1="578" x2="876" y2="578" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="602" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ISR 里禁止 HAL_Delay / 浮点运算 / printf，必要时只置标志交给主循环处理</text>
<text x="876" y="602" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
