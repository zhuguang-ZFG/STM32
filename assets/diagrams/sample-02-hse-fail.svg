<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="720" viewBox="0 0 960 720" role="img" aria-label="HSE 停振后 SYSCLK 落在 HSI 8 MHz：115200 变 12800，1 ms 变 9 ms">


<rect x="0" y="0" width="960" height="720" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">HSE 停振后 SYSCLK 落在 HSI 8 MHz：115200 变 12800，1 ms 变 9 ms</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 LQFP48 · RM0008 Rev 21 §7.3.2</text>
<rect x="906" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">02</text>
<text x="40" y="94" font-size="17" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">正常：HSE 8 MHz 经 PLL ×9 上到 72 MHz</text>
<rect x="40" y="112" width="162" height="56" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="121" y="139.25" font-size="15" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">HSE 8 MHz</text>
<text x="121" y="155" font-size="12" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PD0/PD1 · 5/6 脚</text>
<line x1="204" y1="140" x2="229" y2="140" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="236.00,140.00 229.00,143.50 229.00,136.50" fill="#1b5c45" opacity="1"/>
<rect x="238" y="112" width="172" height="56" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="324" y="139.25" font-size="15" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">PLL ×9</text>
<text x="324" y="155" font-size="12" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PLLMUL=0111 · PLLSRC=1</text>
<line x1="412" y1="140" x2="437" y2="140" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="444.00,140.00 437.00,143.50 437.00,136.50" fill="#1b5c45" opacity="1"/>
<rect x="446" y="112" width="190" height="56" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="541" y="139.25" font-size="15" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">SYSCLK 72 MHz</text>
<text x="541" y="155" font-size="12" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SWS=10 · HCLK 72 MHz</text>
<rect x="672" y="96" width="268" height="46" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="806" y="117.55" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">USART1 → 115200</text>
<text x="806" y="134" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">72e6/(16×115200)=39.0625 · BRR 0x271</text>
<rect x="672" y="152" width="268" height="46" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="806" y="173.55" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">SysTick 重装 72000</text>
<text x="806" y="190" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">→ 1.000 ms</text>
<rect x="672" y="208" width="268" height="46" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="806" y="229.55" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">FLASH LATENCY=2</text>
<text x="806" y="246" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">48–72 MHz 档，配得上</text>
<line x1="638" y1="140" x2="664.984" y2="122.292" stroke="#1b5c45" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="670.00,119.00 666.63,124.80 663.34,119.78" fill="#1b5c45" opacity="1"/>
<line x1="638" y1="140" x2="665.951" y2="170.572" stroke="#1b5c45" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="670.00,175.00 663.74,172.60 668.17,168.55" fill="#1b5c45" opacity="1"/>
<line x1="638" y1="140" x2="668.01" y2="225.34" stroke="#1b5c45" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="670.00,231.00 665.18,226.33 670.84,224.34" fill="#1b5c45" opacity="1"/>
<line x1="40" y1="286" x2="920" y2="286" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="40" y="318" font-size="17" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">停振：CSS 把 SYSCLK 切到 HSI 8 MHz，分频一个没改</text>
<rect x="40" y="336" width="162" height="56" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="121" y="363.25" font-size="15" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">HSE 停振</text>
<text x="121" y="379" font-size="12" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HSERDY=0</text>
<line x1="168" y1="340" x2="186" y2="358" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="186" y1="340" x2="168" y2="358" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="204" y1="364" x2="229" y2="364" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 3"/>
<polygon points="236.00,364.00 229.00,367.50 229.00,360.50" fill="#8f2d2d" opacity="1"/>
<text x="220" y="350" font-size="11" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CSS</text>
<rect x="238" y="336" width="172" height="56" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="324" y="363.25" font-size="15" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">HSI 8 MHz</text>
<text x="324" y="379" font-size="12" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">内部 RC · 上电默认</text>
<line x1="412" y1="364" x2="437" y2="364" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="444.00,364.00 437.00,367.50 437.00,360.50" fill="#8f2d2d" opacity="1"/>
<rect x="446" y="336" width="190" height="56" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="541" y="363.25" font-size="15" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">SYSCLK 8 MHz</text>
<text x="541" y="379" font-size="12" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SWS=00 · PLL 已关</text>
<rect x="672" y="320" width="268" height="46" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="806" y="341.55" font-size="13" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">同一份 0x271 → 12800</text>
<text x="806" y="358" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">8e6/(16×39.0625) · 慢 88.9%</text>
<rect x="672" y="376" width="268" height="46" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="806" y="397.55" font-size="13" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">SysTick 72000 → 9.000 ms</text>
<text x="806" y="414" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">代码写 1 s，实际 9 s</text>
<rect x="672" y="432" width="268" height="46" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="806" y="453.55" font-size="13" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">LATENCY=2 仍生效</text>
<text x="806" y="470" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">8 MHz 只需 0，没人重算</text>
<line x1="638" y1="364" x2="664.984" y2="346.292" stroke="#8f2d2d" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="670.00,343.00 666.63,348.80 663.34,343.78" fill="#8f2d2d" opacity="1"/>
<line x1="638" y1="364" x2="665.951" y2="394.572" stroke="#8f2d2d" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="670.00,399.00 663.74,396.60 668.17,392.55" fill="#8f2d2d" opacity="1"/>
<line x1="638" y1="364" x2="668.01" y2="449.34" stroke="#8f2d2d" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="670.00,455.00 665.18,450.33 670.84,448.34" fill="#8f2d2d" opacity="1"/>
<text x="40" y="512" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">115200 与 12800 是同一份分频，差 9 倍；不是波特率凑不出来</text>
<rect x="40" y="522" width="560" height="16" fill="#f1f5f7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<rect x="40" y="522" width="560" height="16" fill="#1b5c45" opacity="0.22" rx="4"/>
<text x="610" y="535" font-size="11" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">115200（72 MHz）</text>
<rect x="40" y="550" width="62" height="16" fill="#f1f5f7" opacity="1" rx="4" stroke="#8f2d2d" stroke-width="1.5"/>
<rect x="40" y="550" width="62" height="16" fill="#8f2d2d" opacity="0.22" rx="4"/>
<text x="610" y="563" font-size="11" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">12800（8 MHz，÷9）</text>
<text x="40" y="600" font-size="15" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">检查点：三个读数，先定住时钟，再谈波特率</text>
<rect x="40" y="612" width="200" height="50" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="140" y="635.2" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">RCC_CR[17] HSERDY</text>
<text x="140" y="652" font-size="9" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">0 = 晶振没起振</text>
<rect x="252" y="612" width="200" height="50" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="352" y="635.2" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">RCC_CFGR[3:2] SWS</text>
<text x="352" y="652" font-size="9" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">00 = 系统跑在 HSI</text>
<rect x="464" y="612" width="200" height="50" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="564" y="635.2" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">FLASH_ACR[2:0]</text>
<text x="564" y="652" font-size="9" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">2 仍生效，8 MHz 只需 0</text>
<rect x="676" y="612" width="264" height="50" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="808" y="635.2" font-size="12" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">NMI 里写 CSSC</text>
<text x="808" y="652" font-size="9" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">否则 NMI 一直重进</text>
<line x1="24" y1="684" x2="936" y2="684" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="704" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。倍频与等待周期来自 RM0008 Rev 21 第 7.3.2 节；BRR 39.0625 与 0x271 来自第 06 章；引脚与容量来自 DS5319 Rev 20。</text>
<text x="936" y="704" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
