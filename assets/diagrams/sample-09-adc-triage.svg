<text x="72" y="106" font-size="10" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">4096</text>
<text x="78" y="260" font-size="10" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0</text>
<line x1="70" y1="112" x2="486" y2="112" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/>
<text x="482" y="106" font-size="10" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">满量程</text>
<line x1="150" y1="262" x2="150" y2="266" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="150" y="280" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0.2</text>
<line x1="234" y1="262" x2="234" y2="266" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="234" y="280" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0.4</text>
<line x1="318" y1="262" x2="318" y2="266" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="318" y="280" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0.6</text>
<line x1="402" y1="262" x2="402" y2="266" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="402" y="280" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0.8</text>
<line x1="486" y1="262" x2="486" y2="266" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="486" y="280" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">1.0 µs</text>
