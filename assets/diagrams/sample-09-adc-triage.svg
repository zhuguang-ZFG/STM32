<rect x="66" y="96" width="52.5" height="166" fill="#8f2d2d" opacity="0.16" rx="2"/>
<circle cx="118.5" cy="235.934" r="4" fill="#8f2d2d" opacity="1"/>
<line x1="216" y1="242" x2="133.498" y2="240.095" stroke="#8f2d2d" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="126.50,239.93 133.58,236.60 133.42,243.59" fill="#8f2d2d" opacity="1"/>
<text x="222" y="246" font-size="12" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">采样窗 125 ns → 只到 14%</text>
<text x="482" y="188" font-size="12" fill="#1b5c45" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">1 µs 也才 71%</text>
<rect x="530" y="83" width="3" height="18" fill="#075e84" opacity="1"/>
<text x="542" y="96" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">三种症状，三个不同的根</text>
<rect x="530" y="116" width="130" height="34" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="595" y="137.5" font-size="12.5" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">末位抖动</text>
<text x="674" y="138" font-size="12.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">采样电容没充满</text>
<rect x="530" y="170" width="130" height="34" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="595" y="191.5" font-size="12.5" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">恒 4095 / 0</text>
<text x="674" y="192" font-size="12.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">VIN 越界或 VDDA 偏低</text>
<rect x="530" y="224" width="130" height="34" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="595" y="245.5" font-size="12.5" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">整体偏置</text>
<text x="674" y="246" font-size="12.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">上电没做校准</text>
<rect x="40" y="296" width="880" height="40" fill="#f1f5f7" opacity="1" rx="8" stroke="#d7dce1" stroke-width="1.5"/>
<text x="54" y="321" font-size="12.5" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">code × VDDA / 4096　·　Tconv = SMP + 12.5 周期　·　ADCCLK ≤ 14 MHz（÷6 = 12 MHz）</text>
<rect x="40" y="352" width="880" height="98" fill="#f1f5f7" opacity="1" rx="8" stroke="#d7dce1" stroke-width="1.5"/>
<rect x="40" y="352" width="4" height="98" fill="#7a4e00" opacity="1" rx="2"/>
<text x="60" y="379" font-size="15" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">①</text>
<text x="86" y="379" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">末位抖动：等 RC 充完，不是加平均</text>
<text x="60" y="404" font-size="12.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">t ≈ (R_AIN + 1 kΩ) × 8 pF × ln(2^14) ≈ (R_AIN + 1 kΩ) × 78 ns</text>
<text x="60" y="423" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">100 kΩ 要 7.8 µs；SMP=1.5 cycles 只有 125 ns，差 62 倍 → SMPR2 SMP0 = 111（239.5 周期）</text>
<text x="60" y="442" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自检：100 kΩ 源各取 100 次读数，比较 1.5 与 239.5 档的均值与极差</text>
<rect x="40" y="460" width="880" height="98" fill="#f1f5f7" opacity="1" rx="8" stroke="#d7dce1" stroke-width="1.5"/>
<rect x="40" y="460" width="4" height="98" fill="#8f2d2d" opacity="1" rx="2"/>
<text x="60" y="487" font-size="15" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">②</text>
<text x="86" y="487" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">顶满或贴零：先看 VDDA 与脚的方向</text>
<text x="60" y="512" font-size="12.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">4095 是钳位不是读数；VIN &gt; VDDA 会打开输入保护二极管，码值饱和</text>
<text x="60" y="531" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">LQFP48 没有独立 VREF+：pin 9 的 VDDA 就是满量程，1% 下垂让所有码偏 1%</text>
<text x="60" y="550" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自检：转换进行时量 pin 9 到 GND；再用 CH17 Vrefint 反算 VDDA 交叉核对</text>
<rect x="40" y="568" width="880" height="98" fill="#f1f5f7" opacity="1" rx="8" stroke="#d7dce1" stroke-width="1.5"/>
<rect x="40" y="568" width="4" height="98" fill="#5b3a8c" opacity="1" rx="2"/>
<text x="60" y="595" font-size="15" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">③</text>
<text x="86" y="595" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">整体偏置：校准顺序错一步就白做</text>
<text x="60" y="620" font-size="12.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">ADON=1 → 等 2 ADCCLK → RSTCAL=1 → 轮询 RSTCAL=0 → CAL=1 → 轮询 CAL=0</text>
<text x="60" y="639" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">RSTCAL 未清就写 CAL，新校准不生效；校准期间不能有转换在跑</text>
<text x="60" y="658" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自检：0 V 与半量程各测一次 —— 两处台阶一样是偏置，越往上越大是增益</text>
<text x="40" y="704" font-size="14" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">判定顺序</text>
<rect x="144" y="684" width="210" height="36" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="249" y="706.5" font-size="12.5" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">先算采样时间</text>
<line x1="360" y1="702" x2="377" y2="702" stroke="#5b3a8c" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="384.00,702.00 377.00,705.50 377.00,698.50" fill="#5b3a8c" opacity="1"/>
<rect x="390" y="684" width="210" height="36" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="495" y="706.5" font-size="12.5" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">再核 VDDA 与脚</text>
<line x1="606" y1="702" x2="623" y2="702" stroke="#5b3a8c" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="630.00,702.00 623.00,705.50 623.00,698.50" fill="#5b3a8c" opacity="1"/>
<rect x="636" y="684" width="210" height="36" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="741" y="706.5" font-size="12.5" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">最后才校准</text>
<line x1="24" y1="836" x2="936" y2="836" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="858" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。采样时间档位与校准流程来自 RM0008 Rev 21 第 11 章；精度实践来自 AN2834。</text>
<text x="936" y="858" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
