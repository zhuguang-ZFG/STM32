<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="ADC 末位抖动查采样时间，顶满或贴零查 VDDA，整体偏置查校准；三岔互不替代">


<rect x="0" y="0" width="960" height="880" fill="#fbfaf7"/>
