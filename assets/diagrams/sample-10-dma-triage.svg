<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="DMA 传输不动了：CNDTR 不减、数据错位、TC 中断不进，三个岔口一次只改一个寄存器">


<rect x="0" y="0" width="960" height="880" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">DMA 传输不动了：CNDTR 不减、数据错位、TC 中断不进，三个岔口一次只改一个寄存器</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 · chapter 10 · DMA1 7 channels</text>
<rect x="906" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">10</text>
<text x="40" y="86" font-size="16" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">DMA 传输不动了：先读 CNDTR，再看目的缓冲区，最后看中断标志</text>
<text x="40" y="112" font-size="14" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">three branches, one register field each: EN / PSIZE-MSIZE-MINC / TCIE-IFCR</text>
<text x="40" y="138" font-size="13" fill="#7a4e00" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">DMA1_Channel5 (USART1_RX)  CPAR=0x40013804  CMAR=0x20000100  CNDTR=0x0080 at t0</text>
<text x="40" y="170" font-size="16" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">岔口一  CNDTR 不减：事务从未启动</text>
<text x="920" y="170" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">CCR.EN</text>
<rect x="40" y="184" width="880" height="178" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="56" y="214" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">symptom: CNDTR still reads 0x0080, no byte reached the buffer, and TCIF5 is 0</text>
<text x="56" y="240" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">cause A: CCR.EN = 0 (bit 0): CPAR, CMAR and CNDTR were written, then the channel was never enabled</text>
<text x="56" y="266" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">cause B: the peripheral request never arrives: USART1_RX is hard-wired to DMA1 channel 5, not 4 or 6</text>
<text x="56" y="292" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">cause B check: USART_CR3.DMAR = 1, and RXNE sets on every received byte; no RXNE, no request</text>
<text x="56" y="318" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">checkpoint: order matters — CPAR, CMAR, CNDTR, then CCR, and EN = 1 last</text>
<text x="56" y="344" font-size="14" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">probe: set EN from the debugger and watch CNDTR fall; if it falls, the request path was the fault</text>
<text x="40" y="396" font-size="16" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">岔口二  数据错位或全写同一地址：宽度与自增</text>
<text x="920" y="396" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">CCR.PSIZE · CCR.MSIZE · CCR.MINC</text>
<rect x="40" y="410" width="880" height="178" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="56" y="440" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">symptom: bytes arrive shifted by one, or every item overwrites CMAR[0] while CNDTR counts down</text>
<text x="56" y="466" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">cause A: PSIZE[1:0] (CCR 9:8) and MSIZE[1:0] (CCR 11:10) disagree: items are truncated or padded</text>
<text x="56" y="492" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">cause B: MINC = 0 (CCR bit 7): the memory address never increments, so each item writes the same word</text>
<text x="56" y="518" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">not a bug: PINC = 0 (CCR bit 6) on a fixed data register such as USART_DR is the normal setting</text>
<text x="56" y="544" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">checkpoint: for 8-bit USART1_RX set PSIZE = MSIZE = 00, MINC = 1, PINC = 0; CMAR 32-bit aligned</text>
<text x="56" y="570" font-size="14" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">probe: break after 4 items; CMAR must grow by 4 bytes at MSIZE = 00 and by 8 at MSIZE = 01</text>
<text x="40" y="622" font-size="16" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">岔口三  CNDTR 归零但 TC 中断不进：标志与使能</text>
<text x="920" y="622" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">CCR.TCIE · IFCR.CTCIF5</text>
<rect x="40" y="636" width="880" height="152" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="56" y="666" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">symptom: CNDTR reaches 0 and TCIF5 sets, but the ISR never runs</text>
<text x="56" y="692" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">cause A: TCIF5 was already 1 from an earlier run — a set flag blocks a new interrupt until cleared</text>
<text x="56" y="718" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">fix A: write 1 to CTCIF5 (DMA_IFCR bit 17 for channel 5); writing 0 leaves the flag set</text>
<text x="56" y="744" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">cause B: TCIE = 0 (CCR bit 1); TEIE and HTIE also silent, so error and half-transfer never surface</text>
<text x="56" y="770" font-size="14" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">checkpoint: enable the DMA1_Channel5 IRQ in NVIC, then clear all four flags before re-arming</text>
<rect x="40" y="800" width="880" height="32" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="56" y="821" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">底注  F103 仅 DMA1（7 通道）；CNDTR 计配置宽度的数据项数，不是字节：8-bit × 0x0080 = 128 B，16-bit 同值 = 256 B。</text>
<line x1="24" y1="844" x2="936" y2="844" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="864" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。通道映射与 CR/IFCR 语义来自 RM0008 Rev 21 第 13 章；DMA1 结构来自 DS5319 Rev 20 第 2.3.13 节。</text>
<text x="936" y="864" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
