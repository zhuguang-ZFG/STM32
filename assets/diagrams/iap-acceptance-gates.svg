<polygon points="197.00,164.00 191.00,167.00 191.00,161.00" fill="#075e84" opacity="1"/>
<rect x="200" y="110" width="150" height="108" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="275" y="148" font-size="12" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">Range</text>
<text x="275" y="185" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">APP slot 内</text>
<line x1="353" y1="164" x2="367" y2="164" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
