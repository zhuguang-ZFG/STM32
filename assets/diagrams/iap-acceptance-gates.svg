<text x="451" y="148" font-size="12" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="800">Vector</text>
<text x="451" y="185" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">MSP + Reset</text>
<line x1="529" y1="164" x2="543" y2="164" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="549.00,164.00 543.00,167.00 543.00,161.00" fill="#075e84" opacity="1"/>
