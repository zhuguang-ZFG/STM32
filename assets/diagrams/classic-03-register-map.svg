<rect x="40" y="100" width="380" height="54" fill="#f1f5f7" opacity="1" rx="4" stroke="#5e6872" stroke-width="1.5"/>
<rect x="40" y="100" width="5" height="54" fill="#5b3a8c" opacity="1"/>
