<text x="404" y="284" font-size="10.5" fill="#5e6872" text-anchor="end" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x08</text>
<text x="60" y="304" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">只读：引脚上的真实输入电平</text>
<line x1="420" y1="287" x2="462" y2="287" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<rect x="462" y="260" width="170" height="54" fill="#e5f3f8" opacity="1" rx="4" stroke="#075e84" stroke-width="1.5"/>
