<text x="547" y="373" font-size="13" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">③ 输出</text>
<text x="660" y="362" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">写它改电平；|= 是读改写</text>
<rect x="40" y="420" width="380" height="54" fill="#f1f5f7" opacity="1" rx="4" stroke="#5e6872" stroke-width="1.5"/>
<rect x="40" y="420" width="5" height="54" fill="#1b5c45" opacity="1"/>
<text x="60" y="444" font-size="16" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">BSRR</text>
<text x="404" y="444" font-size="10.5" fill="#5e6872" text-anchor="end" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x10</text>
<text x="60" y="464" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">写 1 原子：低 16 位置位 / 高 16 位复位</text>
<line x1="420" y1="447" x2="462" y2="447" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<rect x="462" y="420" width="170" height="54" fill="#e5f3f8" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<text x="547" y="453" font-size="13" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">④ 原子改位</text>
<text x="660" y="442" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">单指令置位 / 复位，不碰别的位</text>
<rect x="40" y="500" width="380" height="54" fill="#f1f5f7" opacity="1" rx="4" stroke="#5e6872" stroke-width="1.5"/>
<rect x="40" y="500" width="5" height="54" fill="#1e4d63" opacity="1"/>
<text x="60" y="524" font-size="16" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">BRR</text>
<text x="404" y="524" font-size="10.5" fill="#5e6872" text-anchor="end" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0x14</text>
<text x="60" y="544" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">写 1 复位（F1 专有）</text>
<line x1="420" y1="527" x2="462" y2="527" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<rect x="462" y="500" width="170" height="54" fill="#e5f3f8" opacity="1" rx="4" stroke="#1e4d63" stroke-width="1.5"/>
<text x="547" y="533" font-size="13" fill="#1e4d63" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">⑤ 复位</text>
<text x="660" y="522" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F4 没有 BRR，并入 BSRR 高 16 位</text>
<rect x="462" y="100" width="170" height="134" fill="#e5f3f8" opacity="1" rx="4" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="547" y="140" font-size="13" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">① 配置类</text>
<text x="547" y="166" font-size="12" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">CRL+CRH</text>
<text x="547" y="190" font-size="12" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">是同一类</text>
<text x="660" y="122" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">MODE/CNF 决定模式</text>
<text x="660" y="142" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">输入 / 输出 / 上下拉 / 复用</text>
<text x="660" y="162" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">一个口 16 脚，两半分管</text>
<rect x="40" y="566" width="896" height="44" fill="#f1f5f7" opacity="1" rx="4" stroke="#5e6872" stroke-width="1.5"/>
<text x="60" y="593" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">只改一个脚、不碰别人：BSRR 写 1 置位 / 复位最直接（F1 另有 BRR 专门复位）；ODR 读改写不是唯一办法。</text>
<line x1="24" y1="618" x2="936" y2="618" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="642" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">偏移与功能依据 RM0008 第 9 章 GPIO 寄存器</text>
<text x="936" y="642" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
