<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CRL+CRH 同属配置类；IDR 读回、ODR 输出、BSRR/BRR 原子改位（F1）</text>
