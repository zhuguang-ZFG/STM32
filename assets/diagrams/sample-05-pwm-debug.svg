<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="920" viewBox="0 0 960 920" role="img" aria-label="有波形而周期差整数倍时停在环 ①；PA6 全无波形时，CC1E = 0 与 CRL MODE6 = 00 要分开读">


<rect x="0" y="0" width="960" height="920" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">有波形而周期差整数倍时停在环 ①；PA6 全无波形时，CC1E = 0 与 CRL MODE6 = 00 要分开读</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 LQFP48 · RM0008 Rev 21 §15 · DS5319 Rev 20 Table 5</text>
<rect x="906" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">05</text>
<text x="40" y="86" font-size="16" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">STM32F103C8T6  LQFP48 pin 16 PA6 = TIM3_CH1  TIM3 on APB1</text>
<text x="40" y="112" font-size="13" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">offsets: TIM3_CCER 0x20   TIM3_CCMR1 0x18   GPIOA_CRL 0x00   TIM3_REMAP lives in AFIO_MAPR</text>
<text x="40" y="138" font-size="14" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">counter clock 72 MHz: PCLK1 = 36 MHz, doubled because the APB1 prescaler is not 1</text>
<text x="40" y="164" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">read the rings in this order; a later ring never repairs an earlier one</text>
<text x="40" y="196" font-size="16" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">正常路径  three rings open, PA6 carries 1 kHz</text>
<rect x="40" y="210" width="880" height="188" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<rect x="58" y="230" width="260" height="132" fill="#fbfaf7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="72" y="260" font-size="14" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">① 分频比</text>
<text x="72" y="292" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">TIM3_PSC = 71  TIM3_ARR = 999</text>
<text x="72" y="320" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">72e6 / (72 × 1000) = 1000 Hz</text>
<text x="72" y="346" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PSC+1 and ARR+1 are the counts</text>
<line x1="318" y1="296" x2="342" y2="296" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="348.00,296.00 342.00,299.00 342.00,293.00" fill="#1b5c45" opacity="1"/>
<rect x="348" y="230" width="260" height="132" fill="#fbfaf7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="362" y="260" font-size="14" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">② 输出使能</text>
<text x="362" y="292" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">TIM3_CCER bit 0</text>
<text x="362" y="320" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">CC1E = 1</text>
<text x="362" y="346" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CCMR1 OC1M[6:4] = 110</text>
<line x1="608" y1="296" x2="632" y2="296" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="638.00,296.00 632.00,299.00 632.00,293.00" fill="#1b5c45" opacity="1"/>
<rect x="638" y="230" width="260" height="132" fill="#fbfaf7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="652" y="260" font-size="14" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">③ GPIO 复用</text>
<text x="652" y="292" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIOA_CRL[27:24] = 0xB</text>
<text x="652" y="320" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">CNF6 = 10  MODE6 = 11</text>
<text x="652" y="346" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TIM3_REMAP = 00 keeps PA6</text>
<text x="56" y="384" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">read PSC, ARR, CCER, and CRL back before touching the code again</text>
<text x="40" y="430" font-size="16" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">失败路径  each ring fails on its own read-back</text>
<rect x="40" y="444" width="880" height="196" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="56" y="478" font-size="13" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">①  PSC/ARR from 36 MHz</text>
<text x="360" y="478" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">a 500 Hz waveform is still there, so only ring ① is wrong</text>
<text x="56" y="516" font-size="13" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">②  CCER bit 0 CC1E = 0</text>
<text x="360" y="516" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">OC1 never reaches the pin: PA6 stays quiet</text>
<text x="56" y="554" font-size="13" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">③a  CRL[27:24] MODE6 = 00</text>
<text x="360" y="554" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">the pin is still an input: AF push-pull never drives it</text>
<text x="56" y="592" font-size="13" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">③b  TIM3_REMAP != 00</text>
<text x="360" y="592" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">the waveform moves to PB4 or PC6: PA6 stays quiet</text>
<text x="56" y="622" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">start from the scope: is there any waveform at all?</text>
<text x="40" y="672" font-size="16" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">判据  waveform first, then the read-back</text>
<rect x="40" y="686" width="880" height="180" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="56" y="716" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">A waveform with the period off by a whole ratio: ring ①. Nothing at all: rings ② and ③.</text>
<text x="56" y="742" font-size="14" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CC1E = 0 disconnects OC1; MODE6 = 00 leaves PA6 an input; a non-zero remap moves the channel.</text>
<text x="56" y="768" font-size="14" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TIM1 also needs BDTR bit 15 MOE = 1 at offset 0x44, reset 0x0000; TIM3 has no MOE.</text>
<text x="56" y="794" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CCR sets only the duty, never the frequency. Read PSC, ARR, CCER, and CRL in that order.</text>
<text x="56" y="820" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">Does not prove: the CCR duty, the probe ground, or whether chapter 08 holds PA6 as SPI1_MISO.</text>
<text x="56" y="846" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">one ring at a time: three numbers turned together hide which one was wrong.</text>
<line x1="24" y1="884" x2="936" y2="884" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="904" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。CCER/CCMR1 位号与 BDTR 偏移来自 RM0008 Rev 21 第 15 章；PA6 第 16 脚与默认复用来自 DS5319 Rev 20 表 5。</text>
<text x="936" y="904" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
