<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="920" viewBox="0 0 960 920" role="img" aria-label="有波形而周期差整数倍时停在环 ①；PA6 全无波形时，CC1E = 0 与 CRL MODE6 = 00 要分开读">


<rect x="0" y="0" width="960" height="920" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="19.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">有波形而周期差整数倍时停在环 ①；PA6 全无波形时，CC1E = 0 与 CRL MODE6 = 00 要分开读</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 LQFP48 · RM0008 Rev 21 §15 · DS5319 Rev 20 Table 5</text>
<rect x="906" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">05</text>
<text x="40" y="122" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PA6 的波形就是判据：先看有没有，再看周期对不对</text>
<rect x="40" y="146" width="280" height="120" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<path d="M 58 166.24 L 58.00 166.24 L 88.50 166.24 L 88.50 209.76 L 119.00 209.76 L 119.00 166.24 L 149.50 166.24 L 149.50 209.76 L 180.00 209.76 L 180.00 166.24 L 210.50 166.24 L 210.50 209.76 L 241.00 209.76 L 241.00 166.24 L 271.50 166.24 L 271.50 209.76 L 302.00 209.76" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#1b5c45" stroke-width="2"/>
<text x="58" y="242" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">1 kHz ✓</text>
<text x="140" y="242" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">三环都通</text>
<rect x="340" y="146" width="280" height="120" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<path d="M 358 166.24 L 358.00 166.24 L 378.33 166.24 L 378.33 166.24 L 398.67 166.24 L 398.67 166.24 L 419.00 166.24 L 419.00 209.76 L 439.33 209.76 L 439.33 209.76 L 459.67 209.76 L 459.67 209.76 L 480.00 209.76 L 480.00 166.24 L 500.33 166.24 L 500.33 166.24 L 520.67 166.24 L 520.67 166.24 L 541.00 166.24 L 541.00 209.76 L 561.33 209.76 L 561.33 209.76 L 581.67 209.76 L 581.67 209.76 L 602.00 209.76" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#7a4e00" stroke-width="2"/>
<text x="358" y="242" font-size="13" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">500 Hz</text>
<text x="440" y="242" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">差整数倍 → 只查环 ①</text>
<rect x="640" y="146" width="280" height="120" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<path d="M 658 209.76 L 658.00 209.76 L 688.50 209.76 L 688.50 209.76 L 719.00 209.76 L 719.00 209.76 L 749.50 209.76 L 749.50 209.76 L 780.00 209.76 L 780.00 209.76 L 810.50 209.76 L 810.50 209.76 L 841.00 209.76 L 841.00 209.76 L 871.50 209.76 L 871.50 209.76 L 902.00 209.76" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#8f2d2d" stroke-width="2"/>
<text x="658" y="242" font-size="13" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">全无</text>
<text x="740" y="242" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">→ 查环 ② ③</text>
<rect x="40" y="300" width="250" height="140" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="54" y="328" font-size="14" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">环 ① 分频比</text>
<text x="54" y="356" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">TIM3_PSC = 71</text>
<text x="54" y="378" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">TIM3_ARR = 999</text>
<text x="54" y="406" font-size="11" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">72e6 / (72 × 1000) = 1000 Hz</text>
<rect x="360" y="300" width="250" height="140" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="374" y="328" font-size="14" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">环 ② 输出使能</text>
<text x="374" y="356" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">TIM3_CCER bit 0 = 1</text>
<text x="374" y="378" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">CCMR1 OC1M = 110</text>
<text x="374" y="406" font-size="11" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CC1E = 0 → OC1 到不了引脚</text>
<rect x="680" y="300" width="250" height="140" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="694" y="328" font-size="14" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">环 ③ GPIO 复用</text>
<text x="694" y="356" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">CRL[27:24] = 0xB</text>
<text x="694" y="378" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">TIM3_REMAP = 00</text>
<text x="694" y="406" font-size="11" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">MODE6 = 00 → 脚还是输入</text>
<line x1="292" y1="370" x2="351" y2="370" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="358.00,370.00 351.00,373.50 351.00,366.50" fill="#1b5c45" opacity="1"/>
<line x1="612" y1="370" x2="671" y2="370" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="678.00,370.00 671.00,373.50 671.00,366.50" fill="#1b5c45" opacity="1"/>
<circle cx="922" cy="370" r="26" fill="#fbfaf7" opacity="1" stroke="#1b5c45" stroke-width="2"/>
<text x="922" y="366" font-size="12" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PA6</text>
<text x="922" y="384" font-size="9" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">第 16 脚</text>
<rect x="680" y="456" width="250" height="54" fill="#f1f5f7" opacity="1" rx="4" stroke="#7a4e00" stroke-width="1.5"/>
<text x="692" y="478" font-size="11" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">REMAP ≠ 00 → 波形跑到</text>
<text x="692" y="496" font-size="11" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PB4 或 PC6，PA6 安静</text>
<text x="40" y="540" font-size="12" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">counter clock 72 MHz：PCLK1 = 36 MHz，APB1 预分频 ≠ 1 时翻倍——按 36 MHz 算 PSC/ARR 就得到 500 Hz</text>
<rect x="40" y="566" width="880" height="210" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="56" y="596" font-size="15" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">判据  先看波形，再做读回</text>
<text x="56" y="626" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CCR 只管占空比，频率由 PSC / ARR 定</text>
<text x="56" y="654" font-size="13" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TIM1 还要 BDTR bit 15 MOE = 1（偏移 0x44，复位 0x0000）；TIM3 没有 MOE</text>
<text x="56" y="682" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">读回顺序：PSC → ARR → CCER → CRL，按这个顺序对数</text>
<text x="56" y="710" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">一次只动一个环：三个数一起改，就不知道错的是谁</text>
<text x="56" y="738" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不证明：CCR 占空比、探头地线、以及第 08 章是否把 PA6 用作 SPI1_MISO</text>
<line x1="24" y1="884" x2="936" y2="884" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="904" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。CCER/CCMR1 位号与 BDTR 偏移来自 RM0008 Rev 21 第 15 章；PA6 第 16 脚与默认复用来自 DS5319 Rev 20 表 5。</text>
<text x="936" y="904" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
