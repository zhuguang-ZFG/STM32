<text x="56" y="714" font-size="14" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Trap: header visible, .c omitted → 'undefined reference' blamed on 'SPL dead'.</text>
