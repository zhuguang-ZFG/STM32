<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="840" viewBox="0 0 960 840" role="img" aria-label="一次链接派生 ELF、map 与 bin；只有 Build succeeded 而没有产物路径，等于还没进入烧录边界">


<rect x="0" y="0" width="960" height="840" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">一次链接派生 ELF、map 与 bin；只有 Build succeeded 而没有产物路径，等于还没进入烧录边界</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 · chapter 01 · linker/stm32f103c8.ld</text>
<rect x="906" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">01</text>
<text x="40" y="86" font-size="16" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">STM32F103C8T6  Flash 0x08000000 to 0x08010000  SRAM 0x20000000 to 0x20005000</text>
<text x="40" y="112" font-size="14" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">.elf keeps symbols and debug info. .bin is the bytes. .map is the address book.</text>
<text x="40" y="138" font-size="13" fill="#7a4e00" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">-Wl,-Map=...  --gc-sections  --print-memory-usage    objcopy -O ihex    objcopy -O binary</text>
<text x="40" y="170" font-size="16" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">正常路径  一次链接，三份产物</text>
<rect x="40" y="184" width="880" height="246" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<rect x="56" y="204" width="176" height="52" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="144" y="228.9" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">.o + .ld</text>
<text x="144" y="245" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">compile, then link</text>
<rect x="272" y="204" width="204" height="52" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="374" y="228.9" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">spl-f1-blink.elf</text>
<text x="374" y="245" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">symbols + debug info</text>
<rect x="516" y="204" width="150" height="52" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="591" y="228.9" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">objcopy</text>
<text x="591" y="245" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">-O binary</text>
<rect x="706" y="204" width="194" height="52" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="803" y="228.9" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">spl-f1-blink.bin</text>
<text x="803" y="245" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">bytes at 0x08000000</text>
<line x1="232" y1="230" x2="265" y2="230" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="272.00,230.00 265.00,233.50 265.00,226.50" fill="#1b5c45" opacity="1"/>
<line x1="476" y1="230" x2="509" y2="230" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="516.00,230.00 509.00,233.50 509.00,226.50" fill="#1b5c45" opacity="1"/>
<line x1="666" y1="230" x2="699" y2="230" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="706.00,230.00 699.00,233.50 699.00,226.50" fill="#1b5c45" opacity="1"/>
<text x="56" y="296" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">elf: the debugger reads it. A breakpoint needs a source line, and the line table lives here.</text>
<text x="56" y="322" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">bin: the flasher reads it. There are no address fields, so it always lands at 0x08000000.</text>
<text x="56" y="348" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">map: sections and symbols with addresses. 64 KB and 20 KB are checked here, nowhere else.</text>
<text x="56" y="374" font-size="15" fill="#7a4e00" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">first 8 bytes of the bin:  00 50 00 20 25 07 00 08</text>
<text x="56" y="400" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">word 0 is 0x20005000, the top of 20 KB SRAM; word 1 is 0x08000725, Reset_Handler in Flash</text>
<text x="40" y="452" font-size="16" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">失败路径  Build succeeded 之后没有产物路径</text>
<rect x="40" y="466" width="880" height="138" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="56" y="496" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">the build log cannot name the compiler, the .ld, or where the ELF sits</text>
<text x="56" y="522" font-size="14" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">a host .exe came out instead: the toolchain file never loaded</text>
<text x="56" y="548" font-size="14" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">no .map, so nobody can say whether .text still ends before 0x08010000</text>
<text x="56" y="574" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">until an artifact path exists, flashing has not started</text>
<text x="40" y="626" font-size="16" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">不证明什么  这张图停在产物边界</text>
<rect x="40" y="640" width="880" height="152" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="56" y="670" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">a .bin on disk does not prove the part was programmed</text>
<text x="56" y="696" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">a .map inside 64 KB does not prove reset reaches main</text>
<text x="56" y="722" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">an .elf does not prove the probe can attach; that is the next figure</text>
<text x="56" y="748" font-size="14" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">while a host .exe is what came out, do not touch the C code</text>
<line x1="24" y1="804" x2="936" y2="804" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="824" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。64 KB / 20 KB 与两个起点来自 DS5319 与本章；产物取 examples/spl-f1-blink 的构建输出。</text>
<text x="936" y="824" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
