<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="660" viewBox="0 0 960 660" role="img" aria-label="三种写法，一条边界">


<rect x="0" y="0" width="960" height="660" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#1b5c45" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">三种写法，一条边界</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HAL 与 BSRR 同为原子写位；只有 ODR 读改写存在竞争窗口</text>
<rect x="789" y="15" width="149" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="863.5" y="33.32" font-size="12" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">ch03-s13 · 写位路径</text>
<rect x="24" y="84" width="300" height="46" fill="#e5f3f8" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="174" y="114" font-size="14" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">A · HAL 库</text>
<rect x="24" y="130" width="300" height="204" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="40" y="162" font-size="11" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">HAL_GPIO_WritePin(GPIOC,</text>
<text x="40" y="183" font-size="11" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">    GPIO_PIN_13, GPIO_PIN_SET);</text>
<line x1="174" y1="208" x2="174" y2="225" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="174.00,230.00 171.50,225.00 176.50,225.00" fill="#5e6872" opacity="1"/>
<text x="174" y="254" font-size="11" fill="#1e4d63" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">展开成：GPIOC-&gt;BSRR = BS13</text>
<rect x="40" y="272" width="268" height="46" fill="#fbfaf7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<text x="174" y="301" font-size="12.5" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">一次 32 位写 · 原子 ✓</text>
<rect x="336" y="84" width="300" height="46" fill="#e5f3f8" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="486" y="114" font-size="14" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">B · 直接写 BSRR</text>
<rect x="336" y="130" width="300" height="204" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="352" y="162" font-size="11" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIOC-&gt;BSRR =</text>
<text x="352" y="183" font-size="11" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">    GPIO_BSRR_BS13;</text>
<line x1="486" y1="208" x2="486" y2="225" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="486.00,230.00 483.50,225.00 488.50,225.00" fill="#5e6872" opacity="1"/>
<text x="486" y="254" font-size="11" fill="#1e4d63" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">低 16 位写 1 = 置位</text>
<rect x="352" y="272" width="268" height="46" fill="#fbfaf7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<text x="486" y="301" font-size="12.5" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">一次 32 位写 · 原子 ✓</text>
<rect x="648" y="84" width="300" height="46" fill="#e5f3f8" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="798" y="114" font-size="14" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">C · ODR 读改写</text>
<rect x="648" y="130" width="300" height="204" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="664" y="162" font-size="11" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">GPIOC-&gt;ODR ^=</text>
<text x="664" y="183" font-size="11" fill="#1b5c45" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">    GPIO_PIN_13;</text>
<line x1="798" y1="208" x2="798" y2="225" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="798.00,230.00 795.50,225.00 800.50,225.00" fill="#5e6872" opacity="1"/>
<text x="798" y="254" font-size="11" fill="#1e4d63" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">读 → 改 → 写，三条指令</text>
<rect x="664" y="272" width="268" height="46" fill="#fbfaf7" opacity="1" rx="4" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="798" y="301" font-size="12.5" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">中间可被插队 · 竞争 ⚠</text>
<rect x="24" y="358" width="912" height="190" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="48" y="388" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">ODR 读改写的丢位现场（主流程 vs 中断）</text>
<text x="40" y="437" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">主流程</text>
<rect x="110" y="412" width="170" height="36" fill="#f1f5f7" opacity="1" rx="4" stroke="#5e6872" stroke-width="1.5"/>
<text x="195" y="435" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">① 读 ODR（旧值）</text>
<line x1="280" y1="430" x2="315" y2="430" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="320.00,430.00 315.00,432.50 315.00,427.50" fill="#5e6872" opacity="1"/>
<rect x="320" y="412" width="160" height="36" fill="#f1f5f7" opacity="1" rx="4" stroke="#5e6872" stroke-width="1.5"/>
<text x="400" y="435" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">② 改：^= bit13</text>
<line x1="480" y1="430" x2="515" y2="430" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="520.00,430.00 515.00,432.50 515.00,427.50" fill="#5e6872" opacity="1"/>
<rect x="520" y="412" width="190" height="36" fill="#f1f5f7" opacity="1" rx="4" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="615" y="435" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">③ 写回 ODR（旧值）</text>
<text x="730" y="435" font-size="12.5" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">ISR 改的位被覆盖丢失</text>
<text x="40" y="506" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">中断</text>
<rect x="350" y="482" width="230" height="36" fill="#fbfaf7" opacity="1" rx="4" stroke="#8f2d2d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="465" y="505" font-size="11" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">ISR：BSRR 置位 bit5</text>
<line x1="465" y1="482" x2="465" y2="457" stroke="#8f2d2d" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/>
<polygon points="465.00,452.00 467.50,457.00 462.50,457.00" fill="#8f2d2d" opacity="1"/>
<text x="48" y="572" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HAL 的价值是封装与可读性，不是把非原子变成原子；比较写法要看实际寄存器路径，不比函数长短。</text>
<line x1="24" y1="618" x2="936" y2="618" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="642" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">依据 RM0008：BSRR/BRR 写 1 生效、单指令完成；ODR 读改写需三条指令</text>
<text x="936" y="642" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
