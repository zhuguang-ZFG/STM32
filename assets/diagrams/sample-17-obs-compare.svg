<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="观测手段不可互替：M3 只有 6 个硬件断点，SWO 占 PB3 不占串口，日志留痕留下 PC 与 CFSR">


