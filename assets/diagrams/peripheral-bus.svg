<text x="120" y="308" font-size="11" fill="#22d3ee" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">USB OTG FS</text>
<rect x="216" y="288" width="160" height="30" fill="#111c31" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
