<line x1="300" y1="202" x2="300" y2="232" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/>
<line x1="120" y1="232" x2="646" y2="232" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/>
