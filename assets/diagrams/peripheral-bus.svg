<rect x="602" y="88" width="258" height="60" fill="#111c31" opacity="1" rx="10" stroke="#34d399" stroke-width="1.5"/>
<text x="731" y="112" font-size="14" fill="#e6edf3" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">APB1 / APB2</text>
<text x="731" y="132" font-size="10.5" fill="#34d399" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PCLK1 = 50 MHz · PCLK2 = 100 MHz</text>
<text x="602" y="194" font-size="12" fill="#a78bfa" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">APB1（最高 50 MHz）</text>
<text x="602" y="338" font-size="12" fill="#f472b6" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">APB2（最高 100 MHz）</text>
<rect x="602" y="204" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="665" y="223" font-size="10.5" fill="#a78bfa" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">USART2/3</text>
<rect x="734" y="204" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="797" y="223" font-size="10.5" fill="#a78bfa" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">I2C1/2/3</text>
<rect x="602" y="238" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="665" y="257" font-size="10.5" fill="#a78bfa" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SPI2/3</text>
<rect x="734" y="238" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="797" y="257" font-size="10.5" fill="#a78bfa" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TIM2~5</text>
<rect x="602" y="272" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="665" y="291" font-size="10.5" fill="#a78bfa" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CAN1</text>
<rect x="734" y="272" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="797" y="291" font-size="10.5" fill="#a78bfa" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">USB 48M</text>
<rect x="602" y="348" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="665" y="367" font-size="10.5" fill="#f472b6" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">USART1/6</text>
<rect x="734" y="348" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="797" y="367" font-size="10.5" fill="#f472b6" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SPI1</text>
<rect x="602" y="382" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="665" y="401" font-size="10.5" fill="#f472b6" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ADC1</text>
<rect x="734" y="382" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="797" y="401" font-size="10.5" fill="#f472b6" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TIM1/9/10/11</text>
<rect x="602" y="416" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="665" y="435" font-size="10.5" fill="#f472b6" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SDIO</text>
<rect x="734" y="416" width="126" height="28" fill="#16233c" opacity="1" rx="7" stroke="#243354" stroke-width="1.5"/>
<text x="797" y="435" font-size="10.5" fill="#f472b6" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SYSCFG</text>
<rect x="40" y="348" width="520" height="160" fill="#0e1626" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="58" y="374" font-size="12.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">为什么必须记住总线？</text>
<text x="58" y="398" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">① 波特率算错：USART2 在 APB1（50 MHz），USART1 在 APB2（100 MHz）</text>
<text x="58" y="420" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">② PWM 频率上限：TIM2 挂 APB1，但定时器时钟有 ×2 倍频（50→100 MHz）</text>
<text x="58" y="442" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">③ 超频红线：APB1 不能超 50 MHz，APB2 不能超 100 MHz</text>
<text x="58" y="464" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">④ ADC 时钟：由 APB2 分频，F4 最高 36 MHz，超过则采样不准</text>
<text x="58" y="486" font-size="10.5" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">⑤ 时钟使能宏（__HAL_RCC_*_CLK_ENABLE）忘记调用 = 外设完全没反应</text>
<rect x="560" y="462" width="300" height="46" fill="#111c31" opacity="1" rx="10" stroke="#243354" stroke-width="1.5"/>
<text x="578" y="482" font-size="11.5" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">查表工具</text>
