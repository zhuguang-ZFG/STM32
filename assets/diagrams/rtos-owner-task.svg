<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="给驱动加很多锁，仍不等于拥有清楚的所有权">


<rect x="0" y="0" width="900" height="560" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#5b3a8c" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">给驱动加很多锁，仍不等于拥有清楚的所有权</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">把完整事务送给唯一所有者，片选、DMA、超时和恢复才能落在同一个状态机里</text>
<rect x="720" y="15" width="158" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="799" y="33.32" font-size="12" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">28 RTOS · IG-011</text>
<text x="220" y="100" font-size="13" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">并发直调：锁住了函数，没锁住完整事务</text>
<rect x="60" y="134" width="140" height="56" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="130" y="167" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">任务 A</text>
<line x1="130" y1="194" x2="213.881" y2="240.6" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="220.00,244.00 212.18,243.66 215.58,237.54" fill="#075e84" opacity="1"/>
<rect x="280" y="134" width="140" height="56" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="350" y="167" font-size="12" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">任务 B</text>
<line x1="350" y1="194" x2="226.533" y2="241.487" stroke="#7a4e00" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="220.00,244.00 225.28,238.22 227.79,244.75" fill="#7a4e00" opacity="1"/>
<rect x="120" y="246" width="200" height="76" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="220" y="272" font-size="12" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SPI API + mutex</text>
<text x="220" y="297" font-size="9.8" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">CS / DMA / timeout 分散</text>
<line x1="220" y1="326" x2="220" y2="367" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="220.00,374.00 216.50,367.00 223.50,367.00" fill="#8f2d2d" opacity="1"/>
<rect x="120" y="376" width="200" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="220" y="403" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">同一外设</text>
<text x="220" y="424" font-size="9.5" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">交叉片选 / 恢复竞态</text>
<text x="680" y="100" font-size="13" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">所有者任务：一次只接受一笔完整事务</text>
<rect x="500" y="134" width="120" height="48" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="560" y="163" font-size="11" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">任务 A</text>
<line x1="624" y1="158" x2="660.205" y2="214.118" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="664.00,220.00 657.26,216.02 663.15,212.22" fill="#075e84" opacity="1"/>
<rect x="500" y="206" width="120" height="48" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="560" y="235" font-size="11" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">任务 B</text>
<line x1="624" y1="230" x2="657.209" y2="221.698" stroke="#7a4e00" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="664.00,220.00 658.06,225.09 656.36,218.30" fill="#7a4e00" opacity="1"/>
<rect x="646" y="194" width="214" height="176" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="753" y="222" font-size="12.5" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SPI owner</text>
<text x="666" y="250" font-size="9.8" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 队列接收完整事务</text>
<text x="666" y="272" font-size="9.8" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 拉低 / 拉高 CS</text>
<text x="666" y="294" font-size="9.8" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 启动并等待 DMA</text>
<text x="666" y="316" font-size="9.8" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 统一超时与恢复</text>
<text x="666" y="338" font-size="9.8" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 返回稳定结果码</text>
<line x1="753" y1="374" x2="753" y2="407" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="753.00,414.00 749.50,407.00 756.50,407.00" fill="#1b5c45" opacity="1"/>
<rect x="646" y="416" width="214" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="753" y="442" font-size="12" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">同一外设</text>
<text x="753" y="463" font-size="9.5" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">串行事务 · 可审计恢复</text>
<rect x="370" y="120" width="56" height="358" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="398" y="298" font-size="28" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">→</text>
<line x1="24" y1="518" x2="876" y2="518" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="542" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">视觉规范：FA-002 概念连续线 · IG-011 前后变化对比 · C-03 / C-10 / C-27 / C-31</text>
<text x="876" y="542" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量图 · STM32 知识库</text>
</svg>
