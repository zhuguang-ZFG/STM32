<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="I2C 三岔口：SDA 卡低先补 9 个 SCL，NACK 先查 7 位 / 8 位地址，SCL 不动是时钟拉伸">


<rect x="0" y="0" width="960" height="880" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">I2C 三岔口：SDA 卡低先补 9 个 SCL，NACK 先查 7 位 / 8 位地址，SCL 不动是时钟拉伸</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 · chapter 07 · UM10204 Rev 6 第 3 章 · RM0008 Rev 21 第 26 章</text>
<rect x="906" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">07</text>
<text x="40" y="86" font-size="16" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">STM32F103C8T6  I2C1  PB6 = SCL  PB7 = SDA  both open-drain, 4.7 kΩ to 3.3 V</text>
<text x="40" y="112" font-size="14" fill="#075e84" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">three dead-bus symptoms; the branch is decided by which line is low when the bus should idle</text>
<text x="40" y="138" font-size="13" fill="#7a4e00" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SDA low + SCL high  →  bus clear    9th clock high  →  address    SCL low after release  →  stretch</text>
<text x="40" y="170" font-size="16" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">岔口一  SDA 卡低：最多 9 个 SCL 脉冲，再补 STOP</text>
<rect x="40" y="184" width="880" height="220" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="56" y="212" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SDA sits low while SCL idles high: no START can be formed, and every HAL call returns BUSY</text>
<text x="56" y="238" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">a slave that lost power or froze mid-byte holds SDA down; the master must finish that byte</text>
<text x="56" y="262" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">drive SCL as open-drain GPIO: up to 9 pulses, sampling SDA between clocks and stopping early</text>
<path d="M 56 276.8 L 56.00 276.80 L 80.00 276.80 L 80.00 297.20 L 104.00 297.20 L 104.00 276.80 L 128.00 276.80 L 128.00 297.20 L 152.00 297.20 L 152.00 276.80 L 176.00 276.80 L 176.00 297.20 L 200.00 297.20 L 200.00 276.80 L 224.00 276.80 L 224.00 297.20 L 248.00 297.20 L 248.00 276.80 L 272.00 276.80 L 272.00 297.20 L 296.00 297.20 L 296.00 276.80 L 320.00 276.80 L 320.00 297.20 L 344.00 297.20 L 344.00 276.80 L 368.00 276.80 L 368.00 297.20 L 392.00 297.20 L 392.00 276.80 L 416.00 276.80 L 416.00 297.20 L 440.00 297.20 L 440.00 276.80 L 464.00 276.80 L 464.00 297.20 L 488.00 297.20 L 488.00 276.80 L 512.00 276.80 L 512.00 276.80 L 536.00 276.80" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#8f2d2d" stroke-width="2"/>
<path d="M 56 337.2 L 56.00 337.20 L 80.00 337.20 L 80.00 337.20 L 104.00 337.20 L 104.00 337.20 L 128.00 337.20 L 128.00 337.20 L 152.00 337.20 L 152.00 337.20 L 176.00 337.20 L 176.00 337.20 L 200.00 337.20 L 200.00 337.20 L 224.00 337.20 L 224.00 337.20 L 248.00 337.20 L 248.00 337.20 L 272.00 337.20 L 272.00 337.20 L 296.00 337.20 L 296.00 337.20 L 320.00 337.20 L 320.00 337.20 L 344.00 337.20 L 344.00 337.20 L 368.00 337.20 L 368.00 337.20 L 392.00 337.20 L 392.00 337.20 L 416.00 337.20 L 416.00 337.20 L 440.00 337.20 L 440.00 337.20 L 464.00 337.20 L 464.00 316.80 L 488.00 316.80 L 488.00 316.80 L 512.00 316.80 L 512.00 316.80 L 536.00 316.80" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#1b5c45" stroke-width="2"/>
<line x1="464" y1="266" x2="464" y2="342" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/>
<text x="548" y="293" font-size="13" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SCL: 9 clocks, GPIO open-drain</text>
<text x="548" y="333" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SDA: slave releases on clock 9</text>
<text x="548" y="356" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">9 is the ceiling, not a target</text>
<text x="56" y="368" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">then a real STOP: SDA low with SCL low → SCL high → SDA high; re-init I2C1 before retrying</text>
<text x="56" y="390" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">8 data bits + 1 ACK is what frees the slave; a 10th pulse would look like another byte</text>
<text x="40" y="434" font-size="16" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">岔口二  一直 NACK：7 位 0x3C 还是 8 位 0x78</text>
<rect x="40" y="448" width="880" height="200" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="56" y="476" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">the bus is alive and the 9th clock stays high: no slave owns the address on the wire</text>
<text x="56" y="502" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">7-bit 0x3C = 0111100; the first byte on the wire is A6..A0 plus R/W: write 0x78, read 0x79</text>
<text x="56" y="528" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">driver macro keeps 0x3C; HAL_I2C_* is called with 0x3C &lt;&lt; 1, and CR2 SADD carries those 8 bits</text>
<rect x="56" y="544" width="40" height="26" fill="#fbfaf7" opacity="1" rx="2" stroke="#5e6872" stroke-width="1"/>
<text x="76" y="562" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">0</text>
<text x="76" y="588" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">A6</text>
<rect x="99" y="544" width="40" height="26" fill="#fbfaf7" opacity="1" rx="2" stroke="#5e6872" stroke-width="1"/>
<text x="119" y="562" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">1</text>
<text x="119" y="588" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">A5</text>
<rect x="142" y="544" width="40" height="26" fill="#fbfaf7" opacity="1" rx="2" stroke="#5e6872" stroke-width="1"/>
<text x="162" y="562" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">1</text>
<text x="162" y="588" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">A4</text>
<rect x="185" y="544" width="40" height="26" fill="#fbfaf7" opacity="1" rx="2" stroke="#5e6872" stroke-width="1"/>
<text x="205" y="562" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">1</text>
<text x="205" y="588" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">A3</text>
<rect x="228" y="544" width="40" height="26" fill="#fbfaf7" opacity="1" rx="2" stroke="#5e6872" stroke-width="1"/>
<text x="248" y="562" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">1</text>
<text x="248" y="588" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">A2</text>
<rect x="271" y="544" width="40" height="26" fill="#fbfaf7" opacity="1" rx="2" stroke="#5e6872" stroke-width="1"/>
<text x="291" y="562" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">0</text>
<text x="291" y="588" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">A1</text>
<rect x="314" y="544" width="40" height="26" fill="#fbfaf7" opacity="1" rx="2" stroke="#5e6872" stroke-width="1"/>
<text x="334" y="562" font-size="14" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">0</text>
<text x="334" y="588" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">A0</text>
<rect x="357" y="544" width="40" height="26" fill="#e5f3f8" opacity="1" rx="2" stroke="#7a4e00" stroke-width="2"/>
<text x="377" y="562" font-size="14" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace" font-weight="700">0</text>
<text x="377" y="588" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">R/W</text>
<text x="420" y="556" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">scan tool prints the 7-bit address: 0x3C</text>
<text x="420" y="580" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HAL macro holds the shifted byte: (0x3C &lt;&lt; 1) = 0x78</text>
<text x="56" y="622" font-size="14" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">0x3C sent as-is is 7-bit 0x1E: nobody answers, so check both conventions before swapping the panel</text>
<text x="40" y="678" font-size="16" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">岔口三  SCL 被拉低不动：先认时钟拉伸</text>
<rect x="40" y="692" width="880" height="150" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="56" y="720" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SCL stays low after the master lets go: the slave is stretching the clock, the bus is not dead</text>
<text x="56" y="745" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">wait for SCL to rise; every I2C master must tolerate a stretched low</text>
<text x="56" y="770" font-size="14" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">if it never rises: read SCL as GPIO, time it with a TIM, then run the 9-pulse clear</text>
<text x="56" y="795" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">a stretched low can outlast the HAL timeout: prove the level first</text>
<text x="670" y="742" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SCL</text>
<line x1="680" y1="738" x2="720" y2="738" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="720" y1="738" x2="720" y2="758" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="720" y1="758" x2="900" y2="758" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="720" y1="738" x2="900" y2="738" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/>
<text x="730" y="782" font-size="10" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">虚线 = 主机松手后的期望</text>
<text x="730" y="798" font-size="11" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">从机按住：低电平更长</text>
<text x="40" y="828" font-size="13" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">清除只还你一条空闲的线，不解释从机为何停在半个字节上</text>
<line x1="24" y1="844" x2="936" y2="844" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="864" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。总线清除与时钟拉伸来自 UM10204 Rev 6 第 3 章；I2C 寄存器语义来自 RM0008 Rev 21 第 26 章。</text>
<text x="936" y="864" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
