<text x="474" y="392" font-size="9.4" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">搜索：型号 + 文档号 + 关键词</text>
<rect x="42" y="446" width="816" height="66" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="60" y="472" font-size="11.5" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">停止条件</text>
<text x="132" y="472" font-size="10.6" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">找不到型号、封装或 revision，就先补齐身份；不要用搜索结果摘要代替原文。</text>
<text x="132" y="495" font-size="10.2" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">引脚和电气看 DS；寄存器和时序看 RM；异常行为还要交叉检查 ES。</text>
