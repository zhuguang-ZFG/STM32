<text x="56" y="444" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">EXTI5-9 and EXTI10-15 share IRQ handlers; check pending bits inside the ISR.</text>
