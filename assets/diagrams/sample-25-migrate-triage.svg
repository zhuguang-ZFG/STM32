<text x="56" y="730" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">冲突时以手册适用条件为准；社区 480 MHz 帖子不能跳过 revision 门。</text>
