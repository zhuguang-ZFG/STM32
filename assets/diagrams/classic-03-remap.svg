<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="660" viewBox="0 0 960 660" role="img" aria-label="F1 重映射：AFIO 时钟 → MAPR → 新引脚">


<rect x="0" y="0" width="960" height="660" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#5b3a8c" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">F1 重映射：AFIO 时钟 → MAPR → 新引脚</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F4 改成每个引脚自己的 AFR 字段；换系列先换手册</text>
<rect x="798" y="15" width="140" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="868" y="33.32" font-size="12" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">ch03-s17 · 重映射</text>
<rect x="24" y="84" width="444" height="340" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="246" y="116" font-size="14" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">F1（RM0008）：例 USART1 → PB6/PB7</text>
<rect x="64" y="140" width="364" height="56" fill="#e5f3f8" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="246" y="166.55" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">① 开 AFIO 时钟</text>
<text x="246" y="183" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">__HAL_RCC_AFIO_CLK_ENABLE()</text>
<line x1="246" y1="196" x2="246" y2="208" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="246.00,214.00 243.00,208.00 249.00,208.00" fill="#5e6872" opacity="1"/>
<rect x="64" y="214" width="364" height="56" fill="#e5f3f8" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="246" y="240.55" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">② 写 AFIO-&gt;MAPR 重映射位</text>
<text x="246" y="257" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">USART1_REMAP = 1</text>
<line x1="246" y1="270" x2="246" y2="282" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="246.00,288.00 243.00,282.00 249.00,282.00" fill="#5e6872" opacity="1"/>
<rect x="64" y="288" width="364" height="56" fill="#e5f3f8" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="246" y="314.55" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">③ 信号从新脚 PB6/PB7 出</text>
<text x="246" y="331" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">示波器在新脚上能看到波形</text>
<rect x="64" y="362" width="364" height="48" fill="#fbfaf7" opacity="1" rx="4" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="246" y="382" font-size="11" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不开 AFIO 时钟：MAPR 写不进，</text>
<text x="246" y="400" font-size="11" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">新脚一直安静。</text>
<rect x="492" y="84" width="444" height="340" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="714" y="116" font-size="14" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">F4：每脚自选 AF 号</text>
<rect x="532" y="140" width="364" height="56" fill="#e5f3f8" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="714" y="166.55" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">GPIOx_AFRL / AFRH</text>
<text x="714" y="183" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">每个引脚 4 bit 字段选 AF0–AF15</text>
<line x1="714" y1="196" x2="714" y2="208" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="714.00,214.00 711.00,208.00 717.00,208.00" fill="#5e6872" opacity="1"/>
<rect x="532" y="214" width="364" height="56" fill="#e5f3f8" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="714" y="240.55" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">例：PA9 的 AFRH[7:4] = AF7</text>
<text x="714" y="257" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">→ USART1_TX</text>
<line x1="714" y1="270" x2="714" y2="282" stroke="#5e6872" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="714.00,288.00 711.00,282.00 717.00,282.00" fill="#5e6872" opacity="1"/>
<rect x="532" y="288" width="364" height="56" fill="#e5f3f8" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="714" y="314.55" font-size="13" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">无需 AFIO 时钟</text>
<text x="714" y="331" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F4 没有 MAPR；规则在 F4 手册</text>
<rect x="532" y="362" width="364" height="48" fill="#fbfaf7" opacity="1" rx="4" stroke="#7a4e00" stroke-width="1.5"/>
<text x="714" y="391" font-size="11" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">别把 F1 的顺序原样搬到 F4。</text>
<rect x="24" y="448" width="912" height="120" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="48" y="482" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">对照记忆</text>
<text x="48" y="510" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F1：AFIO 时钟先行 → 写 MAPR → 再配 GPIO 模式；顺序反了，信号到不了新脚。</text>
<text x="48" y="538" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F4：没有 MAPR，查每脚 AFR 字段和 AF 编号表；换系列先换手册。</text>
<line x1="24" y1="618" x2="936" y2="618" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="642" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">F1 依据 RM0008 AFIO 章节；F4 的 AFR 规则见对应型号参考手册</text>
<text x="936" y="642" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量动画 · STM32 知识库</text>
</svg>
