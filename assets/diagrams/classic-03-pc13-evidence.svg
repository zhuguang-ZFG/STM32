<text x="478" y="236" font-size="11" fill="#1e4d63" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">ODR13 = 1</text>
<circle cx="596" cy="232" r="8" fill="#fbfaf7" opacity="1" stroke="#5e6872" stroke-width="1.5"/>
<text x="612" y="236" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">灯灭</text>
