<text x="48" y="470" font-size="11.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 代码说 1000 ms，PC13 ODR 读回高低交替，时间轴量到 1.000 s：代码 — 寄存器 — 电平连起来了。</text>
<text x="48" y="494" font-size="11.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 只凭眼睛看灯闪不算数：900 ms 和 1100 ms 肉眼分不出。</text>
<text x="48" y="518" font-size="11.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 没有仪器时：明确标注哪些是仿真证据，不要把仿真当实测。</text>
