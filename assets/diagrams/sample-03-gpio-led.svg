<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="660" viewBox="0 0 960 660" role="img" aria-label="PA0 推挽可以点灯；PC13 不能当电流源">


<rect x="0" y="0" width="960" height="660" fill="#0b1220"/>
<rect x="0" y="0" width="960" height="58" fill="#0e1626" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#243354" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#fbbf24" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PA0 推挽可以点灯；PC13 不能当电流源</text>
<text x="22" y="50" font-size="12" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 LQFP48 · DS5319 Rev 20 Figure 8 / Table 5 / note 5</text>
<rect x="906" y="15" width="32" height="28" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#fbbf24" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">03</text>
<rect x="40" y="86" width="420" height="250" fill="#111c31" opacity="1" rx="10" stroke="#22d3ee" stroke-width="1.5"/>
<text x="56" y="116" font-size="16" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">STM32F103C8T6  LQFP48</text>
<rect x="56" y="140" width="150" height="40" fill="#0e1626" opacity="1" rx="6" stroke="#34d399" stroke-width="1.5"/>
<text x="68" y="166" font-size="14" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">10   PA0-WKUP</text>
<rect x="56" y="196" width="190" height="40" fill="#0e1626" opacity="1" rx="6" stroke="#f87171" stroke-width="1.5"/>
<text x="68" y="222" font-size="14" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">2   PC13-TAMPER-RTC</text>
<text x="56" y="270" font-size="13" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PA0 推挽写 1：电流从脚流出</text>
<text x="56" y="296" font-size="13" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PC13 走电源开关，禁止作电流源</text>
<text x="460" y="108" font-size="16" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">正常路径</text>
<rect x="460" y="124" width="460" height="160" fill="#111c31" opacity="1" rx="10" stroke="#34d399" stroke-width="1.5"/>
<text x="476" y="154" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PA0 第 10 脚</text>
<text x="476" y="180" font-size="13" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">3.3 V → 推挽 PMOS → 270 Ω → LED → GND</text>
<text x="476" y="206" font-size="13" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">R = (3.3 − 2.0) / 0.005 = 260 Ω，取 270 Ω</text>
<text x="476" y="232" font-size="13" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">高 500 ms，低 500 ms，合起来 1 Hz</text>
<text x="476" y="256" font-size="12" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">周期来自 HAL_Delay(500)，不是速度位</text>
<text x="460" y="316" font-size="16" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">失败路径</text>
<rect x="460" y="332" width="460" height="150" fill="#111c31" opacity="1" rx="10" stroke="#f87171" stroke-width="1.5"/>
<text x="476" y="362" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PC13 第 2 脚</text>
<text x="476" y="388" font-size="13" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">把 PA0「写 1 点灯」原样搬过来</text>
<text x="476" y="414" font-size="13" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">灌电流上限 3 mA，不能作电流源</text>
<text x="476" y="440" font-size="13" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">速度 ≤ 2 MHz，负载 ≤ 30 pF</text>
<text x="476" y="464" font-size="12" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">25 mA / 50 MHz 对 PC13–PC15 作废</text>
<rect x="40" y="360" width="400" height="200" fill="#0e1626" opacity="1" rx="10" stroke="#a78bfa" stroke-width="1.5"/>
<text x="56" y="390" font-size="14" fill="#a78bfa" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">GPIOx_LCKR  偏移 0x18</text>
<text x="56" y="420" font-size="13" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">LCK[15:0] 在序列中保持不变</text>
<text x="56" y="446" font-size="13" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">LCKK：写 1，写 0，写 1</text>
<text x="56" y="472" font-size="13" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">再读，确认读回 1，锁保持到复位</text>
<text x="56" y="498" font-size="13" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">错一步，锁中止，配置仍可改</text>
<text x="56" y="528" font-size="12" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">RM0008 Rev 21 §9.2.7</text>
<line x1="24" y1="624" x2="936" y2="624" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="644" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。脚位与 3 mA / 2 MHz / 30 pF 来自 DS5319 Rev 20。</text>
<text x="936" y="644" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
