<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="运行 / 反转 / 故障状态机">


<rect x="0" y="0" width="900" height="560" fill="#fbfaf7"/>
<rect x="0" y="0" width="900" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#8f2d2d" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">运行 / 反转 / 故障状态机</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">事件与固件一致：故障 &gt; STOP &gt; 换向（第 32 章 control_tick.c）</text>
<rect x="738" y="15" width="140" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="808" y="33.32" font-size="12" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">32 状态机 · VIS06</text>
<rect x="60" y="110" width="180" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="150" y="136" font-size="12.5" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">DISABLED</text>
<text x="150" y="158" font-size="8.5" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">上电默认 · 输出撤销</text>
<rect x="300" y="110" width="180" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#075e84" stroke-width="1.5"/>
<text x="390" y="136" font-size="12.5" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">ARMED</text>
<text x="390" y="158" font-size="8.5" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">收到有效命令 · 使能通过</text>
<rect x="540" y="60" width="180" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#1b5c45" stroke-width="1.5"/>
<text x="630" y="86" font-size="12.5" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">RUN</text>
<text x="630" y="108" font-size="8.5" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">带符号占空比 · 斜坡 ±50‰/10ms</text>
<rect x="540" y="210" width="180" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#7a4e00" stroke-width="1.5"/>
<text x="630" y="236" font-size="12.5" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">REVERSING</text>
<text x="630" y="258" font-size="8.5" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">斜坡归零→停稳→保持100ms→反向</text>
<rect x="300" y="330" width="180" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="390" y="356" font-size="12.5" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">FAULT</text>
<text x="390" y="378" font-size="8.5" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">故障锁存 · 人工清零</text>
<line x1="240" y1="141" x2="295" y2="141" stroke="#075e84" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="300.00,141.00 295.00,143.50 295.00,138.50" fill="#075e84" opacity="1"/>
<text x="270" y="130" font-size="9" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">arm</text>
<line x1="480" y1="128" x2="535.469" y2="102.114" stroke="#1b5c45" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="540.00,100.00 536.53,104.38 534.41,99.85" fill="#1b5c45" opacity="1"/>
<text x="510" y="106" font-size="9" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">run</text>
<line x1="630" y1="122" x2="630" y2="205" stroke="#7a4e00" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="630.00,210.00 627.50,205.00 632.50,205.00" fill="#7a4e00" opacity="1"/>
<text x="650" y="170" font-size="9" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">换向</text>
<line x1="540" y1="241" x2="482.752" y2="154.174" stroke="#1b5c45" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="480.00,150.00 484.84,152.80 480.67,155.55" fill="#1b5c45" opacity="1"/>
<text x="490" y="208" font-size="9" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">停稳完成</text>
<line x1="150" y1="172" x2="325.491" y2="326.042" stroke="#8f2d2d" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="330.00,330.00 323.51,328.30 327.47,323.79" fill="#8f2d2d" opacity="1"/>
<text x="200" y="268" font-size="9.5" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">任意状态故障</text>
<line x1="470" y1="361" x2="154.305" y2="174.543" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="150.00,172.00 155.58,172.39 153.03,176.70" fill="#5e6872" opacity="1"/>
<text x="310" y="300" font-size="9.5" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">人工清零（先撤销输出）</text>
<rect x="700" y="90" width="180" height="240" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="790" y="118" font-size="12" fill="#8f2d2d" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800">故障来源</text>
<text x="714" y="152" font-size="9.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 命令流断流 500 ms（F01）</text>
<text x="714" y="192" font-size="9.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 无反馈 500 ms</text>
<text x="714" y="232" font-size="9.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 全程 3 s 超时</text>
<text x="714" y="272" font-size="9.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 电流档越界</text>
<text x="714" y="312" font-size="9.5" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">· 参数拒绝（≥1000‰）</text>
<rect x="40" y="420" width="820" height="76" fill="#f1f5f7" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="450" y="448" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">STOP 只是撤销输出；FAULT 锁存并拒绝自动恢复——先查因，再清零。</text>
<text x="450" y="474" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">无反馈 500 ms 证明「看不到转速」立即锁存；500 ms 租约 F01 让串口拔掉不留转动的电机。</text>
<line x1="24" y1="518" x2="876" y2="518" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="542" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">视觉规范：FA-002 概念连续线 · IG-008 多路径流程 · C-03 / C-10 / C-27 / C-31</text>
<text x="876" y="542" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘矢量图 · STM32 知识库</text>
</svg>
