<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="860" viewBox="0 0 960 860" role="img" aria-label="72 MHz 要 2 个 Flash 等待；HSE 停振后系统时钟回到 HSI 8 MHz">


<rect x="0" y="0" width="960" height="860" fill="#0b1220"/>
<rect x="0" y="0" width="960" height="58" fill="#0e1626" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#243354" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#22d3ee" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">72 MHz 要 2 个 Flash 等待；HSE 停振后系统时钟回到 HSI 8 MHz</text>
<text x="22" y="50" font-size="12" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 LQFP48 · RM0008 Rev 21 第 7.3.2 节</text>
<rect x="906" y="15" width="32" height="28" fill="#16233c" opacity="1" rx="8" stroke="#243354" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#22d3ee" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">02</text>
<text x="40" y="86" font-size="16" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">STM32F103C8T6  LQFP48  中密度</text>
<text x="40" y="112" font-size="14" fill="#22d3ee" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">pin 5 PD0  pin 6 PD1  HSE 8 MHz</text>
<text x="40" y="138" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PLLXTPRE=0  PLLSRC=1  PLLMUL=0111  8 x 9 = 72 MHz</text>
<text x="40" y="164" font-size="14" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SYSCLK = HCLK = 72 MHz    PCLK1 = 36 MHz    PCLK2 = 72 MHz</text>
<text x="40" y="190" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TIM2-TIM7 = 72 MHz    ADCCLK = 12 MHz    USBPRE=0  USBCLK = 48 MHz</text>
<text x="40" y="216" font-size="15" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">正常路径  LATENCY=2    CSS 未触发    pin 29 PA8  MCO = PLL/2 = 36 MHz</text>
<rect x="40" y="230" width="880" height="150" fill="#111c31" opacity="1" rx="8" stroke="#34d399" stroke-width="1.5"/>
<text x="56" y="258" font-size="15" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">48 MHz 到 72 MHz 这一档 LATENCY=2</text>
<text x="56" y="284" font-size="14" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">0 到 24 MHz 是 0，24 到 48 MHz 是 1。电压档 2.7-3.6 V</text>
<text x="56" y="310" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">MCO=111 送出 36 MHz，低于 50 MHz</text>
<text x="56" y="336" font-size="13" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">RM0008 Rev 21 第 7.3.2 节。第 8.3.2 节在这颗料上作废</text>
<text x="56" y="360" font-size="13" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">旁注：ADCPRE=01 得到 18 MHz，越过 14 MHz。MCO 直接送 72 MHz 也越过 50 MHz</text>
<text x="40" y="406" font-size="16" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">失败路径  同一棵 x9 的树，LATENCY=0</text>
<rect x="40" y="420" width="880" height="130" fill="#111c31" opacity="1" rx="8" stroke="#f87171" stroke-width="1.5"/>
<text x="56" y="450" font-size="15" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">只把 PLL 改成 x9，LATENCY=0，取指失败</text>
<text x="56" y="476" font-size="14" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">HSE 停振：SYSCLK 回到 HSI 8 MHz，PLL 关掉</text>
<text x="56" y="502" font-size="14" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">NMI 一直进来，直到软件写 CSSC</text>
<text x="56" y="528" font-size="13" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不把 18 MHz 和 72 MHz 的 MCO 再画成第三条完整的树</text>
<rect x="40" y="570" width="880" height="90" fill="#0e1626" opacity="1" rx="8" stroke="#a78bfa" stroke-width="1.5"/>
<text x="56" y="600" font-size="15" fill="#a78bfa" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">旁注  互联型第 8.3.2 节在 STM32F103C8T6 上作废</text>
<text x="56" y="626" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">OTGFSPRE、PLLMUL 的 000x 保留、以及 x6.5，不写进这颗 C8</text>
<text x="56" y="650" font-size="13" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">0111 仍是 x9，0000 仍是 x2。无源晶振不开 bypass</text>
<line x1="24" y1="824" x2="936" y2="824" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="844" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。树来自 RM0008 Rev 21 第 7.3.2 节与第 7.2.7 节；脚位来自 DS5319 Rev 20 图 8。</text>
<text x="936" y="844" font-size="11" fill="#64748b" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
