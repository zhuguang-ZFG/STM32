<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="860" viewBox="0 0 960 860" role="img" aria-label="72 MHz 要 2 个 Flash 等待；HSE 停振后系统时钟回到 HSI 8 MHz">


<rect x="0" y="0" width="960" height="860" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">72 MHz 要 2 个 Flash 等待；HSE 停振后系统时钟回到 HSI 8 MHz</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 LQFP48 · RM0008 Rev 21 第 7.3.2 节</text>
<rect x="906" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">02</text>
<text x="40" y="122" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">先把树画出来，再读寄存器：每个箭头就是一个分频/倍频位</text>
<rect x="40" y="160" width="180" height="62" fill="#fbfaf7" opacity="1" rx="4" stroke="#075e84" stroke-width="2"/>
<text x="130" y="186" font-size="14" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">HSE 8 MHz</text>
<text x="130" y="208" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">pin 5 PD0 · pin 6 PD1</text>
<line x1="222" y1="191" x2="255" y2="191" stroke="#075e84" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="262.00,191.00 255.00,194.50 255.00,187.50" fill="#075e84" opacity="1"/>
<text x="242" y="176" font-size="12" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PLL ×9</text>
<text x="244" y="212" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0111</text>
<text x="40" y="240" font-size="12" fill="#075e84" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">PLLXTPRE=0 · PLLSRC=1 · PLLMUL=0111：8 × 9 = 72 MHz，不是 8 × 8</text>
<rect x="266" y="160" width="180" height="62" fill="#fbfaf7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="2"/>
<text x="356" y="186" font-size="14" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SYSCLK 72</text>
<text x="356" y="208" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PLLSRC=1 HSE</text>
<line x1="448" y1="191" x2="481" y2="191" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="488.00,191.00 481.00,194.50 481.00,187.50" fill="#1b5c45" opacity="1"/>
<rect x="492" y="160" width="170" height="62" fill="#fbfaf7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="2"/>
<text x="577" y="186" font-size="14" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">HCLK 72</text>
<text x="577" y="208" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">AHB 不分频</text>
<rect x="700" y="150" width="220" height="84" fill="#f1f5f7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="1.5"/>
<text x="810" y="176" font-size="14" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">Flash LATENCY=2</text>
<text x="810" y="198" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">0–24:0   24–48:1</text>
<text x="810" y="216" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">48–72:2（2.7–3.6 V）</text>
<line x1="662" y1="191" x2="700" y2="191" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="577" y1="222" x2="577" y2="262" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="577" y1="262" x2="300" y2="262" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="300" y1="262" x2="300" y2="281" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="300.00,288.00 296.50,281.00 303.50,281.00" fill="#1b5c45" opacity="1"/>
<line x1="577" y1="262" x2="850" y2="262" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="850" y1="262" x2="850" y2="281" stroke="#1b5c45" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="850.00,288.00 846.50,281.00 853.50,281.00" fill="#1b5c45" opacity="1"/>
<text x="430" y="254" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">APB1 ÷2</text>
<text x="700" y="254" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">APB2 不分频</text>
<rect x="210" y="292" width="180" height="62" fill="#fbfaf7" opacity="1" rx="4" stroke="#1e4d63" stroke-width="2"/>
<text x="300" y="318" font-size="14" fill="#1e4d63" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PCLK1 36</text>
<text x="300" y="340" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">APB1 外设</text>
<rect x="760" y="292" width="180" height="62" fill="#fbfaf7" opacity="1" rx="4" stroke="#1b5c45" stroke-width="2"/>
<text x="850" y="318" font-size="14" fill="#1b5c45" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">PCLK2 72</text>
<text x="850" y="340" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">APB2 外设</text>
<line x1="300" y1="354" x2="300" y2="381" stroke="#1e4d63" stroke-width="2" stroke-linecap="round" opacity="1"/>
<polygon points="300.00,388.00 296.50,381.00 303.50,381.00" fill="#1e4d63" opacity="1"/>
<text x="312" y="376" font-size="11" fill="#1e4d63" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">TIM ×2（预分频≠1 时翻倍）</text>
<rect x="210" y="392" width="180" height="56" fill="#fbfaf7" opacity="1" rx="4" stroke="#1e4d63" stroke-width="2"/>
<text x="300" y="418" font-size="14" fill="#1e4d63" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">TIM2–7 = 72</text>
<text x="300" y="440" font-size="11" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">定时器时钟</text>
<line x1="577" y1="222" x2="697.442" y2="325.098" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/>
<polygon points="702.00,329.00 695.49,327.38 699.39,322.82" fill="#5e6872" opacity="1"/>
<rect x="704" y="292" width="216" height="74" fill="#fbfaf7" opacity="1" rx="4" stroke="#7a4e00" stroke-width="1.5"/>
<text x="812" y="314" font-size="12" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">ADC 预分频 ÷6</text>
<text x="812" y="336" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">ADCCLK = 12 MHz</text>
<text x="812" y="355" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">ADCPRE=01 → 18 MHz，越过 14 MHz 上限</text>
<line x1="577" y1="222" x2="698.666" y2="404.012" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/>
<polygon points="702.00,409.00 696.17,405.68 701.16,402.34" fill="#5e6872" opacity="1"/>
<rect x="704" y="372" width="216" height="74" fill="#fbfaf7" opacity="1" rx="4" stroke="#7a4e00" stroke-width="1.5"/>
<text x="812" y="394" font-size="12" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">USBPRE=0</text>
<text x="812" y="416" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">USBCLK = 48 MHz</text>
<text x="812" y="435" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">USBPRE=1 → 72 MHz，读描述符失败</text>
<line x1="577" y1="222" x2="699.456" y2="483.566" stroke="#5e6872" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/>
<polygon points="702.00,489.00 696.74,484.84 702.17,482.29" fill="#5e6872" opacity="1"/>
<rect x="704" y="452" width="216" height="74" fill="#fbfaf7" opacity="1" rx="4" stroke="#7a4e00" stroke-width="1.5"/>
<text x="812" y="474" font-size="12" fill="#7a4e00" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">pin 29 PA8 · MCO</text>
<text x="812" y="496" font-size="11" fill="#17202a" text-anchor="middle" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">PLL/2 = 36 MHz</text>
<text x="812" y="515" font-size="10" fill="#5e6872" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">MCO=111；直送 72 MHz 越过 50 MHz 上限</text>
<rect x="40" y="540" width="880" height="130" fill="#f1f5f7" opacity="1" rx="8" stroke="#8f2d2d" stroke-width="1.5"/>
<text x="56" y="568" font-size="15" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">失败路径  HSE 停振：CSS 时钟安全系统</text>
<text x="56" y="596" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">SYSCLK 立刻回到 HSI 8 MHz，PLL 关掉——USART1 的 0x271 在 8 MHz 上只剩 12800</text>
<text x="56" y="622" font-size="13" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">NMI 一直进来，直到软件写 CSSC；同一棵 ×9 的树配 LATENCY=0 也取指失败</text>
<rect x="40" y="686" width="880" height="90" fill="#f1f5f7" opacity="1" rx="8" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="56" y="714" font-size="15" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">旁注  互联型（F105/F107）第 8.3.2 节在这颗 C8 上作废</text>
<text x="56" y="740" font-size="12" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">OTGFSPRE、PLLMUL 的 000x 保留与 x6.5 都不写进这颗料；0111 仍是 ×9，0000 仍是 ×2；无源晶振不开 bypass</text>
<line x1="24" y1="824" x2="936" y2="824" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="844" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。树来自 RM0008 Rev 21 第 7.3.2 节与第 7.2.7 节；脚位来自 DS5319 Rev 20 图 8。</text>
<text x="936" y="844" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
