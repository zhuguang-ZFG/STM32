<text x="858" y="260" font-size="18" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">1</text>
<text x="40" y="300" font-size="16" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">正常路径  停止位为高</text>
<rect x="40" y="314" width="880" height="120" fill="#111c31" opacity="1" rx="8" stroke="#34d399" stroke-width="1.5"/>
<text x="56" y="344" font-size="15" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">停止位上的第 8、第 9、第 10 个采样点表决为 1</text>
<text x="56" y="370" font-size="14" fill="#34d399" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">FE 不置位。数据位用中间那三个点。</text>
<text x="56" y="396" font-size="13" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">起始位的确认序列是第 3、5、7 点和第 8、9、10 点。RM0008 27.3.3</text>
<text x="40" y="460" font-size="16" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">失败路径  停止位三点采到 0</text>
<rect x="40" y="474" width="880" height="130" fill="#111c31" opacity="1" rx="8" stroke="#f87171" stroke-width="1.5"/>
<text x="56" y="504" font-size="15" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">第 8、9、10 点为 0，FE 置位，数据仍在 USART_DR</text>
<text x="56" y="530" font-size="14" fill="#f87171" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">清除顺序：先读 USART_SR，再读 USART_DR。只读 DR 清不掉。</text>
<text x="56" y="556" font-size="13" fill="#fbbf24" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">中断是否到来还要看 RXNE 或 CR3 的 EIE。FE 本身不是唯一的中断源。</text>
<text x="56" y="582" font-size="13" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不要写成「FE 一定进中断服务」</text>
<rect x="40" y="624" width="880" height="100" fill="#0e1626" opacity="1" rx="8" stroke="#a78bfa" stroke-width="1.5"/>
<text x="56" y="654" font-size="15" fill="#a78bfa" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">旁注  OVER8 / 8 倍  不占帧错误那条路径</text>
<text x="56" y="680" font-size="14" fill="#e6edf3" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">这颗 F103 的 USART_CR1 位 31:14 保留，没有这个位。</text>
<text x="56" y="706" font-size="13" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">不在这张图上算 8 倍的 BRR。重映射的 PB6/PB7 不在正常路径上。</text>
<line x1="24" y1="784" x2="936" y2="784" stroke="#1a2742" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="804" font-size="11" fill="#93a4c0" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。脚位来自 DS5319 Rev 20 图 8；采样与 BRR 来自 RM0008 Rev 21 第 27 章。</text>
