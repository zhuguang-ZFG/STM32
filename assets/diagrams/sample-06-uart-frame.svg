<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="820" viewBox="0 0 960 820" role="img" aria-label="停止位采到 0 就是帧错误；0x271 在 72 MHz、16 倍下误差是 0">


<rect x="0" y="0" width="960" height="820" fill="#0b1220"/>
<rect x="0" y="0" width="960" height="58" fill="#0e1626" opacity="1"/>
