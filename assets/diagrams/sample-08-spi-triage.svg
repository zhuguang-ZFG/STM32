<text x="48" y="171" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">MISO</text>
<path d="M 102 168.04 L 102.00 168.04 L 114.75 168.04 L 114.75 168.04 L 127.50 168.04 L 127.50 168.04 L 140.25 168.04 L 140.25 168.04 L 153.00 168.04 L 153.00 168.04 L 165.75 168.04 L 165.75 168.04 L 178.50 168.04 L 178.50 168.04 L 191.25 168.04 L 191.25 168.04 L 204.00 168.04 L 204.00 168.04 L 216.75 168.04 L 216.75 168.04 L 229.50 168.04 L 229.50 168.04 L 242.25 168.04 L 242.25 168.04 L 255.00 168.04 L 255.00 168.04 L 267.75 168.04 L 267.75 168.04 L 280.50 168.04 L 280.50 168.04 L 293.25 168.04 L 293.25 168.04 L 306.00 168.04" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#1b5c45" stroke-width="1.5"/>
<text x="40" y="232" font-size="11.5" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">返回 0xFF：没人驱动 MISO</text>
<text x="340" y="92" font-size="13" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">② SCK 根本不动</text>
<rect x="340" y="102" width="280" height="112" fill="#fbfaf7" opacity="1" rx="2" stroke="#d7dce1" stroke-width="1.5"/>
<text x="348" y="115" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SCK</text>
<path d="M 402 141.96 L 402.00 141.96 L 414.75 141.96 L 414.75 141.96 L 427.50 141.96 L 427.50 141.96 L 440.25 141.96 L 440.25 141.96 L 453.00 141.96 L 453.00 141.96 L 465.75 141.96 L 465.75 141.96 L 478.50 141.96 L 478.50 141.96 L 491.25 141.96 L 491.25 141.96 L 504.00 141.96 L 504.00 141.96 L 516.75 141.96 L 516.75 141.96 L 529.50 141.96 L 529.50 141.96 L 542.25 141.96 L 542.25 141.96 L 555.00 141.96 L 555.00 141.96 L 567.75 141.96 L 567.75 141.96 L 580.50 141.96 L 580.50 141.96 L 593.25 141.96 L 593.25 141.96 L 606.00 141.96" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#075e84" stroke-width="1.5"/>
<text x="348" y="171" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">MISO</text>
<path d="M 402 168.04 L 402.00 168.04 L 414.75 168.04 L 414.75 168.04 L 427.50 168.04 L 427.50 168.04 L 440.25 168.04 L 440.25 168.04 L 453.00 168.04 L 453.00 168.04 L 465.75 168.04 L 465.75 168.04 L 478.50 168.04 L 478.50 168.04 L 491.25 168.04 L 491.25 168.04 L 504.00 168.04 L 504.00 168.04 L 516.75 168.04 L 516.75 168.04 L 529.50 168.04 L 529.50 168.04 L 542.25 168.04 L 542.25 168.04 L 555.00 168.04 L 555.00 168.04 L 567.75 168.04 L 567.75 168.04 L 580.50 168.04 L 580.50 168.04 L 593.25 168.04 L 593.25 168.04 L 606.00 168.04" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#1b5c45" stroke-width="1.5"/>
<text x="340" y="232" font-size="11.5" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">没有时钟：SPE/MSTR 或门控</text>
<text x="640" y="92" font-size="13" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">③ 低速对、高速乱</text>
<rect x="640" y="102" width="280" height="112" fill="#fbfaf7" opacity="1" rx="2" stroke="#d7dce1" stroke-width="1.5"/>
<text x="648" y="115" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SCK</text>
<path d="M 702 141.96 L 702.00 141.96 L 714.75 141.96 L 714.75 112.04 L 727.50 112.04 L 727.50 141.96 L 740.25 141.96 L 740.25 112.04 L 753.00 112.04 L 753.00 141.96 L 765.75 141.96 L 765.75 112.04 L 778.50 112.04 L 778.50 141.96 L 791.25 141.96 L 791.25 112.04 L 804.00 112.04 L 804.00 141.96 L 816.75 141.96 L 816.75 112.04 L 829.50 112.04 L 829.50 141.96 L 842.25 141.96 L 842.25 112.04 L 855.00 112.04 L 855.00 141.96 L 867.75 141.96 L 867.75 112.04 L 880.50 112.04 L 880.50 141.96 L 893.25 141.96 L 893.25 112.04 L 906.00 112.04" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#075e84" stroke-width="1.5"/>
<text x="648" y="171" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">MISO</text>
<path d="M 702 197.96 L 702.00 197.96 L 714.75 197.96 L 714.75 168.04 L 727.50 168.04 L 727.50 168.04 L 740.25 168.04 L 740.25 197.96 L 753.00 197.96 L 753.00 168.04 L 765.75 168.04 L 765.75 197.96 L 778.50 197.96 L 778.50 197.96 L 791.25 197.96 L 791.25 168.04 L 804.00 168.04 L 804.00 168.04 L 816.75 168.04 L 816.75 197.96 L 829.50 197.96 L 829.50 197.96 L 842.25 197.96 L 842.25 168.04 L 855.00 168.04 L 855.00 197.96 L 867.75 197.96 L 867.75 168.04 L 880.50 168.04 L 880.50 168.04 L 893.25 168.04 L 893.25 197.96 L 906.00 197.96" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" stroke="#1b5c45" stroke-width="1.5"/>
<text x="640" y="232" font-size="11.5" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">限速：先降到 BR=010</text>
<rect x="40" y="250" width="880" height="62" fill="#f1f5f7" opacity="1" rx="8" stroke="#d7dce1" stroke-width="1.5"/>
<text x="54" y="272" font-size="12.5" fill="#17202a" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">PA4=CS  PA5=SCK  PA6=MISO  PA7=MOSI（pin 14..17）</text>
<text x="54" y="296" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SPE = CR1 bit 6 · MSTR = CR1 bit 2 · 门控 = RCC_APB2ENR bit 12（关着时 CR1 读回 0x0000）</text>
<rect x="40" y="326" width="880" height="96" fill="#f1f5f7" opacity="1" rx="8" stroke="#d7dce1" stroke-width="1.5"/>
<rect x="40" y="326" width="4" height="96" fill="#8f2d2d" opacity="1" rx="2"/>
<text x="60" y="353" font-size="15" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">①</text>
<text x="86" y="353" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">全 0xFF：片选没低，或者 MISO 悬空</text>
<text x="60" y="378" font-size="12.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">PA4 必须从第一个 SCK 沿到最后一个沿都为低；两次命令之间回到高</text>
<text x="60" y="397" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PA4 常高 → 从机 Hi-Z；PA4 常低 → 两条命令并成一帧；0x00 则是线被拉低/CPOL 反</text>
<text x="60" y="416" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自检：示波器夹在从机端看 PA4 与 PA6，别在主板端猜</text>
<rect x="40" y="432" width="880" height="96" fill="#f1f5f7" opacity="1" rx="8" stroke="#d7dce1" stroke-width="1.5"/>
<rect x="40" y="432" width="4" height="96" fill="#7a4e00" opacity="1" rx="2"/>
<text x="60" y="459" font-size="15" fill="#7a4e00" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">②</text>
<text x="86" y="459" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">没有 SCK：主机没启动，或脚不是复用推挽</text>
<text x="60" y="484" font-size="12.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SPE 与 MSTR 复位都是 0；MSTR=0 时它当从机，永远等外部时钟</text>
<text x="60" y="503" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">PA5 的 CRL 半字节必须是 0xB（复用推挽），配成输入或模拟就没波形</text>
<text x="60" y="522" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自检：读 CR1，若为 0x0000 且 APB2ENR bit 12 = 0，先开门再谈别的</text>
<rect x="40" y="538" width="880" height="96" fill="#f1f5f7" opacity="1" rx="8" stroke="#d7dce1" stroke-width="1.5"/>
<rect x="40" y="538" width="4" height="96" fill="#5b3a8c" opacity="1" rx="2"/>
<text x="60" y="565" font-size="15" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">③</text>
<text x="86" y="565" font-size="15" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">低速对、高速错：先降到 9 MHz 再谈协议</text>
<text x="60" y="590" font-size="12.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">BR=000 是 72/2 = 36 MHz；跳线接的 W25Q64 没按这个速率规定</text>
<text x="60" y="609" font-size="13" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">BR=010（÷8 = 9 MHz）重跑同一条事务；ID 回 0xEF 0x40 0x17 就说明协议没错</text>
<text x="60" y="628" font-size="13" fill="#1b5c45" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自检：010 → 001（18 MHz）逐级爬，停在第一个读错的档位并退回去</text>
<text x="40" y="676" font-size="14" fill="#5b3a8c" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">判定顺序</text>
<rect x="144" y="656" width="210" height="36" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="249" y="678.5" font-size="12.5" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">片选与 MISO</text>
<line x1="360" y1="674" x2="377" y2="674" stroke="#5b3a8c" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="384.00,674.00 377.00,677.50 377.00,670.50" fill="#5b3a8c" opacity="1"/>
<rect x="390" y="656" width="210" height="36" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="495" y="678.5" font-size="12.5" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">SCK 与门控</text>
<line x1="606" y1="674" x2="623" y2="674" stroke="#5b3a8c" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
<polygon points="630.00,674.00 623.00,677.50 623.00,670.50" fill="#5b3a8c" opacity="1"/>
<rect x="636" y="656" width="210" height="36" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="741" y="678.5" font-size="12.5" fill="#5b3a8c" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">最后才降 BR</text>
<line x1="24" y1="836" x2="936" y2="836" stroke="#d7dce1" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="24" y="858" font-size="11" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘。SPE/MSTR 与 BR 分频来自 RM0008 Rev 21 第 25 章；引脚来自 DS5319 Rev 20 表 5。</text>
<text x="936" y="858" font-size="11" fill="#5e6872" text-anchor="end" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">自绘 · 静态 · CC BY 4.0</text>
</svg>
