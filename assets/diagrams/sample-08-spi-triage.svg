<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="880" viewBox="0 0 960 880" role="img" aria-label="SPI 读回全 0xFF 查片选与 MISO，没有 SCK 查 SPE/MSTR 与时钟门，只在高 BR 出错就先降速">


<rect x="0" y="0" width="960" height="880" fill="#fbfaf7"/>
<rect x="0" y="0" width="960" height="58" fill="#f1f5f7" opacity="1"/>
<line x1="0" y1="58" x2="960" y2="58" stroke="#5e6872" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="0" y="0" width="4" height="58" fill="#075e84" opacity="1"/>
<text x="22" y="32" font-size="20" fill="#17202a" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">SPI 三条死路：先看线上回来什么</text>
<text x="22" y="50" font-size="12" fill="#5e6872" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">STM32F103C8T6 · SPI1 on APB2 72 MHz · PA4..PA7 = pin 14..17</text>
<rect x="906" y="15" width="32" height="28" fill="#e5f3f8" opacity="1" rx="8" stroke="#5e6872" stroke-width="1.5"/>
<text x="922" y="33.32" font-size="12" fill="#075e84" text-anchor="middle" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600">08</text>
<text x="40" y="92" font-size="13" fill="#8f2d2d" text-anchor="start" opacity="1" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700">① 有 SCK，MISO 恒高</text>
<rect x="40" y="102" width="280" height="112" fill="#fbfaf7" opacity="1" rx="2" stroke="#d7dce1" stroke-width="1.5"/>
<text x="48" y="115" font-size="10.5" fill="#5e6872" text-anchor="start" opacity="1" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Courier New',monospace">SCK</text>
