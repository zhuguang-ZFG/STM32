<text x="110" y="552" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">IWDG：Reload 624 → 典型 1 s，减到 0 复位</text>
<text x="110" y="583" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">LSI 30–60 kHz 时是 4/3 s 到 2/3 s，不是保证值</text>
