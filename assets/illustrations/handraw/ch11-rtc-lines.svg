<text x="110" y="290" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">证据：读 BKP_DR1 的魔数，再读秒计数</text>
