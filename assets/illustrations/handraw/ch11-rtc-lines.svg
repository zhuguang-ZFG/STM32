<text x="622" y="552" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">启动代码读 RCC_CSR 的 IWDGRSTF / WWDRSTF</text>
<text x="622" y="583" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">持久 boot_id 在备份域里每次自增</text>
<text x="622" y="614" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">LED 重新闪烁只证明重启，不证明来源</text>
<text x="84" y="712" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#2F2E2B" class="t-halo">复位原因、持久状态、实际时间，缺一个就分不清「重启过」和「重启后还是原样」</text>
<text x="84" y="750" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#6E6B60" class="t-halo">四个问题分别指向：备份域魔数、LSE 与 PRL、IWDG/WWDG 计数、复位标志与 boot_id；本章实验按这个顺序做</text>
