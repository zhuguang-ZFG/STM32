<text x="622" y="583" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">持久 boot_id 在备份域里每次自增</text>
<text x="622" y="614" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">LED 重新闪烁只证明重启，不证明来源</text>
<text x="84" y="712" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#2F2E2B" class="t-halo">复位原因、持久状态、实际时间，缺一个就分不清「重启过」和「重启后还是原样」</text>
