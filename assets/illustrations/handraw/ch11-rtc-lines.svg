<text x="84" y="136" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" fill="#6E6B60" class="t-halo">先问「哪条线」，再问「哪一格」；复位原因、持久状态和实际时间不能混成一个问题</text>
<text x="84" y="190" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" font-weight="bold" fill="#1F4680" class="t-halo">RTC 线：时间还在不在</text>
