<text x="622" y="290" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">LSE 32.768 kHz，PRL = 32767 才是 1 Hz</text>
<text x="622" y="321" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">LSI 漂 30–60 kHz，整数 PRL 得不到稳定 1 Hz</text>
