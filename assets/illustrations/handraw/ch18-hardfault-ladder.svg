<text x="96" y="220" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="23" fill="#2F2E2B" class="t-halo">同时保存 EXC_RETURN 与异常栈；避免把后续异常的新值混入判读。</text>
