<text x="72" y="725" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="23" fill="#6E6B60" class="t-halo">FORCED = HFSR bit 30：有故障升级，继续解码保存的 CFSR。</text>
