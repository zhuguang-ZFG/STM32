<text x="72" y="679" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#2F2E2B" class="t-halo">BFAR 是访存地址，不能拿来代替代码 PC；无效 BFAR 也不使栈帧自动可信。</text>
