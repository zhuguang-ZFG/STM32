<text x="96" y="181" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="25" font-weight="bold" fill="#1F4680" class="t-halo">保存现场：BFAR / MMFAR 在先，再保留 CFSR / HFSR 与有效位</text>
<text x="96" y="220" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="23" fill="#2F2E2B" class="t-halo">同时保存 EXC_RETURN 与异常栈；避免把后续异常的新值混入判读。</text>
