<text x="72" y="648" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#6E6B60" class="t-halo">ucHeap 通常在 .bss；静态创建的任务栈另按实际段位置计入，均只算一次。</text>
<text x="72" y="693" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" fill="#B3392F" class="t-halo">未分配的 6144 B 只是这个假设中的余额，不是已经验证的安全余量。</text>
<text x="72" y="738" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" fill="#6E6B60" class="t-halo">最后用真实 map、栈水位、最小剩余 heap 与压力测试核对预算。</text>
