<text x="808" y="592" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">脱离调试器后照常计数</text>
<text x="808" y="613" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">不能当成产品的看门狗策略</text>
<text x="84" y="700" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#2F2E2B" class="t-halo">冻住计数器是为了单步安全；产品里该复位的时候还是要它复位</text>
