<text x="808" y="550" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">手册只印位名 DBG_IWDG_STOP</text>
