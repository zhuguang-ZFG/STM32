<text x="84" y="502" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#6E6B60" class="t-halo">0x801E：FAST=1、DUTY=0、CCR=0x01E=30；0x00B4：FAST=0、CCR=0xB4=180</text>
<text x="84" y="526" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#6E6B60" class="t-halo">两行横轴刻度不同：上一行 2.5 µs，下一行 10 µs；周期比 (3×30) : (2×180) = 1 : 4</text>
