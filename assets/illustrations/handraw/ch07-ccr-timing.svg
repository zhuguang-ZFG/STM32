<text x="620" y="320" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1F4680" class="t-halo">一拍 2.5 µs → 400 kHz</text>
<text x="84" y="372" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" font-weight="bold" fill="#2E5F42" class="t-halo">0x00B4</text>
<text x="84" y="400" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#6E6B60" class="t-halo">FAST=0, DUTY=0</text>
<text x="84" y="422" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#6E6B60" class="t-halo">CCR = 180</text>
