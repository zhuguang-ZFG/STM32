<text x="84" y="750" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#6E6B60" class="t-halo">两行都按 PCLK1 = 36 MHz 复算，不含晶振实际误差与从机时钟拉伸。</text>
