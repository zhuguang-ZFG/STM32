<text x="366" y="180" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" text-anchor="middle" fill="#1F4680" class="t-halo">T_high = 30 × 27.8 ns = 0.83 µs</text>
<text x="746" y="180" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" text-anchor="middle" fill="#1F4680" class="t-halo">T_low = 2 × 30 × 27.8 ns = 1.67 µs</text>
