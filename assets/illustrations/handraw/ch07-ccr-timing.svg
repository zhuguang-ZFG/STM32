<text x="600" y="608" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#2F2E2B" class="t-halo">表 41 / 表 42 里没有 1 MHz 这一档</text>
