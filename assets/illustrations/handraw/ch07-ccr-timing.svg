<rect width="1152" height="864" fill="#FDF8EA"/>
<text x="84" y="126" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" fill="#6E6B60" class="t-halo">PCLK1 = 36 MHz：一个计数 27.8 ns；快速模式 T = 3 × CCR / f，标准模式 T = 2 × CCR / f</text>
<text x="84" y="222" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" font-weight="bold" fill="#1F4680" class="t-halo">0x801E</text>
<text x="84" y="250" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#6E6B60" class="t-halo">FAST=1, DUTY=0</text>
<text x="84" y="272" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#6E6B60" class="t-halo">CCR = 30</text>
