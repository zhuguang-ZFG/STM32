<text x="810" y="330" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" text-anchor="middle" fill="#2E5F42" class="t-halo">T_low = 180 × 27.8 ns = 5 µs</text>
