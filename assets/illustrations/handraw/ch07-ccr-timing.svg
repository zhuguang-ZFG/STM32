<text x="100" y="608" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#2F2E2B" class="t-halo">表 41：PCLK1 取 10 MHz 的整数倍，400 kHz 才精确</text>
<text x="100" y="633" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#2F2E2B" class="t-halo">36 MHz 不是 → 表 42 注 2 给 ±2%</text>
<text x="100" y="658" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#2F2E2B" class="t-halo">这是时钟源的账，不是 CCR 写错</text>
