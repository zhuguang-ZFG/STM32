<text x="590" y="244" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#2F2E2B" class="t-halo">pos &gt; old_pos → 连续新区间</text>
<text x="590" y="288" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#2F2E2B" class="t-halo">pos &lt; old_pos → 尾段 + 头段</text>
<text x="590" y="332" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#2F2E2B" class="t-halo">pos == old_pos → 去重（HT≈IDLE）</text>
<text x="590" y="376" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#2F2E2B" class="t-halo">重新启动会重置 DMA 位置</text>
<text x="590" y="420" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#2F2E2B" class="t-halo">  → old_pos 失去意义</text>
