<text x="624" y="555" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="25" font-weight="bold" fill="#B3392F" class="t-halo">跳过时钟恢复，仍用 8 MHz</text>
