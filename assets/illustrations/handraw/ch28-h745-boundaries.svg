<text x="438" y="360" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">M7 有 data cache。</text>
<text x="438" y="388" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">cacheable 映射按所有权做</text>
<text x="438" y="416" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">clean / invalidate；</text>
<text x="438" y="444" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">HSEM 不做任何缓存维护。</text>
