<text x="576.0" y="160" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2F2E2B" class="t-halo">115200 格子的范例（USART1 @ APB2 72 MHz）</text>
<text x="576.0" y="230" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" text-anchor="middle" fill="#2F2E2B" class="t-halo">公式 fPCLK / (16 × baud) → 39.0625</text>
