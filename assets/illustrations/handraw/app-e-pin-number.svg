<text x="576.0" y="230" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" text-anchor="middle" fill="#2F2E2B" class="t-halo">公式 fPCLK / (16 × baud) → 39.0625</text>
