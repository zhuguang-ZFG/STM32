<text x="576.0" y="630" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" text-anchor="middle" fill="#2F2E2B" class="t-halo">同一纪律的另一格（CAN 500 kbit/s @ APB1 36 MHz）</text>
<text x="576.0" y="666" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" text-anchor="middle" fill="#2F2E2B" class="t-halo">P=9、BS1 5、BS2 2 → 36M/(9×8) = 500 kbit/s，采样点 75%</text>
<text x="576.0" y="702" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" text-anchor="middle" fill="#2F2E2B" class="t-halo">抄错分母（搬 F407 的 42 MHz 档）→ 整网速率整体偏掉</text>
