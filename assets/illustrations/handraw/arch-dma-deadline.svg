<text x="64" y="618" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">HT 交前半区、TC 交后半区；DMA 不会在边界停，慢一拍就写进你正在读的半区。</text>
<text x="64" y="648" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#B3392F" class="t-halo">CCM 在 0x1000_0000；DMA 无路可达，缓冲必须放在主 SRAM。</text>
<text x="64" y="678" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#6E6B60" class="t-halo">EN=0 才能改 CHSEL/CIRC/MINC；改参数先关流，等 EN 读回 0。</text>
