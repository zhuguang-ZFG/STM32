<text x="680" y="318" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#2F2E2B" class="t-halo">业务幂等键（QoS 1 去重）</text>
<text x="680" y="352" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#2F2E2B" class="t-halo">离线队列上限 + 掉网不发送</text>
<text x="680" y="386" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#2F2E2B" class="t-halo">喂狗：网络任务在推进</text>
