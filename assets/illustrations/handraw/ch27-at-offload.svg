<text x="116" y="318" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#2F2E2B" class="t-halo">socket 由 AT 命令开</text>
<text x="116" y="352" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#2F2E2B" class="t-halo">模组自己重连运营商网</text>
