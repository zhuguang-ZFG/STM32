<text x="618" y="514" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">LDO 静态电流 Iq：典型值 &lt;1 µA，仍要计入</text>
