<text x="720" y="244" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">每轮塞 100 ms 阻塞任务，</text>
<text x="720" y="276" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">短按会被吞掉——记录漏按</text>
<text x="720" y="308" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">或响应延迟，再拆掉阻塞重测。</text>
<text x="720" y="360" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="bold" fill="#2E5F42" class="t-halo">第 04 章改用 EXTI：</text>
<text x="720" y="390" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">边沿交给中断，主循环</text>
<text x="720" y="414" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#2F2E2B" class="t-halo">不再由轮询兜底。</text>
<text x="720" y="470" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#6E6B60" class="t-halo">硬件路线：RC 滤波（0.1 µF）</text>
<text x="720" y="496" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#6E6B60" class="t-halo">或施密特触发器整形。</text>
<text x="720" y="552" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#6E6B60" class="t-halo">定时器扫描：按周期采样，</text>
<text x="720" y="576" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#6E6B60" class="t-halo">多次一致才接受。</text>
