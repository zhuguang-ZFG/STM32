<text x="90" y="570" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" fill="#2F2E2B" class="t-halo">1. STBY=L 桥必然关闭 —— 上电安全的地基（GPIO 复位期高阻，靠内部 ~200 kΩ 下拉）</text>
<text x="90" y="610" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" fill="#2F2E2B" class="t-halo">2. 方向有效时 PWM=L 是制动不是滑行；滑行必须 IN1=IN2=L 且 PWM=H</text>
<text x="90" y="650" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" fill="#2F2E2B" class="t-halo">3. 方向由 AIN1/AIN2 决定，PWM 只决定给不给电</text>
