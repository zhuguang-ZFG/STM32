<text x="106" y="623" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#1F4680" class="t-halo">任务水位主要检查这里；异常帧也要留余量。</text>
<text x="638" y="623" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#2E5F42" class="t-halo">MSP 单独留预算；任务水位不能代表它。</text>
