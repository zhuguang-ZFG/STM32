<text x="84" y="744" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#6E6B60" class="t-halo">未画地址和容量比例；8 个寄存器 = 32 B，另留对齐余量。M3 无浮点扩展帧。</text>
