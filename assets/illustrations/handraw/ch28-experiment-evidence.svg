<text x="576.0" y="684" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2E5F42" class="t-halo">验收看返回码、时序和切换次数，不看「看起来正常」</text>
<text x="576.0" y="720" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" text-anchor="middle" fill="#6E6B60" class="t-halo">实验三的验收不是「最后复位了」，而是复位后能区分哪个健康条件先失败</text>
