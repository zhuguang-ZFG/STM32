<text x="110" y="344" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" font-weight="bold" fill="#1F4680" class="t-halo">JumpToApp：不升级，直接交班</text>
<text x="110" y="384" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">① 关中断；清 NVIC 的 ICER / ICPR；关 SysTick</text>
<text x="110" y="417" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">② HAL_RCC_DeInit / HAL_DeInit 复位外设</text>
<text x="110" y="450" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">③ MSP = 0x08004800 处的字[0]（栈初值）</text>
<text x="110" y="483" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">④ VTOR = 0x08004800，开中断后立刻跳字[1]</text>
<text x="110" y="516" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">⑤ 中间不能再插入任何代码</text>
