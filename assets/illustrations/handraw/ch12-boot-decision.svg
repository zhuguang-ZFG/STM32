<text x="576" y="646" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" text-anchor="middle" fill="#2F2E2B" class="t-halo">三处必须一致：链接脚本起始 0x08004800 · main 开头 SCB-&gt;VTOR = 0x08004800 · 跳转装 MSP 与复位向量</text>
<text x="576" y="672" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" text-anchor="middle" fill="#6E6B60" class="t-halo">少改一处，中断就会跳回 Bootloader 的向量表</text>
<text x="84" y="716" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#2F2E2B" class="t-halo">500 ms 是起跳前的等待窗口，不是传输时限；两条路各有自己的闸门</text>
<text x="84" y="750" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#6E6B60" class="t-halo">左路闸门在跳转前清现场；右路闸门是每包 CRC16 与收尾整包 CRC；例程见 examples/iap-bootloader</text>
<text x="576.0" y="74" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#2F2E2B">上电 500 ms 的岔路：升级，还是跳 APP</text>
