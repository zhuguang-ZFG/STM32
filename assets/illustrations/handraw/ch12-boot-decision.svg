<text x="618" y="344" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" font-weight="bold" fill="#2E5F42" class="t-halo">YMODEM：接收、校验、写入</text>
<text x="618" y="384" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">① 每包 128 或 1024 B，CRC16 通过才写，回 ACK</text>
<text x="618" y="417" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">② 空包收尾后核对整包 CRC</text>
<text x="618" y="450" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">③ 置「APP 有效」标志，复位或跳转</text>
<text x="618" y="483" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">④ 任一步失败留在 Bootloader 等重传</text>
<text x="618" y="516" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#2F2E2B" class="t-halo">⑤ 此时旧 APP 可能已被覆盖，单槽无从回退</text>
