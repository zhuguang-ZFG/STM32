<path d="M722.2 517.3 L726.7 511.9 L729.9 507.2 L730.6 507.2 L723.6 506.3 L717.4 506.4" fill="none" stroke="#B3392F" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
<text x="758" y="494" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#B3392F" class="t-halo">从复位向量重启</text>
<text x="758" y="526" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#B3392F" class="t-halo">普通 SRAM 不保留</text>
<text x="270" y="561" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" fill="#6E6B60" class="t-halo">事件至第一条指令：50 µs</text>
<text x="72" y="648" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" font-weight="bold" fill="#2F2E2B" class="t-halo">先配唤醒源，再进入低功耗。</text>
<text x="72" y="686" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#6E6B60" class="t-halo">Stop 的 EXTI 可以选下降沿；Standby 的 WKUP 固定认上升沿。</text>
<text x="72" y="718" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#6E6B60" class="t-halo">IWDG 超时是复位，不能当作 Stop 的普通返回。</text>
<text x="72" y="750" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#6E6B60" class="t-halo">时间为 DS5319 表 26 的典型值；不含 PLL 恢复与后续业务。</text>
<text x="576.0" y="74" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="46" font-weight="bold" text-anchor="middle" fill="#2F2E2B">醒来后，是接着跑，还是重新启动？</text>
