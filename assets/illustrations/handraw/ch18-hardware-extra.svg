<text x="588" y="580" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2F2E2B" class="t-halo">H5 的「超时」是软件看到的，根因可能在线与电容</text>
<text x="588" y="608" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" text-anchor="middle" fill="#6E6B60" class="t-halo">同一块板换一根线、补一次焊，就把「偶发」变成「可复现」</text>
<text x="84" y="692" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#2F2E2B" class="t-halo">先固定硬件变量，再谈软件：能测就别猜</text>
<text x="84" y="728" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#6E6B60" class="t-halo">H5–H7 见本章第四节；晶振电容与 LSE 细节见第 11 章</text>
<text x="579.0" y="77" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#2F2E2B" opacity="0.16">H5–H7：晶振、面包板、共地——先把硬件变量钉住</text>
