<text x="808" y="262" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">现象：不共地就乱码或连不上</text>
<text x="808" y="292" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">原因：两个电源地电位不同</text>
<text x="808" y="322" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">处理：先把 GND 连在一起</text>
<text x="808" y="352" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">先共地，再看信号</text>
