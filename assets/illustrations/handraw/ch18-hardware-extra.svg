<text x="104" y="262" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">现象：HSERDY / LSERDY 超时</text>
<text x="104" y="292" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">应用可能停在错误处理</text>
<text x="104" y="322" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">原因：负载电容、虚焊、走线</text>
<text x="104" y="352" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">处理：按晶振手册选电容；查焊接</text>
<text x="104" y="382" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">再查软件的超时路径</text>
<text x="104" y="412" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">别推成：HSE 失败 = 必然 HSI 回退</text>
<text x="104" y="442" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">LSE 失败也不会自动换时钟源</text>
