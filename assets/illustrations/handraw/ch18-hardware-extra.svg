<text x="456" y="262" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">现象：时好时坏，晃动就复位</text>
<text x="456" y="292" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2F2E2B" class="t-halo">原因：接触电阻大、杜邦线太长</text>
