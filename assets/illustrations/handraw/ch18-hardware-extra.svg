<text x="588" y="608" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" text-anchor="middle" fill="#6E6B60" class="t-halo">同一块板换一根线、补一次焊，就把「偶发」变成「可复现」</text>
<text x="84" y="692" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#2F2E2B" class="t-halo">先固定硬件变量，再谈软件：能测就别猜</text>
<text x="84" y="728" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#6E6B60" class="t-halo">H5–H7 见本章第四节；晶振电容与 LSE 细节见第 11 章</text>
