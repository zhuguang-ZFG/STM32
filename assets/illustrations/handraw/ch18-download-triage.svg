<text x="102" y="252" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#2F2E2B" class="t-halo">D1 连不上</text>
<text x="102" y="274" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6E6B60" class="t-halo">先量 SWDIO/SWCLK、共地、3.3 V</text>
<text x="102" y="293" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6E6B60" class="t-halo">接 NRST 试 connect under reset</text>
<text x="102" y="328" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#2F2E2B" class="t-halo">D2 烧完失联</text>
<text x="102" y="350" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6E6B60" class="t-halo">PA13/PA14 被改成 GPIO</text>
<text x="102" y="369" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6E6B60" class="t-halo">复位下连接；或改 BOOT0=1、</text>
<text x="102" y="388" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6E6B60" class="t-halo">BOOT1=0 从系统存储器启动</text>
