<text x="870" y="252" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#2F2E2B" class="t-halo">D7 一进调试就 HardFault</text>
<text x="870" y="274" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6E6B60" class="t-halo">先保存寄存器与故障现场</text>
<text x="870" y="293" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6E6B60" class="t-halo">CFSR 分类，再看 BFAR</text>
<text x="870" y="312" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6E6B60" class="t-halo">bit15 有效才读地址</text>
<text x="870" y="331" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6E6B60" class="t-halo">同一份 ELF 定位（第 17 章）</text>
