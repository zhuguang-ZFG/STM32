<text x="64" y="668" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" fill="#6E6B60" class="t-halo">中断入口是 VTOR + 4×(IRQn+16)，不是 0x08000000 + 4×IRQn。</text>
<text x="64" y="700" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" fill="#6E6B60" class="t-halo">第 35 脚是 VSS_2、第 36 脚是 VDD_2，探针不要落在它们上面。</text>
<text x="579.0" y="77" font-family="'Segoe Print','STKaiti','KaiTi','Microsoft YaHei','PingFang SC',sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#2F2E2B" opacity="0.16">复位后先取两个 32 位字：栈顶，然后才是复位入口</text>
