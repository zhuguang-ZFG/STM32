<text x="120" y="470" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="25" fill="#2F2E2B" class="t-halo">I_try = 0.5×(−10)×0.01 = −0.05‰</text>
<text x="120" y="510" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="25" fill="#2F2E2B" class="t-halo">u_try = 2×(−10) − 0.05 = −20.05‰ → 负输出 = 要求反向驱动</text>
<text x="90" y="610" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" fill="#2F2E2B" class="t-halo">Kp=2.0 ‰/rpm · Ki=0.5 ‰/(rpm·s) · i_limit=500‰ · duty_limit=900‰ · 斜坡 600 rpm/s</text>
<text x="90" y="648" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" fill="#2F2E2B" class="t-halo">负目标必须能产生负输出 —— 旧实现 fabsf 会彻底失效的地方：负反馈环要有方向概念</text>
