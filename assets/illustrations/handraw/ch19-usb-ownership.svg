<text x="92" y="590" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15.5" fill="#2F2E2B" class="t-halo">AA 55 | seq（2 B）| 64 × uint16 | Checksum8（1 B）· 133 B 仍按 64 + 64 + 5 分包</text>
<text x="92" y="618" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15.5" fill="#B3392F" class="t-halo">校验名是 Checksum8，不能据此称为 CRC</text>
