<text x="576" y="590" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" text-anchor="middle" fill="#6E6B60" class="t-halo">只换指令不改配置，结果会「刚睡就醒」或「睡下去不醒」</text>
