<text x="588" y="602" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2F2E2B" class="t-halo">同一现象可能跨两类：I2C 卡死既可能缺上拉，也可能总线被拉死</text>
<text x="588" y="630" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" text-anchor="middle" fill="#6E6B60" class="t-halo">按「时钟 → 引脚复用 → 标志」的顺序过完老三样，再看波特率、过滤器和采样时间</text>
<text x="84" y="706" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#2F2E2B" class="t-halo">先归类，再改一处；三类根因的修法互不替代</text>
<text x="84" y="742" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#6E6B60" class="t-halo">P1–P9 条目与出处见本章第三节；I2C 恢复见 P4 处理</text>
<text x="576.0" y="74" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#2F2E2B">九条外设 FAQ 的三种根因：开关没开、对不上、没处理物理层</text>
