<text x="104" y="258" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#2F2E2B" class="t-halo">P1 GPIO 写了不动</text>
<text x="104" y="282" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6E6B60" class="t-halo">→ GPIOx 时钟没使能</text>
<text x="104" y="328" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#2F2E2B" class="t-halo">P7 PWM 无输出</text>
<text x="104" y="352" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6E6B60" class="t-halo">→ 没调 HAL_TIM_PWM_Start；AF 未配</text>
<text x="104" y="398" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#2F2E2B" class="t-halo">P4 I2C 卡死</text>
<text x="104" y="422" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6E6B60" class="t-halo">→ 上拉缺失；7 位地址错</text>
