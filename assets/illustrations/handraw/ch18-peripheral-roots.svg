<text x="456" y="258" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#2F2E2B" class="t-halo">P3 串口乱码</text>
<text x="456" y="282" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6E6B60" class="t-halo">→ BRR 与 PCLK2 对不上；未共地</text>
<text x="456" y="328" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#2F2E2B" class="t-halo">P5 SPI 全 FF</text>
<text x="456" y="352" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6E6B60" class="t-halo">→ CS 没拉低；Mode0；MISO</text>
<text x="456" y="398" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#2F2E2B" class="t-halo">P6 ADC 跳动</text>
<text x="456" y="422" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6E6B60" class="t-halo">→ 参考不稳；采样时间短</text>
<text x="456" y="468" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#2F2E2B" class="t-halo">P8 DMA 只搬一次</text>
<text x="456" y="492" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6E6B60" class="t-halo">→ 期望循环却配了 NORMAL</text>
