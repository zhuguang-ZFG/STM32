<text x="808" y="258" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#2F2E2B" class="t-halo">P2 按一次进多次中断</text>
<text x="808" y="282" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6E6B60" class="t-halo">→ 抖动未消抖</text>
<text x="808" y="328" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#2F2E2B" class="t-halo">P9 RTC 归零</text>
<text x="808" y="352" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6E6B60" class="t-halo">→ LSE 未起振；VBAT；电容</text>
<text x="808" y="398" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#2F2E2B" class="t-halo">P4 总线被拉死</text>
<text x="808" y="422" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6E6B60" class="t-halo">→ 9 个时钟脉冲恢复</text>
