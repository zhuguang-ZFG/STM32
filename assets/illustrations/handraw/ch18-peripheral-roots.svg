<text x="588" y="630" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" text-anchor="middle" fill="#6E6B60" class="t-halo">按「时钟 → 引脚复用 → 标志」的顺序过完老三样，再看波特率、过滤器和采样时间</text>
