<text x="576" y="700" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#A8801F" class="t-halo">有 FPU：硬件 26 字 + 软件 25 字（9 + 16）= 51 字。</text>
<text x="576" y="742" font-family="'Segoe Print','Comic Sans MS','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" text-anchor="middle" fill="#B3392F" class="t-halo">26 字是扩展帧；9 字软件帧始终在，别只算 16 字高寄存器。</text>
