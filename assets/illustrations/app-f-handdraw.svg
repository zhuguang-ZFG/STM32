@keyframes hd-pulse{0%,100%{opacity:.58}50%{opacity:1}}
@keyframes hd-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-24px}}
.hd-float{animation:hd-float 3.8s ease-in-out infinite;transform-origin:center}
