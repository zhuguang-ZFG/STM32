<text x="88" y="628" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#6E6B60" class="t-halo">排期自己定，判据不打折；每过一个阶段，手里多一份证据而不是一段读完的记忆。</text>
