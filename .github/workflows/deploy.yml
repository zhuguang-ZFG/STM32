name: 部署合并书站点到 GitHub Pages（/STM32/）

# 发布链路：VitePress 构建 → 页面集合对账 → 旧链存根 → staging 组装 → 离线整书
# （印刷 HTML / PDF / EPUB，落在 /book/ 下）→ /STM32/ 冒烟 → upload-pages-artifact
# → deploy-pages。任一步失败即不发布。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # 验收/设计记录不是站点输入（config 的 srcExclude 已排除 superpowers），改它不重建站点。
      - '!docs/superpowers/**'
      - 'scripts/**'
      - 'plans/2026-11-12-merged-book/mapping.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: Build site (VitePress, base /STM32/)
        run: npm run docs:build
      - name: Page set matches manifest
        run: npm run site:pages
      - name: Scene fallback dims match the PNGs
        run: npm run site:dims
      - name: Every image is lazy + async
        run: npm run site:images
      - name: Prune unreferenced site assets
        run: npm run site:prune
      # 旧 /mcu/** 全量跳转存根（131 页；覆盖率不足即失败）
      - name: Generate legacy redirect stubs
        run: npm run site:stubs
      - name: Assemble Pages staging (/STM32/ root = merged book)
        run: npm run site:assemble
      # 离线整书（AC3 的下载入口）。字体随仓库分发（book/print/fonts），
      # 不依赖 runner 装字体；动画帧截图需要 Chromium，故先装 Python 与浏览器。
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install print build deps
        run: python -m pip install -r book/requirements-print.txt
      - name: Install Chromium (print capture)
        run: python -m playwright install --with-deps chromium
      - name: Build offline book (print HTML / PDF / EPUB)
        run: |
          python -m book.build_print_edition
          python -m book.print_pdf \
            --html book/dist/print/merged-book.html \
            --meta book/dist/print/merged-book.meta.json \
            --out book/dist/print/merged-book.pdf
          python -m book.build_epub
      - name: Stage offline book under /book/
        run: |
          set -euo pipefail
          mkdir -p .temp/pages-site/book
          for spec in html:1000000 pdf:5000000 epub:200000; do
            ext=${spec%%:*}
            floor=${spec##*:}
            src="book/dist/print/merged-book.$ext"
            size=$(wc -c < "$src")
            echo "$src bytes=$size floor=$floor"
            test "$size" -ge "$floor"
            cp "$src" .temp/pages-site/book/
          done
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mounted smoke (/STM32/, incl. /book/ downloads)
        run: |
          node scripts/site-smoke.mjs \
            --root .temp/pages-site --mount /STM32 --downloads
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .temp/pages-site
      - id: deployment
        uses: actions/deploy-pages@v5
