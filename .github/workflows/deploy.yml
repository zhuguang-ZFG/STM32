name: 部署合并书站点到 GitHub Pages（/STM32/）

# 发布链路：VitePress 构建 → 页面集合对账 → 旧链存根 → staging 组装 → /STM32/ 冒烟
# → upload-pages-artifact → deploy-pages。任一步失败即不发布。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # 验收/设计记录不是站点输入（config 的 srcExclude 已排除 superpowers），改它不重建站点。
      - '!docs/superpowers/**'
      - 'scripts/**'
      - 'plans/2026-11-12-merged-book/mapping.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: Build site (VitePress, base /STM32/)
        run: npm run docs:build
      - name: Page set matches manifest
        run: npm run site:pages
      - name: Scene fallback dims match the PNGs
        run: npm run site:dims
      - name: Every image is lazy + async
        run: npm run site:images
      - name: Prune unreferenced site assets
        run: npm run site:prune
      # 旧 /mcu/** 全量跳转存根（131 页；覆盖率不足即失败）
      - name: Generate legacy redirect stubs
        run: npm run site:stubs
      - name: Assemble Pages staging (/STM32/ root = merged book)
        run: npm run site:assemble
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mounted smoke (/STM32/)
        run: npm run site:smoke
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/pages-site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
