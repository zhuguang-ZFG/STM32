name: Release from CI artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Book CI run id whose artifacts to attach (must be green and on the tagged commit)"
        required: true
      tag:
        description: "Release tag to create (must already exist at that commit)"
        required: true
      notes_file:
        description: "Repo-relative markdown file used as release notes"
        required: true
        default: "stm32-book/audits/release-v1.3.1.md"

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download Book CI artifacts in-runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run_id }}" \
            -n stm32-practical-book -n stm32-practical-book-en --dir dist
          find dist -type f -maxdepth 2 -exec sha256sum {} + | tee artifact-sha256.txt

      - name: Create draft release on tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" --draft \
            --title "STM32 实用教程书 ${{ inputs.tag }}" \
            --notes-file "${{ inputs.notes_file }}"

      - name: Upload the four book files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            dist/stm32-practical-book/stm32-practical-book.html \
            dist/stm32-practical-book/stm32-practical-book.pdf \
            dist/stm32-practical-book-en/stm32-practical-book-en.html \
            dist/stm32-practical-book-en/stm32-practical-book-en.pdf

      - name: Verify asset count and sizes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.tag }}" --json assets,isDraft \
            --jq '{draft: .isDraft, assets: [.assets[] | {name, size}]}'
          test "$(gh release view "${{ inputs.tag }}" --json assets --jq '.assets | length')" -eq 4
