name: mcu 质量闸门
on:
  pull_request:
    paths:
      - 'mcu/**'
      - '.github/workflows/mcu-*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      esp-matrix: ${{ steps.catalog.outputs.matrix }}
    defaults:
      run:
        working-directory: mcu
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcu/package-lock.json
      - run: npm ci
      - run: npm run quality
      - name: 浏览器安装与交互回归
        # runner 的 azure.archive.ubuntu.com DNS 会偶发长时间解析失败；有界重试 3 次
        #（间隔 30s），装同一组包、判定不变，不把瞬时基建故障当代码失败。
        run: |
          ok=0
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" -eq 1 ] || exit 1
          npm run test:browser
      # 失败留证：trace.zip 能回放每一步的耗时与页面状态，比日志里的一行超时有用得多
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: mcu/test-results/
          if-no-files-found: ignore
      - name: 动画版式审计（出界 / 压字，Linux 字体度量）
        run: npm run anim:audit
      - name: 题图版式审计（出界 / 压字，放大 1.08 留余量）
        run: node scripts/anim-audit.mjs --dir docs/public/figures --font-scale 1.08
      - name: 题图规格门（纯矢量 / 笔压分级 / 字号下限）
        run: python3 mcu-book/tools/art_guard.py --dir docs/public/figures
      - id: catalog
        name: 从已校验工程清单生成 S3 矩阵
        run: echo "matrix=$(node scripts/project-catalog.mjs --matrix)" >> "$GITHUB_OUTPUT"
      - name: 准备 Python（整书构建用）
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mcu/mcu-book/requirements.txt
      - name: 构建整书 HTML/PDF（随站点发布到 /mcu/book/）
        run: |
          python -m pip install -r mcu-book/requirements.txt
          ok=0
          for i in 1 2 3; do
            if python -m playwright install --with-deps chromium; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" -eq 1 ] || exit 1
          python mcu-book/build_html.py --pdf
          python mcu-book/build_print.py --html mcu-book/dist/mcu-deep-book.html
          mkdir -p docs/.vitepress/dist/book
          cp mcu-book/dist/mcu-deep-book.html mcu-book/dist/mcu-deep-book.pdf mcu-book/dist/mcu-deep-book-print.pdf docs/.vitepress/dist/book/
      - name: 整书契约门（对 PDF 产物反向校验：元数据/大纲/页眉页码）
        run: python mcu-book/check_pdf.py
      - name: 下载包（稳定名 + 版本名 + SHA256SUMS + 落地页）
        run: python mcu-book/publish_downloads.py --out-dir docs/.vitepress/dist/downloads
      - name: 下载包自证（GNU sha256sum 为权威口径 + hashlib 平台无关口径）
        # 为什么要两个口径：清单按 GNU 二进制标记写，GNU coreutils 下 `sha256sum -c` 应全 OK；
        # 而 Git for Windows 的实现会按文本模式读、对 PDF 误报 FAILED（见 publish_downloads.py 注释）。
        # 这里在 Linux 上跑权威口径，同时跑一遍平台无关的 --verify，两者不一致即环境或产物有问题。
        run: |
          cd docs/.vitepress/dist/downloads
          sha256sum -c SHA256SUMS.txt
          cd -
          python mcu-book/publish_downloads.py --verify docs/.vitepress/dist/downloads
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: mcu/docs/.vitepress/dist
          if-no-files-found: error

  arm-host:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mcu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcu/package-lock.json
      - run: npm ci
      - name: 安装编译器
        # runner 的 azure.archive.ubuntu.com DNS 会偶发长时间解析失败（2026-11-11 持续
        # 2 小时以上）：先切回 canonical 源（archive.ubuntu.com 实测可达），再对单个
        # 包的下载失败做 fetch 级重试；装同一组包、判定不变。
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          ok=0
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=8 update && sudo apt-get -o Acquire::Retries=8 install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" -eq 1 ] || exit 1
          arm-none-eabi-gcc --version
      - name: 固定 FreeRTOS 内核
        run: git clone --depth 1 --branch V11.1.0 https://github.com/FreeRTOS/FreeRTOS-Kernel.git .trellis/ref/freertos-v11/kernel
      - name: 固定 RT-Thread 内核（Nano 最小集稀疏检出）
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/RT-Thread/rt-thread.git .trellis/ref/rt-thread
          cd .trellis/ref/rt-thread
          git sparse-checkout set src include libcpu/arm/cortex-m4 include/klibc src/klibc
      - name: 固定 CMSIS 头文件（probe.sh 的位号与地址对账要它）
        # 这两个头文件是所有位号/基址的第二来源。上游动一个空格，diff 口径就变了，
        # 所以不只看 tag，还逐字节校验 sha256——漂移要当场失败，不能悄悄换个版本继续"对账通过"。
        run: |
          mkdir -p .trellis/ref/cmsis
          curl -fsSL -o .trellis/ref/cmsis/stm32f407xx.h https://raw.githubusercontent.com/STMicroelectronics/cmsis-device-f4/v2.6.11/Include/stm32f407xx.h
          curl -fsSL -o .trellis/ref/cmsis/core_cm4.h https://raw.githubusercontent.com/ARM-software/CMSIS_5/5.9.0/CMSIS/Core/Include/core_cm4.h
          cd .trellis/ref/cmsis
          echo 'bd21220ea8b6858c2d727cca1d2a5f1077f8a81717acdac583a1e9165d858160  stm32f407xx.h' > expected.sha256
          echo 'f5b63d52dd1557b15ca414cb59c264f595a7b5669db2a5878dffe22f4caedc8c  core_cm4.h' >> expected.sha256
          sha256sum --check --strict expected.sha256
      - name: 全工程编译与场景切换回归
        run: npm run firmware:check

  esp32:
    needs: checks
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.esp-matrix) }}
    defaults:
      run:
        working-directory: mcu
    steps:
      - uses: actions/checkout@v7
      - name: 干净构建 ESP32-S3
        shell: bash
        env:
          PROJECT: ${{ matrix.path }}
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
          DEFAULTS: ${{ matrix.defaults }}
        run: |
          . /opt/esp/idf/export.sh
          cd "$PROJECT"
          idf.py -B build/ci-$VARIANT -D SDKCONFIG="$PWD/build/ci-$VARIANT/sdkconfig" -D SDKCONFIG_DEFAULTS="$DEFAULTS" set-target "$TARGET"
          idf.py -B build/ci-$VARIANT -D SDKCONFIG="$PWD/build/ci-$VARIANT/sdkconfig" -D SDKCONFIG_DEFAULTS="$DEFAULTS" build size
          python -c 'import json,os; assert json.load(open("build/ci-"+os.environ["VARIANT"]+"/project_description.json"))["target"] == "esp32s3"'

  # Python 静态检查：只抓真错误（未定义名、未用导入、可疑比较…），不做格式化。
  # 已有战果：mcu-book/build_html.py 的 `or video_id`（自己赋给自己）就是这一门抓出来的。
  # 规则范围与排除项见根目录 ruff.toml 的注释。
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mcu
    steps:
      - uses: actions/checkout@v7
      # ruff-action 会把 src（默认仓库根）追加到命令行——args 里写死 mcu 时仍会
      # 带上仓库根，用 mcu/ruff.toml 的规则扫到 stm32-book/ 存量代码（B905 等）。
      # 显式 src: mcu，使命令恒为 `ruff check --config mcu/ruff.toml mcu`。
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.15.21"
          src: mcu
          args: check --config mcu/ruff.toml
