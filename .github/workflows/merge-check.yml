name: Merge Check

on:
  pull_request:
    paths:
      - 'book/**'
      - 'docs/**'
      - 'plans/2026-11-12-merged-book/**'
      - 'plans/2026-11-11-motor-control/**'
      - 'scripts/legacy-redirects.mjs'
      - 'scripts/tests/**'
      - 'tools/slop_lint.py'
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'docs/**'
      - 'plans/2026-11-12-merged-book/**'
      - 'plans/2026-11-11-motor-control/**'
      - 'scripts/legacy-redirects.mjs'
      - 'scripts/tests/**'
      - 'tools/slop_lint.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install book build deps
        run: python -m pip install -r book/requirements.txt
      - name: Run book checks
        run: |
          python -m book.manifest --check
          python -m book.mapping --check
          python -m unittest discover book/tests -v
          python -m book.checks --check
          python tools/slop_lint.py docs/v0-foundations/*.md docs/v1-drivers/*.md docs/v2-reliability/*.md docs/v3-rtos/*.md docs/v4-platforms/*.md docs/v5-motion/*.md docs/v6-labs-projects/*.md docs/v7-delivery/*.md docs/appendix/*.md
          python -m book.build_html --check
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run redirect generator tests
        run: node --test scripts/tests/legacy-redirects.test.mjs
