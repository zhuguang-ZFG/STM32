name: Book CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'mcu/**'
      - '.github/workflows/mcu-*.yml'
  pull_request:
    paths-ignore:
      - 'mcu/**'
      - '.github/workflows/mcu-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Arm toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1 # v1
        with:
          release: "10.3-2021.10"

      - name: Check out frozen STM32F10x SPL V3.5.0
        run: |
          git clone --filter=blob:none https://github.com/wajatimur/stm32f10x-stdperiph-lib.git "$RUNNER_TEMP/stm32f10x-spl"
          git -C "$RUNNER_TEMP/stm32f10x-spl" checkout afa743577f2784e95be2d5003380fdb84a702519
          echo "SPL_ROOT=$RUNNER_TEMP/stm32f10x-spl" >> "$GITHUB_ENV"

      - name: Build frozen SPL example
        working-directory: examples/spl-f1-blink
        run: |
          cmake --preset debug
          cmake --build --preset debug

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: stm32-book/requirements.txt

      - name: Check plain voice
        run: python tools/slop_lint.py

      - name: Install book dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r stm32-book/requirements.txt
          ok=0
          for i in 1 2 3; do
            if python -m playwright install --with-deps chromium; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" -eq 1 ] || exit 1

      - name: Install CJK font for narration tests
        # runner apt 镜像 DNS 偶发长时间解析失败；有界重试 3 次，包与判定不变。
        run: |
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" -eq 1 ] || exit 1

      - name: Run whole-book regressions
        run: python -m unittest discover stm32-book/tests -v

      - name: Audit offline HTML contract
        run: python stm32-book/build_html.py --check

      - name: Build HTML and PDF deliverables
        run: python stm32-book/build_html.py --pdf

      - name: Audit print layout
        run: python tools/audit_pdf_layout.py --lang zh --max-gap-pages 145 --max-large-gap-pages 15 --min-anchors 8 --max-fig-free-pages 5

      - name: Upload offline book
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stm32-practical-book
          path: |
            stm32-book/dist/stm32-practical-book.html
            stm32-book/dist/stm32-practical-book.pdf
          if-no-files-found: error
          retention-days: 14

  book-en:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: stm32-book/requirements.txt

      - name: Install book dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r stm32-book/requirements.txt
          ok=0
          for i in 1 2 3; do
            if python -m playwright install --with-deps chromium; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" -eq 1 ] || exit 1

      - name: Build English HTML and PDF
        run: python stm32-book/build_html.py --lang en --pdf

      - name: Audit print layout
        run: python tools/audit_pdf_layout.py --lang en --max-gap-pages 145 --max-large-gap-pages 15 --min-anchors 8 --max-fig-free-pages 5

      - name: Upload English offline book
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stm32-practical-book-en
          path: |
            stm32-book/dist/stm32-practical-book-en.html
            stm32-book/dist/stm32-practical-book-en.pdf
          if-no-files-found: error
          retention-days: 14
