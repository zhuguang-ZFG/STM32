name: Book CI

# 书稿门 + 印刷/电子书契约：内容规则（manifest/mapping/章节合同/链接/文风）
# 与三份产物（站点 HTML 渲染契约、单文件印刷 HTML、PDF、EPUB）。
# 站点构建与冒烟在 site.yml；发布在 deploy.yml；外链在 links.yml。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book/**'
      - 'scripts/**'
      - 'plans/2026-11-12-merged-book/**'
      - 'tools/slop_lint.py'
      - '.github/workflows/book.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'book/**'
      - 'scripts/**'
      - 'plans/2026-11-12-merged-book/**'
      - 'tools/slop_lint.py'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install book build deps
        run: python -m pip install -r book/requirements-print.txt
      # 必须先装浏览器：pip 装了 playwright 后，印刷集成测试不再是 skipped，
      # 缺 Chromium 会在 unittest 门里直接失败。
      # runner 镜像（Ubuntu 26.04）自带的 packages.microsoft.com 源已 403/不再签名，
      # apt-get update 全量失败会把 --with-deps 一起拖死（PR #194 实测）；
      # 该源只服务 MS 产品，印刷依赖用不到，摘掉再装。
      - name: Install Chromium (print capture)
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*
          python -m playwright install --with-deps chromium
      - name: Run book checks
        run: |
          python -m book.manifest --check
          python -m book.mapping --check
          python -m unittest discover book/tests -v
          python -m book.checks --check
          python tools/slop_lint.py docs/onramp/*.md docs/v0-foundations/*.md docs/v1-drivers/*.md docs/v2-reliability/*.md docs/v3-rtos/*.md docs/v4-platforms/*.md docs/v5-motion/*.md docs/v6-labs-projects/*.md docs/v7-delivery/*.md docs/appendix/*.md
      # build_html 现在是“内容渲染契约”：站点由 VitePress 出，印刷/EPUB 仍走
      # render_markdown/quiz_html，这里钉住 53 页都能渲染。
      - name: Renderer contract (53 pages)
        run: python -m book.build_html --check
      - name: Build print HTML
        run: python book/build_print_edition.py
      - name: Build PDF
        run: python book/print_pdf.py --html book/dist/print/merged-book.html --meta book/dist/print/merged-book.meta.json --out book/dist/print/merged-book.pdf
      # 印刷版面门：横向溢出/孤行标题/孤儿图注/近空页硬失败；底部大空板
      # （被不可拆块推走的页）按当前基线给余量。max_large_gap_pages 统计
      # 的是 250pt 以上合计（2026-11-21 基线：823 页，空板 147、其中
      # 250pt 以上 96，全部来自 figure 整块推页，属可接受排版）。
      - name: Print layout audit
        run: python tools/audit_pdf_layout.py --max-gap-pages 200 --max-large-gap-pages 120
      - name: Build EPUB
        run: python book/build_epub.py
      # EPUB 兼容门：SVG 图片一律光栅化（NeatReader 等阅读器不渲染 <img> SVG）。
      - name: Assert EPUB carries no SVG images
        run: |
          python -c "import zipfile,sys; bad=[n for n in zipfile.ZipFile('book/dist/print/merged-book.epub').namelist() if n.endswith('.svg')]; sys.exit('svg images remain: %r' % bad[:3] if bad else None)"
      - name: Assert artifacts exist and are non-trivial
        run: |
          status=0
          for spec in html:1000000 pdf:500000 epub:200000; do
            ext=${spec%%:*}
            floor=${spec##*:}
            path="book/dist/print/merged-book.$ext"
            size=$(wc -c < "$path" 2>/dev/null || echo 0)
            echo "$path bytes=$size floor=$floor"
            if [ "$size" -lt "$floor" ]; then echo "FAIL artifact $path"; status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v5
        with:
          name: book-print
          path: |
            book/dist/print/merged-book.html
            book/dist/print/merged-book.pdf
            book/dist/print/merged-book.epub
          retention-days: 14

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: Run script tests
        run: node --test scripts/tests/*.test.mjs