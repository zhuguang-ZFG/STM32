<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机制手绘设计草图 · 待审</title><style>:root{color-scheme:light;--cover-ink:#123b33;background:#fff;color:#123b33}html.dark{color-scheme:dark;--cover-ink:#a3c4b9;background:#17191c;color:#e0e3e6}body{max-width:800px;margin:0 auto;padding:24px 40px;font:16px/1.6 system-ui,sans-serif}h1{font-size:22px}h2{font-size:19px;margin-top:28px}.hand-figure{margin:16px 0}svg{display:block;width:100%;height:auto}p{margin:12px 0}.notice{font-size:14px}button{font:inherit}</style><h1>机制手绘 · 设计草图</h1><p class="notice">仅用于审阅文字大小、主次线条和图文关系；不是已集成的正文资产。</p><h2>指针：变量与目标不是同一格</h2><figure class="hand-figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="设计草图：指针变量保存地址，箭头到达另一个被访问对象；不表示两者占用宽度相同"><g fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M16 20 Q56 18 102 20 L102 67 Q59 69 16 67 Z" stroke-width="2.3"/><path d="M215 20 Q256 18 304 20 L304 67 Q262 69 215 67 Z" stroke-width="2.3"/><path d="M104 46 C139 40 177 40 209 45" stroke-width="2.3"/><path d="M199 37 L210 45 L199 53"/><text x="27" y="39" font-size="14" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none">变量 p</text><text x="27" y="59" font-size="14" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none">保存地址</text><text x="228" y="48" font-size="14" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none">目标对象</text><text x="128" y="27" font-size="14" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none">按址访问</text></g></svg>
</figure><p>指针变量保存地址；沿这个地址访问另一个对象，才是解引用。图不表示两个对象占用宽度相同。</p><h2>调度：到期先回到就绪候选集合</h2><figure class="hand-figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-label="设计草图：延时到期使任务进入就绪候选集合，不表示立即取得CPU"><g fill="none" stroke="var(--cover-ink, #123b33)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 20 Q60 18 110 20 L110 68 Q65 70 12 68 Z" stroke-width="2.3"/><path d="M212 20 Q260 18 308 20 L308 68 Q260 70 212 68 Z" stroke-width="2.3"/><path d="M113 45 C142 42 174 42 207 45" stroke-width="2.3"/><path d="M197 37 L208 45 L197 53"/><text x="24" y="39" font-size="14" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none">延时任务</text><text x="24" y="59" font-size="14" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none">尚未就绪</text><text x="225" y="39" font-size="14" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none">就绪任务</text><text x="225" y="59" font-size="14" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none">有资格参选</text><text x="144" y="27" font-size="14" font-family="sans-serif" fill="var(--cover-ink, #123b33)" stroke="none">到期</text></g></svg>
</figure><p>就绪只说明有资格参选，不等于已经占用CPU。适用范围按样章的内核与配置另行核定。</p></html>
