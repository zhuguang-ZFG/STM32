# Wokwi 工程配置。firmware / elf 相对本文件。
# STM32 接受 .elf / .hex / .bin（见 https://docs.wokwi.com/vscode/project-config ）。
# 先按 README 构建 BluePill 固件：
#   cmake --preset bluepill -DCUBEF1_PATH=/path/to/STM32CubeF1
#   cmake --build --preset bluepill
# 产物：build/bluepill/exti-key.elf
# Wokwi 是否模拟 EXTI/NVIC 行为不作为本示例的验收依据。
[wokwi]
version = 1
firmware = 'build/bluepill/exti-key.elf'
elf = 'build/bluepill/exti-key.elf'
